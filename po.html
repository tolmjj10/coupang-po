<script id="__fsapi-loader-injected__">
(function(){
  if (!('showDirectoryPicker' in window)) {
    window.addEventListener('DOMContentLoaded', function(){
      var main = document.querySelector('.main'); if (!main) return;
      var w = document.createElement('div');
      w.id = '__fsapi-unsupported__';
      w.textContent = 'ℹ︎ 이 브라우저는 폴더 자동 불러오기를 지원하지 않습니다. Chrome 또는 Edge로 열어주세요. 또는 아래 슬롯에 직접 파일을 업로드해도 됩니다.';
      main.insertBefore(w, main.firstChild);
    });
    return;
  }

  var PATTERNS = {
    order:  /^PO_SKU_LIST/i,
    sales:  /^basic_operation/i,
    stock:  /^제품\s*현황\s*조회/,
    master: /^쿠팡발주파일양식/
  };
  var LABELS = { order:'쿠팡 발주 리스트', sales:'판매재고', stock:'오아 전산 재고', master:'프로코드' };
  var ORDER  = ['order','sales','stock','master'];

  // ── IndexedDB: 디렉토리 핸들 저장/조회 ──
  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open('coupang-order-folder', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror   = function(){ reject(req.error); };
    });
  }
  function getStoredHandle(){
    return openDB().then(function(db){
      return new Promise(function(resolve){
        var tx = db.transaction('handles','readonly');
        var r  = tx.objectStore('handles').get('dir');
        r.onsuccess = function(){ resolve(r.result || null); };
        r.onerror   = function(){ resolve(null); };
      });
    }).catch(function(){ return null; });
  }
  function saveHandle(h){
    return openDB().then(function(db){
      return new Promise(function(resolve){
        var tx = db.transaction('handles','readwrite');
        tx.objectStore('handles').put(h,'dir');
        tx.oncomplete = function(){ resolve(); };
        tx.onerror    = function(){ resolve(); };
      });
    }).catch(function(){});
  }
  function clearHandle(){
    return openDB().then(function(db){
      return new Promise(function(resolve){
        var tx = db.transaction('handles','readwrite');
        tx.objectStore('handles').delete('dir');
        tx.oncomplete = function(){ resolve(); };
      });
    }).catch(function(){});
  }

  // ── 배너 ──
  function makeBanner(){
    var b = document.createElement('div');
    b.id = '__fsapi-banner__';
    b.innerHTML = '<div class="big">📂 폴더 자동 불러오기</div><div class="sub">클릭하여 발주 파일이 있는 폴더를 선택하세요</div>';
    b.onclick = pickAndLoad;
    return b;
  }
  function setBanner(state, msg){
    var b = document.getElementById('__fsapi-banner__'); if (!b) return;
    b.classList.remove('loading','error');
    if (state === 'loading') {
      b.classList.add('loading');
      b.innerHTML = '<div class="big">⏳ ' + (msg || '불러오는 중...') + '</div>';
    } else if (state === 'error') {
      b.classList.add('error');
      b.innerHTML = '<div class="big">⚠️ ' + msg + '</div><div class="sub">클릭해서 다시 시도</div>';
    } else {
      b.innerHTML = '<div class="big">📂 폴더 자동 불러오기</div><div class="sub">' + (msg || '클릭하여 발주 파일이 있는 폴더를 선택') + '</div>';
    }
  }

  // ── XLSX 처리 ──
  function processBin(type, binStr){
    if (type === 'order')      { orderData  = null; fileState.order  = false; }
    else if (type === 'sales') { salesData  = null; }
    else if (type === 'stock') { stockData  = null; fileState.stock  = false; }
    else if (type === 'master'){ masterData = null; fileState.master = false; }

    resetResults();
    var wb = XLSX.read(binStr, { type:'binary' });

    // 마스터 파일은 '프로코드' 컬럼 있는 시트 자동 선택
    var sheetName = wb.SheetNames[0];
    if (type === 'master' && wb.SheetNames.length > 1) {
      for (var si = 0; si < wb.SheetNames.length; si++) {
        var name = wb.SheetNames[si];
        var aoa  = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'' });
        var hdr = null, hdrIdx = -1;
        for (var ri = 0; ri < Math.min(5, aoa.length); ri++) {
          var row = aoa[ri].map(function(x){ return String(x||'').trim(); });
          if (row.some(function(c){ return /프로\s*코드|procode/i.test(c); })) { hdr = row; hdrIdx = ri; break; }
        }
        if (hdr) {
          sheetName = name;
          if (hdrIdx > 0) {
            var sub = aoa.slice(hdrIdx + 1);
            var rebuilt = sub.map(function(arr){
              var o = {};
              for (var k = 0; k < hdr.length; k++) if (hdr[k]) o[hdr[k]] = (arr[k] !== undefined ? arr[k] : '');
              return o;
            }).filter(function(o){ return Object.values(o).some(function(v){ return String(v).trim() !== ''; }); });
            try { localStorage.setItem('voar-master-data', JSON.stringify(rebuilt)); } catch(e){}
            applyMasterData(rebuilt, 'upload');
            checkReady();
            return;
          }
          break;
        }
      }
    }

    var ws = wb.Sheets[sheetName];
    var rawJson = XLSX.utils.sheet_to_json(ws, { defval:'' });
    var json = rawJson.map(function(row){
      var r = {};
      Object.entries(row).forEach(function(kv){ r[kv[0].replace(/^﻿/, '').trim()] = kv[1]; });
      return r;
    });
    var cols = Object.keys(json[0] || {});

    if (type === 'order') {
      orderData = json;
      document.getElementById('order-cnt').textContent = json.length + '행';
      document.getElementById('order-badge').style.display = 'inline-flex';
      document.getElementById('card-order').classList.add('loaded');
      var poSel = document.getElementById('m-order-po');
      poSel.innerHTML = '<option value="">— 없음 (그룹 없음) —</option>';
      cols.forEach(function(c){ var o = document.createElement('option'); o.value = c; o.textContent = c; poSel.appendChild(o); });
      var gPO = guess(cols,'order-po'); if (gPO) poSel.value = gPO;
      fillSelect('m-order-name', cols, 'order-name');
      fillSelect('m-order-sku',  cols, 'order-sku');
      fillSelect('m-order-qty',  cols, 'order-qty', false, '확정수량');
      fileState.order = true;
    }
    else if (type === 'master') {
      try { localStorage.setItem('voar-master-data', JSON.stringify(json)); } catch(e){}
      applyMasterData(json, 'upload');
    }
    else if (type === 'stock') {
      stockData = json;
      document.getElementById('stock-cnt').textContent = json.length + '행';
      document.getElementById('stock-badge').style.display = 'inline-flex';
      document.getElementById('card-stock').classList.add('loaded');
      fillSelect('m-stock-procode', cols, 'stock-procode', false, '상품코드(단품)');
      fillSelect('m-stock-name',    cols, 'stock-name');
      fillSelect('m-stock-qty',     cols, 'stock-qty', false, '발송 가능 재고');
      transitMap = {};
      var tCol = cols.find(function(h){ return norm(h)==='운송중' || norm(h)==='운송 중'; });
      var cCol = cols.find(function(h){ return norm(h)==='상품코드'; });
      if (tCol && cCol) {
        json.forEach(function(row){
          var code = norm(row[cCol]||''); if (!code) return;
          var qty = parseNum(row[tCol]) || 0;
          transitMap[code] = (transitMap[code]||0) + qty;
        });
      }
      fileState.stock = true;
    }
    else if (type === 'sales') {
      salesData = json;
      salesProcessed = null;
      document.getElementById('sales-cnt').textContent = json.length + '행';
      document.getElementById('sales-badge').style.display = 'inline-flex';
      document.getElementById('card-sales').classList.add('loaded');
      ['m-sales-date-col','m-sales-sku','m-sales-out','m-sales-stock'].forEach(function(id){
        var sel = document.getElementById(id); if (!sel) return;
        sel.innerHTML = '';
        cols.forEach(function(c){ var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      });
      var gDate = guess(cols,'sales-date');  if (gDate) document.getElementById('m-sales-date-col').value = gDate;
      var gSku  = guess(cols,'sales-sku');   if (gSku)  document.getElementById('m-sales-sku').value      = gSku;
      var gOut  = guess(cols,'sales-out');   if (gOut)  document.getElementById('m-sales-out').value      = gOut;
      var gSt   = guess(cols,'sales-stock'); if (gSt)   document.getElementById('m-sales-stock').value    = gSt;
      document.getElementById('sales-mapping').style.display = 'block';
      updateSalesInfo();
    }
    checkReady();
  }

  // 큰 파일 안전한 binary string 변환
  function bufToBinStr(buf){
    var bytes = new Uint8Array(buf);
    var s = '';
    var step = 8192;
    for (var i = 0; i < bytes.length; i += step) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + step, bytes.length)));
    }
    return s;
  }

  async function findFiles(dirHandle){
    var latest = {};
    for await (var entry of dirHandle.values()) {
      if (entry.kind !== 'file') continue;
      if (!/\.(xlsx?|csv)$/i.test(entry.name)) continue;
      for (var key in PATTERNS) {
        if (PATTERNS[key].test(entry.name)) {
          var f = await entry.getFile();
          if (!latest[key] || f.lastModified > latest[key].mtime) {
            latest[key] = { handle: entry, mtime: f.lastModified, name: entry.name };
          }
        }
      }
    }
    return latest;
  }

  async function pickAndLoad(){
    var dirHandle = await getStoredHandle();
    try {
      if (dirHandle) {
        var perm = await dirHandle.queryPermission({ mode:'read' });
        if (perm !== 'granted') perm = await dirHandle.requestPermission({ mode:'read' });
        if (perm !== 'granted') dirHandle = null;
      }
    } catch(e) { dirHandle = null; }

    if (!dirHandle) {
      try {
        setBanner('loading', '폴더 선택 중...');
        dirHandle = await window.showDirectoryPicker({ mode:'read' });
        await saveHandle(dirHandle);
      } catch(e) {
        setBanner('idle', '폴더 선택이 취소되었습니다. 다시 클릭');
        return;
      }
    }

    setBanner('loading', '파일 검색 중...');
    var found;
    try { found = await findFiles(dirHandle); }
    catch(e) {
      console.error(e);
      setBanner('error', '폴더 접근 실패 — 다시 선택해주세요');
      await clearHandle();
      return;
    }

    var missing = ORDER.filter(function(t){ return !found[t]; });
    if (missing.length > 0) {
      setBanner('error', '파일 없음: ' + missing.map(function(t){ return LABELS[t]; }).join(', '));
      return;
    }

    try {
      for (var i = 0; i < ORDER.length; i++) {
        var type = ORDER[i];
        setBanner('loading', LABELS[type] + ' 읽는 중...');
        var file = await found[type].handle.getFile();
        var buf  = await file.arrayBuffer();
        processBin(type, bufToBinStr(buf));
      }

      if (typeof runMatch === 'function' && fileState.order && fileState.master && fileState.stock) {
        runMatch();
        document.body.classList.add('__fsapi-loaded__');
      } else {
        setBanner('error', '데이터 처리 실패 — F12 콘솔 확인');
        console.error('[fsapi] state:', JSON.parse(JSON.stringify(fileState)));
      }
    } catch(e) {
      console.error(e);
      setBanner('error', '오류: ' + (e.message || e));
    }
  }

  window.addEventListener('DOMContentLoaded', async function(){
    await new Promise(function(r){ setTimeout(r, 30); }); // initMaster 양보
    var main = document.querySelector('.main'); if (!main) return;
    main.insertBefore(makeBanner(), main.firstChild);

    var stored = await getStoredHandle();
    if (stored) {
      try {
        var perm = await stored.queryPermission({ mode:'read' });
        if (perm === 'granted') { pickAndLoad(); return; }
      } catch(e){}
      setBanner('idle', '저장된 폴더 사용 — 클릭 시 권한 요청 후 즉시 로드');
    }
  });
})();
</script>
<script id="__VOAR_AUTOLOAD__">
window.__VOAR_REPO__={owner:"tolmjj10",repo:"coupang-po",branch:"main",dir:"data",salesDir:"data/daily"};
(function(){
  var CFG=window.__VOAR_REPO__;
  var PATTERNS={
    order:  /^발주리스트/,
    sales:  /^(일일판매|\d{8})/,
    stock:  /^전산재고/,
    master: /^매입가/,
    issue:  /^이슈제품/
  };

  var hideStyle=document.createElement('style');
  hideStyle.textContent='.upload-grid{display:none !important;}#mapping-section{display:none !important;}#run-btn{display:none !important;}#__fsapi-banner__{display:none !important;}#__fsapi-unsupported__{display:none !important;}';
  document.head.appendChild(hideStyle);

  function setStatus(msg, color){ console.log('[VOAR]', msg); }

  function listOneDir(dir){
    var url='https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+'/contents/'+encodeURI(dir)+'?ref='+CFG.branch;
    return fetch(url, {headers:{'Accept':'application/vnd.github+json'}}).then(function(r){
      if(!r.ok){
        console.warn('[VOAR] listDir skip '+dir+': '+r.status);
        return [];
      }
      return r.json();
    }).catch(function(e){ console.warn('[VOAR] listDir err '+dir+':', e.message); return []; });
  }

  function listRepoFiles(){
    var dirs=[CFG.dir];
    if(CFG.salesDir && CFG.salesDir!==CFG.dir) dirs.push(CFG.salesDir);
    return Promise.all(dirs.map(listOneDir)).then(function(lists){
      var all=[];
      lists.forEach(function(list){ if(Array.isArray(list)) all=all.concat(list); });
      return all;
    });
  }

  function pickLatest(files, regex){
    var hits=files.filter(function(f){ return f.type==='file' && regex.test(f.name); });
    if(hits.length===0) return null;
    hits.sort(function(a,b){ return a.name<b.name?1:a.name>b.name?-1:0; });
    return hits[0];
  }

  /* daily/ 폴더의 날짜 파일 필터: basic_operation_rocket_<digits>.xlsx 또는 단순 YYYYMMDD.xlsx */
  var DAILY_NAME_RE=/^(basic_operation_rocket_)?\d{8,}\.(xlsx|xls|csv)$/i;
  function pickDailySales(files){
    return files.filter(function(f){
      return f.type==='file' && DAILY_NAME_RE.test(f.name)
             && f.path && f.path.indexOf(CFG.salesDir+'/')===0;
    }).sort(function(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; }); // 오름차순 (오래된→최신)
  }

  /* 파일명에서 날짜 8자리 추출 (마지막 8자리 = 종료일) */
  function extractDailyDate(name){
    var base=name.replace(/\.(xlsx|xls|csv)$/i,'');
    var digits=(base.match(/\d+/g)||[]).join('');
    return digits.length>=8 ? digits.slice(-8) : base;
  }

  /* 날짜 파일 하나를 fetch·파싱해서 rows에 '날짜' 컬럼 주입 후 반환 */
  function fetchDailyFile(file){
    var dateStr=extractDailyDate(file.name); // "20260714"
    var isCsv=/\.csv$/i.test(file.name);
    return fetchBinary(file.download_url).then(function(ab){
      var wb;
      if(isCsv){
        /* CSV는 UTF-8 텍스트로 디코드해서 파싱 (binary string 경로는 한글 깨짐) */
        var text=new TextDecoder('utf-8').decode(ab).replace(/^﻿/,'');
        wb=XLSX.read(text,{type:'string'});
      } else {
        wb=XLSX.read(abToBinaryString(ab),{type:'binary'});
      }
      var ws=wb.Sheets[wb.SheetNames[0]];
      var raw=XLSX.utils.sheet_to_json(ws,{defval:'',blankrows:false});
      return raw.map(function(row){
        var r={'날짜':dateStr};
        Object.keys(row).forEach(function(k){
          var key=k.replace(/^﻿/,'').trim();
          if(key==='날짜') return; // 파일명 날짜가 우선
          r[key]=row[k];
        });
        return r;
      });
    }).catch(function(e){ console.warn('[VOAR] daily skip '+file.name+':', e.message); return []; });
  }

  /* daily 파일 여러 개를 병합해서 salesData로 로드 (loadFile의 sales 분기와 동일한 UI 갱신) */
  function loadDailyMerged(files){
    return Promise.all(files.map(fetchDailyFile)).then(function(rowsArr){
      var merged=[]; rowsArr.forEach(function(rs){ merged=merged.concat(rs); });
      if(merged.length===0) return;
      salesData=merged;
      salesProcessed=null;
      var cols=Object.keys(merged[0]||{});
      document.getElementById('sales-cnt').textContent=merged.length+'행 ('+files.length+'일)';
      document.getElementById('sales-badge').style.display='inline-flex';
      document.getElementById('card-sales').classList.add('loaded');
      ['m-sales-date-col','m-sales-sku','m-sales-out','m-sales-stock'].forEach(function(id){
        var sel=document.getElementById(id); if(!sel) return;
        sel.innerHTML='';
        cols.forEach(function(c){ var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o); });
      });
      var gDate=guess(cols,'sales-date'); if(gDate) document.getElementById('m-sales-date-col').value=gDate;
      var gSku =guess(cols,'sales-sku');  if(gSku)  document.getElementById('m-sales-sku').value=gSku;
      var gOut =guess(cols,'sales-out');  if(gOut)  document.getElementById('m-sales-out').value=gOut;
      var gSt  =guess(cols,'sales-stock');if(gSt)   document.getElementById('m-sales-stock').value=gSt;
      var sm=document.getElementById('sales-mapping'); if(sm) sm.style.display='block';
      updateSalesInfo();
      try{ checkReady(); }catch(e){}
      console.log('[VOAR] daily merged: '+files.length+'files, '+merged.length+' rows, cols=['+cols.join(',')+']');
      console.log('[VOAR] auto-picked date='+document.getElementById('m-sales-date-col').value+' sku='+document.getElementById('m-sales-sku').value+' out='+document.getElementById('m-sales-out').value+' stock='+document.getElementById('m-sales-stock').value);
    });
  }

  function fetchBinary(url){
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('fetch '+r.status+' '+url);
      return r.arrayBuffer();
    });
  }

  function abToBinaryString(ab){
    var u8=new Uint8Array(ab); var s=''; var CHUNK=0x8000;
    for(var i=0;i<u8.length;i+=CHUNK){ s+=String.fromCharCode.apply(null, u8.subarray(i,i+CHUNK)); }
    return s;
  }

  function dispatchToLoadFile(type, ab, name){
    var blob=new Blob([ab]);
    blob.name=name;
    var fakeInput={files:[blob]};
    loadFile(type, fakeInput);
  }

  function pickMasterSheet(wb){
    var re=/프로코드|procode/i;
    for(var i=0;i<wb.SheetNames.length;i++){
      var name=wb.SheetNames[i];
      var ws=wb.Sheets[name];
      var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false});
      var maxR=Math.min(5,aoa.length);
      for(var r=0;r<maxR;r++){
        var row=aoa[r]||[];
        for(var c=0;c<row.length;c++){
          if(re.test(String(row[c]||''))){ return {name:name, headerRow:r}; }
        }
      }
    }
    return null;
  }

  function loadMasterFromAB(ab){
    var bin=abToBinaryString(ab);
    var wb=XLSX.read(bin,{type:'binary'});
    var pick=pickMasterSheet(wb);
    var FORCE_LAST_ROW=999;
    var json;
    if(pick){
      var ws=wb.Sheets[pick.name];
      var ref=ws['!ref']||'A1';
      var rng=XLSX.utils.decode_range(ref);
      var endR=Math.max(rng.e.r, FORCE_LAST_ROW);
      var endC=Math.max(rng.e.c, 25);
      var fullRange={s:{r:pick.headerRow,c:0}, e:{r:endR,c:endC}};
      var raw=XLSX.utils.sheet_to_json(ws,{defval:'',range:fullRange,blankrows:false});
      json=raw.map(function(row){ var r={}; Object.keys(row).forEach(function(k){ r[k.replace(/^﻿/,'').trim()]=row[k]; }); return r; });
    } else {
      var ws0=wb.Sheets[wb.SheetNames[0]];
      var raw0=XLSX.utils.sheet_to_json(ws0,{defval:'',blankrows:false});
      json=raw0.map(function(row){ var r={}; Object.keys(row).forEach(function(k){ r[k.replace(/^﻿/,'').trim()]=row[k]; }); return r; });
    }
    try{ localStorage.setItem('voar-master-data', JSON.stringify(json)); }catch(e){}
    applyMasterData(json, 'upload');
  }

  function makeFingerprint(picks){
    return ['order','sales','stock','master'].map(function(k){ return picks[k]?picks[k].sha:'_'; }).join(':');
  }

  function fetchSharedState(){
    return fetch('/api/state').then(function(r){
      if(!r.ok) throw new Error('state HTTP '+r.status);
      return r.json();
    }).catch(function(e){
      console.warn('[VOAR] state fetch skipped:', e.message);
      return null;
    });
  }

  function start(){
    listRepoFiles().then(function(files){
      var picks={};
      Object.keys(PATTERNS).forEach(function(k){ picks[k]=pickLatest(files, PATTERNS[k]); });

      var report=Object.keys(picks).map(function(k){
        return (picks[k]?'✓ '+k+': '+picks[k].name:'✗ '+k+': 없음');
      }).join(' / ');
      console.log('[VOAR] '+report);

      window.__VOAR_FINGERPRINT__=makeFingerprint(picks);
      window.__VOAR_ORDER_SHA__=picks.order?picks.order.sha:'';
      console.log('[VOAR] fingerprint:', window.__VOAR_FINGERPRINT__, 'orderSha:', window.__VOAR_ORDER_SHA__);

      var jobs=[];
      ['order','stock'].forEach(function(k){
        if(picks[k]) jobs.push(fetchBinary(picks[k].download_url).then(function(ab){ dispatchToLoadFile(k, ab, picks[k].name); }));
      });
      if(picks.issue) jobs.push(fetchBinary(picks.issue.download_url).then(function(ab){
        try {
          var wb=XLSX.read(abToBinaryString(ab),{type:'binary'});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
          issueMap={};
          categoryMap={};
          rows.forEach(function(row){
            var keys=Object.keys(row);
            var skuKey=keys.find(function(k){ var n=norm(k); return n==='skuid'||n==='sku'||n==='옵션코드'; })||keys[0];
            var noteKey=keys.find(function(k){ var n=norm(k); return n==='특이사항'||n==='메모'||n==='비고'||n==='note'; });
            var sku=norm(row[skuKey]);
            if(sku) issueMap[sku]=noteKey?String(row[noteKey]||'').trim()||'확인필요':'확인필요';
            var catKey=keys.find(function(k){ return norm(k)==='카테고리'; });
            var catSkuKey=keys.find(function(k){ var n=norm(k); return n==='sku#'||n==='sku번호'||n==='sku_no'||n==='skuno'; });
            if(catKey && catSkuKey){
              var cat=String(row[catKey]||'').trim();
              var csku=norm(row[catSkuKey]);
              if(cat && csku) categoryMap[csku]=cat;
            }
          });
          console.log('[VOAR] issue loaded: '+Object.keys(issueMap).length+'건, category: '+Object.keys(categoryMap).length+'건');
        } catch(e){ console.warn('[VOAR] issue parse err:', e.message); }
      }));
      /* sales: daily/ 폴더의 YYYYMMDD 파일 우선 병합, 없으면 기존 방식 */
      var dailyFiles=pickDailySales(files);
      if(dailyFiles.length>0){
        console.log('[VOAR] daily files: '+dailyFiles.map(function(f){return f.name;}).join(', '));
        jobs.push(loadDailyMerged(dailyFiles));
      } else if(picks.sales){
        jobs.push(fetchBinary(picks.sales.download_url).then(function(ab){ dispatchToLoadFile('sales', ab, picks.sales.name); }));
      }
      if(picks.master) jobs.push(fetchBinary(picks.master.download_url).then(loadMasterFromAB));

      return Promise.all(jobs).then(function(){
        setStatus('데이터 로드 완료');
        try{ checkReady(); }catch(e){}
        try{ document.getElementById('mapping-section').classList.add('show'); }catch(e){}
        setTimeout(function(){
          try{ runMatch(); }catch(e){ console.error('runMatch:',e); }
          fetchSharedState().then(function(saved){
            if(saved && typeof window.applySharedState==='function'){
              window.applySharedState(saved);
              console.log('[VOAR] shared state applied');
            }
          });
        }, 200);
      });
    }).catch(function(err){
      console.error('[VOAR] load error', err);
      setStatus('데이터 로드 실패: '+err.message, '#dc2626');
    });
  }

  function whenReady(){
    if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', start); }
    else { setTimeout(start, 50); }
  }
  whenReady();
})();
</script>
