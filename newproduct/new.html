<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쿠팡 신제품 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1a1916;
    --muted: #6b6960;
    --primary: #1a3a4a;
    --primary-hover: #255269;
    --accent: #1a3a4a;
    --accent-light: #e8f1f5;
    --success: #4a7c59;
    --warning: #b08840;
    --danger: #a85450;
    --info: #4a6b8a;
    --soft-red: #f7efee;
    --soft-yellow: #f8f4e9;
    --soft-green: #eef2ec;
    --soft-blue: #eef1f4;
    --soft-purple: #f2f0ee;
  }
  html, body {
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    height: 100vh;
    overflow: hidden;
  }
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .page-header .title-block h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.024em;
    margin: 0;
    color: var(--text);
    line-height: 1.15;
  }
  .page-header .title-block .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-header #saveStatus {
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .container { max-width: 1720px; margin: 0 auto; padding: 20px 24px 22px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .stats-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 14px;
    background: var(--card);
    border: 1px solid #eae1d8;
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 1px 2px rgba(139, 117, 108, 0.05);
  }
  .stats-row .divider {
    width: 1px; height: 22px; background: #eae1d8; margin: 0 4px;
  }
  button.btn.ghost {
    background: transparent; border-color: transparent; color: #6b6960; padding: 6px 10px;
  }
  button.btn.ghost:hover { background: #f2ede9; border-color: transparent; color: #6b5f47; }
  button.btn.ghost:disabled { opacity: 0.35; cursor: default; background: transparent; }
  button.btn.ghost:disabled:hover { background: transparent; }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .toolbar-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* margin.html 스타일과 동일한 버튼 톤 */
  button.btn {
    font: 500 13px 'Pretendard', sans-serif; letter-spacing: -0.01em;
    padding: 8px 14px; border-radius: 9px; border: 1px solid #e0d6cd;
    background: #ffffff; color: var(--text); cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .05s;
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 500; box-shadow: none;
  }
  button.btn:hover { background: #f6f1ec; border-color: #d3c4b7; transform: none; box-shadow: none; }
  button.btn:active { transform: scale(0.98); }
  button.btn.primary {
    background: #aa9791; color: #fff; border-color: #aa9791;
    box-shadow: 0 1px 2px rgba(139,117,108,0.28);
  }
  button.btn.primary:hover { background: #8b756c; border-color: #8b756c; }
  .stat-card {
    background: var(--card);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
    transition: background .12s ease;
  }
  .stat-card:hover { background: #f8fafc; }
  .stat-label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .stat-value { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-value.red { color: var(--danger); }
  .stat-value.orange { color: var(--warning); }
  .stat-value.green { color: var(--success); }
  .stat-value.indigo { color: var(--text); }

  .alerts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .alert {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
  }
  .alert.urgent {
    background: var(--soft-red);
    color: #8a3a37;
    border-color: #e6d3d1;
  }
  .alert.warning {
    background: var(--soft-yellow);
    color: #7a5c2e;
    border-color: #e5dcc4;
  }
  .alert.info {
    background: var(--soft-blue);
    color: #3d5670;
    border-color: #d5dbe2;
  }
  .alert.ok {
    background: var(--soft-green);
    color: #3d6349;
    border-color: #d4dbd0;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: all .15s ease;
    letter-spacing: -0.01em;
  }
  button:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  button.ghost {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.ghost:hover { background: #f8fafc; box-shadow: none; transform: none; }
  button.danger-icon {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    font-size: 14px;
    border-radius: 6px;
  }
  button.danger-icon:hover {
    background: var(--soft-red);
    color: var(--danger);
    transform: none;
    box-shadow: none;
  }
  .search {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    width: 260px;
    font-family: inherit;
    background: white;
    transition: border-color .15s ease;
  }
  .search:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }

  .table-wrap {
    background: white;
    border-radius: 14px;
    overflow: auto;
    flex: 1;
    min-height: 0;
    border: 1px solid #eae1d8;
    box-shadow: 0 1px 2px rgba(139, 117, 108, 0.05);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 1600px;
  }
  th {
    background: #fafbfd;
    padding: 14px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: nowrap;
  }
  th.resizable { position: sticky; overflow: visible; }
  th .col-resizer {
    position: absolute;
    top: 0;
    right: -3px;
    width: 8px;
    height: 100%;
    cursor: col-resize;
    user-select: none;
    z-index: 3;
  }
  th .col-resizer:hover, th .col-resizer.dragging {
    background: linear-gradient(90deg, transparent, var(--accent) 40%, var(--accent) 60%, transparent);
    opacity: 0.5;
  }
  td {
    padding: 6px 8px;
    border-bottom: 1px solid #f5f6f9;
    vertical-align: middle;
  }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover td { background: #fafbfd; }
  tbody tr.drag-over-top td { border-top: 2px solid var(--accent); }
  tbody tr.drag-over-bottom td { border-bottom: 2px solid var(--accent); }
  tbody tr.dragging { opacity: 0.4; }
  .drag-handle {
    cursor: grab;
    color: #c9c6be;
    font-size: 16px;
    line-height: 1;
    user-select: none;
    text-align: center;
    padding: 0 4px;
    transition: color .12s ease;
  }
  .drag-handle:hover { color: var(--text); }
  .drag-handle:active { cursor: grabbing; }
  tr.completed td { background: #f4f6f2 !important; }
  tr.completed input { color: #4a6b52; }
  tr.urgent-row td { background: #f7efee !important; }
  tr.warning-row td { background: #f8f4e9 !important; }

  input[type="text"], input[type="date"], select.manager-select {
    border: 1px solid transparent;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
    background: transparent;
    color: var(--text);
    transition: all .12s ease;
  }
  input[type="text"]:hover, input[type="date"]:hover, select.manager-select:hover { background: #f4f5f8; }
  input[type="text"]:focus, input[type="date"]:focus, select.manager-select:focus {
    outline: none;
    background: white;
    border-color: #c0c0bb;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
  }
  select.manager-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
    padding-right: 20px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6960' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    font-weight: 500;
  }
  select.manager-select:hover { background-color: #f4f5f8; }
  select.manager-select:focus { background-color: white; }
  input.reg-name {
    background: #f3f1ec;
    border: 1px dashed #c9c3b6;
    color: #6b6355;
    font-size: 11.5px;
    padding: 6px 8px;
    letter-spacing: -0.02em;
  }
  input.reg-name::placeholder { color: #a89f8c; font-style: italic; }
  input.reg-name.filled {
    font-weight: 700;
    color: #2b2b2b;
    background: transparent;
    border: 1px solid transparent;
  }
  input.reg-name.filled:hover {
    background: #f4f5f8;
    border-color: transparent;
  }
  input.reg-name.filled:focus {
    background: #ebe8e0;
    border: 1px solid #c9c3b6;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
  }

  .check-cell {
    text-align: center;
    min-width: 78px;
    padding-left: 4px;
    padding-right: 4px;
  }
  .check-cell input[type="checkbox"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid #d1d5db;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    vertical-align: middle;
    transition: all .15s ease;
    background: white;
  }
  .check-cell input[type="checkbox"] { border-color: #cfcfc9; }
  .check-cell input[type="checkbox"]:hover { border-color: #9a9a94; }
  .check-cell input[type="checkbox"]:checked {
    background: var(--success);
    border-color: var(--success);
  }
  .check-cell input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .check-cell input[type="date"] {
    font-size: 11px;
    padding: 3px 6px;
    text-align: center;
    color: var(--muted);
    margin-top: 4px;
  }
  .rocket-warn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-top: 5px;
    padding: 2px 7px;
    background: #fde2e0;
    color: #8a3a37;
    border: 1px solid #f0b8b3;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    animation: rocket-warn-pulse 1.6s ease-in-out infinite;
  }
  @keyframes rocket-warn-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220, 80, 70, 0.35); }
    50%      { box-shadow: 0 0 0 4px rgba(220, 80, 70, 0);    }
  }

  .status-badge {
    display: inline-block;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .status-done { background: #e4ebe0; color: #4a6b52; }
  .status-progress { background: #e2e7ed; color: #45607a; }
  .status-urgent { background: #ecd9d7; color: #8a3a37; }
  .status-pending { background: #ecebe7; color: #7a7a72; }

  .d-day {
    font-size: 10.5px;
    font-weight: 700;
    display: inline-block;
    margin-top: 4px;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: -0.01em;
  }
  .d-day.danger { background: #ecd9d7; color: #8a3a37; }
  .d-day.warn { background: #ebe1c9; color: #7a5c2e; }
  .d-day.safe { background: #e4ebe0; color: #4a6b52; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    border-radius: 0;
    letter-spacing: -0.01em;
    transition: color .12s ease, border-color .12s ease;
  }
  .tab:hover { color: var(--text); background: transparent; transform: none; box-shadow: none; }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }
  .tab .count {
    display: inline-block;
    background: #ecebe7;
    color: #7a7a72;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    font-weight: 600;
  }
  .tab.active .count { background: #2b2b2b; color: white; }

  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  #confirmMask {
    position: fixed; inset: 0; background: rgba(15,23,42,0.28);
    display: none; align-items: center; justify-content: center; z-index: 2000;
  }
  #confirmMask.open { display: flex; }
  #confirmBox {
    background: white; border-radius: 12px; padding: 20px 22px 16px;
    width: 300px; box-shadow: 0 12px 32px rgba(15,23,42,0.25);
    font-family: inherit;
  }
  #confirmBox .msg { font-size: 14px; color: var(--text); margin-bottom: 16px; line-height: 1.5; }
  #confirmBox .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #confirmBox button {
    padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid #d1d5db; background: white; color: var(--text); font-family: inherit;
  }
  #confirmBox button.primary { background: #2b7a4b; border-color: #2b7a4b; color: white; }
  #confirmBox button.primary:hover { background: #246a41; }

  #memoPopover {
    position: absolute;
    z-index: 1000;
    background: #fffdf5;
    border: 1px solid #e5c76b;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
    padding: 10px;
    width: 280px;
    display: none;
  }
  #memoPopover.open { display: block; }
  #memoPopover textarea {
    width: 100%;
    min-height: 72px;
    resize: vertical;
    border: 1px solid #e5c76b;
    border-radius: 6px;
    padding: 6px 8px;
    font: 13px 'Pretendard', inherit;
    background: white;
    box-sizing: border-box;
  }
  #memoPopover textarea:focus { outline: none; border-color: #b78900; box-shadow: 0 0 0 3px rgba(229,199,107,0.25); }
  #memoPopover .memo-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  #memoPopover .memo-actions button {
    padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid #d1d5db; background: white; color: var(--text); font-family: inherit;
  }
  #memoPopover .memo-actions button.primary { background: #b78900; border-color: #b78900; color: white; }
  #memoPopover .memo-actions button.danger { color: #a4423b; border-color: #f0b6b1; }

  input.reg-name:focus {
    position: relative;
    z-index: 20;
    background: white !important;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
    border-color: var(--accent) !important;
  }

  input.real-name.has-memo {
    background: #fff4f3;
    border-color: #f0b6b1 !important;
    color: #a4423b;
    font-weight: 600;
  }
  input.real-name.has-memo:hover { background: #ffe9e7; }
  input.real-name.has-memo:focus { background: #ffffff; }

  .detail-url-wrap { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  .detail-url-wrap input.detail-url-input {
    flex: 1; min-width: 0; width: auto;
    padding: 6px 8px; font-size: 12px;
  }
  .detail-open-btn {
    flex-shrink: 0;
    padding: 5px 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .12s ease;
  }
  .detail-open-btn:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .detail-open-btn:disabled { background: #d0cec7; border-color: #d0cec7; cursor: not-allowed; }
</style>
</head>
<body>

<div id="confirmMask">
  <div id="confirmBox" role="dialog" aria-modal="true">
    <div class="msg" id="confirmMsg"></div>
    <div class="actions">
      <button type="button" id="confirmNo">아니오</button>
      <button type="button" class="primary" id="confirmYes">예</button>
    </div>
  </div>
</div>

<div id="memoPopover" role="dialog" aria-label="메모">
  <textarea id="memoText" placeholder="이슈/메모를 입력하세요..."></textarea>
  <div class="memo-actions">
    <button type="button" class="danger" id="memoDelete">삭제</button>
    <button type="button" id="memoCancel">취소</button>
    <button type="button" class="primary" id="memoSave">저장</button>
  </div>
</div>

<div class="container">

  <div class="page-header">
    <div class="title-block">
      <h1>신제품</h1>
    </div>
    <span id="saveStatus"></span>
  </div>

  <div class="stats-row">
    <div class="toolbar-inline">
      <button class="btn primary" onclick="addRow()">＋ 신제품 추가</button>
      <button class="btn" onclick="saveNow()" title="지금 바로 공유 저장">저장</button>
      <div class="divider"></div>
      <button class="btn ghost" id="btnUndo" onclick="doUndo()" title="되돌리기 (Ctrl+Z)" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
      </button>
      <button class="btn ghost" id="btnRedo" onclick="doRedo()" title="다시하기 (Ctrl+Y)" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
      </button>
    </div>
    <div class="stats" id="stats" style="display:none"></div>
    <input class="search" id="search" style="margin-left:auto" placeholder="🔍 담당자 · 상품명 검색" oninput="render()">
  </div>
  <div class="alerts" id="alerts"></div>

  <div class="tabs" id="tabs"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:28px;"></th>
          <th style="width:96px;">담당자</th>
          <th class="resizable" style="width:600px;" data-col="reg">등록 상품명<span class="col-resizer"></span></th>
          <th class="resizable" style="width:600px;" data-col="real">전산명<span class="col-resizer"></span></th>
          <th style="width:120px; cursor:pointer; user-select:none;" onclick="toggleSort('prod')" title="클릭하여 정렬">생산완료일 <span id="sortProdIcon" style="opacity:.6;">⇅</span></th>
          <th style="width:140px; cursor:pointer; user-select:none;" onclick="toggleSort('arrival')" title="클릭하여 정렬">입고예정일 <span id="sortArrivalIcon" style="opacity:.6;">⇅</span></th>
          <th style="width:140px; cursor:pointer; user-select:none;" onclick="toggleSort('detail')" title="클릭하여 정렬">상세전달일자 <span id="sortDetailIcon" style="opacity:.6;">⇅</span></th>
          <th class="check-cell">🚀 로켓 등록</th>
          <th class="check-cell">✈️ 윙 등록</th>
          <th class="check-cell">🔗 벤플 매핑</th>
          <th class="check-cell">📢 광고 생성</th>
          <th style="width:100px;">상태</th>
          <th style="width:200px;">상세페이지</th>
          <th class="check-cell" style="width:80px;">✅ 등록완료</th>
          <th style="width:50px;"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
const STORAGE_KEY = 'coupang_new_product_dashboard_v1';
const IMPORTED_KEY = 'coupang_new_product_imported_v1';
const API_URL = '/api/new-state';
const DEFAULT_YEAR = '2026';
const REPO_CFG = { owner: 'tolmjj10', repo: 'coupang-po', branch: 'main', dir: 'newproduct/new' };
const BRANDS = [
  { key: 'all',   label: '전체' },
  { key: 'urgent',label: '긴급' },
  { key: 'oa',    label: '오아',   match: n => (n||'').trim().startsWith('오아') },
  { key: 'voir',  label: '보아르', match: n => (n||'').trim().startsWith('보아르') },
  { key: 'etc',   label: '기타',   match: n => { const t = (n||'').trim(); return !t.startsWith('오아') && !t.startsWith('보아르'); } },
  { key: 'done',  label: '완료' }
];
let activeBrand = 'all';
let sortKey = 'prod'; // 초기 정렬: 생산완료일 오름차순(빠른 순)
let sortAsc = true;
const URGENT_DISMISS_KEY = 'coupang_new_urgent_dismiss_v1';
let urgentDismissedIds = new Set();
try {
  const _stored = JSON.parse(localStorage.getItem(URGENT_DISMISS_KEY) || '[]');
  urgentDismissedIds = new Set(_stored);
} catch(e) {}

function isUrgentRow(r) {
  if (isCompleted(r) || r.registered) return false;
  const a = daysUntil(r.arrivalDate);
  return a !== null && a <= 3;
}
let importedNames = {}; // (구버전 호환용, 더 이상 dedup에 사용하지 않음)
let lastExcelProducts = null; // 마지막으로 처리한 엑셀의 제품명 배열. 이 목록과 diff로 신규 판별
let data = loadLocal();

/* 저장 페이로드 파싱 — 구버전(array), {rows,imported}, {rows,imported,lastExcelProducts} 모두 지원 */
function _parsePayload(parsed) {
  if (Array.isArray(parsed)) return { rows: parsed, imported: null, lastExcelProducts: null };
  if (parsed && Array.isArray(parsed.rows)) {
    return {
      rows: parsed.rows,
      imported: parsed.imported || null,
      lastExcelProducts: Array.isArray(parsed.lastExcelProducts) ? parsed.lastExcelProducts : null
    };
  }
  return { rows: [], imported: null, lastExcelProducts: null };
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = _parsePayload(JSON.parse(raw));
      if (p.imported) importedNames = p.imported;
      if (p.lastExcelProducts) lastExcelProducts = p.lastExcelProducts;
      return p.rows.length ? p.rows : sampleData();
    }
  } catch(e) {}
  return sampleData();
}

async function loadRemote() {
  if (_isDirty) return; // 미저장 로컬 변경을 원격 값으로 덮어쓰지 않도록
  if (Date.now() < _suppressRemoteLoadUntil) return;
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json();
    const p = _parsePayload(remote);
    if (p.rows.length > 0) {
      data = p.rows;
      if (p.imported) {
        Object.keys(p.imported).forEach(k => { importedNames[k] = true; });
      }
      if (p.lastExcelProducts) lastExcelProducts = p.lastExcelProducts;
      migrateImportedToRealName();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts })); } catch(e) {}
      _prevSnapshot = JSON.stringify(data);
      /* 원격 동기화는 사용자 액션이 아니므로 undo 히스토리 초기화 */
      undoStack.length = 0;
      redoStack.length = 0;
      render();
      refreshUndoUI();
    }
  } catch (e) {
    console.warn('[new] remote load skipped:', e.message);
  }
}

/* 이전에 regName으로 자동 임포트된 값을 realName(전산명)으로 이동
   조건: regName에 값 있고, realName은 비어있음
   → 자동 임포트된 값으로 간주하고 이동. 이동 후 해당 이름을 importedNames에 등록 */
function migrateImportedToRealName() {
  let migrated = 0;
  data.forEach(r => {
    const rn = (r.regName || '').trim();
    if (!rn) return;
    if ((r.realName || '').trim()) return; // 이미 전산명이 있으면 건드리지 않음
    r.realName = r.regName;
    r.regName = '';
    importedNames[rn] = true;
    migrated++;
  });
  if (migrated > 0) {
    console.log('[new] regName → realName 마이그레이션: ' + migrated + '건');
    save();
  }
}

function sampleData() {
  return [
    {
      id: uid(), manager: '김현유', regName: '', realName: '예시 상품 A',
      productionDate: '', arrivalDate: '', detailDueDate: '',
      rocket: {done:false, date:''}, wing: {done:false, date:''},
      venple: {done:false, date:''}, ad: {done:false, date:''}
    }
  ];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

let _saveTimer = null;
let _isDirty = false;
/* ── Undo (Ctrl+Z) ─────────────────────────
   save()가 호출될 때마다 이전 상태를 undoStack에 push. 실제 mutation 함수를
   개별적으로 감싸지 않아도 되어 유지보수가 쉬움. */
let _prevSnapshot = null;
const undoStack = [];
const redoStack = [];
const UNDO_MAX = 100;
function refreshUndoUI() {
  const u = document.getElementById('btnUndo');
  const r = document.getElementById('btnRedo');
  if (u) u.disabled = undoStack.length === 0;
  if (r) r.disabled = redoStack.length === 0;
}
function save() {
  if (_prevSnapshot !== null) {
    undoStack.push(_prevSnapshot);
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  }
  /* 새로운 변경이 발생하면 redo 히스토리는 무효화 */
  redoStack.length = 0;
  _prevSnapshot = JSON.stringify(data);
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts }));
  _isDirty = true;
  const el = document.getElementById('saveStatus');
  if (el) el.textContent = '● 미저장 (자동 저장 대기 중)';
  refreshUndoUI();
}
function _applySnapshot(snap, statusText) {
  try {
    data = JSON.parse(snap);
    _prevSnapshot = snap;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts }));
    _isDirty = true;
    const el = document.getElementById('saveStatus');
    if (el) el.textContent = statusText;
    render();
    refreshUndoUI();
  } catch(e) { console.warn('[new] apply snapshot failed:', e); }
}
function doUndo() {
  if (undoStack.length === 0) return;
  const prev = undoStack.pop();
  /* 현재 상태를 redoStack에 저장하여 Ctrl+Y로 복구 가능 */
  if (_prevSnapshot !== null) redoStack.push(_prevSnapshot);
  _applySnapshot(prev, '● 되돌림 (자동 저장 대기 중)');
}
function doRedo() {
  if (redoStack.length === 0) return;
  const next = redoStack.pop();
  if (_prevSnapshot !== null) undoStack.push(_prevSnapshot);
  _applySnapshot(next, '● 다시 실행 (자동 저장 대기 중)');
}
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const key = e.key.toLowerCase();
  const isUndo = !e.shiftKey && key === 'z';
  const isRedo = (key === 'y') || (e.shiftKey && key === 'z');
  if (!isUndo && !isRedo) return;
  const t = e.target;
  /* 입력창 안이면 브라우저의 기본 텍스트 undo/redo에 맡김 */
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  e.preventDefault();
  if (isUndo) doUndo(); else doRedo();
});

async function saveRemote() {
  const el = document.getElementById('saveStatus');
  _suppressRemoteLoadUntil = Date.now() + 5000;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    _isDirty = false;
    if (el) {
      el.textContent = '✓ 공유 저장됨 ' + new Date().toLocaleTimeString('ko-KR');
      setTimeout(() => { if (el.textContent.startsWith('✓')) el.textContent = ''; }, 2000);
    }
  } catch (e) {
    if (el) el.textContent = '⚠ 로컬만 저장 (' + e.message + ')';
    console.warn('[new] remote save failed:', e);
  }
}

function saveNow() {
  clearTimeout(_saveTimer);
  saveRemote();
}

function today() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const t = new Date(dateStr);
  t.setHours(0,0,0,0);
  return Math.round((t - today()) / 86400000);
}

function isCompleted(row) {
  return row.rocket.done && row.wing.done && row.venple.done && row.ad.done;
}

function statusOf(row) {
  /* 긴급: 입고예정일이 D-3 이하부터 표기. 완료된 제품(등록완료 또는 4개 체크)은 제외 */
  if (isCompleted(row) || row.registered) return {label: '', cls: ''};
  const arrival = daysUntil(row.arrivalDate);
  if (arrival !== null && arrival <= 3) {
    return {label: '긴급', cls: 'status-urgent'};
  }
  return {label: '', cls: ''};
}

function hasAnyProgress(row) {
  return row.rocket.done || row.wing.done || row.venple.done || row.ad.done;
}

function rowClass(row) {
  if (isCompleted(row)) return 'completed';
  if (!hasAnyProgress(row)) return '';
  const detail = daysUntil(row.detailDueDate);
  if (detail !== null && detail <= 2) return 'urgent-row';
  if (detail !== null && detail <= 5) return 'warning-row';
  const arrival = daysUntil(row.arrivalDate);
  if (arrival !== null && arrival <= 3 && arrival >= 0) return 'warning-row';
  return '';
}

function dDayHtml(dateStr) {
  if (!dateStr) return '';
  const d = daysUntil(dateStr);
  if (d === null) return '';
  let cls = 'd-day';
  let text = '';
  if (d < 0) { text = 'D+' + Math.abs(d); cls += ' danger'; }
  else if (d === 0) { text = 'D-DAY'; cls += ' danger'; }
  else if (d <= 3) { text = 'D-' + d; cls += ' danger'; }
  else if (d <= 7) { text = 'D-' + d; cls += ' warn'; }
  else { text = 'D-' + d; cls += ' safe'; }
  return '<span class="' + cls + '">' + text + '</span>';
}

/* D-3 이하일 때만 뱃지 표시. colorCls: 'danger'(빨강) 또는 'safe'(초록) */
function dDayBadge(dateStr, colorCls) {
  if (!dateStr) return '';
  const d = daysUntil(dateStr);
  if (d === null || d > 3) return '';
  const text = d < 0 ? 'D+' + Math.abs(d) : d === 0 ? 'D-DAY' : 'D-' + d;
  return '<span class="d-day ' + colorCls + '">' + text + '</span>';
}

/* 색상 규칙: D-n (미래·D-DAY 포함) → 초록(safe), D+n (지남) → 빨강(danger) */

/* 생산완료일: 로켓 등록 전에만, D-3 ~ D-DAY 구간에서 초록색으로 표시.
   D-day가 지나면 감춤(→ 이후엔 입고예정일에 카운트다운 표시). */
function productionBadge(row) {
  if (row.rocket.done || row.rocket.date) return '';
  const d = daysUntil(row.productionDate);
  if (d === null || d < 0 || d > 3) return '';
  const text = d === 0 ? 'D-DAY' : 'D-' + d;
  return '<span class="d-day safe">' + text + '</span>';
}

/* 입고예정일: 로켓 등록 전 + 생산완료일이 D-day를 지난 이후에만
   입고예정일까지 남은 일수를 표시. D- → 초록, D+ → 빨강 */
function arrivalBadge(row) {
  if (row.rocket.done || row.rocket.date) return '';
  const prod = daysUntil(row.productionDate);
  if (prod === null || prod >= 0) return '';
  const d = daysUntil(row.arrivalDate);
  if (d === null) return '';
  const cls = d < 0 ? 'danger' : 'safe';
  const text = d < 0 ? 'D+' + Math.abs(d) : d === 0 ? 'D-DAY' : 'D-' + d;
  return '<span class="d-day ' + cls + '">' + text + '</span>';
}

/* 상세전달일자: 로켓 등록 전 + D-3 이하부터 표시. D- → 초록, D+ → 빨강 */
function detailBadge(row) {
  if (row.rocket.done || row.rocket.date) return '';
  const d = daysUntil(row.detailDueDate);
  if (d === null || d > 3) return '';
  const cls = d < 0 ? 'danger' : 'safe';
  const text = d < 0 ? 'D+' + Math.abs(d) : d === 0 ? 'D-DAY' : 'D-' + d;
  return '<span class="d-day ' + cls + '">' + text + '</span>';
}

function renderAlerts() {
  /* 긴급 경고창은 표시하지 않음 — '긴급' 탭에서 확인 가능 */
  const box = document.getElementById('alerts');
  if (box) box.innerHTML = '';
}

function dismissUrgentAlert() {
  data.filter(isUrgentRow).forEach(r => urgentDismissedIds.add(r.id));
  try { localStorage.setItem(URGENT_DISMISS_KEY, JSON.stringify([...urgentDismissedIds])); } catch(e) {}
  renderAlerts();
}

function renderStats() {
  const total = data.length;
  const done = data.filter(isCompleted).length;
  const urgent = data.filter(isUrgentRow).length;
  const inProgress = total - done - urgent;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">전체</div><div class="stat-value indigo">${total}</div></div>
    <div class="stat-card"><div class="stat-label">완료</div><div class="stat-value green">${done}</div></div>
    <div class="stat-card"><div class="stat-label">진행중</div><div class="stat-value">${Math.max(0,inProgress)}</div></div>
    <div class="stat-card"><div class="stat-label">긴급</div><div class="stat-value red">${urgent}</div></div>
  `;
}

function brandOf(row) {
  const n = (row.realName||'').trim();
  if (n.startsWith('오아')) return 'oa';
  if (n.startsWith('보아르')) return 'voir';
  return 'etc';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = BRANDS.map(b => {
    const count = b.key === 'all' ? data.filter(r => !r.registered).length
      : b.key === 'urgent' ? data.filter(isUrgentRow).length
      : b.key === 'done' ? data.filter(r => r.registered).length
      : data.filter(r => brandOf(r) === b.key && !r.registered).length;
    return `<button class="tab ${activeBrand===b.key?'active':''}" onclick="setBrand('${b.key}')">${b.label}<span class="count">${count}</span></button>`;
  }).join('');
}

function setBrand(key) { activeBrand = key; render(); }

function toggleSort(key) {
  if (sortKey === key) {
    if (sortAsc) { sortAsc = false; }
    else { sortKey = null; sortAsc = true; }
  } else {
    sortKey = key;
    sortAsc = true;
  }
  render();
}
function _sortIcon(key) {
  if (sortKey !== key) return '⇅';
  return sortAsc ? '↑' : '↓';
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let filtered = data;
  if (activeBrand === 'urgent') filtered = filtered.filter(r => !r.registered && isUrgentRow(r));
  else if (activeBrand === 'done') filtered = filtered.filter(r => r.registered);
  else if (activeBrand === 'all') filtered = filtered.filter(r => !r.registered);
  else filtered = filtered.filter(r => brandOf(r) === activeBrand && !r.registered);
  if (q) filtered = filtered.filter(r =>
    (r.manager||'').toLowerCase().includes(q) ||
    (r.regName||'').toLowerCase().includes(q) ||
    (r.realName||'').toLowerCase().includes(q)
  );

  if (sortKey) {
    const field = sortKey === 'prod' ? 'productionDate' : sortKey === 'arrival' ? 'arrivalDate' : 'detailDueDate';
    filtered = filtered.slice().sort((a, b) => {
      const av = a[field] || '';
      const bv = b[field] || '';
      if (!av && !bv) return 0;
      if (!av) return 1;
      if (!bv) return -1;
      return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    });
  }

  const _pi = document.getElementById('sortProdIcon');    if (_pi) _pi.textContent = _sortIcon('prod');
  const _ai = document.getElementById('sortArrivalIcon'); if (_ai) _ai.textContent = _sortIcon('arrival');
  const _di = document.getElementById('sortDetailIcon');  if (_di) _di.textContent = _sortIcon('detail');

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.map(row => {
    const st = statusOf(row);
    const cls = rowClass(row);
    return `
      <tr class="${cls}" data-id="${row.id}">
        <td class="drag-handle" draggable="true" title="드래그해서 순서 변경">≡</td>
        <td>
          <select class="manager-select" onchange="upd('${row.id}','manager',this.value)">
            <option value="" ${!row.manager?'selected':''}>선택</option>
            ${['김현유','이병은','조민주'].map(n=>`<option value="${n}" ${row.manager===n?'selected':''}>${n}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="reg-name ${row.regName ? 'filled' : ''}" value="${esc(row.regName)}" title="${esc(row.regName)}" placeholder="✎ 등록시 기입" onchange="upd('${row.id}','regName',this.value)"></td>
        <td><input type="text" class="real-name ${row.memo?'has-memo':''}" value="${esc(row.realName)}" title="${row.memo?'📝 '+esc(row.memo)+' (우클릭: 메모 편집)':esc(row.realName)+' (우클릭: 메모 추가)'}" placeholder="전산명" onchange="upd('${row.id}','realName',this.value)" oncontextmenu="editMemo(event,'${row.id}')"></td>
        <td>
          <input type="date" min="2026-01-01" value="${row.productionDate||''}" onchange="updProductionDate('${row.id}',this.value)">
          ${productionBadge(row)}
        </td>
        <td>
          <input type="date" min="2026-01-01" value="${row.arrivalDate||''}" onchange="upd('${row.id}','arrivalDate',this.value)">
          ${arrivalBadge(row)}
        </td>
        <td>
          <input type="date" min="2026-01-01" value="${row.detailDueDate||''}" onchange="upd('${row.id}','detailDueDate',this.value)">
          ${detailBadge(row)}
        </td>
        ${checkCell(row,'rocket')}
        ${checkCell(row,'wing')}
        ${checkCell(row,'venple')}
        ${checkCell(row,'ad')}
        <td>${st.label ? `<span class="status-badge ${st.cls}">${st.label}</span>` : ''}</td>
        <td><div class="detail-url-wrap"><input type="text" size="1" class="detail-url-input" value="${esc(row.detailUrl||'')}" placeholder="URL" onchange="upd('${row.id}','detailUrl',this.value)"><button class="detail-open-btn" onclick="openDetail('${row.id}')" ${row.detailUrl?'':'disabled'}>보기</button></div></td>
        <td class="check-cell"><input type="checkbox" ${row.registered?'checked':''} onclick="confirmRegistered(event,'${row.id}')" title="등록완료 시 '완료' 탭으로 이동"></td>
        <td><button class="danger-icon" onclick="delRow('${row.id}')" title="삭제">✕</button></td>
      </tr>
    `;
  }).join('');

  attachDragHandlers();
  renderStats();
  renderAlerts();
  renderTabs();
}

function checkCell(row, key) {
  const item = row[key];
  return `<td class="check-cell">
    <input type="checkbox" ${item.done?'checked':''} onchange="updCheck('${row.id}','${key}',this.checked)">
    <input type="date" min="2026-01-01" value="${item.date||''}" onchange="updCheckDate('${row.id}','${key}',this.value)">
  </td>`;
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* 기존 데이터 일괄 갱신 — 생산완료일이 있는 모든 행의 입고예정일을 생산완료일 + 14일로 덮어씀.
   최초 1회만 실행되도록 로컬 스토리지에 플래그 저장(이후엔 수동 입고예정일 수정을 존중). */
const ARRIVAL_BACKFILL_FLAG = 'coupang_new_arrival_backfill_v2';
function backfillArrivalDates() {
  if (localStorage.getItem(ARRIVAL_BACKFILL_FLAG) === '1') return;
  let updated = 0;
  data.forEach(r => {
    if (!r.productionDate) return;
    const d = new Date(r.productionDate);
    d.setDate(d.getDate() + 14);
    const newArrival = d.toISOString().slice(0, 10);
    if (r.arrivalDate !== newArrival) {
      r.arrivalDate = newArrival;
      updated++;
    }
  });
  if (updated > 0) {
    console.log('[new] 입고예정일 일괄 갱신: ' + updated + '건');
    save();
  }
  try { localStorage.setItem(ARRIVAL_BACKFILL_FLAG, '1'); } catch(e) {}
}
function updProductionDate(id, val) {
  const row = data.find(r => r.id === id);
  if (!row) return;
  row.productionDate = val;
  // 생산완료일이 입력/변경되면 입고예정일은 자동으로 +14일. 입고예정일 필드
  // 자체를 직접 편집한 경우엔 생산완료일에 영향을 주지 않음(별도 onchange).
  if (val) {
    const d = new Date(val);
    d.setDate(d.getDate() + 14);
    row.arrivalDate = d.toISOString().slice(0, 10);
    // DOM에서 해당 행의 입고예정일 input 값을 직접 갱신(전체 render는 포커스 튕김 유발).
    const tr = document.querySelector(`tr[data-id="${id}"]`);
    if (tr) {
      const dateInputs = tr.querySelectorAll('td > input[type="date"]');
      // 컬럼 순서: 생산완료일(0), 입고예정일(1), 상세전달일자(2)
      if (dateInputs[1]) dateInputs[1].value = row.arrivalDate;
    }
  }
  save();
  refreshRowBadges(id);
}
function upd(id, key, val) {
  const row = data.find(r => r.id === id);
  if (!row) return;
  row[key] = val;
  save();
  // render()를 호출하면 방금 클릭한 다음 input의 DOM이 교체돼 "튕김" 현상 발생.
  // 날짜 필드 변경 시엔 해당 행의 D-day 뱃지만 직접 갱신.
  if (key === 'productionDate' || key === 'arrivalDate' || key === 'detailDueDate') {
    refreshRowBadges(id);
  }
}

function refreshRowBadges(id) {
  const row = data.find(r => r.id === id);
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (!row || !tr) return;
  // 생산완료일(0), 입고예정일(1), 상세전달일자(2) 컬럼의 td를 찾아 뱃지 교체.
  const tds = tr.querySelectorAll('td');
  // 컬럼 순서: [drag-handle, 담당자, 등록상품명, 전산명, 생산완료일, 입고예정일, 상세전달일자, ...]
  const setBadge = (td, html) => {
    if (!td) return;
    const existing = td.querySelector('.d-day');
    if (existing) existing.remove();
    if (html) td.insertAdjacentHTML('beforeend', html);
  };
  setBadge(tds[4], productionBadge(row));
  setBadge(tds[5], arrivalBadge(row));
  setBadge(tds[6], detailBadge(row));
}
function openDetail(id) {
  const row = data.find(r => r.id === id);
  if (!row || !row.detailUrl) return;
  let url = String(row.detailUrl).trim();
  if (!/^https?:\/\//i.test(url) && !/^file:/i.test(url)) {
    if (/^[a-zA-Z]:[\\/]/.test(url) || url.startsWith('\\\\')) {
      url = 'file:///' + url.replace(/\\/g, '/');
    }
  }
  window.open(url, '_blank');
}
let memoTargetId = null;
function editMemo(ev, id) {
  ev.preventDefault();
  const row = data.find(r => r.id === id);
  if (!row) return;
  memoTargetId = id;
  const pop = document.getElementById('memoPopover');
  const ta = document.getElementById('memoText');
  ta.value = row.memo || '';
  document.getElementById('memoDelete').style.display = row.memo ? '' : 'none';
  // 위치: 클릭한 셀 오른쪽에 배치
  pop.classList.add('open');
  const target = ev.currentTarget.getBoundingClientRect();
  const popW = pop.offsetWidth;
  const popH = pop.offsetHeight;
  let left = window.scrollX + target.right + 8;
  let top = window.scrollY + target.top;
  if (left + popW > window.scrollX + window.innerWidth - 8) {
    left = window.scrollX + target.left - popW - 8;
  }
  if (top + popH > window.scrollY + window.innerHeight - 8) {
    top = window.scrollY + window.innerHeight - popH - 8;
  }
  pop.style.left = left + 'px';
  pop.style.top = Math.max(window.scrollY + 8, top) + 'px';
  setTimeout(() => ta.focus(), 0);
}
function closeMemo() {
  memoTargetId = null;
  document.getElementById('memoPopover').classList.remove('open');
}
function saveMemo() {
  if (!memoTargetId) return closeMemo();
  const row = data.find(r => r.id === memoTargetId);
  if (row) {
    row.memo = document.getElementById('memoText').value.trim();
    save(); render();

  closeMemo();

function expandRegName(el) {
  const orig = el.style.width;
  el.dataset._origWidth = orig || '';
  // 텍스트 폭 측정
  const measurer = document.createElement('span');
  const cs = getComputedStyle(el);
  measurer.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font:${cs.font};letter-spacing:${cs.letterSpacing};padding:${cs.padding};`;
  measurer.textContent = el.value || el.placeholder || '';
  document.body.appendChild(measurer);
  const textW = measurer.offsetWidth;
  measurer.remove();
  const cellW = el.parentElement.offsetWidth;
  const need = Math.max(cellW, textW + 40);
  const max = Math.min(1400, window.innerWidth - el.getBoundingClientRect().left - 40);
  el.style.width = Math.min(need, max) + 'px';
}
function collapseRegName(el) {
  el.style.width = el.dataset._origWidth || '';
}
document.addEventListener('focusin', e => {
  if (e.target.classList && e.target.classList.contains('reg-name')) expandRegName(e.target);

document.addEventListener('focusout', e => {

});

function askConfirm(msg) {
  return new Promise(resolve => {
    const mask = document.getElementById('confirmMask');
    document.getElementById('confirmMsg').textContent = msg;
    mask.classList.add('open');
    const yes = document.getElementById('confirmYes');
    const no = document.getElementById('confirmNo');
    const cleanup = (v) => {
      mask.classList.remove('open');
      yes.removeEventListener('click', onYes);
      no.removeEventListener('click', onNo);
      mask.removeEventListener('click', onMask);
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onYes = () => cleanup(true);
    const onNo = () => cleanup(false);
    const onMask = e => { if (e.target === mask) cleanup(false); };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); cleanup(false); }
      if (e.key === 'Enter') { e.preventDefault(); cleanup(true); }
    };
    yes.addEventListener('click', onYes);
    no.addEventListener('click', onNo);
    mask.addEventListener('click', onMask);
    document.addEventListener('keydown', onKey);
    setTimeout(() => yes.focus(), 0);
  });
}
async function confirmRegistered(ev, id) {

  const ok = await askConfirm(msg);
  if (ok) updRegistered(id, wantChecked);
}

const COL_WIDTH_KEY = 'coupang_new_col_widths_v1';
function initColumnResize() {
  try {
    const saved = JSON.parse(localStorage.getItem(COL_WIDTH_KEY) || '{}');
    Object.keys(saved).forEach(col => {
      const th = document.querySelector('th[data-col="' + col + '"]');
      if (th && saved[col] > 60) th.style.width = saved[col] + 'px';
    });
  } catch(e){}

  document.querySelectorAll('.col-resizer').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const th = handle.closest('th');
      const allThs = Array.from(th.parentElement.children);
      const idx = allThs.indexOf(th);
      const rightThs = allThs.slice(idx + 1);
      const rightStart = rightThs.map(t => t.getBoundingClientRect().width);
      const totalRight = rightStart.reduce((a,b)=>a+b,0);
      const minPerRight = 40;
      const minTotalRight = rightThs.length * minPerRight;
      const maxDelta = totalRight - minTotalRight;
      const startX = e.clientX;
      const startW = th.getBoundingClientRect().width;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function onMove(ev) {
        let delta = ev.clientX - startX;
        if (delta > maxDelta) delta = maxDelta;
        if (startW + delta < 80) delta = 80 - startW;
        th.style.width = Math.round(startW + delta) + 'px';
        const ratio = totalRight > 0 ? (totalRight - delta) / totalRight : 1;
        rightThs.forEach((t, i) => {
          t.style.width = Math.max(minPerRight, Math.round(rightStart[i] * ratio)) + 'px';
        });
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        try {
          const saved = JSON.parse(localStorage.getItem(COL_WIDTH_KEY) || '{}');
          saved[th.dataset.col] = Math.round(th.getBoundingClientRect().width);
          localStorage.setItem(COL_WIDTH_KEY, JSON.stringify(saved));
        } catch(e){}
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

let _dragId = null;
function attachDragHandlers() {
  const rows = document.querySelectorAll('#tbody tr[data-id]');
  rows.forEach(tr => {
    const handle = tr.querySelector('.drag-handle');
    if (handle) {
      handle.addEventListener('dragstart', e => {
        _dragId = tr.dataset.id;
        tr.classList.add('dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', _dragId); } catch(_){}
      });
      handle.addEventListener('dragend', () => {
        tr.classList.remove('dragging');
        document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => {
          el.classList.remove('drag-over-top', 'drag-over-bottom');
        });
        _dragId = null;
      });
    }
    tr.addEventListener('dragover', e => {
      if (!_dragId || tr.dataset.id === _dragId) return;
      e.preventDefault();
      const rect = tr.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      tr.classList.toggle('drag-over-top', before);
      tr.classList.toggle('drag-over-bottom', !before);
    });
    tr.addEventListener('dragleave', () => {
      tr.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    tr.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = tr.dataset.id;
      const before = tr.classList.contains('drag-over-top');
      tr.classList.remove('drag-over-top', 'drag-over-bottom');
      if (!_dragId || targetId === _dragId) return;
      const srcIdx = data.findIndex(r => r.id === _dragId);
      if (srcIdx < 0) return;
      const [moved] = data.splice(srcIdx, 1);
      let insertAt = data.findIndex(r => r.id === targetId);
      if (insertAt < 0) insertAt = data.length;
      if (!before) insertAt += 1;
      data.splice(insertAt, 0, moved);
      save();
      clearTimeout(_saveTimer);
      saveRemote();
      render();
    });
  });
}

let _xlsxLoading = null;
function ensureXlsx() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('XLSX load failed'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

function _parseNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/,/g, '').trim());
  return isNaN(n) ? 0 : n;
}

async function fetchProductStatus() {
  try {
    const listUrl = 'https://api.github.com/repos/' + REPO_CFG.owner + '/' + REPO_CFG.repo +
                    '/contents/' + encodeURI(REPO_CFG.dir) + '?ref=' + REPO_CFG.branch;
    const listRes = await fetch(listUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!listRes.ok) { console.warn('[new] list HTTP ' + listRes.status); return; }
    const files = await listRes.json();
    const NAME_RE = /^제품\s*현황\s*조회.*\.xlsx?$/i;
    const matches = (files || []).filter(f => f.type === 'file' && NAME_RE.test(f.name));
    if (matches.length === 0) { console.log('[new] 제품 현황 조회 파일 없음'); return; }
    matches.sort((a, b) => a.name < b.name ? 1 : a.name > b.name ? -1 : 0);
    const target = matches[0];
    console.log('[new] 제품 현황 조회 파일: ' + target.name);

    await ensureXlsx();
    const abRes = await fetch(target.download_url);
    if (!abRes.ok) throw new Error('file HTTP ' + abRes.status);
    const ab = await abRes.arrayBuffer();
    const wb = XLSX.read(ab, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (aoa.length < 2) return;

    /* 헤더 행 찾기 (제품명 + 생산중이 있는 행) */
    let hIdx = -1;
    for (let i = 0; i < Math.min(aoa.length, 15); i++) {
      const row = (aoa[i] || []).map(v => String(v || '').trim());
      const hasName = row.some(c => c === '제품명');
      const hasProd = row.some(c => /^생산\s*중$/.test(c));
      if (hasName && hasProd) { hIdx = i; break; }
    }
    if (hIdx < 0) { console.warn('[new] 헤더 행을 찾지 못함'); return; }
    const header = (aoa[hIdx] || []).map(v => String(v || '').trim());
    const findIdx = (fn) => header.findIndex(fn);
    const brandCol = findIdx(h => h === '브랜드');
    const nameCol = findIdx(h => h === '제품명');
    const prodCol = findIdx(h => /^생산\s*중$/.test(h));
    const shipCol = findIdx(h => /^출하\s*중$/.test(h));
    const transCol = findIdx(h => /^운송\s*중$/.test(h));
    if (nameCol < 0 || prodCol < 0 || shipCol < 0 || transCol < 0) {
      console.warn('[new] 필수 컬럼 누락', { brandCol, nameCol, prodCol, shipCol, transCol });
      return;
    }

    const BRANDS_ALLOWED = ['오아', '보아르'];
    const picked = [];
    const seen = new Set();
    for (let r = hIdx + 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const name = String(row[nameCol] || '').trim();
      if (!name) continue;
      if (/리테일/.test(name)) continue;
      if (brandCol >= 0) {
        const brand = String(row[brandCol] || '').trim();
        if (!BRANDS_ALLOWED.includes(brand)) continue;
      }
      const prodQty = _parseNum(row[prodCol]);
      const shipQty = _parseNum(row[shipCol]);
      const transQty = _parseNum(row[transCol]);
      if (prodQty === 0 && shipQty === 0 && transQty === 0) continue;
      if (seen.has(name)) continue;
      seen.add(name);
      picked.push(name);
    }

    /* 신규 판별 — 이전 엑셀 스냅샷(lastExcelProducts)에 없던 제품만 추가
       ※ HTML 현재 상태(삭제 이력 등)와 무관하게 엑셀 diff만으로 결정
       ※ 첫 실행(lastExcelProducts=null)이면 현재 파일을 베이스라인으로 저장만 하고 아무것도 추가하지 않음 */
    if (lastExcelProducts === null) {
      console.log('[new] 최초 실행 — 현재 엑셀을 베이스라인으로 저장 (자동 추가 안 함)');
      lastExcelProducts = picked;
      save();
      return;
    }

    const prevSet = new Set(lastExcelProducts);
    const toAdd = picked.filter(name => !prevSet.has(name));

    /* 현재 엑셀을 다음 실행의 기준으로 갱신 */
    lastExcelProducts = picked;

    if (toAdd.length === 0) {
      console.log('[new] 신규 없음 (엑셀: ' + picked.length + '건, 이전 대비 diff 0)');
      save();
      return;
    }

    toAdd.forEach(name => {
      data.push({
        id: uid(), manager: '', regName: '', realName: name,
        productionDate: '', arrivalDate: '', detailDueDate: '',
        rocket:{done:false,date:''}, wing:{done:false,date:''},
        venple:{done:false,date:''}, ad:{done:false,date:''}
      });
    });
    console.log('[new] ' + toAdd.length + '개 신제품 자동 추가 (이전 엑셀 대비 diff)');
    save();
    render();
  } catch (e) {
    console.warn('[new] fetchProductStatus 실패:', e.message);
  }
}
</script>
