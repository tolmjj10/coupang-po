<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쿠팡 신제품 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1a1916;
    --muted: #6b6960;
    --primary: #1a3a4a;
    --primary-hover: #255269;
    --accent: #1a3a4a;
    --accent-light: #e8f1f5;
    --success: #4a7c59;
    --warning: #b08840;
    --danger: #a85450;
    --info: #4a6b8a;
    --soft-red: #f7efee;
    --soft-yellow: #f8f4e9;
    --soft-green: #eef2ec;
    --soft-blue: #eef1f4;
    --soft-purple: #f2f0ee;
  }
  html, body {
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .page-header {
    background: #fff;
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    min-height: 44px;
  }
  .page-header .header-icon {
    width: 26px; height: 26px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
  }
  .page-header .header-icon svg { width: 18px; height: 18px; stroke-width: 1.75; }
  .page-header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin: 0;
    color: var(--text);
  }
  .page-header .subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-left: 6px;
  }
  .page-header #saveStatus {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .container { max-width: 1720px; margin: 0 auto; padding: 22px 28px 60px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card);
    padding: 18px 22px;
    border-radius: 14px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .stat-card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .stat-value.red { color: var(--danger); }
  .stat-value.orange { color: var(--warning); }
  .stat-value.green { color: var(--success); }
  .stat-value.indigo { color: var(--text); }

  .alerts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .alert {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
  }
  .alert.urgent {
    background: var(--soft-red);
    color: #8a3a37;
    border-color: #e6d3d1;
  }
  .alert.warning {
    background: var(--soft-yellow);
    color: #7a5c2e;
    border-color: #e5dcc4;
  }
  .alert.info {
    background: var(--soft-blue);
    color: #3d5670;
    border-color: #d5dbe2;
  }
  .alert.ok {
    background: var(--soft-green);
    color: #3d6349;
    border-color: #d4dbd0;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: all .15s ease;
    letter-spacing: -0.01em;
  }
  button:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  button.ghost {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.ghost:hover { background: #f8fafc; box-shadow: none; transform: none; }
  button.danger-icon {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    font-size: 14px;
    border-radius: 6px;
  }
  button.danger-icon:hover {
    background: var(--soft-red);
    color: var(--danger);
    transform: none;
    box-shadow: none;
  }
  .search {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    width: 260px;
    font-family: inherit;
    background: white;
    transition: border-color .15s ease;
  }
  .search:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }

  .table-wrap {
    background: white;
    border-radius: 16px;
    overflow: auto;
    max-height: calc(100vh - 200px);
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 1600px;
  }
  th {
    background: #fafbfd;
    padding: 14px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: nowrap;
  }
  th.resizable { position: sticky; overflow: visible; }
  th .col-resizer {
    position: absolute;
    top: 0;
    right: -3px;
    width: 8px;
    height: 100%;
    cursor: col-resize;
    user-select: none;
    z-index: 3;
  }
  th .col-resizer:hover, th .col-resizer.dragging {
    background: linear-gradient(90deg, transparent, var(--accent) 40%, var(--accent) 60%, transparent);
    opacity: 0.5;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid #f5f6f9;
    vertical-align: middle;
  }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover td { background: #fafbfd; }
  tbody tr.drag-over-top td { border-top: 2px solid var(--accent); }
  tbody tr.drag-over-bottom td { border-bottom: 2px solid var(--accent); }
  tbody tr.dragging { opacity: 0.4; }
  .drag-handle {
    cursor: grab;
    color: #c9c6be;
    font-size: 16px;
    line-height: 1;
    user-select: none;
    text-align: center;
    padding: 0 4px;
    transition: color .12s ease;
  }
  .drag-handle:hover { color: var(--text); }
  .drag-handle:active { cursor: grabbing; }
  tr.completed td { background: #f4f6f2 !important; }
  tr.completed input { color: #4a6b52; }
  tr.urgent-row td { background: #f7efee !important; }
  tr.warning-row td { background: #f8f4e9 !important; }

  input[type="text"], input[type="date"], select.manager-select {
    border: 1px solid transparent;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
    background: transparent;
    color: var(--text);
    transition: all .12s ease;
  }
  input[type="text"]:hover, input[type="date"]:hover, select.manager-select:hover { background: #f4f5f8; }
  input[type="text"]:focus, input[type="date"]:focus, select.manager-select:focus {
    outline: none;
    background: white;
    border-color: #c0c0bb;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
  }
  select.manager-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
    padding-right: 26px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6960' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    font-weight: 500;
  }
  select.manager-select:hover { background-color: #f4f5f8; }
  select.manager-select:focus { background-color: white; }
  input.reg-name {
    background: #f3f1ec;
    border: 1px dashed #c9c3b6;
    color: #6b6355;
    font-size: 11.5px;
    padding: 6px 8px;
    letter-spacing: -0.02em;
  }
  input.reg-name::placeholder { color: #a89f8c; font-style: italic; }
  input.reg-name.filled {
    font-weight: 700;
    color: #2b2b2b;
    background: transparent;
    border: 1px solid transparent;
  }
  input.reg-name.filled:hover {
    background: #f4f5f8;
    border-color: transparent;
  }
  input.reg-name.filled:focus {
    background: #ebe8e0;
    border: 1px solid #c9c3b6;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
  }

  .check-cell {
    text-align: center;
    min-width: 130px;
  }
  .check-cell input[type="checkbox"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid #d1d5db;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    vertical-align: middle;
    transition: all .15s ease;
    background: white;
  }
  .check-cell input[type="checkbox"] { border-color: #cfcfc9; }
  .check-cell input[type="checkbox"]:hover { border-color: #9a9a94; }
  .check-cell input[type="checkbox"]:checked {
    background: var(--success);
    border-color: var(--success);
  }
  .check-cell input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .check-cell input[type="date"] {
    font-size: 11px;
    padding: 3px 6px;
    text-align: center;
    color: var(--muted);
    margin-top: 4px;
  }
  .rocket-warn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-top: 5px;
    padding: 2px 7px;
    background: #fde2e0;
    color: #8a3a37;
    border: 1px solid #f0b8b3;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    animation: rocket-warn-pulse 1.6s ease-in-out infinite;
  }
  @keyframes rocket-warn-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220, 80, 70, 0.35); }
    50%      { box-shadow: 0 0 0 4px rgba(220, 80, 70, 0);    }
  }

  .status-badge {
    display: inline-block;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .status-done { background: #e4ebe0; color: #4a6b52; }
  .status-progress { background: #e2e7ed; color: #45607a; }
  .status-urgent { background: #ecd9d7; color: #8a3a37; }
  .status-pending { background: #ecebe7; color: #7a7a72; }

  .d-day {
    font-size: 10.5px;
    font-weight: 700;
    display: inline-block;
    margin-top: 4px;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: -0.01em;
  }
  .d-day.danger { background: #ecd9d7; color: #8a3a37; }
  .d-day.warn { background: #ebe1c9; color: #7a5c2e; }
  .d-day.safe { background: #e4ebe0; color: #4a6b52; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    border-radius: 0;
    letter-spacing: -0.01em;
    transition: color .12s ease, border-color .12s ease;
  }
  .tab:hover { color: var(--text); background: transparent; transform: none; box-shadow: none; }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }
  .tab .count {
    display: inline-block;
    background: #ecebe7;
    color: #7a7a72;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    font-weight: 600;
  }
  .tab.active .count { background: #2b2b2b; color: white; }

  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.9 5.8L20 10.5l-4.7 3.9L16.9 21 12 17.6 7.1 21l1.6-6.6L4 10.5l6.1-1.7L12 3z"/>
    </svg>
  </div>
  <h1>쿠팡 신제품 관리</h1>
  <span class="subtitle">담당자별 신제품 등록 진행 현황 · 자동 저장</span>
  <span id="saveStatus"></span>
</div>

<div class="container">

  <div class="stats" id="stats"></div>
  <div class="alerts" id="alerts"></div>

  <div class="toolbar">
    <button onclick="addRow()">＋ 신제품 추가</button>
    <input class="search" id="search" placeholder="🔍 담당자 · 상품명 검색" oninput="render()">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:28px;"></th>
          <th style="width:110px;">담당자</th>
          <th class="resizable" style="width:360px;" data-col="reg">등록 상품명<span class="col-resizer"></span></th>
          <th class="resizable" style="width:300px;" data-col="real">전산명<span class="col-resizer"></span></th>
          <th style="width:120px;">생산완료일</th>
          <th style="width:140px;">입고예정일</th>
          <th style="width:140px;">상세전달일자</th>
          <th class="check-cell">🚀 로켓 등록</th>
          <th class="check-cell">✈️ 윙 등록</th>
          <th class="check-cell">🔗 벤플 매핑</th>
          <th class="check-cell">📢 광고 생성</th>
          <th style="width:100px;">상태</th>
          <th style="width:50px;"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
const STORAGE_KEY = 'coupang_new_product_dashboard_v1';
const IMPORTED_KEY = 'coupang_new_product_imported_v1';
const API_URL = '/api/new-state';
const DEFAULT_YEAR = '2026';
const REPO_CFG = { owner: 'tolmjj10', repo: 'coupang-po', branch: 'main', dir: 'newproduct/new' };
const BRANDS = [
  { key: 'all',   label: '전체' },
  { key: 'oa',    label: '오아',   match: n => (n||'').trim().startsWith('오아') },
  { key: 'voir',  label: '보아르', match: n => (n||'').trim().startsWith('보아르') },
  { key: 'etc',   label: '기타',   match: n => { const t = (n||'').trim(); return !t.startsWith('오아') && !t.startsWith('보아르'); } }
];
let activeBrand = 'all';
let importedNames = {}; // (구버전 호환용, 더 이상 dedup에 사용하지 않음)
let lastExcelProducts = null; // 마지막으로 처리한 엑셀의 제품명 배열. 이 목록과 diff로 신규 판별
let data = loadLocal();

/* 저장 페이로드 파싱 — 구버전(array), {rows,imported}, {rows,imported,lastExcelProducts} 모두 지원 */
function _parsePayload(parsed) {
  if (Array.isArray(parsed)) return { rows: parsed, imported: null, lastExcelProducts: null };
  if (parsed && Array.isArray(parsed.rows)) {
    return {
      rows: parsed.rows,
      imported: parsed.imported || null,
      lastExcelProducts: Array.isArray(parsed.lastExcelProducts) ? parsed.lastExcelProducts : null
    };
  }
  return { rows: [], imported: null, lastExcelProducts: null };
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = _parsePayload(JSON.parse(raw));
      if (p.imported) importedNames = p.imported;
      if (p.lastExcelProducts) lastExcelProducts = p.lastExcelProducts;
      return p.rows.length ? p.rows : sampleData();
    }
  } catch(e) {}
  return sampleData();
}

async function loadRemote() {
  if (Date.now() < _suppressRemoteLoadUntil) return;
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json();
    const p = _parsePayload(remote);
    if (p.rows.length > 0) {
      data = p.rows;
      if (p.imported) {
        Object.keys(p.imported).forEach(k => { importedNames[k] = true; });
      }
      if (p.lastExcelProducts) lastExcelProducts = p.lastExcelProducts;
      migrateImportedToRealName();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts })); } catch(e) {}
      render();
    }
  } catch (e) {
    console.warn('[new] remote load skipped:', e.message);
  }
}

/* 이전에 regName으로 자동 임포트된 값을 realName(전산명)으로 이동
   조건: regName에 값 있고, realName은 비어있음
   → 자동 임포트된 값으로 간주하고 이동. 이동 후 해당 이름을 importedNames에 등록 */
function migrateImportedToRealName() {
  let migrated = 0;
  data.forEach(r => {
    const rn = (r.regName || '').trim();
    if (!rn) return;
    if ((r.realName || '').trim()) return; // 이미 전산명이 있으면 건드리지 않음
    r.realName = r.regName;
    r.regName = '';
    importedNames[rn] = true;
    migrated++;
  });
  if (migrated > 0) {
    console.log('[new] regName → realName 마이그레이션: ' + migrated + '건');
    save();
  }
}

function sampleData() {
  return [
    {
      id: uid(), manager: '김현유', regName: '', realName: '예시 상품 A',
      productionDate: '', arrivalDate: '', detailDueDate: '',
      rocket: {done:false, date:''}, wing: {done:false, date:''},
      venple: {done:false, date:''}, ad: {done:false, date:''}
    }
  ];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

let _saveTimer = null;
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts }));
  const el = document.getElementById('saveStatus');
  el.textContent = '저장 중...';
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveRemote, 400);
}

async function saveRemote() {
  const el = document.getElementById('saveStatus');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    el.textContent = '✓ 공유 저장됨 ' + new Date().toLocaleTimeString('ko-KR');
    setTimeout(() => { if (el.textContent.startsWith('✓')) el.textContent = ''; }, 2000);
  } catch (e) {
    el.textContent = '⚠ 로컬만 저장 (' + e.message + ')';
    console.warn('[new] remote save failed:', e);
  }
}

function today() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const t = new Date(dateStr);
  t.setHours(0,0,0,0);
  return Math.round((t - today()) / 86400000);
}

function isCompleted(row) {
  return row.rocket.done && row.wing.done && row.venple.done && row.ad.done;
}

function statusOf(row) {
  /* 긴급: 입고예정일이 D-3 이하인데 로켓 등록 미완료 */
  const arrival = daysUntil(row.arrivalDate);
  if (arrival !== null && arrival <= 3 && !row.rocket.done) {
    return {label: '긴급', cls: 'status-urgent'};
  }
  return {label: '', cls: ''};
}

function rowClass(row) {
  if (isCompleted(row)) return 'completed';
  const detail = daysUntil(row.detailDueDate);
  if (detail !== null && detail <= 2) return 'urgent-row';
  if (detail !== null && detail <= 5) return 'warning-row';
  const arrival = daysUntil(row.arrivalDate);
  if (arrival !== null && arrival <= 3 && arrival >= 0) return 'warning-row';
  return '';
}

function dDayHtml(dateStr) {
  if (!dateStr) return '';
  const d = daysUntil(dateStr);
  if (d === null) return '';
  let cls = 'd-day';
  let text = '';
  if (d < 0) { text = 'D+' + Math.abs(d); cls += ' danger'; }
  else if (d === 0) { text = 'D-DAY'; cls += ' danger'; }
  else if (d <= 3) { text = 'D-' + d; cls += ' danger'; }
  else if (d <= 7) { text = 'D-' + d; cls += ' warn'; }
  else { text = 'D-' + d; cls += ' safe'; }
  return '<span class="' + cls + '">' + text + '</span>';
}

function renderAlerts() {
  const alerts = [];
  data.forEach(row => {
    if (isCompleted(row)) return;
    const name = row.realName || row.regName || '(이름 없음)';
    const manager = row.manager || '담당자 미정';

    const detail = daysUntil(row.detailDueDate);
    if (detail !== null) {
      if (detail < 0) alerts.push({cls:'urgent', text:`🚨 [${manager}] "${name}" 상세전달일자 ${Math.abs(detail)}일 초과!`});
      else if (detail === 0) alerts.push({cls:'urgent', text:`🚨 [${manager}] "${name}" 오늘이 상세전달일자입니다!`});
      else if (detail <= 2) alerts.push({cls:'urgent', text:`⚠️ [${manager}] "${name}" 상세전달 D-${detail} — 곧 등록 필요`});
      else if (detail <= 5) alerts.push({cls:'warning', text:`⏰ [${manager}] "${name}" 상세전달 D-${detail}`});
    }

    const arrival = daysUntil(row.arrivalDate);
    if (arrival !== null) {
      if (arrival >= 0 && arrival <= 3) alerts.push({cls:'warning', text:`📦 [${manager}] "${name}" 입고예정 D-${arrival}`});
      else if (arrival < 0 && !row.rocket.done && !row.wing.done) alerts.push({cls:'info', text:`📦 [${manager}] "${name}" 입고 완료(${Math.abs(arrival)}일 전) — 등록 확인`});
    }
  });

  const box = document.getElementById('alerts');
  if (alerts.length === 0) {
    box.innerHTML = '';
  } else {
    box.innerHTML = alerts.map(a => `<div class="alert ${a.cls}">${a.text}</div>`).join('');
  }
}

function renderStats() {
  const total = data.length;
  const done = data.filter(isCompleted).length;
  const urgent = data.filter(r => {
    if (isCompleted(r)) return false;
    const a = daysUntil(r.arrivalDate);
    return a !== null && a <= 3 && !r.rocket.done;
  }).length;
  const inProgress = total - done - urgent;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">전체</div><div class="stat-value indigo">${total}</div></div>
    <div class="stat-card"><div class="stat-label">완료</div><div class="stat-value green">${done}</div></div>
    <div class="stat-card"><div class="stat-label">진행중</div><div class="stat-value">${Math.max(0,inProgress)}</div></div>
    <div class="stat-card"><div class="stat-label">긴급</div><div class="stat-value red">${urgent}</div></div>
  `;
}

function brandOf(row) {
  const n = (row.realName||'').trim();
  if (n.startsWith('오아')) return 'oa';
  if (n.startsWith('보아르')) return 'voir';
  return 'etc';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = BRANDS.map(b => {
    const count = b.key === 'all' ? data.length : data.filter(r => brandOf(r) === b.key).length;
    return `<button class="tab ${activeBrand===b.key?'active':''}" onclick="setBrand('${b.key}')">${b.label}<span class="count">${count}</span></button>`;
  }).join('');
}

function setBrand(key) { activeBrand = key; render(); }

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let filtered = data;
  if (activeBrand !== 'all') filtered = filtered.filter(r => brandOf(r) === activeBrand);
  if (q) filtered = filtered.filter(r =>
    (r.manager||'').toLowerCase().includes(q) ||
    (r.regName||'').toLowerCase().includes(q) ||
    (r.realName||'').toLowerCase().includes(q)
  );

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.map(row => {
    const st = statusOf(row);
    const cls = rowClass(row);
    return `
      <tr class="${cls}" data-id="${row.id}">
        <td class="drag-handle" draggable="true" title="드래그해서 순서 변경">≡</td>
        <td>
          <select class="manager-select" onchange="upd('${row.id}','manager',this.value)">
            <option value="" ${!row.manager?'selected':''}>선택</option>
            ${['김현유','이병은','조민주'].map(n=>`<option value="${n}" ${row.manager===n?'selected':''}>${n}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="reg-name ${row.regName ? 'filled' : ''}" value="${esc(row.regName)}" title="${esc(row.regName)}" placeholder="✎ 등록시 기입" onchange="upd('${row.id}','regName',this.value)"></td>
        <td><input type="text" value="${esc(row.realName)}" title="${esc(row.realName)}" placeholder="전산명" onchange="upd('${row.id}','realName',this.value)"></td>
        <td><input type="date" min="2026-01-01" value="${row.productionDate||''}" onchange="upd('${row.id}','productionDate',this.value)"></td>
        <td>
          <input type="date" min="2026-01-01" value="${row.arrivalDate||''}" onchange="upd('${row.id}','arrivalDate',this.value)">
          ${dDayHtml(row.arrivalDate)}
        </td>
        <td>
          <input type="date" min="2026-01-01" value="${row.detailDueDate||''}" onchange="upd('${row.id}','detailDueDate',this.value)">
          ${dDayHtml(row.detailDueDate)}
        </td>
        ${checkCell(row,'rocket')}
        ${checkCell(row,'wing')}
        ${checkCell(row,'venple')}
        ${checkCell(row,'ad')}
        <td>${st.label ? `<span class="status-badge ${st.cls}">${st.label}</span>` : ''}</td>
        <td><button class="danger-icon" onclick="delRow('${row.id}')" title="삭제">✕</button></td>
      </tr>
    `;
  }).join('');

  attachDragHandlers();
  renderStats();
  renderAlerts();
  renderTabs();
}

function checkCell(row, key) {
  const item = row[key];
  let warnHtml = '';
  if (key === 'rocket' && !item.done && !item.date) {
    const detail = daysUntil(row.detailDueDate);
    if (detail !== null && detail < 0) {
      warnHtml = `<div class="rocket-warn" title="상세전달일자가 ${Math.abs(detail)}일 지났는데 로켓 등록이 안 되어 있어요">⚠️ 등록 지연 D+${Math.abs(detail)}</div>`;
    }
  }
  return `<td class="check-cell">
    <input type="checkbox" ${item.done?'checked':''} onchange="updCheck('${row.id}','${key}',this.checked)">
    <input type="date" min="2026-01-01" value="${item.date||''}" onchange="updCheckDate('${row.id}','${key}',this.value)">
    ${warnHtml}
  </td>`;
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function upd(id, key, val) {
  const row = data.find(r => r.id === id);
  if (row) { row[key] = val; save(); render(); }
}
function updCheck(id, key, val) {
  const row = data.find(r => r.id === id);
  if (row) {
    row[key].done = val;
    if (val && !row[key].date) {
      row[key].date = new Date().toISOString().slice(0,10);
    }
    save(); render();
  }
}
function updCheckDate(id, key, val) {
  const row = data.find(r => r.id === id);
  if (row) { row[key].date = val; if (val) row[key].done = true; save(); render(); }
}

/* ═══════════════════════ 컬럼 리사이즈 ═══════════════════════ */
const COL_WIDTH_KEY = 'coupang_new_col_widths_v1';
function initColumnResize() {
  try {
    const saved = JSON.parse(localStorage.getItem(COL_WIDTH_KEY) || '{}');
    Object.keys(saved).forEach(col => {
      const th = document.querySelector('th[data-col="' + col + '"]');
      if (th && saved[col] > 60) th.style.width = saved[col] + 'px';
    });
  } catch(e){}

  document.querySelectorAll('.col-resizer').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const th = handle.closest('th');
      const startX = e.clientX;
      const startW = th.getBoundingClientRect().width;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function onMove(ev) {
        const w = Math.max(80, Math.round(startW + (ev.clientX - startX)));
        th.style.width = w + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        try {
          const saved = JSON.parse(localStorage.getItem(COL_WIDTH_KEY) || '{}');
          saved[th.dataset.col] = Math.round(th.getBoundingClientRect().width);
          localStorage.setItem(COL_WIDTH_KEY, JSON.stringify(saved));
        } catch(e){}
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

/* ═══════════════════════ 드래그 순서 변경 ═══════════════════════ */
let _dragId = null;
function attachDragHandlers() {
  const rows = document.querySelectorAll('#tbody tr[data-id]');
  rows.forEach(tr => {
    const handle = tr.querySelector('.drag-handle');
    if (handle) {
      handle.addEventListener('dragstart', e => {
        _dragId = tr.dataset.id;
        tr.classList.add('dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', _dragId); } catch(_){}
      });
      handle.addEventListener('dragend', () => {
        tr.classList.remove('dragging');
        document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => {
          el.classList.remove('drag-over-top', 'drag-over-bottom');
        });
        _dragId = null;
      });
    }
    tr.addEventListener('dragover', e => {
      if (!_dragId || tr.dataset.id === _dragId) return;
      e.preventDefault();
      const rect = tr.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      tr.classList.toggle('drag-over-top', before);
      tr.classList.toggle('drag-over-bottom', !before);
    });
    tr.addEventListener('dragleave', () => {
      tr.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    tr.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = tr.dataset.id;
      const before = tr.classList.contains('drag-over-top');
      tr.classList.remove('drag-over-top', 'drag-over-bottom');
      if (!_dragId || targetId === _dragId) return;
      const srcIdx = data.findIndex(r => r.id === _dragId);
      if (srcIdx < 0) return;
      const [moved] = data.splice(srcIdx, 1);
      let insertAt = data.findIndex(r => r.id === targetId);
      if (insertAt < 0) insertAt = data.length;
      if (!before) insertAt += 1;
      data.splice(insertAt, 0, moved);
      save();
      render();
    });
  });
}

function addRow() {
  data.push({
    id: uid(), manager: '', regName: '', realName: '',
    productionDate: '', arrivalDate: '', detailDueDate: '',
    rocket:{done:false,date:''}, wing:{done:false,date:''},
    venple:{done:false,date:''}, ad:{done:false,date:''}
  });
  save(); render();
}

let _suppressRemoteLoadUntil = 0;
function delRow(id) {
  const row = data.find(r => r.id === id);
  if (!row) return;
  const label = row.regName || row.realName || '(이름 없음)';
  if (!confirm('"' + label + '" 삭제하시겠습니까?')) return;
  data = data.filter(r => r.id !== id);
  /* 원격 loadRemote가 방금 삭제한 행을 되돌리지 못하도록 잠깐 억제 */
  _suppressRemoteLoadUntil = Date.now() + 5000;
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows: data, imported: importedNames, lastExcelProducts }));
  render();
  /* 디바운스 우회하고 즉시 원격 반영 */
  clearTimeout(_saveTimer);
  saveRemote();
}

migrateImportedToRealName();
render();
initColumnResize();
loadRemote().then(() => fetchProductStatus());
setInterval(() => { renderAlerts(); renderStats(); }, 60000);
setInterval(loadRemote, 30000);
setInterval(fetchProductStatus, 5 * 60 * 1000);
window.addEventListener('focus', loadRemote);

/* ═══════════════════════ 제품 현황 조회 자동 fetch ═══════════════════════ */
let _xlsxLoading = null;
function ensureXlsx() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('XLSX load failed'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

function _parseNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/,/g, '').trim());
  return isNaN(n) ? 0 : n;
}

async function fetchProductStatus() {
  try {
    const listUrl = 'https://api.github.com/repos/' + REPO_CFG.owner + '/' + REPO_CFG.repo +
                    '/contents/' + encodeURI(REPO_CFG.dir) + '?ref=' + REPO_CFG.branch;
    const listRes = await fetch(listUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!listRes.ok) { console.warn('[new] list HTTP ' + listRes.status); return; }
    const files = await listRes.json();
    const NAME_RE = /^제품\s*현황\s*조회.*\.xlsx?$/i;
    const matches = (files || []).filter(f => f.type === 'file' && NAME_RE.test(f.name));
    if (matches.length === 0) { console.log('[new] 제품 현황 조회 파일 없음'); return; }
    matches.sort((a, b) => a.name < b.name ? 1 : a.name > b.name ? -1 : 0);
    const target = matches[0];
    console.log('[new] 제품 현황 조회 파일: ' + target.name);

    await ensureXlsx();
    const abRes = await fetch(target.download_url);
    if (!abRes.ok) throw new Error('file HTTP ' + abRes.status);
    const ab = await abRes.arrayBuffer();
    const wb = XLSX.read(ab, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (aoa.length < 2) return;

    /* 헤더 행 찾기 (제품명 + 생산중이 있는 행) */
    let hIdx = -1;
    for (let i = 0; i < Math.min(aoa.length, 15); i++) {
      const row = (aoa[i] || []).map(v => String(v || '').trim());
      const hasName = row.some(c => c === '제품명');
      const hasProd = row.some(c => /^생산\s*중$/.test(c));
      if (hasName && hasProd) { hIdx = i; break; }
    }
    if (hIdx < 0) { console.warn('[new] 헤더 행을 찾지 못함'); return; }
    const header = (aoa[hIdx] || []).map(v => String(v || '').trim());
    const findIdx = (fn) => header.findIndex(fn);
    const brandCol = findIdx(h => h === '브랜드');
    const nameCol = findIdx(h => h === '제품명');
    const prodCol = findIdx(h => /^생산\s*중$/.test(h));
    const shipCol = findIdx(h => /^출하\s*중$/.test(h));
    const transCol = findIdx(h => /^운송\s*중$/.test(h));
    if (nameCol < 0 || prodCol < 0 || shipCol < 0 || transCol < 0) {
      console.warn('[new] 필수 컬럼 누락', { brandCol, nameCol, prodCol, shipCol, transCol });
      return;
    }

    const BRANDS_ALLOWED = ['오아', '보아르'];
    const picked = [];
    const seen = new Set();
    for (let r = hIdx + 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const name = String(row[nameCol] || '').trim();
      if (!name) continue;
      if (/리테일/.test(name)) continue;
      if (brandCol >= 0) {
        const brand = String(row[brandCol] || '').trim();
        if (!BRANDS_ALLOWED.includes(brand)) continue;
      }
      const prodQty = _parseNum(row[prodCol]);
      const shipQty = _parseNum(row[shipCol]);
      const transQty = _parseNum(row[transCol]);
      if (prodQty === 0 && shipQty === 0 && transQty === 0) continue;
      if (seen.has(name)) continue;
      seen.add(name);
      picked.push(name);
    }

    /* 신규 판별 — 이전 엑셀 스냅샷(lastExcelProducts)에 없던 제품만 추가
       ※ HTML 현재 상태(삭제 이력 등)와 무관하게 엑셀 diff만으로 결정
       ※ 첫 실행(lastExcelProducts=null)이면 현재 파일을 베이스라인으로 저장만 하고 아무것도 추가하지 않음 */
    if (lastExcelProducts === null) {
      console.log('[new] 최초 실행 — 현재 엑셀을 베이스라인으로 저장 (자동 추가 안 함)');
      lastExcelProducts = picked;
      save();
      return;
    }

    const prevSet = new Set(lastExcelProducts);
    const toAdd = picked.filter(name => !prevSet.has(name));

    /* 현재 엑셀을 다음 실행의 기준으로 갱신 */
    lastExcelProducts = picked;

    if (toAdd.length === 0) {
      console.log('[new] 신규 없음 (엑셀: ' + picked.length + '건, 이전 대비 diff 0)');
      save();
      return;
    }

    toAdd.forEach(name => {
      data.push({
        id: uid(), manager: '', regName: '', realName: name,
        productionDate: '', arrivalDate: '', detailDueDate: '',
        rocket:{done:false,date:''}, wing:{done:false,date:''},
        venple:{done:false,date:''}, ad:{done:false,date:''}
      });
    });
    console.log('[new] ' + toAdd.length + '개 신제품 자동 추가 (이전 엑셀 대비 diff)');
    save();
    render();
  } catch (e) {
    console.warn('[new] fetchProductStatus 실패:', e.message);
  }
}
