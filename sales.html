<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 판매 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --text: #2a1a15;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --neg: #b05858;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 28px 60px; }

  header.page {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .meta { font-size: 12px; color: var(--text-hint); }

  /* 월 선택기 */
  .month-nav {
    display: inline-flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; margin-bottom: 20px;
    user-select: none;
  }
  .month-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px; cursor: pointer; color: var(--text-hint);
    transition: background .12s, color .12s;
  }
  .month-btn:hover { background: var(--accent-light); color: var(--text); }
  .month-btn.disabled { opacity: 0.3; pointer-events: none; }
  .month-btn svg { width: 16px; height: 16px; stroke-width: 2; }
  .month-label {
    position: relative;
    font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
    padding: 0 16px; min-width: 120px; text-align: center;
    cursor: pointer;
  }
  .month-label:hover { color: var(--accent-dark); }
  .month-input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    font: inherit;
  }

  /* KPI */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
  }
  .kpi-label {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* 테이블 */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .card-head {
    padding: 14px 18px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 {
    font-size: 13px; font-weight: 700; margin: 0;
    letter-spacing: -0.01em;
  }
  .card-head .hint {
    font-size: 11.5px; color: var(--text-hint);
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    text-align: right; padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  th:first-child, td:first-child { text-align: left; }
  th {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.04em;
    background: #faf7f4;
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: var(--accent-light); color: var(--text); }
  th .arrow { display: inline-block; margin-left: 4px; opacity: 0.5; }
  th.sort-active { color: var(--accent-dark); }
  th.sort-active .arrow { opacity: 1; }
  tbody tr:hover { background: var(--accent-light); }
  tbody tr:last-child td { border-bottom: 0; }
  td.name { font-weight: 600; }
  td.neg { color: var(--neg); }
  td .dow {
    font-size: 11px; color: var(--text-hint); margin-left: 6px; font-weight: 400;
  }

  .empty {
    padding: 40px 20px; text-align: center;
    color: var(--text-hint); font-size: 13px;
  }

  @media (max-width: 720px) {
    .wrap { padding: 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi-value { font-size: 20px; }
    th, td { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="page">
    <h1>쿠팡 판매 현황</h1>
    <div class="meta" id="meta">로딩…</div>
  </header>

  <div class="month-nav">
    <div class="month-btn" id="prev" title="이전 달">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="month-label" id="month-label">
      <span id="month-text">—</span>
      <input type="month" class="month-input" id="month-input">
    </div>
    <div class="month-btn" id="next" title="다음 달">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">판매수량</div><div class="kpi-value" id="k-qty">—</div></div>
    <div class="kpi"><div class="kpi-label">매출</div><div class="kpi-value" id="k-amt">—</div></div>
    <div class="kpi"><div class="kpi-label">마진</div><div class="kpi-value" id="k-mgn">—</div></div>
    <div class="kpi"><div class="kpi-label">마진율</div><div class="kpi-value" id="k-mgnrate">—</div></div>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>일자별 판매</h2>
      <div class="hint">컬럼 헤더 클릭 → 정렬 변경</div>
    </div>
    <table>
      <thead>
        <tr>
          <th class="sortable" data-key="d">일자<span class="arrow">↕</span></th>
          <th class="sortable sort-active" data-key="q">판매수량<span class="arrow">▼</span></th>
          <th class="sortable" data-key="a">매출<span class="arrow">↕</span></th>
          <th class="sortable" data-key="m">마진<span class="arrow">↕</span></th>
          <th class="sortable" data-key="r">마진율<span class="arrow">↕</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">선택한 달의 데이터가 없습니다</div>
  </section>
</div>

<script>
(function () {
  const fmtInt = n => n.toLocaleString('ko-KR');
  const fmtWon = n => {
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if (abs >= 1e8) return sign + (abs/1e8).toFixed(abs >= 1e9 ? 1 : 2).replace(/\.?0+$/,'') + '억';
    if (abs >= 1e4) return sign + Math.round(abs/1e4).toLocaleString('ko-KR') + '만';
    return sign + fmtInt(abs) + '원';
  };
  const DOW = ['일','월','화','수','목','금','토'];
  const dowOf = iso => DOW[new Date(iso + 'T00:00:00').getDay()];

  const metaEl = document.getElementById('meta');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const monthText = document.getElementById('month-text');
  const monthInput = document.getElementById('month-input');
  const tbody = document.getElementById('tbody');
  const emptyEl = document.getElementById('empty');

  let data = null;
  let availableMonths = [];       // ['2026-05', ...] 오름차순
  let currentMonth = null;        // 'YYYY-MM'
  let sort = { key: 'q', dir: -1 }; // 기본: 수량 내림차순

  function monthsFromData(daily) {
    const set = new Set(daily.map(r => r.d.slice(0,7)));
    return [...set].sort();
  }

  function pickMonth(ym) {
    return data.daily.filter(r => r.d.startsWith(ym));
  }

  function renderKpi(arr) {
    const s = arr.reduce((a,r) => ({ q:a.q+r.q, a:a.a+r.a, m:a.m+r.m }), { q:0, a:0, m:0 });
    document.getElementById('k-qty').textContent = fmtInt(s.q) + '개';
    document.getElementById('k-amt').textContent = fmtWon(s.a);
    document.getElementById('k-mgn').textContent = fmtWon(s.m);
    document.getElementById('k-mgnrate').textContent = s.a !== 0 ? (s.m/s.a*100).toFixed(1) + '%' : '—';
  }

  function renderTable(arr) {
    if (arr.length === 0) {
      tbody.innerHTML = '';
      emptyEl.style.display = '';
      return;
    }
    emptyEl.style.display = 'none';

    const withRate = arr.map(r => ({ ...r, r: r.a !== 0 ? r.m / r.a : 0 }));
    withRate.sort((a, b) => {
      const k = sort.key;
      if (k === 'd') return (a.d < b.d ? -1 : a.d > b.d ? 1 : 0) * sort.dir;
      return (a[k] - b[k]) * sort.dir;
    });

    tbody.innerHTML = withRate.map(r => {
      const amtCls = r.a < 0 ? 'neg' : '';
      const mgnCls = r.m < 0 ? 'neg' : '';
      const rate = r.a !== 0 ? (r.r*100).toFixed(1) + '%' : '—';
      const dow = dowOf(r.d);
      return `<tr>
        <td class="name">${r.d}<span class="dow">${dow}</span></td>
        <td>${fmtInt(r.q)}</td>
        <td class="${amtCls}">${fmtWon(r.a)}</td>
        <td class="${mgnCls}">${fmtWon(r.m)}</td>
        <td>${rate}</td>
      </tr>`;
    }).join('');
  }

  function updateSortHeaders() {
    document.querySelectorAll('th.sortable').forEach(th => {
      const k = th.dataset.key;
      const isActive = k === sort.key;
      th.classList.toggle('sort-active', isActive);
      const arrow = th.querySelector('.arrow');
      arrow.textContent = isActive ? (sort.dir === 1 ? '▲' : '▼') : '↕';
    });
  }

  function updateMonthNav() {
    const idx = availableMonths.indexOf(currentMonth);
    prevBtn.classList.toggle('disabled', idx <= 0);
    nextBtn.classList.toggle('disabled', idx >= availableMonths.length - 1);
    const [y, m] = currentMonth.split('-');
    monthText.textContent = `${y}년 ${Number(m)}월`;
    monthInput.value = currentMonth;
  }

  function setMonth(ym) {
    if (!availableMonths.includes(ym)) {
      // 범위 밖이면 가장 가까운 유효 월로 보정
      const earlier = availableMonths.filter(x => x <= ym).pop();
      ym = earlier || availableMonths[0];
    }
    currentMonth = ym;
    updateMonthNav();
    const arr = pickMonth(ym);
    renderKpi(arr);
    renderTable(arr);
  }

  prevBtn.addEventListener('click', () => {
    const i = availableMonths.indexOf(currentMonth);
    if (i > 0) setMonth(availableMonths[i-1]);
  });
  nextBtn.addEventListener('click', () => {
    const i = availableMonths.indexOf(currentMonth);
    if (i < availableMonths.length - 1) setMonth(availableMonths[i+1]);
  });
  monthInput.addEventListener('change', (e) => {
    if (e.target.value) setMonth(e.target.value);
  });

  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (sort.key === k) sort.dir *= -1;
      else { sort.key = k; sort.dir = (k === 'd') ? -1 : -1; }
      updateSortHeaders();
      renderTable(pickMonth(currentMonth));
    });
  });

  fetch('data/sales-coupang.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      data = j;
      availableMonths = monthsFromData(j.daily);
      metaEl.textContent = `업데이트: ${j.updated_at}`;
      monthInput.min = availableMonths[0];
      monthInput.max = availableMonths[availableMonths.length - 1];
      setMonth(availableMonths[availableMonths.length - 1]);
      updateSortHeaders();
    })
    .catch(err => { metaEl.textContent = '데이터 로드 실패 (' + err + ')'; });
})();
</script>

</body>
</html>
