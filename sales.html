<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 판매 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --text-muted: #4d5a4c;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
    --pos: #4a7a52;
    --neg: #b05858;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 28px 60px; }

  header.page {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .meta { font-size: 12px; color: var(--text-hint); }

  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .tabs {
    display: inline-flex; gap: 2px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px; border-radius: 10px;
  }
  .tab {
    font-size: 12.5px; font-weight: 600; padding: 7px 14px;
    border-radius: 7px; cursor: pointer; color: var(--text-hint);
    transition: background .12s, color .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; }
  .range {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-hint);
  }
  .range input[type="date"] {
    font: inherit; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }
  button.btn {
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text);
    cursor: pointer; transition: background .12s;
  }
  button.btn:hover { background: var(--accent-light); }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .kpi-label {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .kpi-sub { font-size: 11.5px; color: var(--text-hint); margin-top: 3px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px; font-weight: 700; margin: 0 0 12px;
    color: var(--text); letter-spacing: -0.01em;
  }

  .chart-wrap { position: relative; height: 240px; }
  .chart-svg { width: 100%; height: 100%; display: block; }
  .chart-tt {
    position: absolute; pointer-events: none;
    background: var(--text); color: #fff;
    padding: 6px 10px; border-radius: 6px;
    font-size: 11.5px; white-space: nowrap;
    transform: translate(-50%, -100%); margin-top: -8px;
    opacity: 0; transition: opacity .1s;
  }
  .chart-tt.show { opacity: 1; }

  .split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }

  table {
    width: 100%; border-collapse: collapse; font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    text-align: right; padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th:first-child, td:first-child { text-align: left; }
  th {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--accent-light);
    position: sticky; top: 0;
  }
  tbody tr:hover { background: var(--accent-light); }
  td.neg { color: var(--neg); }
  td.name { font-weight: 600; }

  .daily-table-wrap { max-height: 420px; overflow-y: auto; }
  .bar-cell {
    display: inline-block; width: 60px; height: 6px;
    background: var(--accent-light); border-radius: 3px; overflow: hidden;
    vertical-align: middle; margin-left: 8px;
  }
  .bar-fill { display: block; height: 100%; background: var(--accent); }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .split { grid-template-columns: 1fr; }
    .wrap { padding: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="page">
    <h1>쿠팡 판매 현황</h1>
    <div class="meta" id="meta">로딩 중…</div>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <div class="tab" data-days="7" role="tab">7일</div>
      <div class="tab active" data-days="14" role="tab">14일</div>
      <div class="tab" data-days="30" role="tab">30일</div>
      <div class="tab" data-days="60" role="tab">60일</div>
      <div class="tab" data-days="custom" role="tab">직접 선택</div>
    </div>
    <div class="range" id="range" style="display:none">
      <input type="date" id="from"> ~ <input type="date" id="to">
      <button class="btn" id="apply">적용</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">판매수량</div><div class="kpi-value" id="k-qty">—</div><div class="kpi-sub" id="k-qty-sub">—</div></div>
    <div class="kpi"><div class="kpi-label">매출</div><div class="kpi-value" id="k-amt">—</div><div class="kpi-sub" id="k-amt-sub">—</div></div>
    <div class="kpi"><div class="kpi-label">마진</div><div class="kpi-value" id="k-mgn">—</div><div class="kpi-sub" id="k-mgn-sub">—</div></div>
    <div class="kpi"><div class="kpi-label">마진율</div><div class="kpi-value" id="k-mgnrate">—</div><div class="kpi-sub">margin / amount</div></div>
    <div class="kpi"><div class="kpi-label">평균 객단가</div><div class="kpi-value" id="k-aov">—</div><div class="kpi-sub">amount / qty</div></div>
  </div>

  <section class="card">
    <h2>일자별 매출 추이</h2>
    <div class="chart-wrap" id="chart-wrap">
      <svg class="chart-svg" id="chart" preserveAspectRatio="none"></svg>
      <div class="chart-tt" id="tt"></div>
    </div>
  </section>

  <div class="split">
    <section class="card">
      <h2>브랜드별 (최근 30일)</h2>
      <table>
        <thead><tr><th>브랜드</th><th>수량</th><th>매출</th><th>마진</th><th>마진율</th></tr></thead>
        <tbody id="brand-tbody"></tbody>
      </table>
    </section>
    <section class="card">
      <h2>카테고리별 (최근 30일)</h2>
      <table>
        <thead><tr><th>카테고리</th><th>수량</th><th>매출</th><th>마진</th><th>비중</th></tr></thead>
        <tbody id="cat-tbody"></tbody>
      </table>
    </section>
  </div>

  <section class="card">
    <h2>일자별 상세</h2>
    <div class="daily-table-wrap">
      <table>
        <thead><tr><th>일자</th><th>수량</th><th>매출</th><th>마진</th><th>마진율</th></tr></thead>
        <tbody id="daily-tbody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
(function () {
  const fmtInt = n => n.toLocaleString('ko-KR');
  const fmtWon = n => {
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if (abs >= 1e8) return sign + (abs/1e8).toFixed(abs >= 1e9 ? 1 : 2).replace(/\.?0+$/,'') + '억';
    if (abs >= 1e4) return sign + Math.round(abs/1e4).toLocaleString('ko-KR') + '만';
    return sign + fmtInt(abs) + '원';
  };
  const fmtPct = (n, d=1) => (n*100).toFixed(d) + '%';

  const meta = document.getElementById('meta');
  const tabs = document.querySelectorAll('.tab');
  const rangeEl = document.getElementById('range');
  const fromEl = document.getElementById('from');
  const toEl = document.getElementById('to');
  const applyBtn = document.getElementById('apply');

  let data = null;
  let currentRange = null; // {from, to} ISO strings

  function pickDaily(fromISO, toISO) {
    return data.daily.filter(r => r.d >= fromISO && r.d <= toISO);
  }

  function sumArr(arr) {
    return arr.reduce((a, r) => ({ q:a.q+r.q, a:a.a+r.a, m:a.m+r.m }), { q:0, a:0, m:0 });
  }

  function renderKpi(arr) {
    const s = sumArr(arr);
    const prevArr = (() => {
      if (arr.length === 0) return [];
      const spanDays = arr.length;
      const toIdx = data.daily.findIndex(r => r.d === arr[0].d);
      return toIdx > 0 ? data.daily.slice(Math.max(0, toIdx - spanDays), toIdx) : [];
    })();
    const sp = sumArr(prevArr);
    const diffPct = (cur, prev) => prev === 0 ? null : ((cur - prev) / Math.abs(prev)) * 100;

    document.getElementById('k-qty').textContent = fmtInt(s.q) + '개';
    document.getElementById('k-amt').textContent = fmtWon(s.a);
    document.getElementById('k-mgn').textContent = fmtWon(s.m);
    document.getElementById('k-mgnrate').textContent = s.a !== 0 ? (s.m/s.a*100).toFixed(1) + '%' : '—';
    document.getElementById('k-aov').textContent = s.q > 0 ? fmtWon(Math.round(s.a / s.q)) : '—';

    const subTxt = (dp) => dp === null ? '전주 비교 없음' : (dp >= 0 ? '▲ ' : '▼ ') + Math.abs(dp).toFixed(1) + '% vs 직전 ' + arr.length + '일';
    document.getElementById('k-qty-sub').textContent = subTxt(diffPct(s.q, sp.q));
    document.getElementById('k-amt-sub').textContent = subTxt(diffPct(s.a, sp.a));
    document.getElementById('k-mgn-sub').textContent = subTxt(diffPct(s.m, sp.m));
  }

  function renderChart(arr) {
    const svg = document.getElementById('chart');
    const wrap = document.getElementById('chart-wrap');
    const tt = document.getElementById('tt');
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const PL = 50, PR = 10, PT = 14, PB = 24;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    if (arr.length === 0) { svg.innerHTML = ''; return; }

    const vals = arr.map(r => r.a);
    const min = Math.min(0, ...vals), max = Math.max(...vals, 1);
    const span = (max - min) || 1;
    const step = (W - PL - PR) / Math.max(arr.length - 1, 1);
    const xOf = i => PL + i * step;
    const yOf = v => H - PB - ((v - min) / span) * (H - PT - PB);

    // y-axis grid
    let gridLines = '';
    const yTicks = 4;
    for (let i = 0; i <= yTicks; i++) {
      const v = min + (span * i / yTicks);
      const y = yOf(v);
      gridLines += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ebe6df" stroke-width="1"/>`;
      gridLines += `<text x="${PL-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#7a706a">${fmtWon(v)}</text>`;
    }

    // x-axis labels (every N)
    const labelEvery = Math.max(1, Math.ceil(arr.length / 10));
    let xLabels = '';
    arr.forEach((r, i) => {
      if (i % labelEvery === 0 || i === arr.length - 1) {
        xLabels += `<text x="${xOf(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#7a706a">${r.d.slice(5)}</text>`;
      }
    });

    // area + line
    const pts = arr.map((r, i) => `${xOf(i)},${yOf(r.a)}`);
    const linePath = 'M ' + pts.join(' L ');
    const areaPath = linePath + ` L ${xOf(arr.length-1)},${yOf(0)} L ${xOf(0)},${yOf(0)} Z`;

    // dots
    const dots = arr.map((r, i) =>
      `<circle cx="${xOf(i)}" cy="${yOf(r.a)}" r="3" fill="#aa9791" data-i="${i}"/>`
    ).join('');

    // zero line
    const zeroLine = min < 0
      ? `<line x1="${PL}" y1="${yOf(0)}" x2="${W-PR}" y2="${yOf(0)}" stroke="#b05858" stroke-width="1" stroke-dasharray="3,3"/>`
      : '';

    svg.innerHTML =
      gridLines + xLabels + zeroLine +
      `<path d="${areaPath}" fill="rgba(170,151,145,0.18)"/>` +
      `<path d="${linePath}" fill="none" stroke="#8b756c" stroke-width="1.8" stroke-linejoin="round"/>` +
      dots;

    // tooltip
    svg.onmousemove = (e) => {
      const rect = svg.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const i = Math.max(0, Math.min(arr.length-1, Math.round((x - PL) / step)));
      const r = arr[i];
      tt.textContent = `${r.d} · 수량 ${fmtInt(r.q)} · 매출 ${fmtWon(r.a)} · 마진 ${fmtWon(r.m)}`;
      tt.style.left = xOf(i) + 'px';
      tt.style.top = yOf(r.a) + 'px';
      tt.classList.add('show');
    };
    svg.onmouseleave = () => tt.classList.remove('show');
  }

  function renderBreakdowns() {
    const bt = document.getElementById('brand-tbody');
    bt.innerHTML = data.brands_30d.map(b => {
      const rate = b.a !== 0 ? (b.m/b.a*100).toFixed(1) + '%' : '—';
      return `<tr><td class="name">${b.name}</td><td>${fmtInt(b.q)}</td><td>${fmtWon(b.a)}</td><td>${fmtWon(b.m)}</td><td>${rate}</td></tr>`;
    }).join('');

    const totAmt = data.categories_30d.reduce((s,c) => s + c.a, 0) || 1;
    const ct = document.getElementById('cat-tbody');
    ct.innerHTML = data.categories_30d.map(c => {
      const pct = (c.a / totAmt * 100).toFixed(1);
      const barW = Math.max(2, Math.min(60, c.a / totAmt * 60));
      return `<tr><td class="name">${c.name}</td><td>${fmtInt(c.q)}</td><td>${fmtWon(c.a)}</td><td>${fmtWon(c.m)}</td><td>${pct}%<span class="bar-cell"><span class="bar-fill" style="width:${barW}px"></span></span></td></tr>`;
    }).join('');
  }

  function renderDailyTable(arr) {
    const tb = document.getElementById('daily-tbody');
    tb.innerHTML = arr.slice().reverse().map(r => {
      const rate = r.a !== 0 ? (r.m/r.a*100).toFixed(1) + '%' : '—';
      const amtCls = r.a < 0 ? 'neg' : '';
      const mgnCls = r.m < 0 ? 'neg' : '';
      return `<tr><td class="name">${r.d}</td><td>${fmtInt(r.q)}</td><td class="${amtCls}">${fmtWon(r.a)}</td><td class="${mgnCls}">${fmtWon(r.m)}</td><td>${rate}</td></tr>`;
    }).join('');
  }

  function applyRange(fromISO, toISO) {
    currentRange = { from: fromISO, to: toISO };
    const arr = pickDaily(fromISO, toISO);
    renderKpi(arr);
    renderChart(arr);
    renderDailyTable(arr);
  }

  function setDaysTab(days) {
    tabs.forEach(t => t.classList.toggle('active', String(t.dataset.days) === String(days)));
    if (days === 'custom') {
      rangeEl.style.display = '';
      return;
    }
    rangeEl.style.display = 'none';
    const arr = data.daily.slice(-days);
    if (arr.length === 0) return;
    applyRange(arr[0].d, arr[arr.length-1].d);
  }

  tabs.forEach(t => t.addEventListener('click', () => setDaysTab(t.dataset.days === 'custom' ? 'custom' : Number(t.dataset.days))));
  applyBtn.addEventListener('click', () => {
    if (!fromEl.value || !toEl.value) return;
    applyRange(fromEl.value, toEl.value);
  });
  window.addEventListener('resize', () => { if (currentRange) renderChart(pickDaily(currentRange.from, currentRange.to)); });

  fetch('data/sales-coupang.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      data = j;
      meta.textContent = `업데이트: ${j.updated_at} · 소스: ${j.source}`;
      const last = j.daily[j.daily.length-1].d;
      const first = j.daily[0].d;
      fromEl.min = first; fromEl.max = last; fromEl.value = j.daily[Math.max(0, j.daily.length-30)].d;
      toEl.min = first; toEl.max = last; toEl.value = last;
      renderBreakdowns();
      setDaysTab(14);
    })
    .catch(err => { meta.textContent = '데이터 로드 실패 (' + err + ')'; });
})();
</script>

</body>
</html>
