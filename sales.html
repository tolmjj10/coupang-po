<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 판매 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --neg: #b05858;
    --in: #7a8a9a;
    /* 좌측 고정 컬럼 폭 (상품명만 리사이즈 가능) */
    --w-cat: 86px;
    --w-sku: 80px;
    --w-name: 180px;
    --w-note: 110px;
    --w-stock: 62px;
    --w-days: 62px;
    --w-pm: 60px;
    --w-pma: 60px;
    --w-a14: 60px;
    --w-a7: 60px;
  }
  html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 1720px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 20px 24px 22px; height: 100vh; display: flex; flex-direction: column; }

  header.page { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.024em; margin: 0; color: var(--text); }
  .meta { font-size: 11.5px; color: var(--text-hint); }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 1px 2px rgba(139,117,108,0.05);
  }
  .month-nav {
    display: inline-flex; align-items: center;
    background: #fdfbf9; border: 1px solid var(--border);
    border-radius: 10px; padding: 3px; user-select: none;
  }
  .month-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: var(--text-hint); }
  .month-btn:hover { background: var(--accent-light); color: var(--text); }
  .month-btn.disabled { opacity: 0.3; pointer-events: none; }
  .month-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .month-label { position: relative; font-size: 13px; font-weight: 700; padding: 0 14px; min-width: 110px; text-align: center; cursor: pointer; }
  .month-label:hover { color: var(--accent-dark); }
  .month-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font: inherit; }
  .search { display: flex; align-items: center; gap: 6px; }
  .search input { font: inherit; font-size: 12.5px; padding: 6px 10px; min-width: 180px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .cat-filter { font: inherit; font-size: 12.5px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; min-width: 130px; }
  .cat-filter:hover { border-color: var(--text-hint); }
  .cat-filter:focus { outline: none; border-color: var(--accent); }
  .brand-tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; user-select: none; margin-left: 4px; }
  .brand-tab { font-size: 11.5px; font-weight: 600; padding: 4px 11px; border-radius: 5px; cursor: pointer; color: var(--text-hint); }
  .brand-tab:hover { color: var(--text); }
  .brand-tab.active { background: var(--accent); color: #fff; }
  .brand-tab .cnt { font-size: 9.5px; font-weight: 500; margin-left: 4px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .refresh-btn {
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer;
    color: var(--text-hint); transition: color .12s, border-color .12s, background .12s, transform .4s;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--text-hint); background: #fff; }
  .refresh-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .refresh-btn.spinning svg { animation: refresh-spin .8s linear infinite; }
  @keyframes refresh-spin { to { transform: rotate(360deg); } }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; max-width: 820px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; transition: border-color .12s, box-shadow .12s; }
  .kpi.active-out { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(170,151,145,0.14); }
  .kpi.active-in  { border-color: var(--in); box-shadow: 0 0 0 2px rgba(122,138,154,0.16); }
  .kpi-label { font-size: 10.5px; font-weight: 600; color: var(--text-hint); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .kpi-value { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

  .tabs-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .metric-tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; user-select: none; }
  .metric-tab { font-size: 12px; font-weight: 600; padding: 6px 16px; border-radius: 7px; cursor: pointer; color: var(--text-hint); display: inline-flex; align-items: center; gap: 6px; }
  .metric-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .metric-tab:hover { color: var(--text); }
  .metric-tab.active[data-metric="out"]       { background: var(--accent); color: #fff; }
  .metric-tab.active[data-metric="in"]        { background: var(--in); color: #fff; }
  .metric-tab.active[data-metric="month-out"] { background: var(--accent-dark); color: #fff; }
  .metric-tab.active[data-metric="month-in"]  { background: #566977; color: #fff; }

  .expand-ctl { display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-hint); }
  .expand-ctl button { font: inherit; font-size: 11.5px; font-weight: 600; padding: 5px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); cursor: pointer; }
  .expand-ctl button:hover { background: var(--accent-light); }
  .expand-ctl button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pivot-wrap { flex: 1; min-height: 0; overflow: auto; }

  table.pivot {
    border-collapse: separate; border-spacing: 0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    width: 100%;
    table-layout: auto;
  }
  table.pivot th, table.pivot td {
    padding: 6px 8px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.pivot thead th {
    background: #faf7f4;
    position: sticky; top: 0; z-index: 2;
    font-size: 10.5px; font-weight: 600; color: var(--text-hint);
    letter-spacing: 0.03em;
  }

  /* Sticky left columns: cumulative offsets */
  .col-cat   { position: sticky; left: 0px; background: var(--surface); z-index: 1; text-align: left; min-width: var(--w-cat); max-width: var(--w-cat); width: var(--w-cat); overflow: hidden; text-overflow: ellipsis; }
  .col-sku   { position: sticky; left: var(--w-cat); background: var(--surface); z-index: 1; text-align: left; min-width: var(--w-sku); max-width: var(--w-sku); width: var(--w-sku); }
  .col-name  { position: sticky; left: calc(var(--w-cat) + var(--w-sku)); background: var(--surface); z-index: 1; text-align: left; min-width: var(--w-name); max-width: var(--w-name); width: var(--w-name); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .col-note  { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name)); background: var(--surface); z-index: 1; text-align: left; min-width: var(--w-note); max-width: var(--w-note); width: var(--w-note); color: var(--neg); font-size: 11px; overflow: hidden; text-overflow: ellipsis; border-right: 2px solid var(--border-strong); }
  .col-stock { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name) + var(--w-note)); background: var(--surface); z-index: 1; text-align: right; min-width: var(--w-stock); max-width: var(--w-stock); width: var(--w-stock); font-weight: 600; }
  .col-days  { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name) + var(--w-note) + var(--w-stock)); background: var(--surface); z-index: 1; text-align: right; min-width: var(--w-days); max-width: var(--w-days); width: var(--w-days); }
  .col-pm    { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name) + var(--w-note) + var(--w-stock) + var(--w-days)); background: var(--surface); z-index: 1; text-align: right; min-width: var(--w-pm); max-width: var(--w-pm); width: var(--w-pm); }
  .col-pma   { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name) + var(--w-note) + var(--w-stock) + var(--w-days) + var(--w-pm)); background: var(--surface); z-index: 1; text-align: right; min-width: var(--w-pma); max-width: var(--w-pma); width: var(--w-pma); }
  .col-a14   { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name) + var(--w-note) + var(--w-stock) + var(--w-days) + var(--w-pm) + var(--w-pma)); background: var(--surface); z-index: 1; text-align: right; min-width: var(--w-a14); max-width: var(--w-a14); width: var(--w-a14); }
  .col-a7    { position: sticky; left: calc(var(--w-cat) + var(--w-sku) + var(--w-name) + var(--w-note) + var(--w-stock) + var(--w-days) + var(--w-pm) + var(--w-pma) + var(--w-a14)); background: var(--surface); z-index: 1; text-align: right; min-width: var(--w-a7); max-width: var(--w-a7); width: var(--w-a7); border-right: 2px solid var(--border-strong); }
  /* 헤더: 좌측+상단 동시 고정 */
  table.pivot thead th.col-cat,
  table.pivot thead th.col-sku,
  table.pivot thead th.col-name,
  table.pivot thead th.col-note,
  table.pivot thead th.col-stock,
  table.pivot thead th.col-days,
  table.pivot thead th.col-pm,
  table.pivot thead th.col-pma,
  table.pivot thead th.col-a14,
  table.pivot thead th.col-a7 { top: 0; z-index: 3; background: #faf7f4; }

  /* 상품명 컬럼 리사이즈 핸들 */
  table.pivot thead th.col-name { position: sticky; }
  .resize-handle {
    position: absolute; top: 0; bottom: 0; right: -3px;
    width: 6px; cursor: col-resize; z-index: 20;
    user-select: none;
  }
  .resize-handle:hover, .resize-handle.dragging { background: var(--accent); opacity: 0.4; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }

  /* Sticky right */
  .col-amt   { position: sticky; right: 0px;   background: var(--surface); z-index: 1; text-align: right; min-width: 110px; max-width: 110px; width: 110px; font-weight: 700; border-left: 2px solid var(--border-strong); }
  .col-total { position: sticky; right: 110px; background: var(--surface); z-index: 1; text-align: right; min-width: 72px; max-width: 72px; width: 72px; font-weight: 700; border-left: 1px solid var(--border); }
  table.pivot thead th.col-amt   { position: sticky; top: 0; right: 0px;   z-index: 3; background: #faf7f4; }
  table.pivot thead th.col-total { position: sticky; top: 0; right: 110px; z-index: 3; background: #faf7f4; }

  .col-date { text-align: right; min-width: 54px; }
  .col-month { text-align: right; min-width: 78px; }
  td.col-month.zero { color: #cfc6bf; }
  /* 월별 뷰: 매출 컬럼 없음 → 합계가 우측 끝 */
  .month-view .col-total { right: 0px !important; }
  .col-date.wk { background: #fcfaf6; }
  thead .col-date.wk { background: #f6f1e9; }
  .col-date.prev-month { background: #f6f2ec; color: var(--text-hint); }
  thead .col-date.prev-month { background: #ede6dc; color: var(--text-hint); font-weight: 500; }
  td.col-date.zero { color: #cfc6bf; }
  td.col-days.danger { color: var(--neg); font-weight: 700; }
  td.col-stock.low { background: #f8d9d6 !important; color: var(--neg); font-weight: 700; }
  tbody tr:hover td.col-stock.low { background: #f3c4c0 !important; }

  /* 참고 컬럼(전월·14일·7일)은 헤더를 약간 더 진하게 */
  table.pivot thead th.col-pm,
  table.pivot thead th.col-pma,
  table.pivot thead th.col-a14,
  table.pivot thead th.col-a7 { background: #e3d8ca !important; color: var(--accent-dark); }

  tbody tr:hover td { background: var(--accent-light); }
  tbody tr:hover .col-cat, tbody tr:hover .col-sku, tbody tr:hover .col-name,
  tbody tr:hover .col-note, tbody tr:hover .col-stock, tbody tr:hover .col-days,
  tbody tr:hover .col-pm, tbody tr:hover .col-pma, tbody tr:hover .col-a14,
  tbody tr:hover .col-a7, tbody tr:hover .col-amt, tbody tr:hover .col-total {
    background: var(--accent-light);
  }

  .empty, .loading { padding: 40px 20px; text-align: center; color: var(--text-hint); font-size: 13px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="page">
    <h1>쿠팡 판매 현황</h1>
    <div class="meta" id="meta">로딩…</div>
  </header>

  <div class="toolbar">
    <div class="month-nav">
      <div class="month-btn" id="prev" title="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <div class="month-label" id="month-label"><span id="month-text">—</span><input type="month" class="month-input" id="month-input"></div>
      <div class="month-btn" id="next" title="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="search" style="margin-left:auto;">
      <button type="button" id="refreshBtn" class="refresh-btn" title="판매 데이터 새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <select id="catFilter" class="cat-filter" title="카테고리 필터">
        <option value="">전체 카테고리</option>
      </select>
      <input type="search" id="search" placeholder="SKU# / 상품명 검색">
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi" id="kpi-out"><div class="kpi-label">출고 수량</div><div class="kpi-value" id="k-out">—</div></div>
    <div class="kpi" id="kpi-in"><div class="kpi-label">입고 수량</div><div class="kpi-value" id="k-in">—</div></div>
    <div class="kpi"><div class="kpi-label">매출(입고기준)</div><div class="kpi-value" id="k-amt">—</div></div>
    <div class="kpi"><div class="kpi-label">마진</div><div class="kpi-value" id="k-mgn">—</div></div>
  </div>

  <div class="tabs-row">
    <div class="metric-tabs" role="tablist">
      <div class="metric-tab active" data-metric="out" role="tab"><span class="dot"></span>출고 (실 판매)</div>
      <div class="metric-tab" data-metric="in" role="tab"><span class="dot"></span>입고 (쿠팡 창고)</div>
      <div class="metric-tab" data-metric="month-out" role="tab"><span class="dot"></span>월별 출고량</div>
      <div class="metric-tab" data-metric="month-in" role="tab"><span class="dot"></span>월별 입고량</div>
    </div>
    <div class="expand-ctl">
      <span>표시 날짜</span>
      <button data-days="7" class="active">7일</button>
      <button data-days="14">14일</button>
      <button data-days="0">전체</button>
      <div class="brand-tabs" role="tablist" aria-label="브랜드 필터">
        <div class="brand-tab active" data-brand="all" role="tab">전체<span class="cnt" data-cnt="all"></span></div>
        <div class="brand-tab" data-brand="oa" role="tab">오아<span class="cnt" data-cnt="oa"></span></div>
        <div class="brand-tab" data-brand="voar" role="tab">보아르<span class="cnt" data-cnt="voar"></span></div>
      </div>
    </div>
  </div>

  <section class="card">
    <div class="pivot-wrap" id="pivot-wrap">
      <div class="loading" id="loading-msg">데이터 로드 중…</div>
    </div>
    <div class="empty" id="empty" style="display:none">선택한 달 데이터가 없습니다</div>
  </section>
</div>

<script>
(function () {
  const fmtInt = n => n.toLocaleString('ko-KR');
  const fmtNum1 = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
  const fmtWon = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const DOW = ['일','월','화','수','목','금','토'];
  const dowOf = iso => new Date(iso + 'T00:00:00').getDay();
  const isWeekend = iso => { const d = dowOf(iso); return d === 0 || d === 6; };
  const daysInMonth = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  const prevMonthOf = ym => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-2, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

  const metaEl = document.getElementById('meta');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const monthText = document.getElementById('month-text');
  const monthInput = document.getElementById('month-input');
  const pivotWrap = document.getElementById('pivot-wrap');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  const metricTabs = document.querySelectorAll('.metric-tab');
  const expandBtns = document.querySelectorAll('.expand-ctl button');
  const brandTabs = document.querySelectorAll('.brand-tab');
  const catFilter = document.getElementById('catFilter');
  const kpiOut = document.getElementById('kpi-out');
  const kpiIn = document.getElementById('kpi-in');

  let manifest = null;
  let availableMonths = [];
  let currentMonth = null;
  let currentMetric = 'out';
  let visibleDays = 7;
  let currentBrand = 'all';  // all | oa | voar
  let currentCat = '';       // '' = 전체

  const brandOf = (name) => (name && String(name).trim().startsWith('보아르')) ? 'voar' : 'oa';
  const passesBrandCat = (s) => {
    if (currentBrand !== 'all' && brandOf(s.sn) !== currentBrand) return false;
    if (currentCat && (s.cat || '') !== currentCat) return false;
    return true;
  };
  const skuMargin = (id) => {
    const m = marginMap[id];
    if (!m) return 0;
    const cost = Number(m.cost) || 0;
    const originN = Number(m.originN) || 0;
    return (cost / 1.1) - originN;
  };
  const cache = {};
  let marginMap = {};  // sku_id -> {cat, name, cost, price}
  let masterMap = {};  // sku_id -> {stock, note, sn, brand, sp}
  let rosterMap = {};  // sku_id -> {name, cat, kcat, item, owner, status, stock} (일일판매량 xlsx)

  function loadMonth(ym) {
    if (cache[ym]) return Promise.resolve(cache[ym]);
    return fetch(`data/sales-sku/${ym}.json`, { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { cache[ym] = d; return d; });
  }

  function filterAndOverlay(skus, metric, data) {
    // 출고(실 판매) 매출 = 상시가(price) × 수량, 입고 매출 = 매입가(cost) × 수량
    const unitKey = metric === 'in' ? 'cost' : 'price';
    const out = [];
    const seen = new Set();
    for (const s of skus) {
      const m = marginMap[s.id];
      const ro = rosterMap[s.id];
      if (!m && !ro) continue;
      const mm = masterMap[s.id] || {};
      const unit = m ? (Number(m[unitKey]) || 0) : 0;
      out.push(Object.assign({}, s, {
        cat:  (m && m.cat) || s.cat || (ro && ro.cat) || '',
        sn:   (m && m.name) || s.sn || mm.sn || (ro && ro.name) || '',
        note: mm.note || '',
        stock: (ro && ro.stock) || mm.stock || 0,
        unitPrice: unit,
        revenue: s.total * unit
      }));
      seen.add(s.id);
    }
    // 판매 0인 roster SKU도 포함 — 날짜 길이에 맞춘 0 배열
    if (data) {
      const zeroLen = (data.dates || []).length;
      const zeros = new Array(zeroLen).fill(0);
      for (const id of Object.keys(rosterMap)) {
        if (seen.has(id)) continue;
        const ro = rosterMap[id];
        const mm = masterMap[id] || {};
        const m  = marginMap[id];
        const unit = m ? (Number(m[unitKey]) || 0) : 0;
        out.push({
          id, total: 0, qty: zeros.slice(),
          cat:  (m && m.cat) || ro.cat || '',
          sn:   (m && m.name) || mm.sn || ro.name || '',
          note: mm.note || '',
          stock: ro.stock || mm.stock || 0,
          unitPrice: unit,
          revenue: 0
        });
      }
    }
    return out;
  }

  function lastDataIndex(data, metric) {
    const dates = data.dates;
    const skus = data.metrics[metric] || [];
    for (let i = dates.length - 1; i >= 0; i--) {
      for (const s of skus) if ((s.qty[i] || 0) !== 0) return i;
    }
    return dates.length - 1;
  }

  function getVisibleDateIndices(data) {
    const dates = data.dates;
    const end = lastDataIndex(data, currentMetric);
    if (visibleDays === 0) return dates.map((_, i) => i).slice(0, end + 1);
    const start = Math.max(0, end - visibleDays + 1);
    const r = [];
    for (let i = start; i <= end; i++) r.push(i);
    return r;
  }

  // 교차 월 윈도우: visibleDays=7/14일 때 전월 꼬리까지 포함
  function getCrossWindow(data, days) {
    const end = lastDataIndex(data, currentMetric);
    const curr = [];
    for (let i = 0; i <= end; i++) curr.push({ ym: data.month, idx: i, date: data.dates[i] });
    if (!days) return curr;  // '전체'는 현재 월만
    if (curr.length >= days) return curr.slice(-days);
    const pmYm = prevMonthOf(data.month);
    const pm = cache[pmYm];
    if (!pm) return curr;
    const need = days - curr.length;
    const start = Math.max(0, pm.dates.length - need);
    const prev = [];
    for (let i = start; i < pm.dates.length; i++) prev.push({ ym: pmYm, idx: i, date: pm.dates[i] });
    return prev.concat(curr);
  }

  function qtyAt(skuId, entry) {
    const pack = cache[entry.ym];
    if (!pack) return 0;
    const arr = pack.metrics[currentMetric] || [];
    const s = arr.find(x => x.id === skuId);
    return s ? (s.qty[entry.idx] || 0) : 0;
  }

  function sumQty(sku, fromIdx, toIdx) {
    let s = 0;
    for (let i = fromIdx; i <= toIdx; i++) s += sku.qty[i] || 0;
    return s;
  }

  function sumAcross(skuId, days, data) {
    const win = getCrossWindow(data, days);
    let s = 0;
    for (const e of win) s += qtyAt(skuId, e);
    return { sum: s, len: win.length };
  }

  function computeExtras(sku, data) {
    // 교차 월(전월 꼬리까지 포함)로 7/14일 평균 계산
    const savedMetric = currentMetric;
    currentMetric = 'out';
    const r14 = sumAcross(sku.id, 14, data);
    const r7  = sumAcross(sku.id, 7,  data);
    currentMetric = savedMetric;
    const avg14 = r14.len > 0 ? r14.sum / r14.len : 0;
    const avg7  = r7.len  > 0 ? r7.sum  / r7.len  : 0;
    // prev month total
    const pm = cache[prevMonthOf(data.month)];
    let prevTotal = 0;
    if (pm) {
      const pmOut = (pm.metrics.out || []).find(x => x.id === sku.id);
      if (pmOut) prevTotal = pmOut.total;
    }
    const pmLabel = Number(data.month.split('-')[1]) - 1;
    return {
      avg7, avg14,
      prevTotal,
      prevAvg: prevTotal / daysInMonth(prevMonthOf(data.month)),
      prevMonth: pmLabel > 0 ? pmLabel : 12,
      sellableDays: avg7 > 0 ? sku.stock / avg7 : null
    };
  }

  function renderKpi(ym) {
    const d = cache[ym];
    if (d) {
      const fo = filterAndOverlay(d.metrics.out || [], 'out').filter(passesBrandCat);
      const fi = filterAndOverlay(d.metrics.in  || [], 'in').filter(passesBrandCat);
      document.getElementById('k-out').textContent = fmtInt(fo.reduce((a,x)=>a+x.total,0)) + '개';
      document.getElementById('k-in').textContent  = fmtInt(fi.reduce((a,x)=>a+x.total,0)) + '개';
      let amt = 0, mgn = 0;
      for (const s of fi) {                              // 매출/마진 모두 입고기준
        const m = marginMap[s.id];
        if (!m) continue;
        amt += (Number(m.cost) || 0) * s.total;          // 매출 = 매입가 × 입고수량
        mgn += skuMargin(s.id) * s.total;                // 마진 = 오아마진(-VAT) × 입고수량
      }
      document.getElementById('k-amt').textContent = fmtWon(amt);
      document.getElementById('k-mgn').textContent = fmtWon(mgn);
    } else {
      const t = manifest.monthly_totals[ym] || {};
      document.getElementById('k-out').textContent = '…';
      document.getElementById('k-in').textContent  = '…';
      document.getElementById('k-amt').textContent = t.amt != null ? fmtWon(t.amt) : '—';
      document.getElementById('k-mgn').textContent = t.mgn != null ? fmtWon(t.mgn) : '—';
    }
    kpiOut.classList.toggle('active-out', currentMetric === 'out');
    kpiOut.classList.remove('active-in');
    kpiIn.classList.toggle('active-in', currentMetric === 'in');
    kpiIn.classList.remove('active-out');
  }

  function renderPivot(data) {
    if (currentMetric === 'month-out' || currentMetric === 'month-in') {
      renderMonthlyPivot();
      return;
    }
    const isIn = currentMetric === 'in';
    const q = searchEl.value.trim().toLowerCase();
    let skus = filterAndOverlay(data.metrics[currentMetric] || [], currentMetric, data);
    skus = skus.filter(passesBrandCat);
    if (q) {
      skus = skus.filter(s =>
        (s.sn || '').toLowerCase().includes(q) ||
        (s.cat|| '').toLowerCase().includes(q) ||
        (s.id || '').toLowerCase().includes(q) ||
        (s.note|| '').toLowerCase().includes(q)
      );
    }
    if (skus.length === 0) { pivotWrap.innerHTML = ''; emptyEl.style.display = ''; return; }
    emptyEl.style.display = 'none';

    const dates = data.dates;
    const window = getCrossWindow(data, visibleDays);
    const lastIdx = lastDataIndex(data, currentMetric);
    skus.sort((a,b) => ((b.qty[lastIdx]||0) - (a.qty[lastIdx]||0)) || (b.total - a.total));

    const pmLabel = Number(data.month.split('-')[1]) - 1;
    const pmHeader = (pmLabel > 0 ? pmLabel : 12) + '월';

    const parts = [];
    parts.push('<table class="pivot"><thead><tr>');
    parts.push('<th class="col-cat">카테고리</th>');
    parts.push('<th class="col-sku">SKU #</th>');
    parts.push('<th class="col-name">상품명<span class="resize-handle" title="드래그로 폭 조절"></span></th>');
    parts.push('<th class="col-note">이슈사항</th>');
    parts.push('<th class="col-stock">현재고</th>');
    if (!isIn) {
      parts.push('<th class="col-days">판매가능<br>일수</th>');
      parts.push(`<th class="col-pm">${pmHeader}<br>판매량</th>`);
      parts.push(`<th class="col-pma">${pmHeader}<br>평균</th>`);
      parts.push('<th class="col-a14">14일<br>평균</th>');
      parts.push('<th class="col-a7">7일<br>평균</th>');
    }
    for (const e of window) {
      const day = Number(e.date.slice(-2));
      const wkCls = isWeekend(e.date) ? ' wk' : '';
      const otherCls = e.ym !== data.month ? ' prev-month' : '';
      const label = e.ym !== data.month ? `${Number(e.ym.split('-')[1])}/${day}` : day;
      parts.push(`<th class="col-date${wkCls}${otherCls}" title="${e.date} (${DOW[dowOf(e.date)]})">${label}</th>`);
    }
    parts.push('<th class="col-total">월합계</th>');
    const amtSum = skus.reduce((a,x) => a + (x.revenue || 0), 0);
    parts.push(`<th class="col-amt">매출<br><span style="font-weight:600;color:var(--accent-dark);font-size:10.5px;">${fmtWon(amtSum)}</span></th>`);
    parts.push('</tr></thead><tbody>');

    for (const s of skus) {
      parts.push('<tr>');
      parts.push(`<td class="col-cat" title="${s.cat||''}">${s.cat||'—'}</td>`);
      parts.push(`<td class="col-sku">${s.id||'—'}</td>`);
      parts.push(`<td class="col-name" title="${s.sn||''}">${s.sn||'—'}</td>`);
      parts.push(`<td class="col-note" title="${s.note||''}">${s.note||''}</td>`);
      const stockStyle = (s.stock < 5) ? ' style="background:#f8d9d6;color:#b05858;font-weight:700;"' : '';
      parts.push(`<td class="col-stock"${stockStyle}>${fmtInt(s.stock)}</td>`);
      if (!isIn) {
        const ex = computeExtras(s, data);
        const daysLabel = ex.sellableDays === null ? '—' : fmtNum1(ex.sellableDays);
        const daysCls = (ex.sellableDays !== null && ex.sellableDays < 7) ? 'danger' : '';
        parts.push(`<td class="col-days ${daysCls}">${daysLabel}</td>`);
        parts.push(`<td class="col-pm">${ex.prevTotal ? fmtInt(ex.prevTotal) : '—'}</td>`);
        parts.push(`<td class="col-pma">${ex.prevAvg > 0 ? fmtInt(Math.round(ex.prevAvg)) : '—'}</td>`);
        parts.push(`<td class="col-a14">${ex.avg14 > 0 ? fmtNum1(ex.avg14) : '—'}</td>`);
        parts.push(`<td class="col-a7">${ex.avg7 > 0 ? fmtNum1(ex.avg7) : '—'}</td>`);
      }
      for (const e of window) {
        const v = e.ym === data.month ? (s.qty[e.idx] || 0) : qtyAt(s.id, e);
        const wkCls = isWeekend(e.date) ? ' wk' : '';
        const otherCls = e.ym !== data.month ? ' prev-month' : '';
        if (v === 0) parts.push(`<td class="col-date zero${wkCls}${otherCls}">·</td>`);
        else parts.push(`<td class="col-date${wkCls}${otherCls}">${fmtInt(v)}</td>`);
      }
      parts.push(`<td class="col-total">${fmtInt(s.total)}</td>`);
      parts.push(`<td class="col-amt" title="단가 ${fmtInt(s.unitPrice)}원">${s.revenue ? fmtWon(s.revenue) : '—'}</td>`);
      parts.push('</tr>');
    }
    parts.push('</tbody></table>');
    pivotWrap.innerHTML = parts.join('');
    requestAnimationFrame(() => { pivotWrap.scrollLeft = pivotWrap.scrollWidth; });
  }

  function renderMonthlyPivot() {
    const metric = currentMetric === 'month-in' ? 'in' : 'out';
    // 모든 월의 데이터가 로드되어 있어야 함
    const months = availableMonths.filter(ym => cache[ym]);
    if (months.length === 0) {
      pivotWrap.innerHTML = '<div class="loading">월별 데이터 로딩 중…</div>';
      Promise.all(availableMonths.map(ym => loadMonth(ym).catch(() => null)))
        .then(() => renderMonthlyPivot());
      return;
    }
    // SKU 통합: 월별 메트릭 합치기
    const skuAgg = {};
    const ensureAgg = (id) => {
      if (skuAgg[id]) return skuAgg[id];
      const mm = masterMap[id] || {};
      const mg = marginMap[id];
      const ro = rosterMap[id];
      if (!mg && !ro) return null;
      skuAgg[id] = {
        id,
        cat: (mg && mg.cat) || (ro && ro.cat) || '',
        sn:  (mg && mg.name) || mm.sn || (ro && ro.name) || '',
        note: mm.note || '',
        stock: (ro && ro.stock) || mm.stock || 0,
        byMonth: {},
        total: 0
      };
      return skuAgg[id];
    };
    for (const ym of months) {
      const d = cache[ym];
      const arr = d.metrics[metric] || [];
      for (const s of arr) {
        const e = ensureAgg(s.id);
        if (!e) continue;
        e.byMonth[ym] = (e.byMonth[ym] || 0) + s.total;
        e.total += s.total;
      }
    }
    // 판매 0인 roster SKU도 베이스로 포함
    for (const id of Object.keys(rosterMap)) ensureAgg(id);
    let skus = Object.values(skuAgg).filter(passesBrandCat);
    const q = searchEl.value.trim().toLowerCase();
    if (q) {
      skus = skus.filter(s =>
        (s.sn || '').toLowerCase().includes(q) ||
        (s.cat|| '').toLowerCase().includes(q) ||
        (s.id || '').toLowerCase().includes(q) ||
        (s.note|| '').toLowerCase().includes(q)
      );
    }
    if (skus.length === 0) { pivotWrap.innerHTML = ''; emptyEl.style.display = ''; return; }
    emptyEl.style.display = 'none';
    // 최신 월 기준 내림차순
    const latestYm = months[months.length - 1];
    skus.sort((a,b) => ((b.byMonth[latestYm]||0) - (a.byMonth[latestYm]||0)) || (b.total - a.total));

    const parts = [];
    parts.push('<table class="pivot month-view"><thead><tr>');
    parts.push('<th class="col-cat">카테고리</th>');
    parts.push('<th class="col-sku">SKU #</th>');
    parts.push('<th class="col-name">상품명<span class="resize-handle" title="드래그로 폭 조절"></span></th>');
    parts.push('<th class="col-note">이슈사항</th>');
    parts.push('<th class="col-stock">현재고</th>');
    for (const ym of months) {
      const [y, m] = ym.split('-');
      parts.push(`<th class="col-month" title="${ym}">${y.slice(2)}.${Number(m)}월</th>`);
    }
    parts.push('<th class="col-total">합계</th>');
    parts.push('</tr></thead><tbody>');

    for (const s of skus) {
      parts.push('<tr>');
      parts.push(`<td class="col-cat" title="${s.cat||''}">${s.cat||'—'}</td>`);
      parts.push(`<td class="col-sku">${s.id||'—'}</td>`);
      parts.push(`<td class="col-name" title="${s.sn||''}">${s.sn||'—'}</td>`);
      parts.push(`<td class="col-note" title="${s.note||''}">${s.note||''}</td>`);
      const stockStyle = (s.stock < 5) ? ' style="background:#f8d9d6;color:#b05858;font-weight:700;"' : '';
      parts.push(`<td class="col-stock"${stockStyle}>${fmtInt(s.stock)}</td>`);
      for (const ym of months) {
        const v = s.byMonth[ym] || 0;
        if (v === 0) parts.push(`<td class="col-month zero">·</td>`);
        else parts.push(`<td class="col-month">${fmtInt(v)}</td>`);
      }
      parts.push(`<td class="col-total">${fmtInt(s.total)}</td>`);
      parts.push('</tr>');
    }
    parts.push('</tbody></table>');
    pivotWrap.innerHTML = parts.join('');
    requestAnimationFrame(() => { pivotWrap.scrollLeft = pivotWrap.scrollWidth; });
  }

  function updateMonthNav() {
    const idx = availableMonths.indexOf(currentMonth);
    prevBtn.classList.toggle('disabled', idx <= 0);
    nextBtn.classList.toggle('disabled', idx >= availableMonths.length - 1);
    const [y, m] = currentMonth.split('-');
    monthText.textContent = `${y}년 ${Number(m)}월`;
    monthInput.value = currentMonth;
  }

  function refreshPivot() { if (cache[currentMonth]) renderPivot(cache[currentMonth]); }

  function setMonth(ym) {
    if (!availableMonths.includes(ym)) {
      const earlier = availableMonths.filter(x => x <= ym).pop();
      ym = earlier || availableMonths[availableMonths.length-1];
    }
    currentMonth = ym;
    updateMonthNav();
    renderKpi(ym);
    pivotWrap.innerHTML = '<div class="loading">로드 중…</div>';
    const prevYm = prevMonthOf(ym);
    const needPrev = availableMonths.includes(prevYm) && !cache[prevYm];
    const loads = [loadMonth(ym)];
    if (needPrev) loads.push(loadMonth(prevYm).catch(() => null));
    Promise.all(loads).then(([d]) => { renderKpi(ym); renderPivot(d); })
      .catch(err => { pivotWrap.innerHTML = `<div class="loading">로드 실패 (${err})</div>`; });
  }

  prevBtn.addEventListener('click', () => {
    const i = availableMonths.indexOf(currentMonth);
    if (i > 0) setMonth(availableMonths[i-1]);
  });
  nextBtn.addEventListener('click', () => {
    const i = availableMonths.indexOf(currentMonth);
    if (i < availableMonths.length - 1) setMonth(availableMonths[i+1]);
  });
  monthInput.addEventListener('change', (e) => { if (e.target.value) setMonth(e.target.value); });

  metricTabs.forEach(t => t.addEventListener('click', () => {
    currentMetric = t.dataset.metric;
    metricTabs.forEach(x => x.classList.toggle('active', x === t));
    renderKpi(currentMonth);
    refreshPivot();
  }));
  expandBtns.forEach(b => b.addEventListener('click', () => {
    visibleDays = Number(b.dataset.days);
    expandBtns.forEach(x => x.classList.toggle('active', x === b));
    refreshPivot();
  }));
  let searchTimer;
  searchEl.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(refreshPivot, 120); });

  brandTabs.forEach(t => t.addEventListener('click', () => {
    currentBrand = t.dataset.brand;
    brandTabs.forEach(x => x.classList.toggle('active', x === t));
    rebuildCatOptions();
    renderKpi(currentMonth);
    refreshPivot();
  }));
  catFilter.addEventListener('change', () => {
    currentCat = catFilter.value || '';
    renderKpi(currentMonth);
    refreshPivot();
  });

  function updateBrandCounts() {
    const seen = new Set();
    let all = 0, oa = 0, voar = 0;
    const consider = (id, nameHint) => {
      if (!id || seen.has(id)) return;
      seen.add(id);
      const nm = (marginMap[id] && marginMap[id].name) || (masterMap[id] && masterMap[id].sn) || (rosterMap[id] && rosterMap[id].name) || nameHint || '';
      all++;
      if (brandOf(nm) === 'voar') voar++; else oa++;
    };
    Object.keys(marginMap).forEach(id => consider(id));
    Object.keys(masterMap).forEach(id => consider(id));
    Object.keys(rosterMap).forEach(id => consider(id));
    const set = (k, v) => { const el = document.querySelector(`.brand-tab .cnt[data-cnt="${k}"]`); if (el) el.textContent = v ? `(${fmtInt(v)})` : ''; };
    set('all', all); set('oa', oa); set('voar', voar);
  }

  function rebuildCatOptions() {
    const cats = new Set();
    const addFrom = (src, nameKey) => {
      for (const id of Object.keys(src)) {
        const o = src[id] || {};
        const nm = (marginMap[id] && marginMap[id].name) || (masterMap[id] && masterMap[id].sn) || o[nameKey] || '';
        if (currentBrand !== 'all' && brandOf(nm) !== currentBrand) continue;
        const cat = (marginMap[id] && marginMap[id].cat) || o.cat || '';
        if (cat) cats.add(cat);
      }
    };
    addFrom(marginMap, 'name');
    addFrom(rosterMap, 'name');
    const sorted = Array.from(cats).sort((a,b) => a.localeCompare(b, 'ko'));
    const prev = currentCat;
    catFilter.innerHTML = '<option value="">전체 카테고리</option>' +
      sorted.map(c => `<option value="${c}">${c}</option>`).join('');
    if (sorted.includes(prev)) { catFilter.value = prev; }
    else { currentCat = ''; catFilter.value = ''; }
  }

  // 새로고침 버튼: 캐시 비우고 manifest/마진/마스터/이슈맵 전부 다시 로드 → 현재 월 재적재
  const refreshBtn = document.getElementById('refreshBtn');
  async function hardRefresh() {
    if (refreshBtn.classList.contains('spinning')) return;
    refreshBtn.classList.add('spinning');
    try {
      Object.keys(cache).forEach(k => delete cache[k]);
      const [m, ms, mm, issueMap, ro] = await Promise.all([
        fetch('data/sales-sku/index.json', { cache: 'no-store' }).then(r => r.json()),
        fetch('/api/margin-state', { cache: 'no-store' }).then(r => r.ok ? r.json() : { rows: [] }).catch(() => ({ rows: [] })),
        fetch('data/sales-sku/master.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : { skus: {} }).catch(() => ({ skus: {} })),
        loadIssueMap(),
        fetch('data/sales-sku/roster.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : { skus: {} }).catch(() => ({ skus: {} }))
      ]);
      rosterMap = (ro && ro.skus) || {};
      manifest = m;
      availableMonths = m.months.slice().sort();
      monthInput.min = availableMonths[0];
      monthInput.max = availableMonths[availableMonths.length - 1];
      marginMap = {};
      for (const r of ((ms && ms.rows) || [])) {
        const sku = String(r.sku || '').trim();
        if (!sku || !/^\d+$/.test(sku)) continue;
        marginMap[sku] = { cat: r.cat || '', name: r.name || '', cost: r.cost || 0, price: r.price || 0, originN: r.originN || 0 };
      }
      masterMap = (mm && mm.skus) || {};
      for (const [sku, note] of Object.entries(issueMap)) {
        if (!masterMap[sku]) masterMap[sku] = {};
        masterMap[sku].note = note;
      }
      updateBrandCounts();
      rebuildCatOptions();
      metaEl.textContent = `업데이트: ${m.updated_at} · 재고 ${(ro && ro.as_of) || mm.as_of || '-'}`;
      setMonth(currentMonth || availableMonths[availableMonths.length - 1]);
    } catch (e) {
      metaEl.textContent = '새로고침 실패: ' + (e.message || e);
    } finally {
      setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
    }
  }
  refreshBtn.addEventListener('click', hardRefresh);

  // 상품명 컬럼 리사이즈 (드래그)
  try {
    const saved = localStorage.getItem('salesNameWidth');
    if (saved) document.documentElement.style.setProperty('--w-name', saved);
  } catch(e){}
  pivotWrap.addEventListener('mousedown', (e) => {
    if (!e.target.classList || !e.target.classList.contains('resize-handle')) return;
    e.preventDefault();
    const handle = e.target;
    const startX = e.clientX;
    const cs = getComputedStyle(document.documentElement).getPropertyValue('--w-name').trim();
    const startW = parseFloat(cs) || 180;
    document.body.classList.add('resizing');
    handle.classList.add('dragging');
    function onMove(ev) {
      const newW = Math.max(100, Math.min(600, startW + (ev.clientX - startX)));
      document.documentElement.style.setProperty('--w-name', newW + 'px');
    }
    function onUp() {
      document.body.classList.remove('resizing');
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      try {
        const w = getComputedStyle(document.documentElement).getPropertyValue('--w-name').trim();
        if (w) localStorage.setItem('salesNameWidth', w);
      } catch(e){}
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // GitHub repo에서 '이슈제품*.xlsx' 최신본 받아 SKU → 특이사항 매핑
  function loadIssueMap() {
    return fetch('/api/repo-files?path=data&ref=main', { headers: { 'Accept':'application/json' } })
      .then(r => r.ok ? r.json() : [])
      .then(files => {
        const hits = (files || []).filter(f => f.type === 'file' && /^이슈제품/.test(f.name));
        if (!hits.length) return {};
        hits.sort((a,b) => a.name < b.name ? 1 : -1);
        return fetch(hits[0].download_url).then(r => r.arrayBuffer()).then(buf => {
          const wb = XLSX.read(buf, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          const map = {};
          const norm = v => String(v || '').trim().toLowerCase().replace(/[\s\-_]/g, '');
          for (const row of rows) {
            const keys = Object.keys(row);
            const skuKey = keys.find(k => { const n = norm(k); return n === 'skuid' || n === 'sku' || n === '옵션코드'; }) || keys[0];
            const noteKey = keys.find(k => { const n = norm(k); return n === '특이사항' || n === '메모' || n === '비고' || n === 'note'; });
            const sku = String(row[skuKey] || '').trim();
            if (!sku) continue;
            const note = noteKey ? String(row[noteKey] || '').trim() : '';
            map[sku] = note || '확인필요';
          }
          return map;
        });
      })
      .catch(e => { console.warn('issue load fail:', e); return {}; });
  }

  Promise.all([
    fetch('data/sales-sku/index.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
    fetch('/api/margin-state', { cache: 'no-cache' }).then(r => r.ok ? r.json() : { rows: [] }).catch(() => ({ rows: [] })),
    fetch('data/sales-sku/master.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : { skus: {} }).catch(() => ({ skus: {} })),
    loadIssueMap(),
    fetch('data/sales-sku/roster.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : { skus: {} }).catch(() => ({ skus: {} }))
  ]).then(([m, ms, mm, issueMap, ro]) => {
    rosterMap = (ro && ro.skus) || {};
    manifest = m;
    availableMonths = m.months.slice().sort();
    monthInput.min = availableMonths[0];
    monthInput.max = availableMonths[availableMonths.length - 1];
    for (const r of ((ms && ms.rows) || [])) {
      const sku = String(r.sku || '').trim();
      if (!sku || !/^\d+$/.test(sku)) continue;
      marginMap[sku] = { cat: r.cat || '', name: r.name || '', cost: r.cost || 0, price: r.price || 0, originN: r.originN || 0 };
    }
    masterMap = (mm && mm.skus) || {};
    // 이슈제품 리스트의 특이사항 덮어쓰기
    for (const [sku, note] of Object.entries(issueMap)) {
      if (!masterMap[sku]) masterMap[sku] = {};
      masterMap[sku].note = note;
    }
    updateBrandCounts();
    rebuildCatOptions();
    metaEl.textContent = `업데이트: ${m.updated_at} · 재고 ${(ro && ro.as_of) || mm.as_of || '-'}`;
    setMonth(availableMonths[availableMonths.length - 1]);
  }).catch(err => { metaEl.textContent = '데이터 로드 실패 (' + err + ')'; });
})();
</script>
