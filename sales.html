<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 판매 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --text: #2a1a15;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --neg: #b05858;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .wrap { padding: 24px 28px 60px; max-width: 100%; }

  header.page {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .meta { font-size: 12px; color: var(--text-hint); }

  .month-nav {
    display: inline-flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; margin-bottom: 20px;
    user-select: none;
  }
  .month-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px; cursor: pointer; color: var(--text-hint);
    transition: background .12s, color .12s;
  }
  .month-btn:hover { background: var(--accent-light); color: var(--text); }
  .month-btn.disabled { opacity: 0.3; pointer-events: none; }
  .month-btn svg { width: 16px; height: 16px; stroke-width: 2; }
  .month-label {
    position: relative;
    font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
    padding: 0 16px; min-width: 120px; text-align: center;
    cursor: pointer;
  }
  .month-label:hover { color: var(--accent-dark); }
  .month-input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; font: inherit;
  }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 24px; max-width: 900px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 18px;
  }
  .kpi-label {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .card-head {
    padding: 14px 18px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 {
    font-size: 13px; font-weight: 700; margin: 0;
  }
  .card-head .hint { font-size: 11.5px; color: var(--text-hint); }

  .pivot-wrap {
    max-height: 70vh; overflow: auto;
  }
  table.pivot {
    border-collapse: separate; border-spacing: 0;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  table.pivot th, table.pivot td {
    padding: 7px 10px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.pivot thead th {
    background: #faf7f4;
    position: sticky; top: 0; z-index: 2;
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    letter-spacing: 0.03em;
  }
  /* 좌측 고정 컬럼: 상품명 + 월합계 */
  table.pivot th.col-name, table.pivot td.col-name {
    position: sticky; left: 0; background: var(--surface); z-index: 1;
    min-width: 260px; max-width: 260px;
    overflow: hidden; text-overflow: ellipsis;
    text-align: left;
    border-right: 2px solid var(--border);
  }
  table.pivot thead th.col-name { z-index: 3; background: #faf7f4; }
  table.pivot th.col-total, table.pivot td.col-total {
    position: sticky; left: 260px; background: var(--surface); z-index: 1;
    min-width: 80px; text-align: right;
    border-right: 2px solid var(--border-strong, #d9d1c8);
    font-weight: 700;
  }
  table.pivot thead th.col-total { z-index: 3; background: #faf7f4; }
  table.pivot th.col-code, table.pivot td.col-code {
    position: sticky; left: 340px; background: var(--surface); z-index: 1;
    min-width: 80px; font-size: 11px; color: var(--text-hint);
    border-right: 2px solid var(--border);
  }
  table.pivot thead th.col-code { z-index: 3; background: #faf7f4; }

  table.pivot td.col-name {
    font-weight: 600;
  }
  table.pivot th.col-date, table.pivot td.col-date {
    text-align: right;
    min-width: 46px;
  }
  table.pivot td.col-date.zero { color: #ccc; }
  table.pivot td.col-date.wk { background: #fafafa; }
  table.pivot th.col-date.wk { background: #f3efea; }
  table.pivot tbody tr:hover td { background: var(--accent-light); }
  table.pivot tbody tr:hover td.col-name,
  table.pivot tbody tr:hover td.col-total,
  table.pivot tbody tr:hover td.col-code { background: var(--accent-light); }

  .search {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: 12px;
  }
  .search input {
    font: inherit; font-size: 12.5px;
    padding: 6px 10px; min-width: 180px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }

  .empty {
    padding: 40px 20px; text-align: center;
    color: var(--text-hint); font-size: 13px;
  }
  .loading {
    padding: 24px; text-align: center; color: var(--text-hint); font-size: 12px;
  }

  @media (max-width: 720px) {
    .wrap { padding: 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi-value { font-size: 18px; }
    table.pivot th.col-name, table.pivot td.col-name { min-width: 180px; max-width: 180px; }
    table.pivot th.col-total, table.pivot td.col-total { left: 180px; }
    table.pivot th.col-code, table.pivot td.col-code { left: 260px; display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="page">
    <h1>쿠팡 판매 현황</h1>
    <div class="meta" id="meta">로딩…</div>
  </header>

  <div style="display:flex;align-items:center;flex-wrap:wrap">
    <div class="month-nav">
      <div class="month-btn" id="prev" title="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="month-label" id="month-label">
        <span id="month-text">—</span>
        <input type="month" class="month-input" id="month-input">
      </div>
      <div class="month-btn" id="next" title="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="search">
      <input type="search" id="search" placeholder="상품명/코드 검색">
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">판매수량</div><div class="kpi-value" id="k-qty">—</div></div>
    <div class="kpi"><div class="kpi-label">매출</div><div class="kpi-value" id="k-amt">—</div></div>
    <div class="kpi"><div class="kpi-label">마진</div><div class="kpi-value" id="k-mgn">—</div></div>
    <div class="kpi"><div class="kpi-label">마진율</div><div class="kpi-value" id="k-mgnrate">—</div></div>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>제품 × 날짜 판매수량</h2>
      <div class="hint">기본: 월 합계 수량 내림차순 · 가로 스크롤로 전체 날짜 확인</div>
    </div>
    <div class="pivot-wrap" id="pivot-wrap">
      <div class="loading" id="loading-msg">데이터 로드 중…</div>
    </div>
    <div class="empty" id="empty" style="display:none">선택한 달 데이터가 없습니다</div>
  </section>
</div>

<script>
(function () {
  const fmtInt = n => n.toLocaleString('ko-KR');
  const fmtWon = n => {
    const abs = Math.abs(n), sign = n < 0 ? '-' : '';
    if (abs >= 1e8) return sign + (abs/1e8).toFixed(abs >= 1e9 ? 1 : 2).replace(/\.?0+$/,'') + '억';
    if (abs >= 1e4) return sign + Math.round(abs/1e4).toLocaleString('ko-KR') + '만';
    return sign + fmtInt(abs) + '원';
  };
  const DOW = ['일','월','화','수','목','금','토'];
  const dowOf = iso => new Date(iso + 'T00:00:00').getDay();
  const isWeekend = iso => { const d = dowOf(iso); return d === 0 || d === 6; };

  const metaEl = document.getElementById('meta');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const monthText = document.getElementById('month-text');
  const monthInput = document.getElementById('month-input');
  const pivotWrap = document.getElementById('pivot-wrap');
  const loadingMsg = document.getElementById('loading-msg');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');

  let manifest = null;
  let availableMonths = [];
  let currentMonth = null;
  const cache = {}; // month -> data

  function loadMonth(ym) {
    if (cache[ym]) return Promise.resolve(cache[ym]);
    return fetch(`data/sales-sku-${ym}.json`, { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { cache[ym] = d; return d; });
  }

  function renderKpi(ym) {
    const t = manifest.monthly_totals[ym];
    if (!t) { ['k-qty','k-amt','k-mgn','k-mgnrate'].forEach(id => document.getElementById(id).textContent = '—'); return; }
    document.getElementById('k-qty').textContent = fmtInt(t.q) + '개';
    document.getElementById('k-amt').textContent = fmtWon(t.a);
    document.getElementById('k-mgn').textContent = fmtWon(t.m);
    document.getElementById('k-mgnrate').textContent = t.a !== 0 ? (t.m/t.a*100).toFixed(1) + '%' : '—';
  }

  function renderPivot(data) {
    const q = searchEl.value.trim().toLowerCase();
    const skus = q
      ? data.skus.filter(s => s.n.toLowerCase().includes(q) || s.c.toLowerCase().includes(q))
      : data.skus;
    if (skus.length === 0) {
      pivotWrap.innerHTML = '';
      emptyEl.style.display = '';
      return;
    }
    emptyEl.style.display = 'none';

    const dates = data.dates;
    const parts = [];
    parts.push('<table class="pivot"><thead><tr>');
    parts.push('<th class="col-name">상품명</th>');
    parts.push('<th class="col-total">월합계</th>');
    parts.push('<th class="col-code">코드</th>');
    for (const d of dates) {
      const day = Number(d.slice(-2));
      const wkCls = isWeekend(d) ? ' wk' : '';
      parts.push(`<th class="col-date${wkCls}" title="${d} (${DOW[dowOf(d)]})">${day}</th>`);
    }
    parts.push('</tr></thead><tbody>');

    for (const s of skus) {
      parts.push('<tr>');
      parts.push(`<td class="col-name" title="${s.n}">${s.n}</td>`);
      parts.push(`<td class="col-total">${fmtInt(s.total)}</td>`);
      parts.push(`<td class="col-code">${s.c}</td>`);
      for (let i = 0; i < dates.length; i++) {
        const v = s.qty[i] || 0;
        const wkCls = isWeekend(dates[i]) ? ' wk' : '';
        if (v === 0) parts.push(`<td class="col-date zero${wkCls}">·</td>`);
        else parts.push(`<td class="col-date${wkCls}">${fmtInt(v)}</td>`);
      }
      parts.push('</tr>');
    }
    parts.push('</tbody></table>');
    pivotWrap.innerHTML = parts.join('');
  }

  function updateMonthNav() {
    const idx = availableMonths.indexOf(currentMonth);
    prevBtn.classList.toggle('disabled', idx <= 0);
    nextBtn.classList.toggle('disabled', idx >= availableMonths.length - 1);
    const [y, m] = currentMonth.split('-');
    monthText.textContent = `${y}년 ${Number(m)}월`;
    monthInput.value = currentMonth;
  }

  function setMonth(ym) {
    if (!availableMonths.includes(ym)) {
      const earlier = availableMonths.filter(x => x <= ym).pop();
      ym = earlier || availableMonths[availableMonths.length-1];
    }
    currentMonth = ym;
    updateMonthNav();
    renderKpi(ym);
    pivotWrap.innerHTML = '<div class="loading">로드 중…</div>';
    loadMonth(ym)
      .then(d => renderPivot(d))
      .catch(err => { pivotWrap.innerHTML = `<div class="loading">로드 실패 (${err})</div>`; });
  }

  prevBtn.addEventListener('click', () => {
    const i = availableMonths.indexOf(currentMonth);
    if (i > 0) setMonth(availableMonths[i-1]);
  });
  nextBtn.addEventListener('click', () => {
    const i = availableMonths.indexOf(currentMonth);
    if (i < availableMonths.length - 1) setMonth(availableMonths[i+1]);
  });
  monthInput.addEventListener('change', (e) => {
    if (e.target.value) setMonth(e.target.value);
  });

  let searchTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (cache[currentMonth]) renderPivot(cache[currentMonth]);
    }, 120);
  });

  fetch('data/sales-sku-index.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(m => {
      manifest = m;
      availableMonths = m.months.slice().sort();
      monthInput.min = availableMonths[0];
      monthInput.max = availableMonths[availableMonths.length - 1];
      metaEl.textContent = `업데이트: ${m.updated_at}`;
      setMonth(availableMonths[availableMonths.length - 1]);
    })
    .catch(err => { metaEl.textContent = '데이터 로드 실패 (' + err + ')'; });
})();
</script>

</body>
</html>
