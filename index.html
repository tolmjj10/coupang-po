<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡팀 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #1a1916;
    --text-muted: #6b6960;
    --text-hint: #9e9c94;
    --accent: #1a3a4a;
    --accent-light: #e8f1f5;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; width: 100vw; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 16px;
    border-bottom: 1px solid #f0eee6;
    margin-bottom: 14px;
  }
  .brand .logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand .logo svg { width: 15px; height: 15px; stroke-width: 1.9; }
  .brand .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .nav-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 10px 12px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    transition: background .12s ease, color .12s ease;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: #f6f4ee; color: var(--text); }
  .nav-item.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
  }
  .nav-item svg {
    width: 17px; height: 17px;
    stroke-width: 1.75;
    flex-shrink: 0;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 10px 12px;
    font-size: 10.5px;
    color: var(--text-hint);
    letter-spacing: 0.02em;
  }

  .content {
    flex: 1;
    height: 100%;
    background: var(--bg);
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: var(--bg);
  }
  iframe.active { display: block; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </div>
      <span class="title">쿠팡팀 업무 허브</span>
    </div>

    <div class="nav-label">Workspace</div>

    <div class="nav-item active" data-target="order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span>발주</span>
    </div>

    <div class="nav-item" data-target="new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 5.8L20 10.5l-4.7 3.9L16.9 21 12 17.6 7.1 21l1.6-6.6L4 10.5l6.1-1.7L12 3z"/>
      </svg>
      <span>신제품</span>
    </div>

    <div class="sidebar-footer">v1.0</div>
  </aside>

  <main class="content">
    <iframe id="frame-order" class="active" src="발주.html"></iframe>
    <iframe id="frame-new" src="신제품.html"></iframe>
  </main>
</div>

<script>
  const items = document.querySelectorAll('.nav-item');
  const frames = {
    order: document.getElementById('frame-order'),
    new:   document.getElementById('frame-new')
  };
  items.forEach(el => {
    el.addEventListener('click', () => {
      const target = el.dataset.target;
      items.forEach(i => i.classList.toggle('active', i === el));
      Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === target));
      try { history.replaceState(null, '', '#' + target); } catch(e) {}
    });
  });
  const hash = (location.hash || '').replace('#','');
  if (hash && frames[hash]) {
    document.querySelector('.nav-item[data-target="'+hash+'"]').click();
  }
</script>

</body>
</html>
