<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡팀 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    /* 마진테이블/po/new 와 동일한 어스톤 팔레트 */
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --text-muted: #4d5a4c;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; width: 100vw; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 12px;
  }
  /* 랜딩(메인) 화면에서는 사이드바 숨김 */
  body.landing-mode .sidebar { display: none; }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
    cursor: pointer;
    border-radius: 8px;
    transition: background .12s ease;
  }
  .brand:hover { background: var(--accent-light); }
  .brand .logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand .logo svg { width: 15px; height: 15px; stroke-width: 1.9; }
  .brand .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .nav-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 10px 12px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: background .12s ease, color .12s ease;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--accent-light); color: var(--text); }
  .nav-item.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
  }
  .nav-item svg {
    width: 17px; height: 17px;
    stroke-width: 1.75;
    flex-shrink: 0;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 10px 12px;
    font-size: 10.5px;
    color: var(--text-hint);
    letter-spacing: 0.02em;
  }

  .content {
    flex: 1;
    height: 100%;
    background: var(--bg);
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: var(--bg);
  }
  iframe.active { display: block; }

  .landing {
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: #4a3728;
  }
  .landing.active { display: flex; }
  .landing-inner {
    max-width: 760px;
    width: 100%;
    text-align: center;
  }
  .landing h2 {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.035em;
    margin: 0 0 52px;
    color: #ffffff;
  }
  .pick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    max-width: 640px;
    margin: 0 auto;
    gap: 20px;
  }
  .pick-card {
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 16px;
    padding: 22px 24px;
    cursor: pointer;
    text-align: left;
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
  }
  .pick-card:hover {
    transform: translateY(-3px);
  }
  .pick-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--accent-light);
    color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pick-icon svg { width: 22px; height: 22px; stroke-width: 1.75; }
  .pick-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand" id="brand-home" title="첫 화면">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </div>
      <span class="title">쿠팡팀 업무 허브</span>
    </div>

    <div class="nav-label">Workspace</div>

    <div class="nav-item" data-target="margin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
        <line x1="8" y1="3" x2="8" y2="21"/>
      </svg>
      <span>마진테이블</span>
    </div>

    <div class="nav-item" data-target="order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span>발주</span>
    </div>

    <div class="nav-item" data-target="promotion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>프로모션</span>
    </div>

    <div class="nav-item" data-target="new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 5.8L20 10.5l-4.7 3.9L16.9 21 12 17.6 7.1 21l1.6-6.6L4 10.5l6.1-1.7L12 3z"/>
      </svg>
      <span>신제품</span>
    </div>

    <div class="sidebar-footer">v1.0</div>
  </aside>

  <main class="content">
    <div id="landing" class="landing">
      <div class="landing-inner">
        <h2>쿠팡팀 업무 허브</h2>
        <div class="pick-grid">
          <div class="pick-card" data-target="margin">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
                <line x1="8" y1="3" x2="8" y2="21"/>
              </svg>
            </div>
            <div class="pick-title">마진테이블</div>
          </div>
          <div class="pick-card" data-target="order">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <div class="pick-title">발주</div>
          </div>
          <div class="pick-card" data-target="promotion">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </div>
            <div class="pick-title">프로모션</div>
          </div>
          <div class="pick-card" data-target="new">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.9 5.8L20 10.5l-4.7 3.9L16.9 21 12 17.6 7.1 21l1.6-6.6L4 10.5l6.1-1.7L12 3z"/>
              </svg>
            </div>
            <div class="pick-title">신제품</div>
          </div>
        </div>
      </div>
    </div>
    <iframe id="frame-order" data-src="po.html"></iframe>
    <iframe id="frame-new" data-src="newproduct/new.html"></iframe>
    <iframe id="frame-margin" data-src="margin.html"></iframe>
    <iframe id="frame-promotion" data-src="promotion/promotion.html"></iframe>
  </main>
</div>

<script>
  const items = document.querySelectorAll('.nav-item');
  const landing = document.getElementById('landing');
  const frames = {
    order:     document.getElementById('frame-order'),
    new:       document.getElementById('frame-new'),
    margin:    document.getElementById('frame-margin'),
    promotion: document.getElementById('frame-promotion')
  };

  function ensureLoaded(target) {
    const f = frames[target];
    if (!f) return;
    if (!f.src && f.dataset.src) f.src = f.dataset.src;
  }

  function showTarget(target) {
    items.forEach(i => i.classList.toggle('active', i.dataset.target === target));
    if (target) ensureLoaded(target);
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === target));
    landing.classList.toggle('active', !target);
    // 랜딩 화면에서는 사이드바 숨김
    document.body.classList.toggle('landing-mode', !target);
    try { history.replaceState(null, '', target ? '#' + target : location.pathname); } catch(e) {}
  }

  items.forEach(el => {
    el.addEventListener('click', () => showTarget(el.dataset.target));
  });
  document.querySelectorAll('.pick-card').forEach(el => {
    el.addEventListener('click', () => showTarget(el.dataset.target));
  });
  document.getElementById('brand-home').addEventListener('click', () => showTarget(null));

  const hash = (location.hash || '').replace('#','');
  showTarget(frames[hash] ? hash : null);

  // 랜딩 진입 후, 아이들 상태에서 나머지 프레임을 백그라운드로 미리 로드해 다음 클릭 시 즉시 표시
  window.addEventListener('load', () => {
    const preload = () => {
      ensureLoaded('order');
      setTimeout(() => ensureLoaded('margin'), 300);
      setTimeout(() => ensureLoaded('new'), 600);
      setTimeout(() => ensureLoaded('promotion'), 900);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
    else setTimeout(preload, 400);
  });
</script>

</body>
</html>
