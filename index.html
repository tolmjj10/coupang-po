<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡팀 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    /* 마진테이블/po/new 와 동일한 어스톤 팔레트 */
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --text-muted: #4d5a4c;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
    /* 기능색 (상태 신호 — 베이스 어스톤과 조화) */
    --ok: #6e8a6a;        --ok-soft:   #e8efe6;
    --warn: #c9995a;      --warn-soft: #f5ead7;
    --neg: #b05858;       --neg-soft:  #f2dede;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* ─────────── 상단 가로 네비 ─────────── */
  .topbar {
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 10px 20px;
    position: relative;
    z-index: 100;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 12px 4px 4px;
    margin-right: 14px;
    cursor: pointer;
    border-radius: 8px;
    transition: background .12s ease;
  }
  .brand:hover { background: var(--accent-light); }
  .brand .logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand .logo svg { width: 15px; height: 15px; stroke-width: 1.9; }
  .brand .title {
    font-size: 14px; font-weight: 700; letter-spacing: -0.02em; color: var(--text);
  }

  .nav-item {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px; font-weight: 600;
    color: var(--text);
    cursor: pointer; user-select: none;
    transition: color .12s ease, font-weight .12s ease;
    white-space: nowrap;
  }
  .nav-item:hover { color: #000; font-weight: 700; }
  .nav-item.active { color: #000; font-weight: 700; }
  /* 상단바 직속 항목만 밑줄 표시 (드롭다운 내부는 제외) */
  .topbar > .nav-item.active::after,
  .topbar > .nav-group.active-group .nav-trigger::after {
    content: '';
    position: absolute;
    left: 10px; right: 10px; bottom: -11px;
    height: 2px; background: var(--accent-dark);
    border-radius: 2px;
  }
  .nav-item svg {
    width: 15px; height: 15px;
    stroke-width: 1.9;
    flex-shrink: 0;
  }
  .nav-caret {
    width: 10px; height: 10px; opacity: 0.55;
    transition: transform .15s;
  }
  .nav-group.subbar-open .nav-caret { transform: rotate(180deg); }

  .nav-group { position: relative; }
  /* 하위 항목은 숨겨서 데이터 소스로만 사용 (서브바가 대신 렌더) */
  .nav-dropdown { display: none; }

  /* 두 번째 가로줄: 그룹 선택 시 보여주는 서브바 (배경 없음) */
  .subbar {
    display: none;
    align-items: center;
    gap: 4px;
    background: transparent;
    border-bottom: 1px solid var(--border);
    padding: 6px 20px;
    position: relative;
    z-index: 90;
  }
  .subbar.show { display: flex; }
  .sub-item {
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-hint);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color .12s ease, font-weight .12s ease;
    border-radius: 6px;
  }
  .sub-item:hover { color: #000; font-weight: 700; }
  .sub-item.active { color: #000; font-weight: 700; }

  .content {
    flex: 1;
    height: 100%;
    background: var(--bg);
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: var(--bg);
  }
  iframe.active { display: block; }

  .landing {
    width: 100%;
    height: 100%;
    display: none;
    padding: 20px 24px 22px;
    background: var(--bg);
    overflow: auto;
  }
  .landing.active { display: block; }
  .landing-inner {
    max-width: 1720px;
    width: 100%;
    margin: 0 auto;
  }
  .landing-head {
    display: flex; align-items: baseline; justify-content: flex-end;
    margin-bottom: 14px;
  }
  .landing-head h2 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.024em; margin: 0; color: var(--text);
  }
  .landing-head .today {
    font-size: 11.5px; color: var(--text-hint); font-variant-numeric: tabular-nums;
  }

  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 14px;
  }
  .dash-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    min-height: 220px;
    display: flex; flex-direction: column;
  }
  .dash-card.full { grid-column: 1 / -1; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 13.5px; font-weight: 700; letter-spacing: -0.02em; color: var(--text);
  }
  .card-sub { font-size: 11px; color: var(--text-hint); font-weight: 500; }
  .card-link {
    font-size: 11.5px; color: var(--accent-dark); font-weight: 600;
    cursor: pointer; letter-spacing: -0.01em;
  }
  .card-link:hover { text-decoration: underline; }

  /* 프로모션/신제품 리스트 */
  .promo-list, .new-list { display: flex; flex-direction: column; gap: 2px; }
  .promo-row, .new-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .promo-row:last-child, .new-row:last-child { border-bottom: 0; }
  .promo-type {
    font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 4px;
    letter-spacing: -0.01em; flex-shrink: 0;
  }
  .promo-type.gold { background: #efe4ea; color: #6a4a5a; }
  .promo-type.time { background: #e6ece6; color: #4a5748; }
  .promo-date { font-size: 11.5px; color: var(--text-hint); font-variant-numeric: tabular-nums; min-width: 92px; flex-shrink: 0; }
  .promo-dday { font-size: 10.5px; font-weight: 700; color: var(--text-hint); min-width: 36px; text-align: right; flex-shrink: 0; }
  .promo-dday.urgent { color: var(--neg); }
  .promo-dday.soon   { color: var(--warn); }
  .promo-name, .new-name { flex: 1; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .new-days { font-size: 10.5px; font-weight: 700; color: var(--warn); flex-shrink: 0; }
  .new-days.critical { color: var(--neg); }
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-hint); font-size: 12px; padding: 24px 0;
  }

  /* 판매 요약 */
  .sales-kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 14px;
  }
  .sales-kpi {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    background: #fdfbf9;
  }
  .sales-kpi .k-label { font-size: 10.5px; color: var(--text-hint); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .sales-kpi .k-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; white-space: nowrap; }
  .sales-kpi .k-sub { font-size: 10.5px; color: var(--text-hint); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sales-kpi.ly { background: #fff; }
  .sales-kpi.ly .k-value { color: var(--text-hint); font-size: 14px; }
  .k-delta { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; vertical-align: 2px; }
  .k-delta.up   { color: var(--ok);  background: var(--ok-soft); }
  .k-delta.down { color: var(--neg); background: var(--neg-soft); }
  .k-delta.flat { color: var(--text-hint); background: var(--accent-light); }

  /* 차트 */
  .chart-wrap { position: relative; width: 100%; height: 220px; }
  .chart-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart-tip {
    position: absolute; pointer-events: none;
    background: #2a1a15; color: #fff;
    font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 6px;
    transform: translate(-50%, -115%); white-space: nowrap;
    font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .1s;
  }
  .chart-tip.show { opacity: 1; }

  /* ─────────── 모바일 대응 (≤ 720px) ─────────── */
  @media (max-width: 720px) {
    html, body { overflow: auto; -webkit-text-size-adjust: 100%; }
    .app { height: auto; min-height: 100vh; width: 100%; }
    .topbar {
      padding: 8px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: sticky; top: 0;
    }
    .topbar::-webkit-scrollbar { display: none; }
    .brand { margin-right: 6px; }
    .brand .title { font-size: 13px; }
    .nav-item { padding: 6px 10px; font-size: 12.5px; }
    .subbar { padding: 6px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .subbar::-webkit-scrollbar { display: none; }
    .sub-item { padding: 6px 10px; font-size: 12px; }

    .content { height: auto; min-height: calc(100vh - 50px); }
    .landing { padding: 16px 14px 24px; }
    .landing-head h2 { font-size: 17px; }
    .dash-grid { grid-template-columns: 1fr; }
    .sales-kpis { grid-template-columns: repeat(2, 1fr); }
    .chart-wrap { height: 180px; }

    iframe { height: calc(100vh - 50px); }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="topbar">
    <div class="brand" id="brand-home" title="첫 화면">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </div>
      <span class="title">쿠팡팀 업무 허브</span>
    </div>

    <!-- 홈 -->
    <div class="nav-item" id="nav-home"><span>홈</span></div>

    <!-- 상품 ▾ (마진테이블, 신제품) -->
    <div class="nav-group" data-group="product">
      <div class="nav-item nav-trigger">
        <span>상품</span>
        <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav-dropdown">
        <div class="nav-item" data-target="margin"><span>마진테이블</span></div>
        <div class="nav-item" data-target="new"><span>신제품</span></div>
      </div>
    </div>

    <!-- 발주 ▾ (발주리스트, 입고리스트) -->
    <div class="nav-group" data-group="order">
      <div class="nav-item nav-trigger">
        <span>발주</span>
        <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav-dropdown">
        <div class="nav-item" data-target="order"><span>발주리스트</span></div>
        <div class="nav-item" data-target="inbound"><span>입고리스트</span></div>
      </div>
    </div>

    <!-- 프로모션 -->
    <div class="nav-item" data-target="promotion"><span>프로모션</span></div>

    <!-- 판매 ▾ (판매 현황, 판매가 확인) -->
    <div class="nav-group" data-group="sales">
      <div class="nav-item nav-trigger">
        <span>판매</span>
        <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav-dropdown">
        <div class="nav-item" data-target="sales"><span>판매 현황</span></div>
        <div class="nav-item" data-target="price"><span>판매가 확인</span></div>
      </div>
    </div>

    <!-- 정산 -->
    <div class="nav-item" data-target="settlement"><span>정산</span></div>
  </nav>

  <!-- 그룹 선택 시 나타나는 하위 서브바 -->
  <div class="subbar" id="subbar"></div>

  <main class="content">
    <div id="landing" class="landing">
      <div class="landing-inner">
        <div class="landing-head">
          <div class="today" id="today-label"></div>
        </div>

        <div class="dash-grid">
          <!-- ① 프로모션 요약 -->
          <section class="dash-card">
            <div class="card-head">
              <div>
                <div class="card-title">예정된 프로모션</div>
                <div class="card-sub">골드박스 · 타임특가</div>
              </div>
              <div class="card-link" data-link="promotion">전체 보기 →</div>
            </div>
            <div class="promo-list" id="promo-list"></div>
          </section>

          <!-- ② 신제품 요약 -->
          <section class="dash-card">
            <div class="card-head">
              <div>
                <div class="card-title">진전 없는 신제품</div>
                <div class="card-sub">입고 완료 이후 변화 없음</div>
              </div>
              <div class="card-link" data-link="new">전체 보기 →</div>
            </div>
            <div class="new-list" id="new-list"></div>
          </section>

          <!-- ③ 판매 요약 -->
          <section class="dash-card full">
            <div class="card-head">
              <div>
                <div class="card-title">판매 요약 <span class="card-sub" id="sales-month-label"></span></div>
                <div class="card-sub">최근 6개월 입고매출 추이</div>
              </div>
              <div class="card-link" data-link="sales">판매 현황 →</div>
            </div>
            <div class="sales-kpis">
              <div class="sales-kpi">
                <div class="k-label">당월 실매출</div>
                <div class="k-value" id="kpi-out">—</div>
              </div>
              <div class="sales-kpi">
                <div class="k-label">당월 입고매출</div>
                <div class="k-value" id="kpi-in">—</div>
              </div>
              <div class="sales-kpi ly">
                <div class="k-label">작년 동월 실매출</div>
                <div class="k-value" id="kpi-out-ly">—</div>
              </div>
              <div class="sales-kpi ly">
                <div class="k-label">작년 동월 입고매출</div>
                <div class="k-value" id="kpi-in-ly">—</div>
              </div>
            </div>
            <div class="chart-wrap">
              <svg id="chart"></svg>
              <div class="chart-tip" id="chart-tip"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
    <iframe id="frame-order" data-src="po.html"></iframe>
    <iframe id="frame-inbound" data-src="inbound.html"></iframe>
    <iframe id="frame-new" data-src="newproduct/new.html"></iframe>
    <iframe id="frame-margin" data-src="margin.html"></iframe>
    <iframe id="frame-promotion" data-src="promotion/promotion.html"></iframe>
    <iframe id="frame-price" data-src="price.html"></iframe>
    <iframe id="frame-sales" data-src="sales.html"></iframe>
    <iframe id="frame-settlement" data-src="settlement.html"></iframe>
  </main>
</div>

<script>
  const landing = document.getElementById('landing');
  const frames = {
    order:      document.getElementById('frame-order'),
    inbound:    document.getElementById('frame-inbound'),
    new:        document.getElementById('frame-new'),
    margin:     document.getElementById('frame-margin'),
    promotion:  document.getElementById('frame-promotion'),
    price:      document.getElementById('frame-price'),
    sales:      document.getElementById('frame-sales'),
    settlement: document.getElementById('frame-settlement')
  };

  function ensureLoaded(target) {
    const f = frames[target];
    if (!f) return;
    if (!f.src && f.dataset.src) f.src = f.dataset.src;
  }

  // 그룹별 하위 항목 데이터 (HTML .nav-dropdown에서 추출)
  const GROUPS = {};
  document.querySelectorAll('.nav-group').forEach(g => {
    const name = g.dataset.group;
    const items = [...g.querySelectorAll('.nav-dropdown .nav-item[data-target]')]
      .map(el => ({ target: el.dataset.target, label: el.textContent.trim() }));
    GROUPS[name] = items;
  });
  const groupOfTarget = (t) => {
    for (const [g, items] of Object.entries(GROUPS)) {
      if (items.some(it => it.target === t)) return g;
    }
    return null;
  };

  // 현재 서브바에 표시 중인 그룹 (사용자가 트리거만 눌러 열어둔 경우 포함)
  let visibleGroup = null;
  const subbar = document.getElementById('subbar');

  function renderSubbar(groupName, activeTarget) {
    if (!groupName) {
      subbar.classList.remove('show');
      subbar.innerHTML = '';
      subbar.style.paddingLeft = '';
      return;
    }
    const items = GROUPS[groupName] || [];
    subbar.innerHTML = items.map(it =>
      `<div class="sub-item ${it.target === activeTarget ? 'active' : ''}" data-target="${it.target}">${it.label}</div>`
    ).join('');
    subbar.classList.add('show');
    // 트리거 버튼의 가로 위치에 맞춰 좌측 패딩 설정 → 서브 항목이 상단 트리거 바로 아래 정렬
    const trigger = document.querySelector(`.nav-group[data-group="${groupName}"] .nav-trigger`);
    if (trigger) {
      const topbar = document.querySelector('.topbar');
      const tRect = trigger.getBoundingClientRect();
      const bRect = topbar.getBoundingClientRect();
      subbar.style.paddingLeft = Math.max(0, tRect.left - bRect.left) + 'px';
    }
    subbar.querySelectorAll('.sub-item').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        showTarget(el.dataset.target);
      });
    });
  }

  function closeSubbar() {
    if (!visibleGroup) return;
    visibleGroup = null;
    renderSubbar(null);
    document.querySelectorAll('.nav-group.subbar-open').forEach(g => g.classList.remove('subbar-open'));
  }

  function showTarget(target) {
    // 상단바 상위 nav-item active 토글
    document.querySelectorAll('.topbar > .nav-item[data-target]').forEach(i =>
      i.classList.toggle('active', i.dataset.target === target));
    document.getElementById('nav-home').classList.toggle('active', !target);

    // 그룹 밑줄 — 실제 자식이 선택된 상태 유지
    const targetGroup = groupOfTarget(target);
    document.querySelectorAll('.nav-group').forEach(g => {
      g.classList.toggle('active-group', g.dataset.group === targetGroup);
    });

    // 네비게이션 발생 시 서브바는 항상 닫음
    closeSubbar();

    if (target) ensureLoaded(target);
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === target));
    landing.classList.toggle('active', !target);
    if (!target && typeof window.__redrawDashChart === 'function') {
      requestAnimationFrame(() => window.__redrawDashChart());
    }
    try { history.replaceState(null, '', target ? '#' + target : location.pathname); } catch(e) {}
  }

  // 리프(직접 네비게이션하는) 항목
  document.querySelectorAll('.topbar > .nav-item[data-target]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showTarget(el.dataset.target);
    });
  });

  // 그룹 트리거(상품/발주/판매) — 서브바 토글만 하고 네비게이션은 안 함
  document.querySelectorAll('.nav-group').forEach(group => {
    const trigger = group.querySelector('.nav-trigger');
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const name = group.dataset.group;
      if (visibleGroup === name) {
        closeSubbar();
      } else {
        visibleGroup = name;
        const currentHash = (location.hash || '').replace('#','');
        renderSubbar(name, currentHash);
        document.querySelectorAll('.nav-group').forEach(g =>
          g.classList.toggle('subbar-open', g.dataset.group === visibleGroup));
      }
    });
  });

  // 서브바 외부(상단바/서브바 아닌 곳) 클릭 시 서브바 닫기
  document.addEventListener('click', (e) => {
    if (e.target.closest('.topbar') || e.target.closest('.subbar')) return;
    closeSubbar();
  });
  // iframe 내부 클릭은 부모 창에서 blur 로 감지됨 → 서브바 닫기
  window.addEventListener('blur', closeSubbar);

  document.querySelectorAll('.card-link').forEach(el => {
    el.addEventListener('click', () => showTarget(el.dataset.link));
  });
  document.getElementById('brand-home').addEventListener('click', () => { closeSubbar(); showTarget(null); });
  document.getElementById('nav-home').addEventListener('click', (e) => { e.stopPropagation(); closeSubbar(); showTarget(null); });

  const hash = (location.hash || '').replace('#','');
  showTarget(frames[hash] ? hash : null);

  // 랜딩 진입 후, 아이들 상태에서 나머지 프레임을 백그라운드로 미리 로드해 다음 클릭 시 즉시 표시
  window.addEventListener('load', () => {
    const preload = () => {
      ensureLoaded('order');
      setTimeout(() => ensureLoaded('inbound'), 150);
      setTimeout(() => ensureLoaded('margin'), 300);
      setTimeout(() => ensureLoaded('new'), 600);
      setTimeout(() => ensureLoaded('promotion'), 900);
      setTimeout(() => ensureLoaded('price'), 1200);
      setTimeout(() => ensureLoaded('sales'), 1500);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
    else setTimeout(preload, 400);
  });

  /* ──────────────────────────────────────────────────
     대시보드 렌더링 (현재는 목업 데이터)
     TODO: 실데이터 연결
       - 프로모션: /api/promotion-state 에서 미래 골드박스/타임특가 추출
       - 신제품: /api/new-state 에서 "진전 없음" 판정 (status/updated_at 기반)
       - 판매: data/sales-sku/<ym>.json 또는 신규 월별 롤업 엔드포인트
     ────────────────────────────────────────────────── */
  (function initDashboard(){
    const today = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('today-label').textContent =
      `${today.getFullYear()}.${pad(today.getMonth()+1)}.${pad(today.getDate())}`;
    document.getElementById('sales-month-label').textContent =
      `${today.getFullYear()}년 ${today.getMonth()+1}월`;

    // 금액 포맷 (10억 = 1,000,000,000)
    const fmtKR = (n) => {
      if (n == null || isNaN(n)) return '—';
      if (n >= 1e8)  return (n/1e8).toFixed(n>=1e9?0:1).replace(/\.0$/,'') + '억';
      if (n >= 1e4)  return (n/1e4).toFixed(0) + '만';
      return n.toLocaleString('ko-KR');
    };
    const fmtWon = (n) => (n == null || isNaN(n)) ? '—' : n.toLocaleString('ko-KR') + '원';

    const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    const diffDays = (ymd) => {
      if (!ymd) return null;
      const d = new Date(ymd + 'T00:00:00');
      return Math.round((today - d) / 86400000);
    };

    /* ───────── ① 프로모션 (실데이터) ───────── */
    const promoList = document.getElementById('promo-list');
    promoList.innerHTML = '<div class="empty-state">불러오는 중…</div>';
    Promise.all([
      fetch('/api/promotion-state', { cache:'no-cache' }).then(r => r.ok ? r.json() : []).catch(() => []),
      fetch('/api/margin-state',    { cache:'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)
    ]).then(([promos, margin]) => {
      const rows = Array.isArray(promos) ? promos : (promos?.rows || []);
      // SKU → 상품명 매핑
      const mRows = Array.isArray(margin) ? margin : (margin?.rows || []);
      const nameOf = {};
      mRows.forEach(r => {
        const sku = r.sku || r.skuId || r.SKU;
        const nm  = r.name || r.productName || r.title;
        if (sku && nm) nameOf[String(sku)] = nm;
      });

      const upcoming = rows
        .filter(r => (r.type === '골드박스' || r.type === '타임특가') && r.date && r.date >= todayStr)
        .sort((a,b) => (a.date + (a.time||'00')).localeCompare(b.date + (b.time||'00')))
        .slice(0, 5);

      if (upcoming.length === 0) {
        promoList.innerHTML = '<div class="empty-state">예정된 골드박스·타임특가가 없습니다</div>';
        return;
      }
      promoList.innerHTML = upcoming.map(p => {
        const dd = diffDays(p.date) * -1; // 미래이므로 양수
        const cls = p.type === '골드박스' ? 'gold' : 'time';
        const ddLabel = dd === 0 ? '오늘' : `D-${dd}`;
        const urgCls = dd <= 1 ? 'urgent' : (dd <= 3 ? 'soon' : '');
        const timeLabel = (p.type === '타임특가' && p.time) ? ` ${p.time}시` : '';
        const name = nameOf[String(p.skuId)] || p.title || (p.skuId ? `SKU ${p.skuId}` : '(이름 없음)');
        return `
          <div class="promo-row">
            <span class="promo-type ${cls}">${p.type}</span>
            <span class="promo-date">${p.date.slice(5)}${timeLabel}</span>
            <span class="promo-name" title="${name.replace(/"/g,'&quot;')}">${name}</span>
            <span class="promo-dday ${urgCls}">${ddLabel}</span>
          </div>`;
      }).join('');
    }).catch(() => {
      promoList.innerHTML = '<div class="empty-state">프로모션 데이터를 불러오지 못했습니다</div>';
    });

    /* ───────── ② 신제품 (진전 없는 것만, 실데이터) ─────────
       "진전 없음" = 입고완료(arrivalDone)됐지만 로켓/윙/벤플/광고 모두 미완료 + 미등록
       기간 임계값: arrivalDate 기준 7일 이상 경과한 것만 표시 */
    const newList = document.getElementById('new-list');
    newList.innerHTML = '<div class="empty-state">불러오는 중…</div>';
    fetch('/api/new-state', { cache:'no-cache' })
      .then(r => r.ok ? r.json() : { rows:[] })
      .catch(() => ({ rows:[] }))
      .then(parsed => {
        const rows = Array.isArray(parsed) ? parsed : (parsed?.rows || []);
        const stuck = rows.map(r => {
          const name = r.realName || r.regName || '(이름 없음)';
          const anyTask = (r.rocket?.done) || (r.wing?.done) || (r.venple?.done) || (r.ad?.done);
          const noProgress = r.arrivalDone === true && !anyTask && !r.registered;
          const days = diffDays(r.arrivalDate);
          return { name, days, stuck: noProgress && days != null && days >= 7 };
        }).filter(x => x.stuck).sort((a,b) => b.days - a.days);

        if (stuck.length === 0) {
          newList.innerHTML = '<div class="empty-state">주의할 신제품이 없습니다</div>';
          return;
        }
        newList.innerHTML = stuck.slice(0, 8).map(n => {
          const critCls = n.days >= 15 ? 'critical' : '';
          return `
          <div class="new-row">
            <span class="new-name" title="${n.name.replace(/"/g,'&quot;')}">${n.name}</span>
            <span class="new-days ${critCls}">${n.days}일째</span>
          </div>`;
        }).join('');
      });

    /* ───────── ③ 판매 요약 (실데이터) ─────────
       데이터 소스: data/sales-dash.json (oa_ops.mart_sales_daily · partner_name=쿠팡)
       실매출 = sales_amount, 입고매출 = cost_amount */
    let data = []; // 차트에 쓸 6개월 시리즈 (fetch 뒤 채움)
    fetch('data/sales-dash.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(dash => {
        if (!dash) {
          ['kpi-out','kpi-in','kpi-out-ly','kpi-in-ly'].forEach(id =>
            document.getElementById(id).textContent = '—');
          return;
        }
        const k = dash.kpi || {};
        const deltaBadge = (now, ly) => {
          if (!now || !ly) return '';
          const pct = ((now - ly) / ly) * 100;
          const cls = pct > 0.5 ? 'up' : (pct < -0.5 ? 'down' : 'flat');
          const sign = pct > 0 ? '+' : '';
          return ` <span class="k-delta ${cls}">${sign}${pct.toFixed(1)}%</span>`;
        };
        document.getElementById('kpi-out').innerHTML    = fmtWon(k.sales_this) + deltaBadge(k.sales_this, k.sales_ly);
        document.getElementById('kpi-in').innerHTML     = fmtWon(k.cost_this)  + deltaBadge(k.cost_this,  k.cost_ly);
        document.getElementById('kpi-out-ly').textContent = fmtWon(k.sales_ly);
        document.getElementById('kpi-in-ly').textContent  = fmtWon(k.cost_ly);

        const trend = Array.isArray(dash.trend_6m) ? dash.trend_6m : [];
        data = trend.map(p => ({
          ym: p.ym,
          label: `${+p.ym.slice(5)}월`,
          v: Number(p.cost) || 0,
        }));
        drawChart(data);
      });

    function drawChart(data){
      if (!data || data.length < 2) return;
      const svg = document.getElementById('chart');
      const tip = document.getElementById('chart-tip');
      const wrap = svg.parentElement;
      const W = Math.max(320, Math.floor(wrap.clientWidth));
      const H = Math.max(140, Math.floor(wrap.clientHeight));
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('width', W);
      svg.setAttribute('height', H);
      const padL = 64, padR = 20, padT = 14, padB = 30;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;

      const vals = data.map(d => d.v);
      const max = Math.max(...vals);
      const min = Math.min(...vals);
      // 눈금 범위: 아래로 min*0.9, 위로 max*1.08
      const yMin = Math.max(0, Math.floor(min * 0.9 / 1e8) * 1e8);
      const yMax = Math.ceil(max * 1.08 / 1e8) * 1e8;
      const steps = 4;
      const stepV = (yMax - yMin) / steps;

      const x = i => padL + (innerW * i / (data.length - 1));
      const y = v => padT + innerH - (innerH * (v - yMin) / (yMax - yMin));

      let parts = [];
      // Y축 눈금선 + 라벨
      for (let s = 0; s <= steps; s++) {
        const v = yMin + stepV * s;
        const yy = y(v);
        parts.push(`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eee5dc" stroke-dasharray="3,3"/>`);
        parts.push(`<text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="10" fill="#7a706a" font-family="Pretendard">${fmtKR(v)}</text>`);
      }
      // X축 라벨
      data.forEach((d,i) => {
        parts.push(`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a706a" font-family="Pretendard">${d.label}</text>`);
      });
      // 라인 (부드러운 곡선)
      const path = data.map((d,i) => `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(d.v).toFixed(1)}`).join(' ');
      // 면 영역
      const area = `M ${x(0)} ${padT+innerH} L ` + data.map((d,i) => `${x(i).toFixed(1)} ${y(d.v).toFixed(1)}`).join(' L ') + ` L ${x(data.length-1)} ${padT+innerH} Z`;
      parts.push(`<path d="${area}" fill="url(#g-area)"/>`);
      parts.push(`<path d="${path}" fill="none" stroke="#8b756c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
      // 점 + hover 영역
      data.forEach((d,i) => {
        parts.push(`<circle cx="${x(i)}" cy="${y(d.v)}" r="3.2" fill="#fff" stroke="#8b756c" stroke-width="1.8"/>`);
      });
      // hover용 투명 영역
      data.forEach((d,i) => {
        const cx = x(i), cy = y(d.v);
        parts.push(`<circle class="hover-pt" data-i="${i}" cx="${cx}" cy="${cy}" r="18" fill="transparent"/>`);
      });

      svg.innerHTML = `
        <defs>
          <linearGradient id="g-area" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%"  stop-color="#aa9791" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#aa9791" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${parts.join('')}
      `;

      // hover 툴팁 (SVG 좌표 = 컨테이너 좌표, 1:1 매핑)
      svg.querySelectorAll('.hover-pt').forEach(pt => {
        pt.addEventListener('mouseenter', () => {
          const i = +pt.dataset.i;
          const d = data[i];
          tip.style.left = pt.getAttribute('cx') + 'px';
          tip.style.top  = pt.getAttribute('cy') + 'px';
          tip.innerHTML = `<div style="opacity:.75;font-weight:500">${d.ym}</div>${fmtWon(d.v)}`;
          tip.classList.add('show');
        });
        pt.addEventListener('mouseleave', () => tip.classList.remove('show'));
      });
    }

    // 리사이즈 대응
    let rT;
    window.addEventListener('resize', () => {
      clearTimeout(rT);
      rT = setTimeout(() => {
        drawChart(data);
        // 서브바가 열려 있으면 트리거 위치에 맞춰 재정렬
        if (visibleGroup) {
          const currentHash = (location.hash || '').replace('#','');
          renderSubbar(visibleGroup, currentHash);
        }
      }, 120);
    });

    // 랜딩이 보일 때 재렌더 (iframe 전환 → 홈 복귀 등)
    window.__redrawDashChart = () => drawChart(data);
  })();
</script>
