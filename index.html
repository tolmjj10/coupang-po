<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡팀 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    /* 마진테이블/po/new 와 동일한 어스톤 팔레트 */
    --bg: #fbfbfe;
    --surface: #ffffff;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --text-muted: #4d5a4c;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-light: #f2ede9;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; width: 100vw; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 12px;
  }
  /* 랜딩(메인) 화면에서는 사이드바 숨김 */
  body.landing-mode .sidebar { display: none; }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
    cursor: pointer;
    border-radius: 8px;
    transition: background .12s ease;
  }
  .brand:hover { background: var(--accent-light); }
  .brand .logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand .logo svg { width: 15px; height: 15px; stroke-width: 1.9; }
  .brand .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .nav-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 10px 12px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: background .12s ease, color .12s ease;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--accent-light); color: var(--text); }
  .nav-item.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
  }
  .nav-item svg {
    width: 17px; height: 17px;
    stroke-width: 1.75;
    flex-shrink: 0;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 10px 12px;
    font-size: 10.5px;
    color: var(--text-hint);
    letter-spacing: 0.02em;
  }

  .content {
    flex: 1;
    height: 100%;
    background: var(--bg);
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: var(--bg);
  }
  iframe.active { display: block; }

  .landing {
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: #4a3728;
  }
  .landing.active { display: flex; }
  .landing-inner {
    max-width: 760px;
    width: 100%;
    text-align: center;
  }
  .landing h2 {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.035em;
    margin: 0 0 52px;
    color: #ffffff;
  }
  .pick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    max-width: 640px;
    margin: 0 auto;
    gap: 20px;
  }
  .pick-card {
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 16px;
    padding: 22px 24px;
    cursor: pointer;
    text-align: left;
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
  }
  .pick-card:hover {
    transform: translateY(-3px);
  }
  .pick-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--accent-light);
    color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pick-icon svg { width: 22px; height: 22px; stroke-width: 1.75; }
  .pick-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  /* ─────────── 쿠팡 판매 현황 패널 ─────────── */
  .sales-panel {
    max-width: 760px;
    margin: 36px auto 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 20px 22px;
    text-align: left;
    color: #fff;
  }
  .sales-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .sales-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sales-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
  }
  .sales-tabs {
    display: inline-flex;
    gap: 2px;
    background: rgba(255,255,255,0.08);
    padding: 3px;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .sales-tab {
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: rgba(255,255,255,0.6);
    transition: background .12s, color .12s;
  }
  .sales-tab.active { background: #fff; color: #4a3728; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .kpi {
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 11px 13px;
  }
  .kpi-label {
    font-size: 10.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .kpi-value {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .kpi-sub {
    font-size: 10.5px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .spark-wrap {
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 10px 12px 6px;
    margin-bottom: 16px;
  }
  .spark-label {
    font-size: 10.5px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .spark-svg { width: 100%; height: 48px; display: block; }
  .breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .bd-title {
    font-size: 10.5px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .bd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 12.5px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .bd-row:last-child { border-bottom: 0; }
  .bd-name { font-weight: 600; }
  .bd-val { color: rgba(255,255,255,0.75); font-variant-numeric: tabular-nums; }
  .sales-err {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    padding: 10px 0;
  }

  /* ─────────── 모바일 대응 (≤ 720px) ─────────── */
  @media (max-width: 720px) {
    html, body { overflow: auto; -webkit-text-size-adjust: 100%; }
    .app { flex-direction: column; height: auto; min-height: 100vh; width: 100%; }

    /* 사이드바 → 상단 가로 스크롤 바 */
    .sidebar {
      width: 100%;
      flex-direction: row;
      align-items: center;
      padding: 8px 10px;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 6px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .sidebar .brand {
      padding: 4px 10px;
      margin-bottom: 0;
      border-bottom: 0;
      flex-shrink: 0;
      gap: 8px;
    }
    .sidebar .brand .title { font-size: 13px; }
    .sidebar .brand .logo { width: 22px; height: 22px; }
    .sidebar .brand .logo svg { width: 13px; height: 13px; }
    .nav-label { display: none; }
    .nav-item {
      flex-shrink: 0;
      padding: 7px 12px;
      font-size: 12.5px;
      margin-bottom: 0;
      white-space: nowrap;
      gap: 6px;
    }
    .nav-item svg { width: 14px; height: 14px; }
    .sidebar-footer { display: none; }

    /* 랜딩 화면 — 세로 스택 */
    .content { height: auto; min-height: calc(100vh - 50px); }
    .landing { padding: 32px 20px 40px; align-items: flex-start; }
    .landing-inner { max-width: 100%; }
    .landing h2 {
      font-size: 26px;
      margin: 8px 0 28px;
      letter-spacing: -0.03em;
    }
    .pick-grid {
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 100%;
    }
    .pick-card {
      padding: 16px 18px;
      gap: 14px;
      border-radius: 14px;
    }
    .pick-card:hover { transform: none; }
    .pick-card:active { transform: scale(0.98); }
    .pick-icon { width: 38px; height: 38px; border-radius: 11px; }
    .pick-icon svg { width: 20px; height: 20px; }
    .pick-title { font-size: 15px; }

    .sales-panel { margin-top: 24px; padding: 16px 14px; border-radius: 14px; }
    .kpi-grid { gap: 8px; }
    .kpi { padding: 9px 10px; }
    .kpi-value { font-size: 16px; }
    .breakdown { grid-template-columns: 1fr; gap: 10px; }

    /* 서브 페이지 iframe — 뷰포트 남은 높이 채움 */
    iframe { height: calc(100vh - 50px); }

    /* 랜딩 모드에서는 사이드바 계속 숨김 (원래 동작 유지) */
    body.landing-mode .sidebar { display: none; }
  }

  /* 아주 작은 폰 (≤ 380px) — 폰트 한 단계 더 축소 */
  @media (max-width: 380px) {
    .landing h2 { font-size: 22px; margin-bottom: 22px; }
    .pick-card { padding: 14px 16px; }
    .pick-title { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand" id="brand-home" title="첫 화면">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </div>
      <span class="title">쿠팡팀 업무 허브</span>
    </div>

    <div class="nav-label">Workspace</div>

    <div class="nav-item" data-target="margin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
        <line x1="8" y1="3" x2="8" y2="21"/>
      </svg>
      <span>마진테이블</span>
    </div>

    <div class="nav-item" data-target="order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span>발주</span>
    </div>

    <div class="nav-item" data-target="promotion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>프로모션</span>
    </div>

    <div class="nav-item" data-target="new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 5.8L20 10.5l-4.7 3.9L16.9 21 12 17.6 7.1 21l1.6-6.6L4 10.5l6.1-1.7L12 3z"/>
      </svg>
      <span>신제품</span>
    </div>

    <div class="nav-item" data-target="price">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span>판매가 확인</span>
    </div>

    <div class="sidebar-footer">v1.0</div>
  </aside>

  <main class="content">
    <div id="landing" class="landing">
      <div class="landing-inner">
        <h2>쿠팡팀 업무 허브</h2>
        <div class="pick-grid">
          <div class="pick-card" data-target="margin">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
                <line x1="8" y1="3" x2="8" y2="21"/>
              </svg>
            </div>
            <div class="pick-title">마진테이블</div>
          </div>
          <div class="pick-card" data-target="order">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <div class="pick-title">발주</div>
          </div>
          <div class="pick-card" data-target="promotion">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </div>
            <div class="pick-title">프로모션</div>
          </div>
          <div class="pick-card" data-target="new">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.9 5.8L20 10.5l-4.7 3.9L16.9 21 12 17.6 7.1 21l1.6-6.6L4 10.5l6.1-1.7L12 3z"/>
              </svg>
            </div>
            <div class="pick-title">신제품</div>
          </div>
          <div class="pick-card" data-target="price">
            <div class="pick-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
            </div>
            <div class="pick-title">판매가 확인</div>
          </div>
        </div>

        <section class="sales-panel" id="sales-panel" aria-label="쿠팡 판매 현황">
          <div class="sales-head">
            <div class="sales-title">쿠팡 판매 현황</div>
            <div class="sales-meta" id="sales-meta">로딩…</div>
          </div>
          <div class="sales-tabs" role="tablist">
            <div class="sales-tab" data-days="7" role="tab">7일</div>
            <div class="sales-tab active" data-days="14" role="tab">14일</div>
            <div class="sales-tab" data-days="30" role="tab">30일</div>
          </div>
          <div class="kpi-grid">
            <div class="kpi"><div class="kpi-label">판매수량</div><div class="kpi-value" id="kpi-qty">—</div></div>
            <div class="kpi"><div class="kpi-label">매출</div><div class="kpi-value" id="kpi-amt">—</div></div>
            <div class="kpi"><div class="kpi-label">마진</div><div class="kpi-value" id="kpi-mgn">—</div><div class="kpi-sub" id="kpi-mgnrate">—</div></div>
          </div>
          <div class="spark-wrap">
            <div class="spark-label">일자별 매출 추이</div>
            <svg class="spark-svg" id="spark" viewBox="0 0 600 48" preserveAspectRatio="none"></svg>
          </div>
          <div class="breakdown">
            <div>
              <div class="bd-title">브랜드 (30일)</div>
              <div id="bd-brand"></div>
            </div>
            <div>
              <div class="bd-title">카테고리 Top (30일)</div>
              <div id="bd-cat"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <iframe id="frame-order" data-src="po.html"></iframe>
    <iframe id="frame-new" data-src="newproduct/new.html"></iframe>
    <iframe id="frame-margin" data-src="margin.html"></iframe>
    <iframe id="frame-promotion" data-src="promotion/promotion.html"></iframe>
    <iframe id="frame-price" data-src="price.html"></iframe>
  </main>
</div>

<script>
  const items = document.querySelectorAll('.nav-item');
  const landing = document.getElementById('landing');
  const frames = {
    order:     document.getElementById('frame-order'),
    new:       document.getElementById('frame-new'),
    margin:    document.getElementById('frame-margin'),
    promotion: document.getElementById('frame-promotion'),
    price:     document.getElementById('frame-price')
  };

  function ensureLoaded(target) {
    const f = frames[target];
    if (!f) return;
    if (!f.src && f.dataset.src) f.src = f.dataset.src;
  }

  function showTarget(target) {
    items.forEach(i => i.classList.toggle('active', i.dataset.target === target));
    if (target) ensureLoaded(target);
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === target));
    landing.classList.toggle('active', !target);
    // 랜딩 화면에서는 사이드바 숨김
    document.body.classList.toggle('landing-mode', !target);
    try { history.replaceState(null, '', target ? '#' + target : location.pathname); } catch(e) {}
  }

  items.forEach(el => {
    el.addEventListener('click', () => showTarget(el.dataset.target));
  });
  document.querySelectorAll('.pick-card').forEach(el => {
    el.addEventListener('click', () => showTarget(el.dataset.target));
  });
  document.getElementById('brand-home').addEventListener('click', () => showTarget(null));

  const hash = (location.hash || '').replace('#','');
  showTarget(frames[hash] ? hash : null);

  // 랜딩 진입 후, 아이들 상태에서 나머지 프레임을 백그라운드로 미리 로드해 다음 클릭 시 즉시 표시
  window.addEventListener('load', () => {
    const preload = () => {
      ensureLoaded('order');
      setTimeout(() => ensureLoaded('margin'), 300);
      setTimeout(() => ensureLoaded('new'), 600);
      setTimeout(() => ensureLoaded('promotion'), 900);
      setTimeout(() => ensureLoaded('price'), 1200);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
    else setTimeout(preload, 400);
  });

  // ─────────── 쿠팡 판매 현황 ───────────
  (function () {
    const metaEl = document.getElementById('sales-meta');
    const qEl = document.getElementById('kpi-qty');
    const aEl = document.getElementById('kpi-amt');
    const mEl = document.getElementById('kpi-mgn');
    const mrEl = document.getElementById('kpi-mgnrate');
    const sparkEl = document.getElementById('spark');
    const brandEl = document.getElementById('bd-brand');
    const catEl = document.getElementById('bd-cat');
    const tabs = document.querySelectorAll('.sales-tab');
    let data = null;

    const fmtInt = n => n.toLocaleString('ko-KR');
    const fmtWon = n => {
      const abs = Math.abs(n);
      if (abs >= 1e8) return (n/1e8).toFixed(abs >= 1e9 ? 1 : 2).replace(/\.0+$/,'') + '억';
      if (abs >= 1e4) return (n/1e4).toFixed(0) + '만';
      return fmtInt(n) + '원';
    };

    function sumRange(days) {
      const arr = data.daily.slice(-days);
      return arr.reduce((acc, r) => ({ q: acc.q + r.q, a: acc.a + r.a, m: acc.m + r.m }), { q: 0, a: 0, m: 0 });
    }

    function renderKpi(days) {
      const s = sumRange(days);
      qEl.textContent = fmtInt(s.q) + '개';
      aEl.textContent = fmtWon(s.a);
      mEl.textContent = fmtWon(s.m);
      mrEl.textContent = s.a > 0 ? '마진율 ' + (s.m / s.a * 100).toFixed(1) + '%' : '—';
    }

    function renderSpark() {
      const arr = data.daily.slice(-30);
      const W = 600, H = 48, P = 2;
      const vals = arr.map(r => r.a);
      const min = Math.min(0, ...vals), max = Math.max(...vals, 1);
      const span = (max - min) || 1;
      const step = (W - P*2) / Math.max(arr.length - 1, 1);
      const pts = arr.map((r, i) => {
        const x = P + i * step;
        const y = H - P - ((r.a - min) / span) * (H - P*2);
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      const path = 'M ' + pts.join(' L ');
      const areaPath = path + ` L ${W-P},${H-P} L ${P},${H-P} Z`;
      sparkEl.innerHTML =
        `<path d="${areaPath}" fill="rgba(255,255,255,0.12)" stroke="none"/>` +
        `<path d="${path}" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>`;
    }

    function renderBreakdown() {
      brandEl.innerHTML = data.brands_30d.map(b =>
        `<div class="bd-row"><span class="bd-name">${b.name}</span><span class="bd-val">${fmtWon(b.a)}</span></div>`
      ).join('');
      catEl.innerHTML = data.categories_30d.slice(0, 5).map(c =>
        `<div class="bd-row"><span class="bd-name">${c.name}</span><span class="bd-val">${fmtWon(c.a)}</span></div>`
      ).join('');
    }

    function setActive(days) {
      tabs.forEach(t => t.classList.toggle('active', Number(t.dataset.days) === days));
      renderKpi(days);
    }

    fetch('/data/sales-coupang.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        data = j;
        metaEl.textContent = `업데이트 ${j.updated_at}`;
        setActive(14);
        renderSpark();
        renderBreakdown();
        tabs.forEach(t => t.addEventListener('click', () => setActive(Number(t.dataset.days))));
      })
      .catch(err => {
        metaEl.textContent = '데이터 없음';
        document.getElementById('sales-panel').innerHTML =
          '<div class="sales-title">쿠팡 판매 현황</div>' +
          '<div class="sales-err">판매 데이터를 불러오지 못했습니다 (' + err + ')</div>';
      });
  })();
</script>

</body>
</html>
