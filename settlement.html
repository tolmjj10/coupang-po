<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe; --surface: #ffffff;
    --border: #ebe6df; --border-strong: #d9d1c8;
    --text: #2a1a15; --text-hint: #7a706a;
    --accent: #aa9791; --accent-dark: #8b756c; --accent-light: #f2ede9;
    --neg: #b05858; --ok: #6e8a6a;
    --cpc: #8b756c;         /* 광고비 색 (어스브라운) */
    --coupon: #c4875c;      /* 쿠폰 색 (테라코타) */
  }
  html, body { height: 100%; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  .wrap { max-width: 1720px; margin: 0 auto; width: 100%; box-sizing: border-box;
          padding: 20px 24px 22px; min-height: 100vh; }

  header.page { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.024em; margin: 0; color: var(--text); line-height: 1.15; }
  .map-info { font-size: 11.5px; color: var(--text-hint); }
  .map-info .ok { color: var(--ok); font-weight: 700; }
  .map-info .bad { color: var(--neg); font-weight: 700; }

  /* 드롭존 */
  .drops {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin-bottom: 18px;
  }
  .drop {
    background: var(--surface);
    border: 1.5px dashed var(--border-strong);
    border-radius: 14px;
    padding: 22px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .drop:hover { border-color: var(--accent); background: #fdfbf9; }
  .drop.dragover { border-color: var(--accent-dark); background: var(--accent-light); }
  .drop.loaded { border-style: solid; border-color: var(--accent); background: #fdfbf9; }
  .drop.cpc.loaded    { border-color: var(--cpc); }
  .drop.coupon.loaded { border-color: var(--coupon); }
  .drop-tag {
    position: absolute; top: 10px; left: 14px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    padding: 2px 8px; border-radius: 10px;
    background: var(--accent-light); color: var(--accent-dark);
  }
  .drop.cpc .drop-tag    { background: #e8e1dc; color: var(--cpc); }
  .drop.coupon .drop-tag { background: #f3e2d2; color: var(--coupon); }
  .drop-title { font-size: 14px; font-weight: 700; margin-top: 6px; }
  .drop-hint  { font-size: 11.5px; color: var(--text-hint); margin-top: 4px; }
  .drop-file  { font-size: 12px; font-weight: 600; color: var(--accent-dark); margin-top: 8px; word-break: break-all; }
  input[type="file"] { display: none; }

  /* 결과 테이블 */
  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    min-height: 320px;
  }
  .result-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .result-head .title { font-size: 14px; font-weight: 700; }
  .result-head .sub { font-size: 11.5px; color: var(--text-hint); }
  .result-head .btn-reload {
    margin-left: auto;
    font: 600 11.5px 'Pretendard',sans-serif; letter-spacing: -0.01em;
    padding: 5px 11px; border-radius: 6px;
    background: #fff; border: 1px solid var(--border-strong);
    color: var(--text-hint); cursor: pointer;
  }
  .result-head .btn-reload:hover { color: var(--text); border-color: var(--accent); }

  table.cat {
    width: 100%; border-collapse: collapse;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  table.cat th {
    background: #faf7f3; font-weight: 700; font-size: 11.5px;
    color: var(--text-hint); padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    text-align: right; letter-spacing: 0.02em;
  }
  table.cat th.left { text-align: left; }
  table.cat td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    text-align: right; white-space: nowrap;
  }
  table.cat td.left { text-align: left; font-weight: 600; }
  table.cat tr.brand td.left { color: var(--cpc); font-weight: 700; }
  table.cat tr.sum td { font-weight: 700; background: #fdfbf9; }
  table.cat td.cpc    { color: var(--cpc); font-weight: 600; }
  table.cat td.coupon { color: var(--coupon); font-weight: 600; }
  table.cat td.total  { font-weight: 700; }
  table.cat .bar {
    display: inline-block; vertical-align: middle;
    height: 6px; border-radius: 3px; background: var(--accent-light);
    position: relative; width: 100px; margin-left: 8px;
  }
  table.cat .bar > span {
    position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
    background: var(--cpc);
  }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px; color: var(--text-hint); font-size: 13px; text-align: center;
    gap: 8px;
  }
  .empty svg { width: 36px; height: 36px; opacity: 0.4; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>정산</h1>
    <div class="map-info" id="map-info">매핑 로드 중…</div>
  </header>

  <div class="drops">
    <div class="drop cpc" id="drop-cpc">
      <div class="drop-tag">파일 1 · CPC 광고비</div>
      <div class="drop-title">광고 정산 엑셀</div>
      <div class="drop-hint">pa_total_campaign…xlsx</div>
      <div class="drop-file" id="file-cpc" hidden></div>
      <input type="file" accept=".xlsx,.xls" />
    </div>
    <div class="drop coupon" id="drop-coupon">
      <div class="drop-tag">파일 2 · 쿠폰비</div>
      <div class="drop-title">쿠폰 정산 엑셀</div>
      <div class="drop-hint">Coupang_Stocked_Data_List…xlsx</div>
      <div class="drop-file" id="file-coupon" hidden></div>
      <input type="file" accept=".xlsx,.xls" />
    </div>
  </div>

  <div class="result-box" id="result">
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
      </svg>
      <div>CPC·쿠폰 두 파일을 모두 업로드하면 카테고리별 집계가 표시됩니다.</div>
    </div>
  </div>
</div>

<script>
/* ─────────── 유틸 ─────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtWon = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('ko-KR');

/* ─────────── 상태 ─────────── */
let maps = null;             // { viid2sku: {viid: {sku, brand}}, sku2cat: {sku: {cat, name}} }
let cpcData = null;          // [{camp_id, viid, cost, camp_name}]
let couponData = null;       // [{sku, amount}]

/* ─────────── 매핑 로드 ─────────── */
async function loadMaps() {
  const info = document.getElementById('map-info');
  try {
    const res = await fetch('/api/settlement-maps', { cache: 'no-cache' });
    const data = await res.json();
    if (!data || !data.viid2sku || !data.sku2cat) {
      info.innerHTML = '<span class="bad">매핑 미설정</span> — 관리자가 /api/settlement-maps에 매핑을 올려야 합니다';
      maps = null;
      return;
    }
    maps = data;
    info.innerHTML = `<span class="ok">매핑 로드됨</span> · VIID→SKU ${Object.keys(maps.viid2sku).length.toLocaleString()}개 · SKU→카테 ${Object.keys(maps.sku2cat).length.toLocaleString()}개 · 갱신 ${esc(maps.updated_at || '')}`;
  } catch (e) {
    info.innerHTML = '<span class="bad">매핑 로드 실패</span>';
  }
}

/* ─────────── 분류 룰 ─────────── */
function classify(sku, brand, campName) {
  const b = (brand || '').trim();
  const nameHint = sku && maps.sku2cat[sku] ? (maps.sku2cat[sku].name || '') : '';
  const text = `${campName || ''} ${nameHint}`;
  if (b === '삼대오백' || text.includes('삼대오백') || text.includes('뉴트리커먼')) return '삼대오백';
  if (text.includes('온살') || text.includes('루메어카이브') || text.includes('루메아카이브')) return '온살';
  if (sku && maps.sku2cat[sku] && (b === '오아' || b === '보아르' || nameHint.startsWith('오아') || nameHint.startsWith('보아르'))) {
    return maps.sku2cat[sku].cat;
  }
  if (campName && (campName.includes('오아') || campName.includes('[오아]'))) return '오아 미매칭';
  if (campName && campName.includes('보아르')) return '보아르 미매칭';
  return '기타';
}

/* ─────────── 엑셀 파싱 ─────────── */
function parseCPC(wb) {
  // pa_total_campaign 구조: col 4=캠페인 ID, 5=캠페인명, 8=광고집행 옵션ID(VIID), 15=광고비
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const rows = [];
  for (let i = 1; i < aoa.length; i++) {  // skip header
    const r = aoa[i];
    const campId = r[3];
    const campName = r[4];
    const viid = r[7];
    const cost = Number(r[14]);
    if (!campId || !cost) continue;
    rows.push({
      camp_id: String(campId).replace(/\.0$/,'').trim(),
      camp_name: String(campName || '').trim(),
      viid: viid ? String(viid).replace(/\.0$/,'').trim() : '',
      cost,
    });
  }
  return rows;
}

function parseCoupon(wb) {
  // Coupang_Stocked_Data_List 구조: col 3=SKU번호, col 12=총단가
  // 헤더 행: '구분','번호','SKU번호','SKU명','입고/반출시각','물류센터','세금타입','수량','단가','공급가액','세액','총단가',...
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const rows = [];
  // 1열(col 0) 구분이 있는 행만 (헤더 이후)
  for (let i = 1; i < aoa.length; i++) {
    const r = aoa[i];
    const gubun = r[0];                                  // '발주' / '반출'
    const sku = r[2];
    const totalUnit = r[11];                             // 총단가
    if (!sku) continue;
    const amount = Number(String(totalUnit).replace(/,/g,''));
    if (!amount) continue;
    const sign = gubun === '반출' ? -1 : 1;
    rows.push({ sku: String(sku).trim(), amount: amount * sign });
  }
  return rows;
}

/* ─────────── 집계 ─────────── */
function aggregate() {
  if (!maps || !cpcData || !couponData) return;

  // 카테고리별 집계
  const byCat = {}; // cat → { cpc, coupon }
  const bump = (cat, key, val) => {
    if (!byCat[cat]) byCat[cat] = { cpc: 0, coupon: 0 };
    byCat[cat][key] += val;
  };

  // CPC: 캠페인→VIID→SKU→카테
  let cpcMatched = 0, cpcUnmatched = 0;
  for (const row of cpcData) {
    const mapped = row.viid && maps.viid2sku[row.viid];
    const sku = mapped ? mapped.sku : '';
    const brand = mapped ? mapped.brand : '';
    const cat = classify(sku, brand, row.camp_name);
    bump(cat, 'cpc', row.cost);
    if (cat === '기타') cpcUnmatched++; else cpcMatched++;
  }

  // 쿠폰: SKU→카테 (VIID 안 거침)
  let cpnMatched = 0, cpnUnmatched = 0;
  for (const row of couponData) {
    const skuMeta = maps.sku2cat[row.sku];
    let cat;
    if (skuMeta) {
      const nm = skuMeta.name || '';
      if (nm.includes('삼대오백') || nm.includes('뉴트리커먼')) cat = '삼대오백';
      else if (nm.includes('온살') || nm.includes('루메어카이브') || nm.includes('루메아카이브')) cat = '온살';
      else if (nm.startsWith('오아') || nm.startsWith('보아르')) cat = skuMeta.cat;
      else cat = skuMeta.cat || '기타';
      cpnMatched++;
    } else {
      cat = '기타';
      cpnUnmatched++;
    }
    bump(cat, 'coupon', row.amount);
  }

  render(byCat, { cpcMatched, cpcUnmatched, cpnMatched, cpnUnmatched });
}

/* ─────────── 렌더 ─────────── */
function render(byCat, stats) {
  const cats = Object.entries(byCat);
  const totalCpc = cats.reduce((s,[,v]) => s + v.cpc, 0);
  const totalCpn = cats.reduce((s,[,v]) => s + v.coupon, 0);
  const totalAll = totalCpc + totalCpn;

  // 정렬: 합계 내림차순. '기타'는 맨 아래
  const sorted = cats.sort((a,b) => {
    if (a[0] === '기타') return 1;
    if (b[0] === '기타') return -1;
    return (b[1].cpc + b[1].coupon) - (a[1].cpc + a[1].coupon);
  });

  const maxTotal = Math.max(1, ...sorted.map(([,v]) => v.cpc + v.coupon));
  const rows = sorted.map(([cat, v]) => {
    const sum = v.cpc + v.coupon;
    const pct = (sum / totalAll * 100).toFixed(1);
    const barPct = Math.max(2, Math.round(sum / maxTotal * 100));
    const isBrand = (cat === '삼대오백' || cat === '온살');
    return `
      <tr class="${isBrand ? 'brand' : ''}">
        <td class="left">${esc(cat)}</td>
        <td class="cpc">${fmtWon(v.cpc)}</td>
        <td class="coupon">${fmtWon(v.coupon)}</td>
        <td class="total">${fmtWon(sum)}</td>
        <td style="text-align:left; color: var(--text-hint); font-weight:500;">
          ${pct}%
          <span class="bar"><span style="width:${barPct}%"></span></span>
        </td>
      </tr>`;
  }).join('');

  const sumRow = `
    <tr class="sum">
      <td class="left">합계</td>
      <td class="cpc">${fmtWon(totalCpc)}</td>
      <td class="coupon">${fmtWon(totalCpn)}</td>
      <td class="total">${fmtWon(totalAll)}</td>
      <td></td>
    </tr>`;

  document.getElementById('result').innerHTML = `
    <div class="result-head">
      <div class="title">카테고리별 집계</div>
      <div class="sub">
        CPC 레코드 ${(stats.cpcMatched + stats.cpcUnmatched).toLocaleString()}건
        · 쿠폰 레코드 ${(stats.cpnMatched + stats.cpnUnmatched).toLocaleString()}건
        ${stats.cpcUnmatched + stats.cpnUnmatched ? ` · <span style="color:var(--neg);font-weight:600;">미매칭 ${stats.cpcUnmatched + stats.cpnUnmatched}건</span>` : ''}
      </div>
      <button class="btn-reload" onclick="window.location.reload()">초기화</button>
    </div>
    <table class="cat">
      <thead>
        <tr>
          <th class="left">카테고리</th>
          <th>CPC 광고비</th>
          <th>쿠폰비</th>
          <th>합계</th>
          <th class="left" style="padding-left:16px;">비중</th>
        </tr>
      </thead>
      <tbody>${rows}${sumRow}</tbody>
    </table>
  `;
}

/* ─────────── 드롭존 핸들러 ─────────── */
function setupDrop(id, kind) {
  const zone = document.getElementById(id);
  const input = zone.querySelector('input[type="file"]');
  const label = zone.querySelector('.drop-file');
  const title = zone.querySelector('.drop-title');
  const hint = zone.querySelector('.drop-hint');

  const handle = (file) => {
    if (!file) return;
    label.textContent = file.name;
    label.hidden = false;
    zone.classList.add('loaded');
    title.hidden = true; hint.hidden = true;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        if (kind === 'cpc') cpcData = parseCPC(wb);
        else couponData = parseCoupon(wb);
        aggregate();
      } catch (err) {
        label.textContent = '파싱 오류: ' + err.message;
        label.style.color = 'var(--neg)';
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', e => handle(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover');
  }));
  zone.addEventListener('drop', e => handle(e.dataTransfer.files[0]));
}

setupDrop('drop-cpc', 'cpc');
setupDrop('drop-coupon', 'coupon');
window.addEventListener('dragover', e => { if (!e.target.closest('.drop')) e.preventDefault(); });
window.addEventListener('drop',     e => { if (!e.target.closest('.drop')) e.preventDefault(); });

loadMaps();
</script>
</body>
</html>
