<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe; --surface: #ffffff;
    --border: #ebe6df; --border-strong: #d9d1c8;
    --text: #2a1a15; --text-hint: #7a706a;
    --accent: #aa9791; --accent-dark: #8b756c; --accent-light: #f2ede9;
    --neg: #b05858; --ok: #6e8a6a;
    --cpc: #8b756c;         /* 광고비 색 (어스브라운) */
    --coupon: #c4875c;      /* 쿠폰 색 (테라코타) */
    --sales: #6e8a6a;       /* 매출 색 (올리브) */
    --profit: #556b7a;      /* 순수익 색 (스틸블루) */
  }
  html, body { height: 100%; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  .wrap { max-width: 1720px; margin: 0 auto; width: 100%; box-sizing: border-box;
          padding: 12px 24px 14px; min-height: 100vh; }

  header.page { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.024em; margin: 0; color: var(--text); line-height: 1.15; }
  .map-info { font-size: 11.5px; color: var(--text-hint); }
  .map-info .ok { color: var(--ok); font-weight: 700; }
  .map-info .bad { color: var(--neg); font-weight: 700; }

  /* 드롭존 */
  .drops {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    margin-bottom: 12px;
  }
  .drop {
    background: var(--surface);
    border: 1.5px dashed var(--border-strong);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .drop:hover { border-color: var(--accent); background: #fdfbf9; }
  .drop.dragover { border-color: var(--accent-dark); background: var(--accent-light); }
  .drop.loaded { border-style: solid; border-color: var(--accent); background: #fdfbf9; }
  .drop.cpc.loaded    { border-color: var(--cpc); }
  .drop.coupon.loaded { border-color: var(--coupon); }
  .drop-tag {
    position: absolute; top: 10px; left: 14px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    padding: 2px 8px; border-radius: 10px;
    background: var(--accent-light); color: var(--accent-dark);
  }
  .drop.cpc .drop-tag    { background: #e8e1dc; color: var(--cpc); }
  .drop.coupon .drop-tag { background: #f3e2d2; color: var(--coupon); }
  .drop.sales .drop-tag  { background: #e0e8df; color: var(--sales); }
  .drop.sales.loaded     { border-color: var(--sales); }
  .drop-title { font-size: 14px; font-weight: 700; margin-top: 6px; }
  .drop-hint  { font-size: 11.5px; color: var(--text-hint); margin-top: 4px; }
  .drop-file  { font-size: 12px; font-weight: 600; color: var(--accent-dark); margin-top: 8px; word-break: break-all; }
  input[type="file"] { display: none; }

  /* 결과 테이블 */
  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
  }
  .result-box#result { min-height: 0; }
  .result-box#result:empty { display: none; }
  .result-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .result-head .title { font-size: 14px; font-weight: 700; }
  .result-head .sub { font-size: 11.5px; color: var(--text-hint); }
  .result-head .btn-reload {
    margin-left: auto;
    font: 600 11.5px 'Pretendard',sans-serif; letter-spacing: -0.01em;
    padding: 5px 11px; border-radius: 6px;
    background: #fff; border: 1px solid var(--border-strong);
    color: var(--text-hint); cursor: pointer;
  }
  .result-head .btn-reload:hover { color: var(--text); border-color: var(--accent); }

  table.cat {
    width: 100%; border-collapse: collapse;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  table.cat th {
    background: #faf7f3; font-weight: 700; font-size: 11.5px;
    color: var(--text-hint); padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    text-align: right; letter-spacing: 0.02em;
  }
  table.cat th.left { text-align: left; }
  table.cat td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    text-align: right; white-space: nowrap;
  }
  table.cat td.left { text-align: left; font-weight: 600; }
  table.cat tr.brand td.left { color: var(--cpc); font-weight: 700; }
  table.cat tr.sum td { font-weight: 700; background: #fdfbf9; }
  table.cat td.cpc    { color: var(--cpc); font-weight: 600; }
  table.cat td.coupon { color: var(--coupon); font-weight: 600; }
  table.cat td.total  { font-weight: 700; }
  table.cat .bar {
    display: inline-block; vertical-align: middle;
    height: 6px; border-radius: 3px; background: var(--accent-light);
    position: relative; width: 100px; margin-left: 8px;
  }
  table.cat .bar > span {
    position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
    background: var(--cpc);
  }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px; color: var(--text-hint); font-size: 13px; text-align: center;
    gap: 8px;
  }
  .empty svg { width: 36px; height: 36px; opacity: 0.4; }

  /* SKU 상세 테이블 */
  #result-sku { margin-top: 14px; }
  table.sku {
    width: 100%; border-collapse: collapse;
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  table.sku th {
    position: sticky; top: 0; z-index: 1;
    background: #faf7f3; font-weight: 700; font-size: 11px;
    color: var(--text-hint); padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: right; letter-spacing: 0.02em;
  }
  table.sku th.left { text-align: left; }
  table.sku td {
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    text-align: right; white-space: nowrap;
  }
  table.sku td.left { text-align: left; }
  table.sku td.name { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  table.sku td.neg { color: var(--neg); }
  table.sku td.pos { color: var(--ok); }
  table.sku tr.group td {
    background: var(--accent-light); color: var(--accent-dark);
    font-weight: 700; font-size: 11.5px; letter-spacing: 0.02em;
    padding: 6px 10px; text-align: left;
    cursor: pointer; user-select: none;
  }
  table.sku tr.group td:hover { background: #e9e2db; }
  table.sku tr.group .m { color: var(--text-hint); font-weight: 500; margin-left: 10px; }
  table.sku tr.group .caret { display: inline-block; width: 10px; margin-right: 4px; transition: transform .15s; }
  table.sku tr.group.collapsed .caret { transform: rotate(-90deg); }
  table.sku tr.subsum td {
    font-weight: 700; background: #fdfbf9;
    border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong);
  }
  table.sku td.cpc    { color: var(--cpc); }
  table.sku td.coupon { color: var(--coupon); }
  table.sku td.gmv    { color: var(--sales); font-weight: 600; }
  table.sku td.profit { color: var(--profit); font-weight: 700; }
  table.sku td.profit.neg { color: var(--neg); }

  /* 툴바 (검색/필터) */
  .sku-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 4px 0 12px;
  }
  .sku-toolbar .chips {
    display: flex; gap: 6px; flex-wrap: wrap; flex: 1;
  }
  .chip {
    font: 600 11.5px 'Pretendard',sans-serif; letter-spacing: -0.01em;
    padding: 5px 11px; border-radius: 999px;
    background: #fff; border: 1px solid var(--border-strong);
    color: var(--text-hint); cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active {
    background: var(--text); color: #fff; border-color: var(--text);
  }
  .search-wrap {
    position: relative; min-width: 220px;
    margin-left: auto;
  }
  .search-wrap input {
    width: 100%; padding: 7px 32px 7px 32px;
    font: 500 12.5px 'Pretendard',sans-serif;
    border: 1px solid var(--border-strong); border-radius: 8px;
    background: #fff; color: var(--text);
    outline: none; transition: border-color .12s;
  }
  .search-wrap input:focus { border-color: var(--accent-dark); }
  .search-wrap .icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; opacity: 0.5; pointer-events: none;
  }
  .search-wrap .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; border: none; background: transparent;
    color: var(--text-hint); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .btn-reset-data {
    font: 500 11px 'Pretendard',sans-serif;
    padding: 4px 9px; border-radius: 6px;
    background: #fff; border: 1px solid var(--border);
    color: var(--text-hint); cursor: pointer;
  }
  .btn-reset-data:hover { color: var(--neg); border-color: var(--neg); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>정산</h1>
    <div class="map-info" id="map-info">매핑 로드 중…</div>
  </header>

  <div class="drops">
    <div class="drop cpc" id="drop-cpc">
      <div class="drop-tag">파일 1 · CPC 광고비</div>
      <div class="drop-title">광고 정산 엑셀</div>
      <div class="drop-hint">A00065399-dailySettlement-…xlsx</div>
      <div class="drop-file" id="file-cpc" hidden></div>
      <input type="file" accept=".xlsx,.xls" />
    </div>
    <div class="drop coupon" id="drop-coupon">
      <div class="drop-tag">파일 2 · 쿠폰비</div>
      <div class="drop-title">쿠폰 정산 파일</div>
      <div class="drop-hint">coupon_YYYY_MM_DD (N).xls</div>
      <div class="drop-file" id="file-coupon" hidden></div>
      <input type="file" accept=".xlsx,.xls" />
    </div>
    <div class="drop sales" id="drop-sales">
      <div class="drop-tag">파일 3 · 매출/원가</div>
      <div class="drop-title">SALES_ANALYSIS (월치)</div>
      <div class="drop-hint">A00065399_SALES_ANALYSIS…csv</div>
      <div class="drop-file" id="file-sales" hidden></div>
      <input type="file" accept=".csv" />
    </div>
  </div>

  <div class="result-box" id="result">
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
      </svg>
      <div>CPC·쿠폰을 올리면 카테고리별 집계가 뜨고, SALES_ANALYSIS도 올리면 SKU별 순수익이 추가로 표시됩니다.</div>
    </div>
  </div>
  <div class="result-box" id="result-sku" hidden></div>
</div>

<script>
/* ─────────── 유틸 ─────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtWon = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('ko-KR');

/* ─────────── 상태 ─────────── */
let maps = null;             // { viid2sku, sku2cat, camp2viid, camp_name, camp_viid_cost }
let marginMap = null;        // { sku: {cost, origin, price, name, cat} }  (/api/margin-state)
let cpcData = null;          // [{camp_id, cost, camp_name}]  (청구 소진 광고비 기준)
let couponData = null;       // [{sku, amount}]  (|펀딩금액|)
let salesData = null;        // { sku: {qty, name, brand} }  (SALES_ANALYSIS 월치, col 28 벤더아이템ID 수량)
let currentBySku = null;     // 집계된 SKU 상세 (필터링 재렌더용)
let filterCat = '';          // '' = 전체
let filterSearch = '';

/* ─────────── localStorage ─────────── */
const LS = {
  cpc: 'settle_cpc', cpcName: 'settle_cpc_name',
  coupon: 'settle_coupon', couponName: 'settle_coupon_name',
  sales: 'settle_sales', salesName: 'settle_sales_name',
};
function lsSave(key, val) {
  try { localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val)); }
  catch (e) { console.warn('localStorage save fail:', e); }
}
function lsLoad(key, parse = true) {
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  if (!parse) return raw;
  try { return JSON.parse(raw); } catch { return null; }
}
function lsClearAll() {
  for (const k of Object.values(LS)) localStorage.removeItem(k);
}

function restoreFromLs() {
  cpcData = lsLoad(LS.cpc);
  couponData = lsLoad(LS.coupon);
  salesData = lsLoad(LS.sales);
  // 드롭존 라벨 복원
  for (const [kind, nameKey] of [['cpc', LS.cpcName], ['coupon', LS.couponName], ['sales', LS.salesName]]) {
    const name = lsLoad(nameKey, false);
    const data = kind === 'cpc' ? cpcData : kind === 'coupon' ? couponData : salesData;
    if (name && data) {
      const zone = document.getElementById(`drop-${kind}`);
      const label = zone.querySelector('.drop-file');
      const title = zone.querySelector('.drop-title');
      const hint = zone.querySelector('.drop-hint');
      label.textContent = name + ' · 저장됨';
      label.hidden = false;
      title.hidden = true; hint.hidden = true;
      zone.classList.add('loaded');
    }
  }
}

/* ─────────── 매핑 로드 ─────────── */
async function loadMaps() {
  const info = document.getElementById('map-info');
  try {
    const res = await fetch('/api/settlement-maps', { cache: 'no-cache' });
    const data = await res.json();
    if (!data || !data.viid2sku || !data.sku2cat || !data.camp2viid) {
      info.innerHTML = '<span class="bad">매핑 미설정</span> — viid2sku/sku2cat/camp2viid 필요';
      maps = null;
      return;
    }
    maps = data;
    info.innerHTML = `<span class="ok">매핑 로드됨</span> · VIID→SKU ${Object.keys(maps.viid2sku).length.toLocaleString()} · SKU→카테 ${Object.keys(maps.sku2cat).length.toLocaleString()} · 캠페인→VIID ${Object.keys(maps.camp2viid).length.toLocaleString()} · 갱신 ${esc(maps.updated_at || '')}`;
  } catch (e) {
    info.innerHTML = '<span class="bad">매핑 로드 실패</span>';
  }
}

async function loadMargin() {
  try {
    const res = await fetch('/api/margin-state', { cache: 'no-cache' });
    const data = await res.json();
    if (!data || !Array.isArray(data.rows)) { marginMap = {}; return; }
    marginMap = {};
    for (const r of data.rows) {
      if (!r.sku) continue;
      const cost = Number(r.cost) || 0;             // 매입가 (VAT 포함, 쿠팡 입금 전)
      const supply = cost ? cost / 1.1 : 0;         // 공급가 (VAT 제외) — 벤더 실매출
      marginMap[String(r.sku).trim()] = {
        supply,                                      // 공급가 VAT제외
        origin: Number(r.originN) || Number(r.origin) || 0,  // 원가 (NEW 우선)
        price: Number(r.price) || 0,                // 소비자가
        name: r.name || '',
        cat: r.cat || '',
      };
    }
  } catch (e) {
    console.warn('margin-state 로드 실패:', e);
    marginMap = {};
  }
}

/* ─────────── 분류 룰 ─────────── */
function classify(sku, brand, campName) {
  const b = (brand || '').trim();
  const nameHint = sku && maps.sku2cat[sku] ? (maps.sku2cat[sku].name || '') : '';
  const text = `${campName || ''} ${nameHint}`;
  if (b === '삼대오백' || text.includes('삼대오백') || text.includes('뉴트리커먼')) return '삼대오백';
  if (text.includes('온살') || text.includes('루메어카이브') || text.includes('루메아카이브')) return '온살';
  if (text.includes('올리미') || text.includes('히팅뷰러') || text.includes('히팅마스크')) return '뷰티가전';
  if (sku && maps.sku2cat[sku] && (b === '오아' || b === '보아르' || nameHint.startsWith('오아') || nameHint.startsWith('보아르'))) {
    return maps.sku2cat[sku].cat;
  }
  if (campName && (campName.includes('오아') || campName.includes('[오아]'))) return '오아 미매칭';
  if (campName && campName.includes('보아르')) return '보아르 미매칭';
  return '기타';
}

/* 캠페인 → 카테: 수동 cat 최우선, 다음 수동 sku, 다음 VIID 다수결, 없으면 캠페인명 */
function catForCamp(campId, campName) {
  const manual = maps.manual_camp_sku && maps.manual_camp_sku[campId];
  if (manual) {
    // 신규 구조: {skus, cat}
    if (manual.cat) return manual.cat;
    const skus = manual.skus || (Array.isArray(manual) ? manual : []);
    if (skus.length) {
      const sm = maps.sku2cat[skus[0]];
      if (sm) return catForSku(skus[0], sm);
    }
  }
  const viids = maps.camp2viid[campId] || [];
  const tally = {};
  let best = null;
  for (const v of viids) {
    const m = maps.viid2sku[v];
    if (!m) continue;
    const c = classify(m.sku, m.brand, campName);
    tally[c] = (tally[c] || 0) + 1;
    if (!best || tally[c] > tally[best]) best = c;
  }
  if (best && best !== '기타') return best;
  return classify(null, null, campName);
}

/* ─────────── 엑셀 파싱 ─────────── */
function parseCPC(wb) {
  // dailySettlement 구조 (0-indexed):
  //   col 7 = 캠페인 ID, col 8 = 캠페인명, col 16 = 청구 소진 광고비
  // row 0 헤더, row 1 = '전체' 요약 (스킵), row 2+ 일별+캠페인별 상세.
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const byCamp = {}; // camp_id → { cost, camp_name }
  for (let i = 1; i < aoa.length; i++) {
    const r = aoa[i];
    const campId = r[7];
    if (!campId || typeof campId !== 'number') continue;  // 요약행/일별소계 스킵
    const cid = String(Math.round(campId));
    const campName = String(r[8] || '').trim();
    const cost = Number(r[16]) || 0;
    if (!cost) continue;
    if (!byCamp[cid]) byCamp[cid] = { cost: 0, camp_name: campName };
    byCamp[cid].cost += cost;
    if (campName && !byCamp[cid].camp_name) byCamp[cid].camp_name = campName;
  }
  return Object.entries(byCamp).map(([camp_id, v]) => ({ camp_id, cost: v.cost, camp_name: v.camp_name }));
}

function parseSales(file) {
  // SALES_ANALYSIS CSV:
  //   col 3=SKU ID, 4=SKU명, 11=브랜드,
  //   col 15=매입원가(COGS) = 쿠팡이 집계한 "수량 × 공급가(VAT제외)" 정수
  //   col 28(AC)=판매수량(벤더아이템ID, 반품 반영 — 음수 가능)
  // → 매출 = col 15 합계 (쿠팡 집계 그대로, 매출파일과 100% 일치)
  //    원가 = qty × margin.originN (aggregate에서 처리)
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: false,
      skipEmptyLines: true,
      complete: (res) => {
        const rows = res.data;
        const bySku = {};
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.length < 29) continue;
          const sku = String(r[3] || '').trim();
          if (!sku) continue;
          const name = String(r[4] || '').trim();
          const brand = String(r[11] || '').trim();
          const gmvCogs = Number(r[15]) || 0;  // col 15 매입원가 (= 벤더 매출 VAT제외)
          const qty = Number(r[28]) || 0;      // col 28 판매수량 (반품 반영)
          const d = bySku[sku] || (bySku[sku] = { qty:0, gmvCogs:0, name, brand });
          d.qty += qty;
          d.gmvCogs += gmvCogs;
          if (name && !d.name) d.name = name;
          if (brand && !d.brand) d.brand = brand;
        }
        resolve(bySku);
      },
      error: reject,
    });
  });
}

function parseCoupon(file) {
  // HTML xls 포맷: SKU 번호 (col 3), SKU명 (col 4), 펀딩 금액 (col 12)
  return file.text().then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const trs = doc.querySelectorAll('tr');
    const rows = [];
    trs.forEach((tr, idx) => {
      if (idx === 0) return;
      const tds = tr.querySelectorAll('td');
      if (tds.length < 13) return;
      const sku = tds[3].textContent.trim();
      const name = tds[4].textContent.trim();
      const raw = tds[12].textContent.trim().replace(/,/g, '');
      const amt = Number(raw);
      if (!sku || !amt) return;
      rows.push({ sku, name, amount: Math.abs(amt) });
    });
    return rows;
  });
}

/* ─────────── 집계 ─────────── */
const VAT_RATE = 1.1;
const BRAND_CATS = new Set(['삼대오백', '온살']);
const UNMATCHED_CATS = new Set(['오아 미매칭', '보아르 미매칭', '기타']);

/* Largest Remainder Method: raw(float) 배열 합이 total(int)과 정확히 같도록 floor+잉여 분배. */
function distributeRound(entries, total) {
  const items = entries.map(([k, v]) => ({ k, floor: Math.floor(v), rem: v - Math.floor(v) }));
  let diff = total - items.reduce((s, x) => s + x.floor, 0);
  // 잉여를 remainder 큰 순으로 +1 (diff<0이면 작은 순으로 -1)
  items.sort((a, b) => diff >= 0 ? b.rem - a.rem : a.rem - b.rem);
  for (let i = 0; i < Math.abs(diff); i++) items[i].floor += Math.sign(diff);
  const out = {};
  for (const x of items) out[x.k] = x.floor;
  return out;
}

/* 캠페인 광고비 → SKU별 분배. 수동 SKU 최우선, 다음 camp_viid_cost 비율, 다음 camp2viid 균등. */
function distributeCampCost(campId, totalRawCost) {
  const out = {};
  const manual = maps.manual_camp_sku && maps.manual_camp_sku[campId];
  const manualSkus = manual ? (manual.skus || (Array.isArray(manual) ? manual : [])) : [];
  if (manualSkus.length) {
    const per = totalRawCost / manualSkus.length;
    for (const s of manualSkus) out[s] = (out[s] || 0) + per;
    return out;
  }
  // cat만 지정됐고 SKU 없으면 가상 SKU로 묶기
  if (manual && manual.cat && !manualSkus.length) {
    out[`__cat_${manual.cat}_${campId}`] = totalRawCost;
    return out;
  }
  const costMap = maps.camp_viid_cost && maps.camp_viid_cost[campId];
  if (costMap) {
    const sum = Object.values(costMap).reduce((s, v) => s + v, 0);
    if (sum > 0) {
      for (const [viid, c] of Object.entries(costMap)) {
        const sku = (maps.viid2sku[viid] && maps.viid2sku[viid].sku) || `__viid_${viid}`;
        out[sku] = (out[sku] || 0) + totalRawCost * (c / sum);
      }
      return out;
    }
  }
  const viids = maps.camp2viid[campId] || [];
  const skus = [...new Set(viids.map(v => maps.viid2sku[v] && maps.viid2sku[v].sku).filter(Boolean))];
  if (skus.length === 0) {
    out['__nocamp__'] = totalRawCost;
    return out;
  }
  const per = totalRawCost / skus.length;
  for (const s of skus) out[s] = per;
  return out;
}

/* SKU → 카테 (쿠폰 분류 로직과 동일) */
function catForSku(sku, meta) {
  const nm = (meta && meta.name) || '';
  if (nm.includes('삼대오백') || nm.includes('뉴트리커먼')) return '삼대오백';
  if (nm.includes('온살') || nm.includes('루메어카이브') || nm.includes('루메아카이브')) return '온살';
  if (nm.includes('올리미') || nm.includes('히팅뷰러') || nm.includes('히팅마스크')) return '뷰티가전';
  if (nm.startsWith('오아') || nm.startsWith('보아르')) return meta.cat;
  return (meta && meta.cat) || '기타';
}

function aggregate() {
  if (!maps || !cpcData || !couponData) return;

  // 수동 매핑 역색인: SKU → cat (manual에서 cat 지정된 캠페인의 SKU에 적용)
  const manualSkuCat = {};
  for (const [cid, mm] of Object.entries(maps.manual_camp_sku || {})) {
    if (!mm) continue;
    const skus = mm.skus || (Array.isArray(mm) ? mm : []);
    const cat = (mm && typeof mm === 'object') ? mm.cat : '';
    if (!cat || !skus.length) continue;
    for (const s of skus) {
      if (!manualSkuCat[s]) manualSkuCat[s] = cat;
    }
  }

  const byCat = {}; // cat → { cpc(float), coupon(int) }
  const bump = (cat, key, val) => {
    if (!byCat[cat]) byCat[cat] = { cpc: 0, coupon: 0 };
    byCat[cat][key] += val;
  };

  const bySku = {}; // sku → {cpc(raw), coupon, gmv, cogs, qty, name, brand, cat}
  const skuEnsure = (sku, extra) => {
    if (!bySku[sku]) {
      const sm = maps.sku2cat[sku];
      const vMatch = String(sku).match(/^__cat_(.+?)_([0-9]+)$/);
      // cat 우선순위: 가상SKU > manual에서 지정된 cat > sku2cat > fallback
      let cat;
      if (vMatch) cat = vMatch[1];
      else if (manualSkuCat[sku]) cat = manualSkuCat[sku];
      else cat = catForSku(sku, sm || extra);
      bySku[sku] = {
        cpc: 0, coupon: 0, gmv: 0, cogs: 0, qty: 0,
        name: (sm && sm.name) || (extra && extra.name) || (vMatch ? `(캠페인 ${vMatch[2]})` : ''),
        brand: (extra && extra.brand) || '',
        cat,
      };
    } else if (extra) {
      if (extra.name && !bySku[sku].name) bySku[sku].name = extra.name;
      if (extra.brand && !bySku[sku].brand) bySku[sku].brand = extra.brand;
    }
    return bySku[sku];
  };

  // CPC: 카테별 + SKU별 동시 집계
  let cpcMatched = 0, cpcUnmatched = 0, totalRawCost = 0;
  for (const row of cpcData) {
    const cat = catForCamp(row.camp_id, row.camp_name);
    bump(cat, 'cpc', row.cost);
    totalRawCost += row.cost;
    if (UNMATCHED_CATS.has(cat)) cpcUnmatched++; else cpcMatched++;
    // SKU 분배
    const dist = distributeCampCost(row.camp_id, row.cost);
    for (const [sku, cost] of Object.entries(dist)) {
      skuEnsure(sku).cpc += cost;
    }
  }

  // 쿠폰 — sku2cat 없을 때는 쿠폰 파일의 SKU명에서 브랜드 추론
  let cpnMatched = 0, cpnUnmatched = 0;
  for (const row of couponData) {
    const skuMeta = maps.sku2cat[row.sku];
    let cat;
    if (skuMeta) {
      cat = catForSku(row.sku, skuMeta);
      cpnMatched++;
    } else {
      // SKU명 fallback (sku2cat에 없을 때 쿠폰명에서 브랜드 추론)
      const nm = row.name || '';
      if (nm.includes('삼대오백') || nm.includes('뉴트리커먼')) { cat = '삼대오백'; cpnMatched++; }
      else if (nm.includes('온살') || nm.includes('루메어카이브') || nm.includes('루메아카이브')) { cat = '온살'; cpnMatched++; }
      else if (nm.includes('올리미') || nm.includes('히팅뷰러') || nm.includes('히팅마스크')) { cat = '뷰티가전'; cpnMatched++; }
      else { cat = '기타'; cpnUnmatched++; }
    }
    bump(cat, 'coupon', row.amount);
    skuEnsure(row.sku, { name: row.name }).coupon += row.amount;
  }

  // 매출/원가 (sales 있을 때만) — qty × 마진테이블 cost/origin
  if (salesData) {
    for (const [sku, s] of Object.entries(salesData)) {
      const d = skuEnsure(sku, s);
      const mg = marginMap && marginMap[sku];
      d.qty += s.qty;
      d.gmv += s.gmvCogs;              // 매출 = SALES col 15 (쿠팡 집계 "수량×공급가VAT제외", 정수)
      if (mg) d.cogs += s.qty * mg.origin;  // 원가 = 수량 × 마진.originN
    }
  }

  // 카테 광고비 반올림 분배 (전체 합 = 189,413,014 정확히 맞춤)
  const totalCpcInt = Math.round(totalRawCost * VAT_RATE);
  const perCatVat = Object.fromEntries(
    Object.entries(byCat).map(([k, v]) => [k, v.cpc * VAT_RATE])
  );
  const roundedCpc = distributeRound(Object.entries(perCatVat), totalCpcInt);
  for (const k of Object.keys(byCat)) byCat[k].cpc = roundedCpc[k] ?? 0;

  // SKU 광고비도 VAT ×1.1 후 반올림 (카테 합과 정확 일치시키려면 더 복잡 — 지금은 각각 round)
  for (const d of Object.values(bySku)) {
    d.cpcVat = Math.round(d.cpc * VAT_RATE);
    d.profit = Math.round(d.gmv - d.cogs - d.cpcVat - d.coupon);
  }

  render(byCat, { cpcMatched, cpcUnmatched, cpnMatched, cpnUnmatched, totalCpcInt });
  renderSkuTable(bySku);
}

/* ─────────── 렌더 ─────────── */
function render(byCat, stats) {
  const cats = Object.entries(byCat);
  const totalCpc = stats.totalCpcInt;
  const totalCpn = cats.reduce((s,[,v]) => s + v.coupon, 0);
  const totalAll = totalCpc + totalCpn;

  // 정렬 그룹: 0=오아/보아르 세분 카테, 1=브랜드(삼대오백/온살), 2=미매칭/기타
  const groupOf = k => UNMATCHED_CATS.has(k) ? 2 : (BRAND_CATS.has(k) ? 1 : 0);
  const sorted = cats.sort((a,b) => {
    const g = groupOf(a[0]) - groupOf(b[0]);
    if (g !== 0) return g;
    return (b[1].cpc + b[1].coupon) - (a[1].cpc + a[1].coupon);
  });

  const maxTotal = Math.max(1, ...sorted.map(([,v]) => v.cpc + v.coupon));
  const rows = sorted.map(([cat, v]) => {
    const sum = v.cpc + v.coupon;
    const pct = (sum / totalAll * 100).toFixed(1);
    const barPct = Math.max(2, Math.round(sum / maxTotal * 100));
    const isBrand = (cat === '삼대오백' || cat === '온살');
    return `
      <tr class="${isBrand ? 'brand' : ''}">
        <td class="left">${esc(cat)}</td>
        <td class="cpc">${fmtWon(v.cpc)}</td>
        <td class="coupon">${fmtWon(v.coupon)}</td>
        <td class="total">${fmtWon(sum)}</td>
        <td style="text-align:left; color: var(--text-hint); font-weight:500;">
          ${pct}%
          <span class="bar"><span style="width:${barPct}%"></span></span>
        </td>
      </tr>`;
  }).join('');

  const sumRow = `
    <tr class="sum">
      <td class="left">합계</td>
      <td class="cpc">${fmtWon(totalCpc)}</td>
      <td class="coupon">${fmtWon(totalCpn)}</td>
      <td class="total">${fmtWon(totalAll)}</td>
      <td></td>
    </tr>`;

  document.getElementById('result').innerHTML = `
    <div class="result-head">
      <div class="title">카테고리별 집계</div>
      <div class="sub">
        CPC 레코드 ${(stats.cpcMatched + stats.cpcUnmatched).toLocaleString()}건
        · 쿠폰 레코드 ${(stats.cpnMatched + stats.cpnUnmatched).toLocaleString()}건
        ${stats.cpcUnmatched + stats.cpnUnmatched ? ` · <span style="color:var(--neg);font-weight:600;">미매칭 ${stats.cpcUnmatched + stats.cpnUnmatched}건</span>` : ''}
      </div>
      <button class="btn-reload" onclick="window.location.reload()">초기화</button>
    </div>
    <table class="cat">
      <thead>
        <tr>
          <th class="left">카테고리</th>
          <th>CPC 광고비</th>
          <th>쿠폰비</th>
          <th>합계</th>
          <th class="left" style="padding-left:16px;">비중</th>
        </tr>
      </thead>
      <tbody>${rows}${sumRow}</tbody>
    </table>
  `;
}

/* ─────────── SKU 상세 테이블 ─────────── */
window.setFilterCat = (cat) => { filterCat = (filterCat === cat) ? '' : cat; renderSkuTable(); };
window.setFilterSearch = (q) => { filterSearch = q || ''; renderSkuTable(); };
window.clearSearch = () => { filterSearch = ''; renderSkuTable(); };
let collapsedCats = new Set(['기타']);  // 기본 접힘
window.toggleCat = (cat) => {
  if (collapsedCats.has(cat)) collapsedCats.delete(cat); else collapsedCats.add(cat);
  renderSkuTable();
};
window.resetSettleData = () => {
  if (!confirm('저장된 파일 데이터 전부 삭제할까요? (매핑 KV는 유지)')) return;
  lsClearAll();
  location.reload();
};

function renderSkuTable(bySku) {
  const box = document.getElementById('result-sku');
  if (bySku) currentBySku = bySku;
  if (!currentBySku) { box.hidden = true; return; }

  const hasSales = !!salesData;
  const allEntries = Object.entries(currentBySku);
  if (allEntries.length === 0) { box.hidden = true; return; }
  box.hidden = false;

  // 전체 카테 수집 (chip용) — 필터 적용 전 기준
  const allCats = {};
  for (const [,d] of allEntries) {
    const c = d.cat || '기타';
    allCats[c] = (allCats[c] || 0) + 1;
  }
  const groupOf = k => UNMATCHED_CATS.has(k) ? 2 : (BRAND_CATS.has(k) || k === '뷰티가전' ? 1 : 0);
  const chipCats = Object.keys(allCats).sort((a,b) => groupOf(a) - groupOf(b) || a.localeCompare(b));

  // 필터링 (카테 + 검색)
  const q = filterSearch.trim().toLowerCase();
  const filtered = allEntries.filter(([sku, d]) => {
    if (filterCat && d.cat !== filterCat) return false;
    if (q) {
      const hay = (sku + ' ' + (d.name || '') + ' ' + (d.brand || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // 카테 그룹핑
  const groups = {};
  for (const [sku, d] of filtered) {
    const cat = d.cat || '기타';
    (groups[cat] = groups[cat] || []).push([sku, d]);
  }
  const catOrder = Object.keys(groups).sort((a,b) => {
    const g = groupOf(a) - groupOf(b);
    if (g !== 0) return g;
    const sa = groups[a].reduce((s,[,d]) => s + d.gmv, 0);
    const sb = groups[b].reduce((s,[,d]) => s + d.gmv, 0);
    return sb - sa;
  });

  // 필터된 합계
  let TG=0, TC=0, TP=0, TCPC=0, TCPN=0;
  for (const [,d] of filtered) { TG+=d.gmv; TC+=d.cogs; TCPC+=d.cpcVat; TCPN+=d.coupon; TP+=d.profit; }

  const header = `
    <tr>
      <th class="left">SKU</th>
      <th class="left">SKU명</th>
      <th>수량</th>
      ${hasSales ? '<th>매출</th><th>원가</th>' : ''}
      <th>광고비(VAT)</th>
      <th>쿠폰</th>
      ${hasSales ? '<th>순수익</th><th>마진%</th>' : ''}
    </tr>`;

  const bodyParts = [];
  const colspan = hasSales ? 9 : 5;
  for (const cat of catOrder) {
    const items = groups[cat].sort((a,b) => b[1].gmv - a[1].gmv || b[1].cpcVat - a[1].cpcVat);
    let g=0,c=0,cp=0,cpn=0,p=0,qty=0;
    for (const [,d] of items) { g+=d.gmv; c+=d.cogs; cp+=d.cpcVat; cpn+=d.coupon; p+=d.profit; qty+=d.qty; }
    const marginPct = g > 0 ? (p / g * 100).toFixed(1) : '—';
    const isCollapsed = collapsedCats.has(cat);
    bodyParts.push(`<tr class="group ${isCollapsed?'collapsed':''}"><td colspan="${colspan}" onclick="toggleCat('${cat.replace(/'/g, "\\'")}')">
      <span class="caret">▼</span>${esc(cat)}
      <span class="m">SKU ${items.length}개 · 매출 ${fmtWon(g)} · 광고 ${fmtWon(cp)} · 순수익 ${fmtWon(p)} ${hasSales?`(${marginPct}%)`:''}</span></td></tr>`);
    if (!isCollapsed) {
      for (const [sku, d] of items) {
        const mPct = d.gmv > 0 ? (d.profit / d.gmv * 100).toFixed(1) : '—';
        const profitCls = d.profit < 0 ? 'profit neg' : 'profit';
        bodyParts.push(`
          <tr>
            <td class="left">${esc(sku)}</td>
            <td class="left name" title="${esc(d.name)}">${esc(d.name || '')}</td>
            <td>${d.qty ? d.qty.toLocaleString() : '—'}</td>
            ${hasSales ? `<td class="gmv">${fmtWon(d.gmv)}</td><td>${fmtWon(d.cogs)}</td>` : ''}
            <td class="cpc">${fmtWon(d.cpcVat)}</td>
            <td class="coupon">${fmtWon(d.coupon)}</td>
            ${hasSales ? `<td class="${profitCls}">${fmtWon(d.profit)}</td><td>${mPct}${mPct==='—'?'':'%'}</td>` : ''}
          </tr>`);
      }
    }
  }

  const totalMargin = TG > 0 ? (TP / TG * 100).toFixed(1) : '—';
  const sumLabel = filterCat || q
    ? `필터 합계 (${filtered.length} / ${allEntries.length} SKU)`
    : `전체 합계 (${filtered.length} SKU)`;
  const sumRow = `
    <tr class="subsum">
      <td class="left" colspan="2">${sumLabel}</td>
      <td>—</td>
      ${hasSales ? `<td class="gmv">${fmtWon(TG)}</td><td>${fmtWon(TC)}</td>` : ''}
      <td class="cpc">${fmtWon(TCPC)}</td>
      <td class="coupon">${fmtWon(TCPN)}</td>
      ${hasSales ? `<td class="${TP<0?'profit neg':'profit'}">${fmtWon(TP)}</td><td>${totalMargin}${totalMargin==='—'?'':'%'}</td>` : ''}
    </tr>`;

  const emptyMsg = filtered.length === 0
    ? `<tr><td colspan="${colspan}" style="text-align:center; padding:40px; color:var(--text-hint);">일치하는 SKU가 없습니다.</td></tr>`
    : '';

  const chipHtml = ['<button class="chip ' + (filterCat === '' ? 'active' : '') + '" onclick="setFilterCat(\'\')">전체</button>']
    .concat(chipCats.map(c => `<button class="chip ${filterCat === c ? 'active' : ''}" onclick="setFilterCat('${c}')">${esc(c)} <span style="opacity:.6">${allCats[c]}</span></button>`))
    .join('');

  const searchVal = esc(filterSearch);
  box.innerHTML = `
    <div class="result-head">
      <div class="title">SKU 상세</div>
      <div class="sub">
        ${hasSales
          ? `매출 ${fmtWon(TG)} · 원가 ${fmtWon(TC)} · 광고 ${fmtWon(TCPC)} · 쿠폰 ${fmtWon(TCPN)} → <strong style="color:var(--profit)">순수익 ${fmtWon(TP)} (${totalMargin}%)</strong>`
          : `SALES_ANALYSIS를 올리면 매출/순수익이 추가로 계산됩니다.`}
      </div>
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="sku-search" placeholder="SKU/상품명/브랜드 검색" value="${searchVal}" oninput="setFilterSearch(this.value)">
        ${filterSearch ? '<button class="clear" onclick="clearSearch()" title="지우기">×</button>' : ''}
      </div>
      <button class="btn-reset-data" onclick="resetSettleData()" title="저장된 파일 데이터 초기화">저장 초기화</button>
    </div>
    <div class="sku-toolbar">
      <div class="chips">${chipHtml}</div>
    </div>
    <div style="max-height: calc(100vh - 180px); overflow-y: auto;">
      <table class="sku">
        <thead>${header}</thead>
        <tbody>${bodyParts.join('')}${emptyMsg}${sumRow}</tbody>
      </table>
    </div>`;

  // 포커스 유지 (타이핑 중 리렌더로 blur 되는 것 방지)
  if (filterSearch) {
    const inp = document.getElementById('sku-search');
    if (inp) { inp.focus(); inp.setSelectionRange(filterSearch.length, filterSearch.length); }
  }
}

/* ─────────── 드롭존 핸들러 ─────────── */
function setupDrop(id, kind) {
  const zone = document.getElementById(id);
  const input = zone.querySelector('input[type="file"]');
  const label = zone.querySelector('.drop-file');
  const title = zone.querySelector('.drop-title');
  const hint = zone.querySelector('.drop-hint');

  const handle = async (file) => {
    if (!file) return;
    label.textContent = file.name;
    label.hidden = false;
    zone.classList.add('loaded');
    title.hidden = true; hint.hidden = true;
    try {
      if (kind === 'cpc') {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        cpcData = parseCPC(wb);
        lsSave(LS.cpc, cpcData); lsSave(LS.cpcName, file.name);
      } else if (kind === 'coupon') {
        couponData = await parseCoupon(file);
        lsSave(LS.coupon, couponData); lsSave(LS.couponName, file.name);
      } else if (kind === 'sales') {
        salesData = await parseSales(file);
        lsSave(LS.sales, salesData); lsSave(LS.salesName, file.name);
      }
      label.textContent = file.name;
      aggregate();
    } catch (err) {
      label.textContent = '파싱 오류: ' + err.message;
      label.style.color = 'var(--neg)';
      console.error(err);
    }
  };

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', e => handle(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover');
  }));
  zone.addEventListener('drop', e => handle(e.dataTransfer.files[0]));
}

setupDrop('drop-cpc', 'cpc');
setupDrop('drop-coupon', 'coupon');
setupDrop('drop-sales', 'sales');
window.addEventListener('dragover', e => { if (!e.target.closest('.drop')) e.preventDefault(); });
window.addEventListener('drop',     e => { if (!e.target.closest('.drop')) e.preventDefault(); });

(async () => {
  await Promise.all([loadMaps(), loadMargin()]);
  restoreFromLs();
  if (cpcData && couponData) aggregate();
})();
</script>
