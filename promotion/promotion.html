<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로모션 일정 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --surface: #ffffff;
    --surface-alt: #f5f3ef;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --text-muted: #4d5a4c;
    --text-hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-soft: #f2ede9;
    --accent-softer: #f8f5f2;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
    --warm: #c9906e;
    --warm-soft: #f5e6d9;
    --plum: #a58098;
    --plum-soft: #efe4ea;
    --slate: #7a8a9a;
    --slate-soft: #e2e7ec;
    --today: #b04a3a;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .wrap { padding: 20px 24px 40px; max-width: 1600px; margin: 0 auto; }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .nav-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: background .12s ease, color .12s ease;
  }
  .nav-btn:hover { background: var(--accent-soft); color: var(--text); }
  .month-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    padding: 0 8px;
    min-width: 140px;
    text-align: center;
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .btn:hover { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-hint); }
  .btn.ghost:hover { background: var(--accent-soft); color: var(--text); }

  .view-toggle { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .view-toggle .btn { border: 0; border-radius: 0; height: 30px; }
  .view-toggle .btn.active { background: var(--accent); color: #fff; }

  .spacer { flex: 1; }
  .save-status { font-size: 11.5px; color: var(--text-hint); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  /* ─────────── Timeline (Gantt) view ─────────── */
  .timeline {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 320px;
  }
  .tl-side {
    border-right: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .tl-side-head {
    height: 56px;
    display: flex; align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tl-side-row {
    height: 52px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .tl-side-row:hover { background: var(--accent-softer); }
  .tl-side-row.selected { background: var(--accent-soft); }
  .tl-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-meta {
    font-size: 11px;
    color: var(--text-hint);
    display: flex; gap: 6px; align-items: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .type-tag {
    display: inline-flex; align-items: center;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .type-tag.타임특가 { background: var(--warm-soft); color: #8a4a2a; }
  .type-tag.기획전   { background: var(--sage-soft); color: #4a5748; }
  .type-tag.쿠폰     { background: var(--plum-soft); color: #6a4a5a; }
  .type-tag.할인     { background: var(--slate-soft); color: #3a4a5a; }
  .type-tag.기타     { background: var(--accent-soft); color: var(--accent-dark); }

  .tl-canvas {
    position: relative;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tl-grid {
    position: relative;
    min-width: 100%;
  }
  .tl-day-head-row {
    display: grid;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0;
    z-index: 2;
  }
  .tl-day-head {
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--text-hint);
    padding: 4px 0;
  }
  .tl-day-head .d { font-size: 14px; font-weight: 700; color: var(--text); }
  .tl-day-head.weekend .d { color: var(--text-hint); }
  .tl-day-head.sun .d { color: #b04a3a; }
  .tl-day-head.sat .d { color: #5a6f8a; }
  .tl-day-head.today {
    background: var(--accent-soft);
  }
  .tl-day-head.today .d { color: var(--today); }
  .tl-day-head.today .w { color: var(--today); font-weight: 600; }

  .tl-body-row {
    position: relative;
    height: 52px;
    border-bottom: 1px solid var(--border);
  }
  .tl-body-row.selected { background: var(--accent-softer); }
  .tl-col-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
    pointer-events: none;
  }
  .tl-col-line.weekend { background: var(--surface-alt); width: 100%; z-index: 0; }
  .tl-today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--today);
    opacity: 0.55;
    pointer-events: none;
    z-index: 3;
  }
  .bar {
    position: absolute;
    top: 10px; bottom: 10px;
    border-radius: 8px;
    padding: 0 10px;
    display: flex; align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    transition: transform .1s ease, box-shadow .1s ease;
    z-index: 1;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .bar:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); z-index: 4; }
  .bar.타임특가 { background: var(--warm); }
  .bar.기획전   { background: var(--sage); color: #2a3a2a; }
  .bar.쿠폰     { background: var(--plum); }
  .bar.할인     { background: var(--slate); }
  .bar.기타     { background: var(--accent); }
  .bar .bar-txt { overflow: hidden; text-overflow: ellipsis; }

  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: var(--text-hint);
    font-size: 13px;
  }
  .empty-state .big { font-size: 15px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }

  /* ─────────── Modal ─────────── */
  .mask {
    position: fixed; inset: 0;
    background: rgba(32,24,20,0.32);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .mask.open { display: flex; }
  .modal {
    width: 480px; max-width: calc(100% - 32px);
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.16);
    overflow: hidden;
  }
  .modal-head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .modal-body {
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.02em;
  }
  .field input, .field select, .field textarea {
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field textarea { height: auto; padding: 8px 10px; min-height: 60px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(170,151,145,0.15);
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-foot {
    padding: 12px 20px 16px;
    display: flex; justify-content: space-between; gap: 8px;
    border-top: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .modal-foot .right { display: flex; gap: 8px; }

  .legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--text-hint);
    align-items: center;
  }
  .legend .dot {
    display: inline-block;
    width: 10px; height: 10px; border-radius: 3px;
    margin-right: 5px; vertical-align: middle;
  }
  .legend .dot.타임특가 { background: var(--warm); }
  .legend .dot.기획전   { background: var(--sage); }
  .legend .dot.쿠폰     { background: var(--plum); }
  .legend .dot.할인     { background: var(--slate); }
  .legend .dot.기타     { background: var(--accent); }
</style>
</head>
<body>

<div class="wrap">
  <div class="toolbar">
    <button class="nav-btn" id="prevBtn" title="이전">‹</button>
    <div class="month-title" id="monthTitle">—</div>
    <button class="nav-btn" id="nextBtn" title="다음">›</button>
    <button class="btn ghost" id="todayBtn">오늘</button>

    <div class="view-toggle" style="margin-left:8px">
      <button class="btn" data-range="month" id="rangeMonth">월</button>
      <button class="btn active" data-range="quarter" id="rangeQuarter">분기</button>
    </div>

    <div class="spacer"></div>
    <span class="save-status" id="saveStatus">—</span>
    <button class="btn primary" id="addBtn">＋ 프로모션 추가</button>
  </div>

  <div class="card">
    <div class="timeline" id="timeline">
      <div class="tl-side">
        <div class="tl-side-head">프로모션</div>
        <div id="tlSideRows"></div>
      </div>
      <div class="tl-canvas" id="tlCanvas">
        <div class="tl-grid" id="tlGrid"></div>
      </div>
    </div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="big">등록된 프로모션이 없습니다</div>
      <div>상단 [＋ 프로모션 추가] 버튼으로 시작하세요</div>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot 타임특가"></span>타임특가</span>
    <span><span class="dot 기획전"></span>기획전</span>
    <span><span class="dot 쿠폰"></span>쿠폰</span>
    <span><span class="dot 할인"></span>할인</span>
    <span><span class="dot 기타"></span>기타</span>
  </div>
</div>

<!-- Edit / Add Modal -->
<div class="mask" id="editMask">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">프로모션 추가</h3>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>프로모션명</label>
        <input type="text" id="fName" placeholder="예) 봄맞이 타임특가">
      </div>
      <div class="field-row">
        <div class="field">
          <label>유형</label>
          <select id="fType">
            <option value="타임특가">타임특가</option>
            <option value="기획전">기획전</option>
            <option value="쿠폰">쿠폰</option>
            <option value="할인">할인</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="field">
          <label>대상 SKU (콤마 구분)</label>
          <input type="text" id="fSku" placeholder="예) 12345, 67890">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>시작일</label>
          <input type="date" id="fStart">
        </div>
        <div class="field">
          <label>종료일</label>
          <input type="date" id="fEnd">
        </div>
      </div>
      <div class="field">
        <label>상품명 / 메모</label>
        <textarea id="fName2" placeholder="상품명 또는 부가 설명"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="delBtn" style="color:#b04a3a">삭제</button>
      <div class="right">
        <button class="btn" id="cancelBtn">취소</button>
        <button class="btn primary" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = '/api/promotion-state';
const STORAGE_KEY = 'promotion_state_local';

let data = [];        // [{id,name,type,start,end,sku,memo}]
let editingId = null;
let viewAnchor = new Date(); // 첫째 주 기준일
let rangeMode = 'quarter';   // 'month' | 'quarter'

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); };
const uid = () => 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function todayMidnight() { const t=new Date(); t.setHours(0,0,0,0); return t; }
function daysBetween(a,b) { return Math.round((b - a) / 86400000); }
function addDays(d, n) { const c=new Date(d); c.setDate(c.getDate()+n); return c; }

/* ═══════════════════════ Data I/O ═══════════════════════ */
async function loadRemote() {
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const arr = await res.json();
    data = Array.isArray(arr) ? arr : (arr.rows || []);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    render();
    saveStatus('불러옴');
  } catch (e) {
    console.warn('[promotion] loadRemote 실패:', e.message);
    // localStorage 폴백
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) { try { data = JSON.parse(cached); render(); saveStatus('오프라인'); } catch(_){} }
  }
}
let _saveTimer = null;
let _isDirty = false;
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  _isDirty = true;
  saveStatus('● 미저장');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveRemote, 800);
}
async function saveRemote() {
  if (!_isDirty) return;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    _isDirty = false;
    saveStatus('저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  } catch (e) {
    saveStatus('저장 실패');
    console.warn('[promotion] saveRemote 실패:', e.message);
  }
}
function saveStatus(t) { $('saveStatus').textContent = t; }

/* ═══════════════════════ Range calculation ═══════════════════════ */
function currentRange() {
  const a = new Date(viewAnchor.getFullYear(), viewAnchor.getMonth(), 1);
  let end;
  if (rangeMode === 'month') {
    end = new Date(a.getFullYear(), a.getMonth()+1, 0);
  } else {
    // quarter = 3개월
    end = new Date(a.getFullYear(), a.getMonth()+3, 0);
  }
  return { start: a, end };
}
function monthTitleText() {
  const { start, end } = currentRange();
  if (rangeMode === 'month') return `${start.getFullYear()}년 ${start.getMonth()+1}월`;
  return `${start.getFullYear()}년 ${start.getMonth()+1}월 – ${end.getMonth()+1}월`;
}

/* ═══════════════════════ Render ═══════════════════════ */
function render() {
  $('monthTitle').textContent = monthTitleText();
  const { start, end } = currentRange();
  const totalDays = daysBetween(start, end) + 1;
  const DAY_W = rangeMode === 'month' ? 42 : 22;
  const gridWidth = totalDays * DAY_W;

  // 필터: 이 구간과 겹치는 프로모션만
  const visible = data
    .filter(p => p.start && p.end)
    .filter(p => {
      const s = parseYmd(p.start), e = parseYmd(p.end);
      return s && e && !(e < start || s > end);
    })
    .sort((a,b) => (a.start||'').localeCompare(b.start||''));

  $('emptyState').style.display = visible.length ? 'none' : 'block';
  $('timeline').style.display = visible.length ? 'grid' : 'none';

  // Side rows
  const sideHtml = visible.map(p => `
    <div class="tl-side-row" data-id="${p.id}">
      <div class="tl-name">${esc(p.name || '(이름 없음)')}</div>
      <div class="tl-meta">
        <span class="type-tag ${p.type||'기타'}">${esc(p.type||'기타')}</span>
        <span>${esc(p.sku || '')}</span>
      </div>
    </div>
  `).join('');
  $('tlSideRows').innerHTML = sideHtml;

  // Grid header + body
  const today = todayMidnight();
  let headHtml = `<div class="tl-day-head-row" style="grid-template-columns:repeat(${totalDays}, ${DAY_W}px); width:${gridWidth}px">`;
  for (let i=0;i<totalDays;i++) {
    const d = addDays(start, i);
    const dow = d.getDay();
    const cls = ['tl-day-head'];
    if (dow === 0) cls.push('sun','weekend');
    else if (dow === 6) cls.push('sat','weekend');
    if (d.getTime() === today.getTime()) cls.push('today');
    const dowLabel = ['일','월','화','수','목','금','토'][dow];
    const showMonth = rangeMode === 'month' || d.getDate() === 1 || i === 0;
    headHtml += `<div class="${cls.join(' ')}">
      <div class="w">${showMonth ? (d.getMonth()+1)+'/' : ''}${d.getDate() === 1 ? '' : ''}${dowLabel}</div>
      <div class="d">${d.getDate()}</div>
    </div>`;
  }
  headHtml += `</div>`;

  // Body rows w/ bars
  let bodyHtml = '';
  visible.forEach(p => {
    const ps = parseYmd(p.start), pe = parseYmd(p.end);
    const offStart = clamp(daysBetween(start, ps), 0, totalDays-1);
    const offEnd = clamp(daysBetween(start, pe), 0, totalDays-1);
    const left = offStart * DAY_W + 2;
    const width = Math.max((offEnd - offStart + 1) * DAY_W - 4, 20);
    const barLabel = p.name || '(이름 없음)';
    bodyHtml += `<div class="tl-body-row" data-id="${p.id}" style="width:${gridWidth}px">`;
    // weekend background stripes
    for (let i=0;i<totalDays;i++) {
      const d = addDays(start, i);
      const dow = d.getDay();
      if (dow===0 || dow===6) {
        bodyHtml += `<div class="tl-col-line weekend" style="left:${i*DAY_W}px; width:${DAY_W}px"></div>`;
      }
    }
    bodyHtml += `<div class="bar ${p.type||'기타'}" style="left:${left}px; width:${width}px" data-id="${p.id}"><span class="bar-txt">${esc(barLabel)}</span></div>`;
    // today line
    const todayOff = daysBetween(start, today);
    if (todayOff >= 0 && todayOff < totalDays) {
      bodyHtml += `<div class="tl-today-line" style="left:${todayOff*DAY_W + DAY_W/2}px"></div>`;
    }
    bodyHtml += `</div>`;
  });

  $('tlGrid').innerHTML = headHtml + bodyHtml;
  $('tlGrid').style.width = gridWidth + 'px';

  // wire up clicks
  $('tlSideRows').querySelectorAll('.tl-side-row').forEach(r => {
    r.addEventListener('click', () => openEdit(r.dataset.id));
  });
  $('tlGrid').querySelectorAll('.bar').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); openEdit(b.dataset.id); });
  });
  // range button state
  $('rangeMonth').classList.toggle('active', rangeMode==='month');
  $('rangeQuarter').classList.toggle('active', rangeMode==='quarter');
}

function esc(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ═══════════════════════ Edit modal ═══════════════════════ */
function openEdit(id) {
  editingId = id || null;
  const p = id ? data.find(x => x.id === id) : null;
  $('modalTitle').textContent = p ? '프로모션 편집' : '프로모션 추가';
  $('fName').value = p?.name || '';
  $('fType').value = p?.type || '타임특가';
  $('fSku').value = p?.sku || '';
  $('fStart').value = p?.start || ymd(new Date());
  $('fEnd').value = p?.end || ymd(addDays(new Date(), 7));
  $('fName2').value = p?.memo || '';
  $('delBtn').style.display = p ? '' : 'none';
  $('editMask').classList.add('open');
  setTimeout(() => $('fName').focus(), 40);
}
function closeEdit() { $('editMask').classList.remove('open'); editingId = null; }

$('addBtn').addEventListener('click', () => openEdit(null));
$('cancelBtn').addEventListener('click', closeEdit);
$('editMask').addEventListener('click', e => { if (e.target === $('editMask')) closeEdit(); });
$('saveBtn').addEventListener('click', () => {
  const name = $('fName').value.trim();
  if (!name) { $('fName').focus(); return; }
  const start = $('fStart').value;
  const end = $('fEnd').value;
  if (!start || !end) { alert('시작일과 종료일을 입력하세요'); return; }
  if (end < start) { alert('종료일이 시작일보다 앞설 수 없습니다'); return; }
  const rec = {
    id: editingId || uid(),
    name,
    type: $('fType').value,
    sku: $('fSku').value.trim(),
    start, end,
    memo: $('fName2').value.trim()
  };
  if (editingId) {
    const i = data.findIndex(x => x.id === editingId);
    if (i >= 0) data[i] = rec; else data.push(rec);
  } else {
    data.push(rec);
  }
  save();
  closeEdit();
  render();
});
$('delBtn').addEventListener('click', () => {
  if (!editingId) return;
  if (!confirm('이 프로모션을 삭제할까요?')) return;
  data = data.filter(x => x.id !== editingId);
  save();
  closeEdit();
  render();
});

/* ═══════════════════════ Navigation ═══════════════════════ */
$('prevBtn').addEventListener('click', () => {
  const step = rangeMode === 'month' ? 1 : 3;
  viewAnchor = new Date(viewAnchor.getFullYear(), viewAnchor.getMonth()-step, 1);
  render();
});
$('nextBtn').addEventListener('click', () => {
  const step = rangeMode === 'month' ? 1 : 3;
  viewAnchor = new Date(viewAnchor.getFullYear(), viewAnchor.getMonth()+step, 1);
  render();
});
$('todayBtn').addEventListener('click', () => { viewAnchor = new Date(); render(); });
$('rangeMonth').addEventListener('click', () => { rangeMode='month'; render(); });
$('rangeQuarter').addEventListener('click', () => { rangeMode='quarter'; render(); });

/* ═══════════════════════ Boot ═══════════════════════ */
loadRemote();
setInterval(loadRemote, 30000);
window.addEventListener('focus', loadRemote);
window.addEventListener('beforeunload', () => {
  if (_isDirty) {
    const payload = JSON.stringify(data);
    navigator.sendBeacon(API_URL, new Blob([payload], { type: 'application/json' }));
  }
});
</script>
</body>
</html>
