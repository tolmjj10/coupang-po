<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 프로모션 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --card: #ffffff;
    --surface-alt: #f5f3ef;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --muted: #4d5a4c;
    --hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-soft: #f2ede9;
    --accent-softer: #f8f5f2;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
    --warm: #c9906e;
    --warm-soft: #f5e6d9;
    --plum: #a58098;
    --plum-soft: #efe4ea;
    --slate: #7a8a9a;
    --slate-soft: #e2e7ec;
    --gold: #b89968;
    --gold-soft: #f5eddb;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .container { max-width: 1720px; margin: 0 auto; padding: 20px 24px 22px; }

  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .page-header h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.024em;
    margin: 0; color: var(--text); line-height: 1.15;
  }
  #saveStatus { color: var(--muted); font-size: 12px; font-weight: 500; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--muted);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .btn:hover { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--hint); }
  .btn.ghost:hover { background: var(--accent-soft); color: var(--text); }

  .tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .tab {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--muted);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tab:hover { background: var(--accent-soft); color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 18px; padding: 0 6px;
    background: rgba(255,255,255,0.28);
    color: inherit;
    border-radius: 9px;
    font-size: 11px; font-weight: 700;
  }
  .tab:not(.active) .count { background: var(--accent-soft); color: var(--accent-dark); }
  .month-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    flex-wrap: wrap;
  }
  .month-bar-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--hint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .month-tabs .tab { height: 28px; padding: 0 11px; font-size: 12px; font-weight: 500; }
  .month-tabs .tab.active { font-weight: 600; }

  .tab.tab-icon { width: 34px; padding: 0; justify-content: center; color: var(--hint); }
  .tab.tab-icon:disabled { opacity: 0.35; cursor: not-allowed; }
  .tab.tab-icon:not(:disabled):hover { color: var(--text); }

  .spacer { flex: 1; }

  /* ─────────── Table ─────────── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    max-height: calc(100vh - 220px);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
  }
  th {
    background: var(--surface-alt);
    color: var(--muted);
    font-weight: 600;
    font-size: 11.5px;
    position: sticky; top: 0;
    z-index: 2;
    letter-spacing: -0.01em;
    line-height: 1.25;
    overflow: visible;
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: var(--accent-soft); color: var(--text); }
  th .col-resizer {
    position: absolute;
    top: 0; right: -3px;
    width: 8px; height: 100%;
    cursor: col-resize;
    user-select: none;
    z-index: 3;
    background: transparent;
  }
  th .col-resizer:hover, th .col-resizer.active {
    background: var(--accent);
    opacity: 0.5;
  }
  th:last-child, td:last-child { border-right: 0; }
  tbody tr:hover td { background: var(--accent-softer); }
  td.right { text-align: right; }
  td.left { text-align: left; }
  td.calc {
    background: #fbf9f5;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  td.calc.strong { color: var(--text); font-weight: 600; }
  td.calc.id-cell { color: var(--hint); }
  td.calc.name-cell { color: var(--text); }
  td.num { font-variant-numeric: tabular-nums; }

  /* 날짜 입력의 달력 아이콘 숨기기 (클릭 시 달력은 정상 열림) */
  input[type="date"] { cursor: pointer; position: relative; }
  input[type="date"]::-webkit-calendar-picker-indicator {
    background: transparent;
    color: transparent;
    cursor: pointer;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    opacity: 0;
  }
  input[type="date"]::-webkit-inner-spin-button { display: none; }

  /* number input spinner 제거 (수량/할인율 등) */
  td input[type="number"]::-webkit-outer-spin-button,
  td input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  td input[type="number"] { -moz-appearance: textfield; }

  td input, td select {
    width: 100%;
    height: 26px;
    padding: 0 6px;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text);
    text-align: center;
    outline: none;
    transition: border-color .12s ease, background .12s ease;
  }
  td input:hover, td select:hover { border-color: var(--border-strong); background: #fff; }
  td input:focus, td select:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(170,151,145,0.15);
  }
  td.right input { text-align: right; }
  td select { appearance: none; padding-right: 18px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6960' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 5px center;
  }

  /* 유형별 색상: 프로모션(2번째) 컬럼에만 적용 */
  tbody tr.row-골드박스 td:nth-child(2) { background: #efe4ea; color: #6a4a5a; font-weight: 600; }
  tbody tr.row-타임특가 td:nth-child(2) { background: #e6ece6; color: #4a5748; font-weight: 600; }
  tbody tr.row-기획전   td:nth-child(2) { background: #f5e6d9; color: #8a4a2a; font-weight: 600; }
  tbody tr.row-즉시할인 td:nth-child(2) { background: #f5eddb; color: #7a5a1a; font-weight: 600; }

  .type-pill {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .type-골드박스 { background: var(--plum-soft); color: #6a4a5a; }
  .type-타임특가 { background: var(--sage-soft); color: #4a5748; }
  .type-기획전   { background: var(--warm-soft); color: #8a4a2a; }
  .type-즉시할인 { background: var(--gold-soft); color: #7a5a1a; }

  .row-del {
    width: 22px; height: 22px;
    border: 0; background: transparent;
    color: var(--hint);
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
    transition: background .12s ease, color .12s ease;
  }
  .row-del:hover { background: #f5e8e3; color: #b04a3a; }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--hint);
    font-size: 13px;
  }
  .empty .big { font-size: 15px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }

  .missing { color: #b89968; font-weight: 600; }

  /* 판매가 편집 셀 (사이트 자체할인 델타 표시) */
  td.price-cell { position: relative; padding: 4px 8px; }
  td.price-cell .price-delta {
    font-size: 10px;
    color: #b04a3a;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 1px;
    font-variant-numeric: tabular-nums;
  }
  td.price-cell input.num-input {
    text-align: right;
    padding-right: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* 판매율 색상 */
  td.rate-good { background: #e6efe6 !important; color: #3a5a3a; }
  td.rate-mid  { background: #f5eddb !important; color: #7a5a1a; }
  td.rate-bad  { background: #fbe9e5 !important; color: #b04a3a; }

  .icon-btn { width: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }

  /* ─────────── 체험단 뷰 ─────────── */
  .exp-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .exp-group-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
  }
  .exp-date-input {
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    background: #fff;
    color: var(--text);
  }
  .exp-group-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .exp-group-total {
    margin-left: auto;
    font-size: 13px; font-weight: 700;
    color: var(--accent-dark);
    font-variant-numeric: tabular-nums;
  }
  .exp-group-total .label { font-size: 11px; color: var(--hint); font-weight: 500; margin-right: 6px; letter-spacing: 0.02em; }
  .exp-group table { width: 100%; border-collapse: collapse; }
  .exp-add-row {
    padding: 8px 14px;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end;
  }
  .exp-review-cell { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .exp-review-cell input[type="text"] { max-width: 60px; }
  .exp-review-cell input[type="text"]:disabled { background: var(--surface-alt); color: var(--hint); }
  .exp-review-cell input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent-dark); }
  .exp-new-date {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    margin-bottom: 12px;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* ─────────── 달력 모달 ─────────── */
  .mask {
    position: fixed; inset: 0;
    background: rgba(32,24,20,0.32);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .mask.open { display: flex; }
  .cal-modal {
    width: min(1100px, 95vw);
    max-height: 90vh;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.16);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .cal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .cal-title { font-size: 15px; font-weight: 700; min-width: 130px; text-align: center; }
  .nav-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--muted);
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--accent-soft); color: var(--text); }
  .spacer { flex: 1; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(120px, 1fr);
    gap: 1px;
    background: var(--border);
    padding: 1px;
    overflow: auto;
    flex: 1;
  }
  .cal-dow {
    background: var(--surface-alt);
    padding: 6px 0;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--hint);
    letter-spacing: 0.04em;
  }
  .cal-dow.sun { color: #b04a3a; }
  .cal-dow.sat { color: #5a6f8a; }
  .cal-cell {
    background: var(--card);
    padding: 6px;
    display: flex; flex-direction: column;
    gap: 3px;
    font-size: 11.5px;
    min-height: 100px;
  }
  .cal-cell.other-month { background: var(--surface-alt); color: var(--hint); }
  .cal-cell.today .cal-date-num { color: #b04a3a; font-weight: 700; }
  .cal-date-num { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .cal-date-num.sun { color: #b04a3a; }
  .cal-date-num.sat { color: #5a6f8a; }
  .cal-entry {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10.5px;
    line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: default;
  }
  .cal-entry.골드박스 { background: var(--plum-soft); color: #6a4a5a; }
  .cal-entry.타임특가 { background: var(--sage-soft); color: #4a5748; }
  .cal-entry.기획전   { background: var(--warm-soft); color: #8a4a2a; }
  .cal-entry.즉시할인 { background: var(--gold-soft); color: #7a5a1a; }
  .cal-entry.체험단   { background: var(--slate-soft); color: #3a4a5a; }

  .date-cell .date-stack { display: flex; flex-direction: column; gap: 3px; align-items: stretch; }
  .date-cell .date-range { display: flex; align-items: center; gap: 0; justify-content: center; }
  .date-cell .date-range input[type="date"] {
    flex: 0 0 auto;
    width: 92px;
    padding: 0 2px;
    text-align: center;
  }
  .date-cell .date-range .tilde { color: var(--hint); font-size: 11px; padding: 0 3px; }
  .date-cell .plan-title { text-align: center; padding: 0 4px; }
  .date-cell .time-sel { max-width: 100%; }
  /* 타임특가: 날짜 뒤에 시간 셀렉터. 배경 없이 날짜 입력과 동일한 느낌 */
  .date-cell .date-inline { display: flex; align-items: center; gap: 3px; }
  .date-cell .time-sel-compact {
    flex-shrink: 0;
    width: 46px;
    padding: 0 4px;
    font-size: 12px;
    color: var(--text);
    background-color: transparent;
    background-image: none; /* 드롭다운 화살표 숨김 */
    border: 1px solid transparent;
    text-align: center;
    cursor: pointer;
  }
  .date-cell .time-sel-compact:hover { border-color: var(--border-strong); background-color: #fff; }
  .date-cell .time-sel-compact:focus { border-color: var(--accent); background-color: #fff; }
  .date-cell .date-inline input[type="date"] { min-width: 0; flex: 1; padding: 0 4px; }

  /* 골드박스·타임특가 14일 중복 경고 */
  td.sku-conflict input {
    background: #fbe9e5;
    border-color: #e8b8ae;
    color: #b04a3a;
    font-weight: 700;
  }
  td.sku-conflict input:focus {
    border-color: #b04a3a;
    box-shadow: 0 0 0 3px rgba(176,74,58,0.15);
  }
  .conflict-tip {
    display: inline-block;
    margin-left: 4px;
    color: #b04a3a;
    font-size: 11px;
    font-weight: 700;
    cursor: help;
  }
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1>프로모션</h1>
    <span id="saveStatus">—</span>
  </div>

  <div class="month-bar">
    <span class="month-bar-label">월별</span>
    <div class="tabs month-tabs" id="monthTabs"></div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <button class="btn" id="saveBtn" title="지금 바로 공유 저장">저장</button>
    <button class="btn icon-btn" id="calBtn" title="달력 보기" aria-label="달력 보기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
    <button class="btn primary" id="addBtn">＋ 프로모션 추가</button>
    <button class="btn" id="reloadBtn" title="마진/VIID·PID 데이터 다시 불러오기">↻ 데이터 갱신</button>
  </div>

  <div class="table-wrap" id="mainWrap">
    <table id="tbl">
      <thead>
        <tr>
          <th style="width:206px" class="sortable" id="dateSortTh" title="클릭하여 정렬 방향 전환">날짜<span id="dateSortIcon" style="margin-left:4px; font-size:10px; opacity:.75;">▼</span></th>
          <th style="width:108px">프로모션</th>
          <th style="width:148px">SKU ID</th>
          <th style="width:104px">VIID</th>
          <th style="width:104px">PID</th>
          <th style="width:180px" class="left">SKU 명</th>
          <th style="width:88px">할인율/금액</th>
          <th style="width:92px">판매가</th>
          <th style="width:90px">할인금액</th>
          <th style="width:92px">프로모션가</th>
          <th style="width:100px">현재오아마진</th>
          <th style="width:92px">프로모션<br>마진(-vat)</th>
          <th style="width:92px">프로모션<br>오아마진율</th>
          <th style="width:98px">공급가(-vat)</th>
          <th style="width:70px">수량</th>
          <th style="width:76px">판매량</th>
          <th style="width:74px">판매율</th>
          <th style="width:90px">총 매출</th>
          <th style="width:86px">총 마진</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">
      <div class="big">등록된 프로모션이 없습니다</div>
      <div>상단 [＋ 프로모션 추가] 버튼으로 시작하세요</div>
    </div>
  </div>

  <div id="expWrap" style="display:none"></div>
</div>

<!-- 달력 모달 -->
<div class="mask" id="calMask">
  <div class="cal-modal">
    <div class="cal-head">
      <button class="nav-btn" id="calPrev">‹</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="nav-btn" id="calNext">›</button>
      <button class="btn ghost" id="calToday">오늘</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="calClose">닫기</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<script>
const API_URL = '/api/promotion-state';
const MARGIN_URL = '/api/margin-state';
const REPO_CFG = { owner:'tolmjj10', repo:'coupang-po', branch:'main', dir:'promotion/viid_pid' };
const TYPES = ['골드박스','타임특가','기획전','즉시할인','체험단'];
const RESTRICTED_TYPES = new Set(['골드박스','타임특가']);
const RESTRICT_DAYS = 14;
const EXPERIENCE_BASE_COST = 125000;
const TIMES = ['07','15','23'];
const STORAGE_KEY = 'promotion_state_local';
const MARGIN_CACHE_KEY = 'promotion_margin_cache';
const VIID_CACHE_KEY = 'promotion_viid_cache';
const TOMBSTONE_KEY = 'promotion_tombstones';
const TOMBSTONE_TTL_MS = 120000; // 2분 — Cloudflare KV 전파 시간 여유
let tombstones = {}; // { id: timestamp } — 최근 삭제된 행. loadRemote가 이걸 필터링해서 KV 지연으로 부활 방지

let data = [];        // rows
let marginMap = {};   // skuId → {name, cost, price, originN, supply, curMargin}
let viidMap = {};     // skuId → {viid, pid}
let activeTab = '전체';
const _now = new Date();
let activeMonth = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}`;
// 정렬 방향: 'none'(입력 순), 'asc'(오름차순), 'desc'(내림차순). 기본은 none — 사용자가 입력한 순서 유지
let sortDir = (function() {
  const v = localStorage.getItem('promotion_sort_dir');
  return (v === 'asc' || v === 'desc') ? v : 'none';
})();

const $ = id => document.getElementById(id);
const uid = () => 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (n==null||!isFinite(n)) ? '' : Math.round(n).toLocaleString('ko-KR');
const fmtPct = n => (n==null||!isFinite(n)) ? '' : (n*100).toFixed(1)+'%';
const parseN = v => { if(v==null||v==='') return null; const n=parseFloat(String(v).replace(/[,\s%원]/g,'')); return isFinite(n)?n:null; };
function fmtDiscount(v) {
  const n = parseN(v);
  if (n == null) return '';
  if (n < 100) return String(n) + '%';
  return Math.round(n).toLocaleString('ko-KR');
}

/* ═══════════════════════ 14일 중복 검사 (골드박스/타임특가) ═══════════════════════ */
function findConflict(row) {
  if (!RESTRICTED_TYPES.has(row.type)) return null;
  const sku = String(row.skuId||'').trim();
  if (!sku || !row.date) return null;
  const d0 = new Date(row.date); if (isNaN(d0)) return null;
  for (const other of data) {
    if (other.id === row.id) continue;
    if (!RESTRICTED_TYPES.has(other.type)) continue;
    if (String(other.skuId||'').trim() !== sku) continue;
    if (!other.date) continue;
    const d1 = new Date(other.date); if (isNaN(d1)) continue;
    const diff = Math.abs(Math.round((d0 - d1) / 86400000));
    if (diff < RESTRICT_DAYS) return { other, diff };
  }
  return null;
}

/* ═══════════════════════ 파생 계산 ═══════════════════════ */
function derive(r) {
  const m = marginMap[String(r.skuId||'').trim()] || null;
  const vp = viidMap[String(r.skuId||'').trim()] || null;
  const skuName = m ? m.name : '';
  // 판매가: 행 생성 시점의 마진 소비자가를 priceBase에 스냅샷, 사용자가 수정하면 priceEdit
  const priceBase = (r.priceBase != null) ? parseN(r.priceBase) : (m ? m.price : null);
  const priceEdit = (r.priceEdit != null && r.priceEdit !== '') ? parseN(r.priceEdit) : null;
  const salePrice = (priceEdit != null) ? priceEdit : priceBase;
  const priceDelta = (priceEdit != null && priceBase != null) ? (priceBase - priceEdit) : null; // 양수면 추가할인
  const supply = m ? m.supply : null;
  const curMargin = m ? m.curMargin : null;
  const viid = vp ? vp.viid : '';
  const pid = vp ? vp.pid : '';
  // 할인율/금액: <100 이면 %(퍼센트), >=100 이면 원화 금액으로 해석
  const rate = parseN(r.discountRate);
  let discAmt = null;
  if (rate != null) {
    if (rate < 100) {
      discAmt = (salePrice != null) ? Math.round(salePrice * rate/100) : null;
    } else {
      discAmt = Math.round(rate);
    }
  }
  const promoPrice = (salePrice!=null && discAmt!=null) ? salePrice - discAmt : null;
  const promoMargin = (curMargin!=null && discAmt!=null) ? curMargin - discAmt : null;
  const promoMarginRate = (promoMargin!=null && supply) ? promoMargin/supply : null;
  // 분석 지표 (골드박스/타임특가에서만 의미 있음, 다른 유형은 계산되어도 표시 안 함)
  const qty = parseN(r.qty);
  const sold = parseN(r.sold);
  const soldRate = (sold != null && qty) ? sold/qty : null;
  const totalRevenue = (sold != null && promoPrice != null) ? sold * promoPrice : null;
  const totalMargin  = (sold != null && promoMargin != null) ? sold * promoMargin : null;
  return { m, skuName, salePrice, priceBase, priceDelta, supply, curMargin, viid, pid, discAmt, promoPrice, promoMargin, promoMarginRate, soldRate, totalRevenue, totalMargin };
}

/* ═══════════════════════ Render ═══════════════════════ */
function rowInMonth(r, ym) {
  if (ym === '__ALL__') return true;
  if (!r.date) return false;
  const rowStart = r.date.slice(0,7);
  const rowEnd = (r.endDate || r.date).slice(0,7);
  // 기간이 걸치는 달이면 포함 (기획전/즉시할인 등)
  return rowStart <= ym && ym <= rowEnd;
}

function sortByDate(arr) {
  if (sortDir === 'none') return arr; // 입력 순 유지
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...arr].sort((a, b) => {
    const ad = String(a.date || '');
    const bd = String(b.date || '');
    if (!ad && !bd) return 0;
    if (!ad) return 1;   // 빈 날짜는 항상 뒤로
    if (!bd) return -1;
    return ad < bd ? -1*dir : ad > bd ? 1*dir : 0;
  });
}
function updateSortIcon() {
  const el = document.getElementById('dateSortIcon');
  if (!el) return;
  if (sortDir === 'asc') { el.textContent = '▲'; el.style.opacity = '0.85'; }
  else if (sortDir === 'desc') { el.textContent = '▼'; el.style.opacity = '0.85'; }
  else { el.textContent = '⇅'; el.style.opacity = '0.35'; }
}

function renderMonthTabs() {
  const monthsSet = new Set();
  data.forEach(r => {
    if (r.date && /^\d{4}-\d{2}/.test(r.date)) monthsSet.add(r.date.slice(0,7));
    if (r.endDate && /^\d{4}-\d{2}/.test(r.endDate)) monthsSet.add(r.endDate.slice(0,7));
  });
  if (activeMonth && activeMonth !== '__ALL__') monthsSet.add(activeMonth); // 현재 활성 월은 데이터 없어도 표시. '__ALL__'은 뒤에서 붙이므로 제외
  const now = new Date();
  monthsSet.add(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
  const months = [...monthsSet].sort().reverse();
  const options = ['__ALL__', ...months];
  const counts = {};
  months.forEach(m => counts[m] = data.filter(r => rowInMonth(r, m)).length);
  counts['__ALL__'] = data.length;
  $('monthTabs').innerHTML = options.map(m => {
    const label = m === '__ALL__' ? '전체 기간' : `${m.slice(0,4)}년 ${parseInt(m.slice(5,7),10)}월`;
    return `<button class="tab ${activeMonth===m?'active':''}" data-month="${m}">${label}<span class="count">${counts[m]||0}</span></button>`;
  }).join('');
  $('monthTabs').querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => { activeMonth = el.dataset.month; render(); });
  });
}

function renderTabs() {
  const inMonth = data.filter(r => rowInMonth(r, activeMonth));
  const counts = { '전체': inMonth.filter(r => r.type !== '체험단').length };
  TYPES.forEach(t => counts[t] = inMonth.filter(r => r.type === t).length);
  const tabs = ['전체', ...TYPES];
  const undoDisabled = undoStack.length === 0 ? 'disabled' : '';
  const redoDisabled = redoStack.length === 0 ? 'disabled' : '';
  const parts = [];
  tabs.forEach(t => {
    if (t === '체험단') {
      parts.push(`<button class="tab tab-icon" id="undoBtn" ${undoDisabled} title="되돌리기 (Ctrl+Z)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
      </button>`);
      parts.push(`<button class="tab tab-icon" id="redoBtn" ${redoDisabled} title="다시하기 (Ctrl+Y)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
      </button>`);
    }
    parts.push(`<button class="tab ${activeTab===t?'active':''}" data-tab="${t}">
      ${t}<span class="count">${counts[t]||0}</span>
    </button>`);
  });
  $('tabs').innerHTML = parts.join('');
  $('tabs').querySelectorAll('.tab[data-tab]').forEach(el => {
    el.addEventListener('click', () => { activeTab = el.dataset.tab; render(); });
  });
  const ub = document.getElementById('undoBtn');
  const rb = document.getElementById('redoBtn');
  if (ub) ub.addEventListener('click', doUndo);
  if (rb) rb.addEventListener('click', doRedo);
}

function render() {
  // 재렌더 전 현재 포커스/커서 위치 스냅샷 → 재렌더 후 복원
  const focusInfo = captureFocus();
  renderMonthTabs();
  renderTabs();
  updateSortIcon();
  if (activeTab === '체험단') {
    $('mainWrap').style.display = 'none';
    $('expWrap').style.display = 'block';
    renderExperience();
    restoreFocus(focusInfo);
    return;
  }
  $('mainWrap').style.display = 'block';
  $('expWrap').style.display = 'none';
  // 전체 탭에선 체험단 제외 (별도 뷰이므로) + 월 필터
  let visible = data.filter(r => {
    if (r.type === '체험단') return false;
    if (!rowInMonth(r, activeMonth)) return false;
    return activeTab==='전체' || r.type === activeTab;
  });
  visible = sortByDate(visible);
  $('emptyState').style.display = visible.length ? 'none' : 'block';
  $('tbody').innerHTML = visible.map(r => rowHtml(r)).join('');
  wireRow();
  restoreFocus(focusInfo);
}

function captureFocus() {
  const el = document.activeElement;
  if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'SELECT' && el.tagName !== 'TEXTAREA')) return null;
  const tr = el.closest('tr[data-id]');
  const groupEl = el.closest('[data-group-date]');
  const info = { k: el.dataset.k, tag: el.tagName };
  if (el.tagName !== 'SELECT') { info.start = el.selectionStart; info.end = el.selectionEnd; }
  if (tr) { info.scope = 'row'; info.rowId = tr.dataset.id; }
  else if (groupEl) { info.scope = 'group'; info.groupDate = groupEl.dataset.groupDate; }
  else info.scope = 'byId', info.id = el.id;
  return info;
}
function restoreFocus(info) {
  if (!info) return;
  let el = null;
  if (info.scope === 'row' && info.rowId) {
    el = document.querySelector(`tr[data-id="${CSS.escape(info.rowId)}"] [data-k="${info.k}"]`);
  } else if (info.scope === 'group' && info.groupDate) {
    el = document.querySelector(`[data-group-date="${CSS.escape(info.groupDate)}"]`);
  } else if (info.scope === 'byId' && info.id) {
    el = document.getElementById(info.id);
  }
  if (!el) return;
  el.focus();
  if (info.tag !== 'SELECT' && info.start != null) {
    try { el.setSelectionRange(info.start, info.end); } catch(_) {}
  }
}

/* ═══════════════════════ 체험단 뷰 ═══════════════════════ */
function renderExperience() {
  const rows = data.filter(r => r.type === '체험단' && rowInMonth(r, activeMonth));
  // 날짜별 그룹화
  const groups = {};
  rows.forEach(r => {
    const key = r.date || '(날짜 없음)';
    (groups[key] = groups[key] || []).push(r);
  });
  const dateKeys = sortDir === 'none'
    ? Object.keys(groups) // 입력 순 유지
    : Object.keys(groups).sort((a,b) => sortDir === 'asc' ? a.localeCompare(b) : b.localeCompare(a));
  let html = '';
  if (dateKeys.length === 0) {
    html = `<div class="empty" style="background:var(--card);border:1px solid var(--border);border-radius:12px;">
      <div class="big">등록된 체험단이 없습니다</div>
      <div>상단 [＋ 프로모션 추가] 버튼으로 새 날짜 그룹을 만드세요</div>
    </div>`;
  }
  dateKeys.forEach(dk => {
    const items = groups[dk];
    let groupTotal = 0;
    const rowsHtml = items.map(r => {
      const m = marginMap[String(r.skuId||'').trim()] || null;
      const supply = m ? m.supply : null;
      const qty = parseN(r.qty) || 0;
      const total = (supply != null) ? (EXPERIENCE_BASE_COST + supply) * qty : null;
      if (total != null) groupTotal += total;
      const missingSku = r.skuId && !m;
      const reviewChecked = !!r.reviewChecked;
      return `<tr data-id="${r.id}" class="row-체험단">
        <td><input type="text" data-k="skuId" value="${esc(r.skuId||'')}" placeholder="SKU"></td>
        <td class="left calc ${missingSku?'missing':''}" title="${esc(m?m.name:'')}">${esc(m?m.name:'') || (missingSku?'매칭 SKU 없음':'')}</td>
        <td class="right calc num">${fmtN(EXPERIENCE_BASE_COST)}</td>
        <td class="right calc num">${fmtN(supply)}</td>
        <td><input type="text" inputmode="numeric" pattern="[0-9]*" data-k="qty" value="${esc(r.qty??'')}"></td>
        <td class="right calc num strong">${fmtN(total)}</td>
        <td>
          <div class="exp-review-cell">
            ${reviewChecked ? '' : `<input type="text" inputmode="numeric" pattern="[0-9]*" data-k="reviewCount" value="${esc(r.reviewCount??'')}" placeholder="리뷰">`}
            <input type="checkbox" data-k="reviewChecked" ${reviewChecked?'checked':''} title="리뷰 작성 완료">
          </div>
        </td>
        <td><button class="row-del" title="삭제" data-row-id="${esc(r.id)}" onmousedown="event.preventDefault()" onclick="window.deleteExpRow(this.dataset.rowId)">✕</button></td>
      </tr>`;
    }).join('');
    html += `<div class="exp-group" data-date="${esc(dk)}">
      <div class="exp-group-head">
        <input type="date" class="exp-date-input" value="${esc(dk==='(날짜 없음)'?'':dk)}" data-group-date="${esc(dk)}">
        <span class="exp-group-title">체험단</span>
        <span class="exp-group-total"><span class="label">총 비용</span>${fmtN(groupTotal)}원</span>
      </div>
      <table>
        <thead><tr>
          <th style="width:100px">SKU ID</th>
          <th style="width:260px" class="left">SKU 명</th>
          <th style="width:100px">기본비</th>
          <th style="width:110px">공급가(-vat)</th>
          <th style="width:80px">수량</th>
          <th style="width:120px">총 비용</th>
          <th style="width:130px">리뷰여부</th>
          <th style="width:32px"></th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="exp-add-row">
        <button class="btn" data-add-exp="${esc(dk)}">＋ 이 날짜에 SKU 추가</button>
      </div>
    </div>`;
  });
  html += `<div class="exp-new-date">
    <span>새 날짜 그룹 만들기:</span>
    <input type="date" id="expNewDate">
    <button class="btn primary" id="expNewBtn">＋ 그룹 추가</button>
  </div>`;
  $('expWrap').innerHTML = html;
  wireExperience();
}

window.deleteExpRow = async function(id) {
  const targetId = String(id||'').trim();
  if (!confirm('이 SKU를 삭제할까요?')) return;
  data = data.filter(x => String(x.id) !== targetId);
  addTombstone(targetId);
  save();
  render();
  clearTimeout(_saveTimer);
  await saveRemote();
};

function wireExperience() {
  $('expWrap').querySelectorAll('tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelectorAll('input').forEach(el => {
      const k = el.dataset.k;
      const evt = (el.type === 'checkbox') ? 'change' : 'change';
      el.addEventListener(evt, () => {
        const row = data.find(x => x.id === id); if (!row) return;
        if (el.type === 'checkbox') row[k] = el.checked;
        else row[k] = el.value;
        save();
        if (k === 'skuId' || k === 'qty' || k === 'reviewChecked') scheduleRender();
      });
    });
  });
  // 그룹 날짜 변경 → 그룹에 속한 모든 행의 날짜 일괄 수정
  $('expWrap').querySelectorAll('.exp-date-input').forEach(el => {
    el.addEventListener('change', () => {
      const oldDate = el.dataset.groupDate;
      const newDate = el.value;
      if (!newDate) return;
      data.forEach(r => {
        if (r.type === '체험단' && (r.date||'(날짜 없음)') === oldDate) r.date = newDate;
      });
      save(); render();
    });
  });
  // 이 날짜에 SKU 추가
  $('expWrap').querySelectorAll('[data-add-exp]').forEach(btn => {
    btn.addEventListener('click', () => {
      const dk = btn.dataset.addExp;
      data.push({
        id: uid(),
        type: '체험단',
        date: dk === '(날짜 없음)' ? '' : dk,
        skuId: '', qty: '', reviewCount: '', reviewChecked: false
      });
      save(); render();
    });
  });
  // 새 날짜 그룹
  const newBtn = document.getElementById('expNewBtn');
  if (newBtn) newBtn.addEventListener('click', () => {
    const v = document.getElementById('expNewDate').value;
    if (!v) { alert('날짜를 선택하세요'); return; }
    data.push({
      id: uid(), type: '체험단', date: v,
      skuId: '', qty: '', reviewCount: '', reviewChecked: false
    });
    save(); render();
  });
}

function analyticsCellsHtml(r, d) {
  // 체험단은 별도 뷰이므로 제외, 그 외 모든 유형에서 판매량/판매율/총매출/총마진 활성
  const isAnalyzable = r.type && r.type !== '체험단';
  if (!isAnalyzable) {
    return `<td class="calc"></td><td class="calc"></td><td class="calc"></td><td class="calc"></td>`;
  }
  let rateCls = 'calc num';
  if (d.soldRate != null) {
    if (d.soldRate >= 0.8) rateCls += ' rate-good';
    else if (d.soldRate >= 0.5) rateCls += ' rate-mid';
    else rateCls += ' rate-bad';
  }
  return `
    <td><input type="text" inputmode="numeric" pattern="[0-9]*" data-k="sold" value="${esc(r.sold??'')}"></td>
    <td class="right ${rateCls} strong">${fmtPct(d.soldRate)}</td>
    <td class="right calc num">${fmtN(d.totalRevenue)}</td>
    <td class="right calc num strong">${fmtN(d.totalMargin)}</td>`;
}

function dateCellHtml(r) {
  const dateInput = `<input type="date" data-k="date" value="${esc(r.date||'')}">`;
  if (r.type === '타임특가') {
    // 타임특가 탭에서만 시간 셀렉터 노출. 전체 탭에서는 골드박스와 동일하게 날짜만 표시
    if (activeTab === '타임특가') {
      return `<div class="date-inline">
        ${dateInput}
        <select data-k="time" class="time-sel-compact" title="시간 선택">
          <option value="">시간</option>
          ${TIMES.map(t=>`<option value="${t}" ${r.time===t?'selected':''}>${t}시</option>`).join('')}
        </select>
      </div>`;
    }
    return dateInput;
  }
  if (r.type === '기획전') {
    return `<div class="date-stack">
      <div class="date-range">${dateInput}<span class="tilde">~</span><input type="date" data-k="endDate" value="${esc(r.endDate||'')}"></div>
      <input type="text" data-k="title" value="${esc(r.title||'')}" placeholder="기획전명" class="plan-title">
    </div>`;
  }
  if (r.type === '즉시할인') {

  return dateInput;
}

function wireRow() {
  $('tbody').querySelectorAll('tr').forEach(tr => {
    const id = tr.dataset.id;
    // 할인율/금액·판매가 편집 편의: 포커스 시 원본값(포맷 제거) 보이도록
    tr.querySelectorAll('input.disc-input, input.num-input').forEach(el => {
      el.addEventListener('focus', () => {
        const raw = parseN(el.value);
        el.value = raw != null ? String(raw) : '';
        el.select();
      });
    });
    tr.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('change', () => {
        const row = data.find(x => x.id === id); if (!row) return;
        const k = el.dataset.k;
        // priceEdit은 콤마 제거 후 숫자만
        if (k === 'priceEdit') {
          const v = el.value.replace(/[,\s]/g,'');
          row.priceEdit = v === '' ? null : v;
        } else {
          row[k] = el.value;
        }
        // SKU 변경 시 → 신규 SKU의 현재 마진 가격을 priceBase에 스냅샷 + 사용자 오버라이드 리셋
        if (k === 'skuId') {
          const m = marginMap[String(row.skuId||'').trim()];
          row.priceBase = m ? m.price : null;
          row.priceEdit = null;
        }
        save();
        if (k === 'skuId' || k === 'discountRate' || k === 'type' || k === 'date' || k === 'sold' || k === 'qty' || k === 'priceEdit') {
          // 클릭·드롭다운이 완전히 끝난 뒤 재렌더. 인접 select/버튼 클릭이 유실되지 않도록 여유 지연
          scheduleRender();
        }
      });
    });
  });
}

/* ═══════════════════════ 저장/로드 ═══════════════════════ */
let _saveTimer = null;
let _isDirty = false;
let undoStack = [];
let redoStack = [];
const UNDO_MAX = 30;
let _prevSnapshot = null;
function snapshot() { return JSON.stringify(data); }
function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(_prevSnapshot);
  const snap = undoStack.pop();
  data = JSON.parse(snap);
  _prevSnapshot = snap;
  _isDirty = true;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  clearTimeout(_saveTimer); _saveTimer = setTimeout(saveRemote, 400);
  saveStatus('● 되돌림');
  render();
}
function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(_prevSnapshot);
  const snap = redoStack.pop();
  data = JSON.parse(snap);
  _prevSnapshot = snap;
  _isDirty = true;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  clearTimeout(_saveTimer); _saveTimer = setTimeout(saveRemote, 400);
  saveStatus('● 다시하기');
  render();
}
function saveStatus(t) { $('saveStatus').textContent = t; }

function save() {
  // 이전 스냅샷을 undo 스택에 push
  if (_prevSnapshot !== null) {
    undoStack.push(_prevSnapshot);
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  }
  redoStack.length = 0;
  _prevSnapshot = snapshot();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  _isDirty = true;
  saveStatus('● 미저장');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveRemote, 60000); // 1분 자동 저장
}
async function saveRemote(opts) {
  const force = opts && opts.force;
  if (!_isDirty && !force) return;
  saveStatus('저장 중…');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    _isDirty = false;
    saveStatus('저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  } catch (e) {
    saveStatus('저장 실패');
    console.warn('[promotion] saveRemote 실패:', e.message);
  }
}
function addTombstone(id) {
  tombstones[id] = Date.now();
  try { localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tombstones)); } catch(_) {}
}
function pruneTombstones() {
  const now = Date.now();
  let changed = false;
  for (const k in tombstones) {
    if (now - tombstones[k] > TOMBSTONE_TTL_MS) { delete tombstones[k]; changed = true; }
  }
  if (changed) { try { localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tombstones)); } catch(_) {} }
}
async function loadRemote() {
  // 미저장 로컬 변경이 있으면 원격 응답을 로컬에 적용하지 않음 (편집값 유실 방지)
  if (_isDirty) { console.log('[promotion] loadRemote 스킵 — 미저장 로컬 변경 있음'); return; }
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const arr = await res.json();
    if (_isDirty) { console.log('[promotion] loadRemote 응답 무시 — 그 사이 로컬 편집 발생'); return; }
    let fresh = Array.isArray(arr) ? arr : (arr.rows || []);
    // 툼스톤 필터 — 최근 삭제한 행이 KV 지연으로 돌아오는 것 차단
    pruneTombstones();
    const tombKeys = Object.keys(tombstones);
    if (tombKeys.length) {
      const before = fresh.length;
      fresh = fresh.filter(r => !tombstones[String(r.id)]);
      if (fresh.length < before) console.log('[promotion] 툼스톤 필터로', before - fresh.length, '건 차단');
    }
    data = fresh;
    // 하위호환: id 보장 + priceBase 미설정 행은 현재 마진에서 스냅샷
    data.forEach(r => {
      if (!r.id) r.id = uid();
      if (r.priceBase == null && r.skuId) {
        const m = marginMap[String(r.skuId).trim()];
        if (m && m.price != null) r.priceBase = m.price;
      }
    });
    _prevSnapshot = snapshot();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    render();
    saveStatus('불러옴');
  } catch (e) {
    console.warn('[promotion] loadRemote 실패:', e.message);
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) { try { data = JSON.parse(cached); render(); saveStatus('오프라인'); } catch(_){} }
  }
}

async function loadMargin() {
  try {
    const res = await fetch(MARGIN_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    const rows = Array.isArray(j) ? j : (j.rows || []);
    marginMap = {};
    rows.forEach(r => {
      const sku = String(r.sku||'').trim();
      if (!sku) return;
      const cost = parseN(r.cost);
      const price = parseN(r.price);
      const originN = parseN(r.originN);
      const supply = cost!=null ? cost/1.1 : null;
      const curMargin = (supply!=null && originN!=null) ? supply - originN : null;
      marginMap[sku] = { name: r.name||'', cost, price, originN, supply, curMargin };
    });
    try { localStorage.setItem(MARGIN_CACHE_KEY, JSON.stringify(marginMap)); } catch(_) {}
    console.log('[promotion] margin 로드', Object.keys(marginMap).length,'건');
    scheduleRender();
  } catch (e) {
    console.warn('[promotion] loadMargin 실패:', e.message);
  }
}

/* ═══════════════════════ VIID/PID 엑셀 ═══════════════════════ */
let _xlsxLoading = null;
function ensureXlsx() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('XLSX load failed'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
async function loadViidPid() {
  try {
    const listUrl = '/api/repo-files?path=' + encodeURIComponent(REPO_CFG.dir) + '&ref=' + REPO_CFG.branch;
    const listRes = await fetch(listUrl);
    if (!listRes.ok) throw new Error('list HTTP '+listRes.status);
    const files = await listRes.json();
    const NAME_RE = /viid.*pid.*확인/i;
    const target = (files||[]).find(f => f.type==='file' && NAME_RE.test(f.name) && /\.xlsx?$/i.test(f.name));
    if (!target) { console.log('[promotion] viid_pid확인 파일 없음'); return; }
    await ensureXlsx();
    const abRes = await fetch(target.download_url);
    if (!abRes.ok) throw new Error('file HTTP '+abRes.status);
    const ab = await abRes.arrayBuffer();
    const wb = XLSX.read(ab, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (aoa.length < 2) return;
    // 헤더 행 자동 감지 (SKU / VIID / PID 헤더 포함하는 행)
    let hIdx = -1;
    for (let i=0; i<Math.min(aoa.length, 10); i++) {
      const row = (aoa[i]||[]).map(v => String(v||'').toUpperCase().replace(/\s+/g,''));
      const hasSku  = row.some(c => /SKU/.test(c));
      const hasViid = row.some(c => /VIID|옵션ID|옵션아이디/.test(c));
      const hasPid  = row.some(c => /(^|[^A-Z])PID|노출ID|상품ID/.test(c));
      if (hasSku && (hasViid || hasPid)) { hIdx = i; break; }
    }
    if (hIdx < 0) { console.warn('[promotion] viid_pid 헤더 감지 실패'); return; }
    const header = (aoa[hIdx]||[]).map(v => String(v||'').toUpperCase().replace(/\s+/g,''));
    const skuCol  = header.findIndex(h => /SKU/.test(h) && !/명|NAME/.test(h));
    const viidCol = header.findIndex(h => /VIID|옵션ID|옵션아이디/.test(h));
    const pidCol  = header.findIndex(h => /(^|[^A-Z])PID|노출ID|상품ID/.test(h));
    viidMap = {};
    for (let r = hIdx+1; r < aoa.length; r++) {
      const row = aoa[r]||[];
      const sku = String(row[skuCol]||'').trim();
      if (!sku) continue;
      viidMap[sku] = {
        viid: viidCol>=0 ? String(row[viidCol]||'').trim() : '',
        pid:  pidCol>=0  ? String(row[pidCol] ||'').trim() : ''
      };
    }
    try { localStorage.setItem(VIID_CACHE_KEY, JSON.stringify(viidMap)); } catch(_) {}
    console.log('[promotion] VIID/PID 매핑 로드', Object.keys(viidMap).length,'건');
    scheduleRender();
  } catch (e) {
    console.warn('[promotion] loadViidPid 실패:', e.message);
  }
}

function openCal() {
  const year = calAnchor.getFullYear();
  const month = calAnchor.getMonth();
  $('calTitle').textContent = `${year}년 ${month+1}월`;
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const gridStart = new Date(year, month, 1 - startDow);
  const cells = [];
  for (let i=0;i<42;i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    cells.push(d);
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const dowNames = ['일','월','화','수','목','금','토'];
  let html = dowNames.map((n,i) => `<div class="cal-dow ${i===0?'sun':(i===6?'sat':'')}">${n}</div>`).join('');
  cells.forEach(d => {
    const dow = d.getDay();
    const isOther = d.getMonth() !== month;
    const isToday = d.getTime() === today.getTime();
    const dayEntries = calEntriesForDate(d);
    const dnCls = ['cal-date-num'];
    if (dow===0) dnCls.push('sun'); else if (dow===6) dnCls.push('sat');
    html += `<div class="cal-cell ${isOther?'other-month':''} ${isToday?'today':''}">
      <div class="${dnCls.join(' ')}">${d.getDate()}</div>
      ${dayEntries.map(e => `<div class="cal-entry ${e.type}" title="${esc(e.tooltip)}">${esc(e.text)}</div>`).join('')}
    </div>`;
  });
  $('calGrid').innerHTML = html;
  $('calMask').classList.add('open');
}

function calEntriesForDate(d) {
  const ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const out = [];
  data.forEach(r => {
    if (!r.type) return;
    const m = marginMap[String(r.skuId||'').trim()];
    const name = m ? m.name : (r.skuId||'-');
    const inRange = (r.date && r.endDate) ? (ymd >= r.date && ymd <= r.endDate) : (r.date === ymd);
    if (r.type === '기획전') {
      if (inRange) out.push({ type:'기획전', text:`기획전: ${r.title||'(이름 없음)'}`, tooltip:`${r.date||''}${r.endDate?'~'+r.endDate:''} ${r.title||''}` });
    } else if (r.type === '즉시할인') {
      if (inRange) out.push({ type:'즉시할인', text:`즉시할인: ${name}`, tooltip:`${r.date||''}${r.endDate?'~'+r.endDate:''} ${name}` });
    } else if (r.date === ymd) {
      if (r.type === '골드박스') out.push({ type:'골드박스', text:`골드박스: ${name}`, tooltip:name });
      else if (r.type === '타임특가') out.push({ type:'타임특가', text:`${r.time?r.time+'시 ':''}타임특가: ${name}`, tooltip:name });
      else if (r.type === '체험단') out.push({ type:'체험단', text:`체험단: ${name}`, tooltip:name });
    }
  });
  // 기획전은 그룹당 하루에 1개만 (dedup)
  const seen = new Set();
  return out.filter(e => {
    const key = e.type + '|' + e.text;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
}

/* ═══════════════════════ 컬럼 리사이즈 ═══════════════════════ */
const COL_WIDTH_KEY = 'promotion_col_widths';
function initColResize() {
  const ths = document.querySelectorAll('#tbl thead th');
  // 저장된 너비 복원
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(COL_WIDTH_KEY)||'{}') || {}; } catch(_) {}
  ths.forEach((th, idx) => {
    if (saved[idx] && idx < ths.length - 1) th.style.width = saved[idx] + 'px';
    // 마지막(삭제 버튼) 컬럼은 리사이즈 제외
    if (idx === ths.length - 1) return;
    // 이미 붙어있으면 재삽입 방지
    if (th.querySelector('.col-resizer')) return;
    const grip = document.createElement('span');
    grip.className = 'col-resizer';
    th.appendChild(grip);
    grip.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      grip.classList.add('active');
      const startX = e.clientX;
      const startW = th.getBoundingClientRect().width;
      document.body.style.cursor = 'col-resize';
      function onMove(ev) {
        const w = Math.max(40, startW + (ev.clientX - startX));
        th.style.width = w + 'px';
      }
      function onUp() {
        grip.classList.remove('active');
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        // 저장
        const widths = {};
        document.querySelectorAll('#tbl thead th').forEach((h, i) => {
          widths[i] = Math.round(h.getBoundingClientRect().width);
        });
        try { localStorage.setItem(COL_WIDTH_KEY, JSON.stringify(widths)); } catch(_) {}
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

/* ═══════════════════════ Boot ═══════════════════════ */
(async () => {
  // 캐시된 로컬 데이터/마진/VIID·PID 를 먼저 복원해 즉시 표시 (원격 갱신은 백그라운드에서 진행)
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      const arr = JSON.parse(cached);
      if (Array.isArray(arr)) {
        data = arr;
        data.forEach(r => { if (!r.id) r.id = uid(); });
      }
    }
    const mCache = localStorage.getItem(MARGIN_CACHE_KEY);
    if (mCache) { const m = JSON.parse(mCache); if (m && typeof m === 'object') marginMap = m; }
    const vCache = localStorage.getItem(VIID_CACHE_KEY);
    if (vCache) { const v = JSON.parse(vCache); if (v && typeof v === 'object') viidMap = v; }
    const tCache = localStorage.getItem(TOMBSTONE_KEY);
    if (tCache) { const t = JSON.parse(tCache); if (t && typeof t === 'object') tombstones = t; }
    pruneTombstones();
  } catch (_) {}
  render();
  initColResize();
  await Promise.all([loadMargin(), loadViidPid()]);
  await loadRemote();
})();
setInterval(loadRemote, 30000);
window.addEventListener('focus', loadRemote);
window.addEventListener('beforeunload', () => {
  if (_isDirty) {
    const payload = JSON.stringify(data);
    navigator.sendBeacon(API_URL, new Blob([payload], { type: 'application/json' }));
  }
});
</script>
