<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 프로모션 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --card: #ffffff;
    --surface-alt: #f5f3ef;
    --border: #ebe6df;
    --border-strong: #d9d1c8;
    --text: #2a1a15;
    --muted: #4d5a4c;
    --hint: #7a706a;
    --accent: #aa9791;
    --accent-dark: #8b756c;
    --accent-soft: #f2ede9;
    --accent-softer: #f8f5f2;
    --sage: #b1c0b2;
    --sage-soft: #e6ece6;
    --warm: #c9906e;
    --warm-soft: #f5e6d9;
    --plum: #a58098;
    --plum-soft: #efe4ea;
    --slate: #7a8a9a;
    --slate-soft: #e2e7ec;
    --gold: #b89968;
    --gold-soft: #f5eddb;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .container { max-width: 1720px; margin: 0 auto; padding: 20px 24px 22px; }

  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .page-header h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.024em;
    margin: 0; color: var(--text); line-height: 1.15;
  }
  #saveStatus { color: var(--muted); font-size: 12px; font-weight: 500; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--muted);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .btn:hover { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--hint); }
  .btn.ghost:hover { background: var(--accent-soft); color: var(--text); }

  .tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .tab {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--muted);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tab:hover { background: var(--accent-soft); color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 18px; padding: 0 6px;
    background: rgba(255,255,255,0.28);
    color: inherit;
    border-radius: 9px;
    font-size: 11px; font-weight: 700;
  }
  .tab:not(.active) .count { background: var(--accent-soft); color: var(--accent-dark); }

  .spacer { flex: 1; }

  /* ─────────── Table ─────────── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    max-height: calc(100vh - 220px);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
  }
  th {
    background: var(--surface-alt);
    color: var(--muted);
    font-weight: 600;
    font-size: 11.5px;
    position: sticky; top: 0;
    z-index: 2;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  th:last-child, td:last-child { border-right: 0; }
  tbody tr:hover td { background: var(--accent-softer); }
  td.right { text-align: right; }
  td.left { text-align: left; }
  td.calc {
    background: #fbf9f5;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  td.calc.strong { color: var(--text); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }

  td input, td select {
    width: 100%;
    height: 26px;
    padding: 0 6px;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text);
    text-align: center;
    outline: none;
    transition: border-color .12s ease, background .12s ease;
  }
  td input:hover, td select:hover { border-color: var(--border-strong); background: #fff; }
  td input:focus, td select:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(170,151,145,0.15);
  }
  td.right input { text-align: right; }
  td select { appearance: none; padding-right: 18px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6960' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 5px center;
  }

  .type-pill {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .type-골드박스 { background: var(--gold-soft); color: #7a5a1a; }
  .type-타임특가 { background: var(--warm-soft); color: #8a4a2a; }
  .type-기획전   { background: var(--sage-soft); color: #4a5748; }
  .type-즉시할인 { background: var(--plum-soft); color: #6a4a5a; }

  .row-del {
    width: 22px; height: 22px;
    border: 0; background: transparent;
    color: var(--hint);
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
    transition: background .12s ease, color .12s ease;
  }
  .row-del:hover { background: #f5e8e3; color: #b04a3a; }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--hint);
    font-size: 13px;
  }
  .empty .big { font-size: 15px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }

  .missing { color: #b89968; font-weight: 600; }
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1>프로모션</h1>
    <span id="saveStatus">—</span>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <button class="btn primary" id="addBtn">＋ 프로모션 추가</button>
    <button class="btn" id="reloadBtn" title="마진/VIID·PID 데이터 다시 불러오기">↻ 데이터 갱신</button>
  </div>

  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th style="width:100px">날짜</th>
          <th style="width:98px">프로모션 유형</th>
          <th style="width:82px">SKU ID</th>
          <th style="width:110px">VIID</th>
          <th style="width:110px">PID</th>
          <th style="width:220px" class="left">SKU 명</th>
          <th style="width:68px">할인율(%)</th>
          <th style="width:82px">판매가</th>
          <th style="width:82px">할인금액</th>
          <th style="width:82px">프로모션가</th>
          <th style="width:88px">현재오아마진</th>
          <th style="width:92px">프로모션<br>마진(-vat)</th>
          <th style="width:88px">프로모션<br>오아마진율</th>
          <th style="width:88px">공급가(-vat)</th>
          <th style="width:70px">수량</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">
      <div class="big">등록된 프로모션이 없습니다</div>
      <div>상단 [＋ 프로모션 추가] 버튼으로 시작하세요</div>
    </div>
  </div>
</div>

<script>
const API_URL = '/api/promotion-state';
const MARGIN_URL = '/api/margin-state';
const REPO_CFG = { owner:'tolmjj10', repo:'coupang-po', branch:'main', dir:'promotion' };
const TYPES = ['골드박스','타임특가','기획전','즉시할인'];
const STORAGE_KEY = 'promotion_state_local';

let data = [];        // rows
let marginMap = {};   // skuId → {name, cost, price, originN, supply, curMargin}
let viidMap = {};     // skuId → {viid, pid}
let activeTab = '전체';

const $ = id => document.getElementById(id);
const uid = () => 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (n==null||!isFinite(n)) ? '' : Math.round(n).toLocaleString('ko-KR');
const fmtPct = n => (n==null||!isFinite(n)) ? '' : (n*100).toFixed(1)+'%';
const parseN = v => { if(v==null||v==='') return null; const n=parseFloat(String(v).replace(/[,\s%]/g,'')); return isFinite(n)?n:null; };

/* ═══════════════════════ 파생 계산 ═══════════════════════ */
function derive(r) {
  const m = marginMap[String(r.skuId||'').trim()] || null;
  const vp = viidMap[String(r.skuId||'').trim()] || null;
  const skuName = m ? m.name : '';
  const salePrice = m ? m.price : null;
  const supply = m ? m.supply : null;
  const curMargin = m ? m.curMargin : null;
  const viid = vp ? vp.viid : '';
  const pid = vp ? vp.pid : '';
  const rate = parseN(r.discountRate); // 0~100
  const discAmt = (salePrice!=null && rate!=null) ? Math.round(salePrice * rate/100) : null;
  const promoPrice = (salePrice!=null && discAmt!=null) ? salePrice - discAmt : null;
  const promoMargin = (curMargin!=null && discAmt!=null) ? curMargin - discAmt : null;
  const promoMarginRate = (promoMargin!=null && supply) ? promoMargin/supply : null;
  return { m, skuName, salePrice, supply, curMargin, viid, pid, discAmt, promoPrice, promoMargin, promoMarginRate };
}

/* ═══════════════════════ Render ═══════════════════════ */
function renderTabs() {
  const counts = { '전체': data.length };
  TYPES.forEach(t => counts[t] = data.filter(r => r.type === t).length);
  const tabs = ['전체', ...TYPES];
  $('tabs').innerHTML = tabs.map(t => `
    <button class="tab ${activeTab===t?'active':''}" data-tab="${t}">
      ${t}<span class="count">${counts[t]||0}</span>
    </button>
  `).join('');
  $('tabs').querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => { activeTab = el.dataset.tab; render(); });
  });
}

function render() {
  renderTabs();
  const visible = data.filter(r => activeTab==='전체' || r.type === activeTab);
  $('emptyState').style.display = visible.length ? 'none' : 'block';
  const html = visible.map(r => rowHtml(r)).join('');
  $('tbody').innerHTML = html;
  wireRow();
}

function rowHtml(r) {
  const d = derive(r);
  const typeCls = d ? (r.type||'') : '';
  const missingSku = r.skuId && !d.m;
  const missingVP = r.skuId && !d.viid;
  return `<tr data-id="${r.id}">
    <td><input type="date" data-k="date" value="${esc(r.date||'')}"></td>
    <td>
      <select data-k="type">
        <option value="">-</option>
        ${TYPES.map(t=>`<option value="${t}" ${r.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </td>
    <td><input type="text" data-k="skuId" value="${esc(r.skuId||'')}" placeholder="SKU"></td>
    <td class="calc ${missingVP?'missing':''}">${esc(d.viid) || (missingVP?'―':'')}</td>
    <td class="calc ${missingVP?'missing':''}">${esc(d.pid) || (missingVP?'―':'')}</td>
    <td class="left calc ${missingSku?'missing':''}" title="${esc(d.skuName)}">${esc(d.skuName) || (missingSku?'매칭 SKU 없음':'')}</td>
    <td><input type="number" data-k="discountRate" step="0.1" value="${r.discountRate??''}" placeholder="%"></td>
    <td class="right calc num">${fmtN(d.salePrice)}</td>
    <td class="right calc num">${fmtN(d.discAmt)}</td>
    <td class="right calc num strong">${fmtN(d.promoPrice)}</td>
    <td class="right calc num">${fmtN(d.curMargin)}</td>
    <td class="right calc num strong">${fmtN(d.promoMargin)}</td>
    <td class="right calc num">${fmtPct(d.promoMarginRate)}</td>
    <td class="right calc num">${fmtN(d.supply)}</td>
    <td><input type="number" data-k="qty" value="${r.qty??''}" placeholder="수량"></td>
    <td><button class="row-del" title="삭제">✕</button></td>
  </tr>`;
}

function wireRow() {
  $('tbody').querySelectorAll('tr').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('change', () => {
        const row = data.find(x => x.id === id); if (!row) return;
        row[el.dataset.k] = el.value;
        save();
        // SKU/할인율 변경 시 즉시 파생값 다시 그리기
        if (el.dataset.k === 'skuId' || el.dataset.k === 'discountRate' || el.dataset.k === 'type') {
          render();
        }
      });
    });
    tr.querySelector('.row-del').addEventListener('click', () => {
      if (!confirm('이 행을 삭제할까요?')) return;
      data = data.filter(x => x.id !== id);
      save(); render();
    });
  });
}

/* ═══════════════════════ 저장/로드 ═══════════════════════ */
let _saveTimer = null;
let _isDirty = false;
function saveStatus(t) { $('saveStatus').textContent = t; }

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  _isDirty = true;
  saveStatus('● 미저장');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveRemote, 800);
}
async function saveRemote() {
  if (!_isDirty) return;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    _isDirty = false;
    saveStatus('저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  } catch (e) {
    saveStatus('저장 실패');
    console.warn('[promotion] saveRemote 실패:', e.message);
  }
}
async function loadRemote() {
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const arr = await res.json();
    data = Array.isArray(arr) ? arr : (arr.rows || []);
    // 하위호환: 예전 스키마 필드가 있으면 정리
    data.forEach(r => { if (!r.id) r.id = uid(); });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    render();
    saveStatus('불러옴');
  } catch (e) {
    console.warn('[promotion] loadRemote 실패:', e.message);
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) { try { data = JSON.parse(cached); render(); saveStatus('오프라인'); } catch(_){} }
  }
}

/* ═══════════════════════ 마진 데이터 ═══════════════════════ */
async function loadMargin() {
  try {
    const res = await fetch(MARGIN_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    const rows = Array.isArray(j) ? j : (j.rows || []);
    marginMap = {};
    rows.forEach(r => {
      const sku = String(r.sku||'').trim();
      if (!sku) return;
      const cost = parseN(r.cost);
      const price = parseN(r.price);
      const originN = parseN(r.originN);
      const supply = cost!=null ? cost/1.1 : null;
      const curMargin = (supply!=null && originN!=null) ? supply - originN : null;
      marginMap[sku] = { name: r.name||'', cost, price, originN, supply, curMargin };
    });
    console.log('[promotion] margin 로드', Object.keys(marginMap).length,'건');
  } catch (e) {
    console.warn('[promotion] loadMargin 실패:', e.message);
  }
}

/* ═══════════════════════ VIID/PID 엑셀 ═══════════════════════ */
let _xlsxLoading = null;
function ensureXlsx() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('XLSX load failed'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
async function loadViidPid() {
  try {
    const listUrl = '/api/repo-files?path=' + encodeURIComponent(REPO_CFG.dir) + '&ref=' + REPO_CFG.branch;
    const listRes = await fetch(listUrl);
    if (!listRes.ok) throw new Error('list HTTP '+listRes.status);
    const files = await listRes.json();
    const NAME_RE = /viid.*pid.*확인/i;
    const target = (files||[]).find(f => f.type==='file' && NAME_RE.test(f.name) && /\.xlsx?$/i.test(f.name));
    if (!target) { console.log('[promotion] viid_pid확인 파일 없음'); return; }
    await ensureXlsx();
    const abRes = await fetch(target.download_url);
    if (!abRes.ok) throw new Error('file HTTP '+abRes.status);
    const ab = await abRes.arrayBuffer();
    const wb = XLSX.read(ab, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (aoa.length < 2) return;
    // 헤더 행 자동 감지 (SKU / VIID / PID 헤더 포함하는 행)
    let hIdx = -1;
    for (let i=0; i<Math.min(aoa.length, 10); i++) {
      const row = (aoa[i]||[]).map(v => String(v||'').toUpperCase().replace(/\s+/g,''));
      const hasSku  = row.some(c => /SKU/.test(c));
      const hasViid = row.some(c => /VIID|옵션ID|옵션아이디/.test(c));
      const hasPid  = row.some(c => /(^|[^A-Z])PID|노출ID|상품ID/.test(c));
      if (hasSku && (hasViid || hasPid)) { hIdx = i; break; }
    }
    if (hIdx < 0) { console.warn('[promotion] viid_pid 헤더 감지 실패'); return; }
    const header = (aoa[hIdx]||[]).map(v => String(v||'').toUpperCase().replace(/\s+/g,''));
    const skuCol  = header.findIndex(h => /SKU/.test(h) && !/명|NAME/.test(h));
    const viidCol = header.findIndex(h => /VIID|옵션ID|옵션아이디/.test(h));
    const pidCol  = header.findIndex(h => /(^|[^A-Z])PID|노출ID|상품ID/.test(h));
    viidMap = {};
    for (let r = hIdx+1; r < aoa.length; r++) {
      const row = aoa[r]||[];
      const sku = String(row[skuCol]||'').trim();
      if (!sku) continue;
      viidMap[sku] = {
        viid: viidCol>=0 ? String(row[viidCol]||'').trim() : '',
        pid:  pidCol>=0  ? String(row[pidCol] ||'').trim() : ''
      };
    }
    console.log('[promotion] VIID/PID 매핑 로드', Object.keys(viidMap).length,'건');
  } catch (e) {
    console.warn('[promotion] loadViidPid 실패:', e.message);
  }
}

/* ═══════════════════════ 행 추가 ═══════════════════════ */
$('addBtn').addEventListener('click', () => {
  const today = new Date();
  const ymd = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const initialType = (activeTab && activeTab !== '전체') ? activeTab : '';
  data.unshift({ id: uid(), date: ymd, type: initialType, skuId: '', discountRate: '', qty: '' });
  save(); render();
});
$('reloadBtn').addEventListener('click', async () => {
  saveStatus('갱신 중…');
  await Promise.all([loadMargin(), loadViidPid()]);
  render();
  saveStatus('갱신 완료');
});

/* ═══════════════════════ Boot ═══════════════════════ */
(async () => {
  render();
  await Promise.all([loadMargin(), loadViidPid()]);
  await loadRemote();
})();
setInterval(loadRemote, 30000);
window.addEventListener('focus', loadRemote);
window.addEventListener('beforeunload', () => {
  if (_isDirty) {
    const payload = JSON.stringify(data);
    navigator.sendBeacon(API_URL, new Blob([payload], { type: 'application/json' }));
  }
});
</script>
</body>
</html>
