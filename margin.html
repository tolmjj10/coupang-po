<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마진테이블</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    /* Apple-inspired mono palette */
    --bg:#f5f5f7;
    --surface:#ffffff;
    --surface-alt:#fbfbfd;
    --hairline:rgba(0,0,0,0.06);
    --hairline-strong:rgba(0,0,0,0.10);
    --text:#1d1d1f;
    --muted:#6e6e73;
    --hint:#a1a1a6;
    --accent:#1d1d1f;
    --accent-soft:#f2f2f4;
    --tint:#e8e8ed;
    --up:#c92a2a;
    --down:#1864ab;
    --ok:#2b8a3e;
    --warn:#b76e00;
    --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
    --shadow-sm:0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md:0 4px 16px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    letter-spacing:-0.014em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    font-feature-settings:'ss01','cv11';}
  .wrap{padding:22px 28px 28px;max-width:1600px;margin:0 auto;}

  /* Header */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
  .page-head .title-block h1{font-size:26px;font-weight:700;letter-spacing:-0.028em;color:var(--text);line-height:1.15;}
  .page-head .title-block .sub{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:10px;}
  .save-info{font-size:12px;color:var(--ok);display:inline-flex;align-items:center;gap:6px;}
  .save-info::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .save-info.dirty{color:var(--warn);}
  .save-info.err{color:var(--up);}

  /* Toolbar card */
  .toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--surface);border-radius:14px;padding:10px 12px;
    box-shadow:var(--shadow-sm);margin-bottom:14px;
    border:1px solid var(--hairline);
  }
  .actions{display:flex;gap:6px;}
  .btn{
    font:500 13px -apple-system,'Pretendard',sans-serif;letter-spacing:-0.01em;
    padding:8px 14px;border-radius:10px;border:1px solid var(--hairline-strong);
    background:var(--surface);color:var(--text);cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .05s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:var(--surface-alt);border-color:rgba(0,0,0,0.16);}
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:#000;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px;}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--text);}
  .btn.danger:hover{background:#fff5f5;border-color:#ffc9c9;color:var(--up);}
  .divider{width:1px;height:22px;background:var(--hairline);margin:0 4px;}

  .search{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .search input, .search select{
    font:13px -apple-system,'Pretendard',sans-serif;padding:8px 12px;
    border:1px solid var(--hairline-strong);border-radius:10px;
    background:var(--surface);color:var(--text);outline:none;
    min-width:130px;transition:border-color .15s,box-shadow .15s;
  }
  .search input{min-width:180px;}
  .search input:focus, .search select:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.05);
  }
  .search input::placeholder{color:var(--hint);}

  /* Table card */
  .table-wrap{
    background:var(--surface);border-radius:16px;overflow:auto;
    max-height:calc(100vh - 190px);
    box-shadow:var(--shadow-sm);border:1px solid var(--hairline);
  }
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap;}
  thead th{
    position:sticky;top:0;background:var(--surface);color:var(--muted);
    font-weight:600;font-size:11.5px;letter-spacing:0.02em;text-transform:uppercase;
    padding:14px 14px;border-bottom:1px solid var(--hairline);
    text-align:center;z-index:2;line-height:1.3;
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    background:rgba(255,255,255,0.85);
  }
  tbody td{padding:0;border-bottom:1px solid var(--hairline);color:var(--text);vertical-align:middle;}
  tbody td .cell{padding:12px 14px;min-height:44px;display:flex;align-items:center;font-size:13px;}
  tbody td .cell.num{justify-content:flex-end;font-variant-numeric:tabular-nums;}
  tbody td .cell.center{justify-content:center;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover td{background:var(--surface-alt);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.new-row td{background:#f0f7ff;}
  tbody tr.new-row:hover td{background:#e5f0fc;}

  /* Editable cell */
  .editable{cursor:text;border-radius:6px;margin:2px;padding:10px 12px !important;min-height:36px !important;transition:background .12s;}
  .editable:hover{background:var(--accent-soft);}
  .editable[contenteditable="true"]{
    background:#fff !important;
    box-shadow:0 0 0 2px var(--accent) inset;
    outline:none;
  }

  /* Calc cells (읽기 전용) */
  .calc{color:var(--muted);background:linear-gradient(0deg,var(--surface-alt),var(--surface-alt));}

  /* Semantic colors */
  .pct{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);font-weight:600;font-variant-numeric:tabular-nums;}
  .down{color:var(--down);font-weight:600;font-variant-numeric:tabular-nums;}
  .zero{color:var(--hint);}
  .col-cat{color:var(--muted);}
  .col-name .cell{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;padding:14px 14px;font-weight:500;}
  .col-name .cell.editable{display:block;}
  .col-name .cell[contenteditable="true"]{overflow:visible;white-space:normal;}

  /* Pill/tag styles for status */
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:100px;
    font-size:11.5px;font-weight:600;letter-spacing:-0.01em;
    background:var(--accent-soft);color:var(--text);
  }
  .status-pill.sell{background:#e7f5ec;color:#2b6a3f;}
  .status-pill.stop{background:#f5e7e7;color:#9a3a3a;}
  .status-pill.dot::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}

  /* Row actions */
  .row-actions{display:flex;gap:2px;justify-content:center;}
  .row-actions .btn{
    padding:6px 8px;font-size:12px;border-radius:8px;
    color:var(--muted);background:transparent;border-color:transparent;
  }
  .row-actions .btn:hover{background:var(--accent-soft);color:var(--text);}
  .row-actions .btn.danger:hover{background:#fff5f5;color:var(--up);}

  .empty{padding:64px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .err{padding:64px 20px;text-align:center;color:var(--up);font-size:14px;}

  th.sortable{cursor:pointer;user-select:none;transition:color .1s;}
  th.sortable:hover{color:var(--text);}
  th.sortable .arrow{display:inline-block;width:12px;margin-left:2px;opacity:0.35;font-size:9px;}
  th.sortable.asc .arrow::after{content:'▲';opacity:1;color:var(--text);}
  th.sortable.desc .arrow::after{content:'▼';opacity:1;color:var(--text);}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
    background:rgba(29,29,31,0.92);color:#fff;
    padding:12px 20px;border-radius:12px;font:500 13px -apple-system,'Pretendard',sans-serif;
    z-index:99999;box-shadow:0 8px 24px rgba(0,0,0,0.15);
    opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Native select arrow polish */
  .search select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%236e6e73' stroke-width='1.5' d='M1 1l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;
  }

  /* Scrollbar polish */
  .table-wrap::-webkit-scrollbar{width:10px;height:10px;}
  .table-wrap::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:8px;border:2px solid var(--surface);}
  .table-wrap::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25);}
  .table-wrap::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="title-block">
      <h1>마진테이블</h1>
      <div class="sub">
        <span id="status">불러오는 중…</span>
        <span id="saveInfo" class="save-info"></span>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="actions">
      <button class="btn primary" id="btnAdd">＋ 행 추가</button>
      <button class="btn" id="btnSave">저장</button>
      <button class="btn ghost" id="btnReload">새로고침</button>
      <button class="btn ghost" id="btnSeed" title="KV가 비어있을 때 마진테이블.xlsx에서 초기 데이터 가져오기">xlsx에서 초기화</button>
    </div>
    <div class="search">
      <select id="fCat"><option value="">전체 카테고리</option></select>
      <select id="fOwner"><option value="">전체 담당자</option></select>
      <select id="fStatus"><option value="">전체 상태</option></select>
      <input id="fQ" type="search" placeholder="SKU# / 상품명 검색">
    </div>
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG={owner:'tolmjj10',repo:'coupang-po',branch:'main',dir:'data',file:'마진테이블.xlsx'};

/* 컬럼 정의
   - editable: 인라인 편집 가능한 원본 컬럼
   - calc:     수식으로 자동 계산되는 컬럼
   - type:     'text' | 'num' | 'select'
*/
const COLS=[
  {k:'owner',   label:'담당자',      w:70,  align:'center', editable:true, type:'text'},
  {k:'cat',     label:'카테고리',    w:100, align:'center', editable:true, type:'select', cls:'col-cat',
    options:['이미용','욕실가전','모바일','겨울가전','여름가전','건강가전','주방가전','생활가전','인테리어/조명','제습기','공기청정기','육아','차량','애견']},
  {k:'sku',     label:'SKU #',       w:90,  align:'center', editable:true, type:'text'},
  {k:'name',    label:'상품명',      w:280, align:'left',   editable:true, type:'text', cls:'col-name'},
  {k:'status',  label:'판매상태',    w:80,  align:'center', editable:true, type:'select', options:['판매','중지','단종','품절','예정']},
  {k:'cost',    label:'매입가',      w:90,  align:'right',  editable:true, type:'num'},
  {k:'supply',  label:'공급가',      w:90,  align:'right',  calc:r=>r.cost!=null? r.cost/1.1 : null,           type:'num'},
  {k:'vat',     label:'부가세',      w:80,  align:'right',  calc:r=>r.cost!=null? r.cost - r.cost/1.1 : null,  type:'num'},
  {k:'margin1', label:'마진(+VAT)',  w:90,  align:'right',  calc:r=>(r.price!=null&&r.cost!=null)? r.price - r.cost : null, type:'num'},
  {k:'mRate',   label:'마진율',      w:70,  align:'right',  calc:r=>(r.price&&r.cost!=null)? 1-(r.cost/r.price) : null,      type:'pct'},
  {k:'price',   label:'소비자가',    w:90,  align:'right',  editable:true, type:'num'},
  {k:'origin',  label:'원가',        w:90,  align:'right',  editable:true, type:'num'},
  {k:'originN', label:'원가(NEW)',   w:90,  align:'right',  editable:true, type:'num'},
  {k:'diff',    label:'원가 증감액', w:100, align:'center', render:renderDiff},
  {k:'margin2', label:'마진(-VAT)',  w:90,  align:'right',  calc:r=>(r.cost!=null&&r.originN!=null)? (r.cost/1.1) - r.originN : null, type:'num'},
  {k:'pRate',   label:'이익율',      w:70,  align:'right',  calc:r=>{ if(r.cost==null||r.originN==null) return null; const g=r.cost/1.1, o=g-r.originN; return g? o/g:null; }, type:'pct'},
  {k:'roas',    label:'광고 ROAS\n(상시가 기준)', w:100, align:'right', calc:r=>{ if(r.cost==null||r.originN==null||r.price==null) return null; const g=r.cost/1.1, o=g-r.originN; return o? r.price/o:null; }, type:'num2'},
  {k:'_act',    label:'',            w:100, align:'center', render:renderActions},
];

const EDITABLE_KEYS=COLS.filter(c=>c.editable).map(c=>c.k);
const NUM_KEYS=new Set(COLS.filter(c=>c.editable&&c.type==='num').map(c=>c.k));

let rows=[];
let sortKey=null, sortDir=1;
let dirty=false;
let saving=false;
let autosaveTimer=null;
let lastSavedAt=null;

/* ─────────────────────────── util ─────────────────────────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtInt(n){ if(n==null||!isFinite(n)) return ''; return Math.round(n).toLocaleString(); }
function fmtNum2(n){ if(n==null||!isFinite(n)) return ''; return n.toLocaleString(undefined,{maximumFractionDigits:2}); }
function fmtPct(n){ if(n==null||!isFinite(n)) return ''; return (n*100).toFixed(1)+'%'; }
function toNum(v){ if(v==null||v==='') return null; const n=Number(String(v).replace(/,/g,'').trim()); return isFinite(n)?n:null; }
function uid(){ return 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg;
  if(color) t.style.background=color; else t.style.background='#16a34a';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),1800);
}

function renderDiff(_,r){
  const a=r.originN, b=r.origin;
  if(a==null||b==null) return '';
  if(a>b) return `<span class="up">▲ ${fmtInt(a-b)}</span>`;
  if(a<b) return `<span class="down">▼ ${fmtInt(b-a)}</span>`;
  return `<span class="zero">0</span>`;
}
function renderActions(_,r){
  return `<div class="row-actions">
    <button class="btn ghost" data-act="dup" title="복제">⧉</button>
    <button class="btn ghost danger" data-act="del" title="삭제">✕</button>
  </div>`;
}

/* ─────────────────────────── render ─────────────────────────── */
function buildHead(){
  const tr=document.getElementById('thead-row');
  tr.innerHTML=COLS.map(c=>{
    const sortable=c.k!=='_act';
    const cls=sortable?'sortable':'';
    return `<th class="${cls}" data-k="${c.k}" style="min-width:${c.w}px;">${esc(c.label).replace(/\n/g,'<br>')}${sortable?'<span class="arrow"></span>':''}</th>`;
  }).join('');
  tr.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.k;
      if(sortKey===k){ sortDir=-sortDir; } else { sortKey=k; sortDir=1; }
      tr.querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
      th.classList.add(sortDir===1?'asc':'desc');
      render();
    });
  });
}

function getCellValue(r, col){
  if(col.calc) return col.calc(r);
  return r[col.k];
}

function formatValue(v, col){
  if(v==null) return '';
  if(col.type==='pct')  return fmtPct(v);
  if(col.type==='num')  return fmtInt(v);
  if(col.type==='num2') return fmtNum2(v);
  return String(v);
}

function renderCell(r, col){
  if(col.render && !col.calc) return col.render(getCellValue(r,col), r);
  const v=getCellValue(r,col);
  if(col.calc){
    let inner;
    if(col.type==='pct')       inner=`<span class="pct">${fmtPct(v)}</span>`;
    else if(col.type==='num2') inner=fmtNum2(v);
    else                       inner=fmtInt(v);
    const align=col.align==='right'?'num':(col.align==='center'?'center':'');
    return `<div class="cell calc ${align}">${inner}</div>`;
  }
  const align=col.align==='right'?'num':(col.align==='center'?'center':'');
  const display=formatValue(v,col);
  let inner=esc(display);
  if(col.k==='status' && display){
    const s=String(display).trim();
    const cls=s==='판매'?'sell':(s==='중지'||s==='단종'||s==='품절'?'stop':'');
    inner=`<span class="status-pill ${cls}">${esc(s)}</span>`;
  }
  return `<div class="cell editable ${align}" data-k="${col.k}" data-type="${col.type}">${inner}</div>`;
}

function render(){
  const q=document.getElementById('fQ').value.trim().toLowerCase();
  const fc=document.getElementById('fCat').value;
  const fo=document.getElementById('fOwner').value;
  const fs=document.getElementById('fStatus').value;

  let list=rows.filter(r=>{
    if(fc && r.cat!==fc) return false;
    if(fo && r.owner!==fo) return false;
    if(fs && r.status!==fs) return false;
    if(q){
      const hay=((r.sku||'')+' '+(r.name||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(sortKey){
    const col=COLS.find(c=>c.k===sortKey);
    list.sort((a,b)=>{
      const va=getCellValue(a,col), vb=getCellValue(b,col);
      const na=Number(va), nb=Number(vb);
      const bothNum=isFinite(na)&&isFinite(nb);
      let cmp;
      if(bothNum) cmp=na-nb;
      else cmp=String(va==null?'':va).localeCompare(String(vb==null?'':vb),'ko');
      return cmp*sortDir;
    });
  }

  const tbody=document.getElementById('tbody');
  if(list.length===0){
    tbody.innerHTML=`<tr><td colspan="${COLS.length}" class="empty">표시할 데이터가 없습니다. 상단 [+ 행 추가] 또는 [xlsx에서 초기화]를 눌러주세요.</td></tr>`;
  } else {
    tbody.innerHTML=list.map(r=>{
      const cls=r._new?'new-row':'';
      return `<tr data-id="${r._id}" class="${cls}">`+COLS.map(c=>{
        const cell=renderCell(r,c);
        return `<td class="${c.cls||''}">${cell}</td>`;
      }).join('')+'</tr>';
    }).join('');
    attachEditors();
  }
  document.getElementById('status').textContent=`총 ${rows.length.toLocaleString()}건${list.length!==rows.length?' · 필터 '+list.length.toLocaleString()+'건':''}`;
}

/* ─────────────────────────── edit ─────────────────────────── */
function attachEditors(){
  const tbody=document.getElementById('tbody');
  tbody.querySelectorAll('tr').forEach(tr=>{
    const id=tr.dataset.id;
    tr.querySelectorAll('.editable').forEach(el=>{
      el.addEventListener('click',()=>startEdit(el,id));
    });
    tr.querySelectorAll('button[data-act]').forEach(b=>{
      b.addEventListener('click',(e)=>{
        e.stopPropagation();
        const act=b.dataset.act;
        if(act==='del') deleteRow(id);
        else if(act==='dup') duplicateRow(id);
      });
    });
  });
}

function startEdit(el, id){
  const r=rows.find(x=>x._id===id);
  if(!r) return;
  const k=el.dataset.k;
  const type=el.dataset.type;
  const col=COLS.find(c=>c.k===k);

  if(type==='select'){
    const cur=r[k]||'';
    const sel=document.createElement('select');
    sel.style.cssText='width:100%;padding:5px;border:1px solid var(--accent);border-radius:4px;font:12.5px Pretendard;';
    sel.innerHTML=`<option value=""></option>`+col.options.map(o=>`<option value="${esc(o)}"${o===cur?' selected':''}>${esc(o)}</option>`).join('');
    el.innerHTML='';
    el.appendChild(sel);
    sel.focus();
    const commit=()=>{ setValue(r,k,sel.value); render(); markDirty(); };
    sel.addEventListener('change',commit);
    sel.addEventListener('blur',commit);
    return;
  }

  const raw=r[k];
  el.textContent=raw==null?'':String(raw);
  el.setAttribute('contenteditable','true');
  el.focus();
  const range=document.createRange(); range.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(range);

  const commit=()=>{
    el.removeAttribute('contenteditable');
    const txt=el.textContent.trim();
    const newVal=NUM_KEYS.has(k)?toNum(txt):txt;
    if((r[k]??'')!==(newVal??'')){
      setValue(r,k,newVal);
      markDirty();
    }
    render();
  };
  el.addEventListener('blur',commit,{once:true});
  el.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); }
    if(ev.key==='Escape'){ ev.preventDefault(); el.removeAttribute('contenteditable'); render(); }
  });
}

function setValue(r,k,v){ r[k]=v; delete r._new; }

function addRow(){
  const r={_id:uid(),_new:true,owner:'',cat:'',sku:'',name:'',status:'',cost:null,price:null,origin:null,originN:null};
  rows.unshift(r);
  markDirty();
  fillFilters();
  render();
}

function duplicateRow(id){
  const idx=rows.findIndex(r=>r._id===id);
  if(idx<0) return;
  const src=rows[idx];
  const copy={...src,_id:uid(),_new:true};
  rows.splice(idx+1,0,copy);
  markDirty();
  render();
}

function deleteRow(id){
  const r=rows.find(x=>x._id===id);
  if(!r) return;
  if(!confirm(`삭제하시겠습니까?\n${r.sku||''} ${r.name||''}`.trim())) return;
  rows=rows.filter(x=>x._id!==id);
  markDirty();
  fillFilters();
  render();
}

/* ─────────────────────────── filters ─────────────────────────── */
function fillFilters(){
  const cats=[...new Set(rows.map(r=>r.cat).filter(Boolean))].sort();
  const owners=[...new Set(rows.map(r=>r.owner).filter(Boolean))].sort();
  const sts=[...new Set(rows.map(r=>r.status).filter(Boolean))].sort();
  const put=(id,arr)=>{
    const el=document.getElementById(id);
    const cur=el.value;
    el.innerHTML=el.querySelector('option').outerHTML+arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    el.value=cur;
  };
  put('fCat',cats); put('fOwner',owners); put('fStatus',sts);
}

/* ─────────────────────────── save/load ─────────────────────────── */
function markDirty(){
  dirty=true;
  updateSaveInfo();
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(save,3000);
}

function updateSaveInfo(){
  const el=document.getElementById('saveInfo');
  el.classList.remove('dirty','err');
  if(saving){ el.textContent='저장 중…'; el.classList.add('dirty'); return; }
  if(dirty){ el.textContent='● 변경사항 있음 (자동 저장 대기)'; el.classList.add('dirty'); return; }
  if(lastSavedAt){
    const d=new Date(lastSavedAt);
    el.textContent='저장됨 · '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  } else {
    el.textContent='';
  }
}

async function save(){
  if(saving) return;
  saving=true; updateSaveInfo();
  try{
    const payload=rows.map(r=>{
      const {_id,_new,...rest}=r;
      return rest;
    });
    const res=await fetch('/api/margin-state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    dirty=false;
    lastSavedAt=Date.now();
    // 저장 후 _new 배지 제거
    rows.forEach(r=>delete r._new);
    render();
    showToast('저장 완료');
  } catch(e){
    console.error(e);
    const el=document.getElementById('saveInfo');
    el.textContent='저장 실패: '+e.message;
    el.classList.add('err');
    showToast('저장 실패: '+e.message,'#dc2626');
  } finally {
    saving=false; updateSaveInfo();
  }
}

async function load(){
  document.getElementById('status').textContent='불러오는 중…';
  try{
    const res=await fetch('/api/margin-state',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    rows=(Array.isArray(data)?data:[]).map(r=>({_id:uid(),...r}));
    fillFilters();
    render();
    if(rows.length===0){
      document.getElementById('status').textContent='데이터 없음 · [xlsx에서 초기화] 또는 [+ 행 추가]';
    }
  } catch(e){
    console.error(e);
    document.getElementById('tbody').innerHTML=`<tr><td colspan="${COLS.length}" class="err">불러오기 실패: ${esc(e.message)}<br><br>배포판(https://coupang-po.pages.dev)에서 열어야 저장/불러오기가 동작합니다.</td></tr>`;
    document.getElementById('status').textContent='로드 실패';
  }
}

async function seedFromXlsx(){
  if(rows.length>0){
    if(!confirm(`현재 ${rows.length}건이 있습니다. xlsx로 덮어쓰시겠습니까? (되돌릴 수 없음)`)) return;
  }
  document.getElementById('status').textContent='xlsx 로드 중…';
  try{
    const url=`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${encodeURI(CFG.dir)}/${encodeURIComponent(CFG.file)}?ref=${CFG.branch}`;
    const meta=await fetch(url,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{ if(!r.ok) throw new Error('메타 HTTP '+r.status); return r.json(); });
    const ab=await fetch(meta.download_url).then(r=>{ if(!r.ok) throw new Error('DL HTTP '+r.status); return r.arrayBuffer(); });
    const wb=XLSX.read(new Uint8Array(ab),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(arr.length<2) throw new Error('데이터 없음');
    const H=arr[0].map(h=>String(h||'').trim());
    const idx={
      owner:  H.findIndex(h=>h==='담당자'),
      cat:    H.findIndex(h=>h==='카테고리'),
      sku:    H.findIndex(h=>h==='SKU #'||h.replace(/\s|#/g,'').toLowerCase()==='sku'),
      name:   H.findIndex(h=>h==='상품명'),
      status: H.findIndex(h=>h==='판매상태'),
      cost:   H.findIndex(h=>h==='매입가'),
      price:  H.findIndex(h=>h==='소비자가'),
      origin: H.findIndex(h=>h==='원가'),
      originN:H.findIndex(h=>h.replace(/\s/g,'')==='원가(NEW)'),
    };
    rows=arr.slice(1).map(r=>({
      _id:uid(),
      owner:  String(r[idx.owner]||'').trim(),
      cat:    String(r[idx.cat]||'').trim(),
      sku:    String(r[idx.sku]||'').trim(),
      name:   String(r[idx.name]||'').trim(),
      status: String(r[idx.status]||'').trim(),
      cost:   toNum(r[idx.cost]),
      price:  toNum(r[idx.price]),
      origin: toNum(r[idx.origin]),
      originN:toNum(r[idx.originN]),
    })).filter(r=>r.sku||r.name);
    fillFilters();
    render();
    markDirty();
    showToast(`xlsx에서 ${rows.length}건 불러옴 · 자동 저장 예정`);
  } catch(e){
    console.error(e);
    showToast('xlsx 로드 실패: '+e.message,'#dc2626');
    document.getElementById('status').textContent='xlsx 로드 실패';
  }
}

/* ─────────────────────────── init ─────────────────────────── */
buildHead();
['fQ','fCat','fOwner','fStatus'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('btnAdd').addEventListener('click',addRow);
document.getElementById('btnSave').addEventListener('click',()=>{ clearTimeout(autosaveTimer); save(); });
document.getElementById('btnReload').addEventListener('click',()=>{
  if(dirty && !confirm('저장하지 않은 변경사항이 있습니다. 버리시겠습니까?')) return;
  dirty=false; load();
});
document.getElementById('btnSeed').addEventListener('click',seedFromXlsx);
window.addEventListener('beforeunload',ev=>{
  if(dirty){ ev.preventDefault(); ev.returnValue=''; }
});
load();
</script>
