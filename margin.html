<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마진테이블</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    /* Warm earth palette — chocolate text, sage muted, warm taupe accent */
    --bg:#fbfbfe;
    --surface:#ffffff;
    --surface-alt:#f5f3ef;
    --hairline:#ebe6df;
    --hairline-strong:#d9d1c8;
    --text:#2a1a15;
    --muted:#4d5a4c;
    --hint:#7a706a;
    --accent:#aa9791;
    --accent-dark:#8b756c;
    --accent-soft:#f2ede9;
    --accent-softer:#f8f5f2;
    --tint:#c9bdb4;
    --sage:#b1c0b2;
    --sage-soft:#e6ece6;
    --up:#b04a3a;
    --down:#5a6f8a;
    --ok:#6f7c6d;
    --warn:#b89968;
    --shadow-xs:0 1px 2px rgba(76,52,46,0.05);
    --shadow-sm:0 2px 6px rgba(76,52,46,0.06);
    --shadow-md:0 6px 20px rgba(76,52,46,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    letter-spacing:-0.012em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

  /* Overall shell: sidebar + main */
  .shell{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* Category sidebar — 폭 애니메이션 제거(테이블 리플로우 비용이 커 렉 발생) */
  .side{
    width:210px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--hairline);
    padding:18px 12px;display:flex;flex-direction:column;overflow-y:auto;
    position:relative;
  }
  body.sidebar-collapsed .side{
    width:0;padding:18px 0;border-right-color:transparent;overflow:hidden;
  }
  .side-toggle{
    position:fixed;top:64px;left:198px;
    width:22px;height:22px;border-radius:50%;
    background:var(--surface);border:1px solid var(--hairline-strong);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);cursor:pointer;font-size:12px;line-height:1;
    z-index:20;box-shadow:var(--shadow-xs);
    transition:background .12s, color .12s, border-color .12s;
    user-select:none;
  }
  .side-toggle:hover{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent);}
  body.sidebar-collapsed .side-toggle{left:8px;}
  .side-title{
    font-size:11px;font-weight:600;color:var(--hint);
    letter-spacing:0.09em;text-transform:uppercase;
    padding:6px 12px 10px;
  }
  .side-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;margin-bottom:2px;border-radius:9px;
    font-size:13px;font-weight:500;color:var(--muted);
    cursor:pointer;user-select:none;
    transition:background .12s ease,color .12s ease;
  }
  .side-item:hover{background:var(--surface-alt);color:var(--text);}
  .side-item.active{
    background:var(--accent-soft);color:var(--accent-dark);font-weight:600;
  }
  .side-item .count{
    font-size:11px;font-weight:600;color:var(--hint);
    background:var(--surface-alt);padding:2px 8px;border-radius:100px;min-width:26px;text-align:center;
  }
  .side-item.active .count{
    background:#fff;color:var(--accent-dark);
  }

  /* Main content */
  .main{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:20px 24px 22px;}

  /* Header */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
  .page-head .title-block h1{font-size:22px;font-weight:700;letter-spacing:-0.024em;color:var(--text);line-height:1.15;}
  .page-head .title-block .sub{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:10px;}
  .save-info{font-size:12px;color:var(--ok);display:inline-flex;align-items:center;gap:6px;}
  .save-info::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .save-info.dirty{color:var(--warn);}
  .save-info.err{color:var(--up);}

  /* Toolbar card */
  .toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--surface);border-radius:14px;padding:10px 14px;
    box-shadow:var(--shadow-xs);margin-bottom:14px;
    border:1px solid var(--hairline);
  }
  .actions{display:flex;gap:6px;}
  .btn{
    font:500 13px 'Pretendard',sans-serif;letter-spacing:-0.01em;
    padding:8px 14px;border-radius:9px;border:1px solid var(--hairline-strong);
    background:var(--surface);color:var(--text);cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .05s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:var(--surface-alt);border-color:var(--tint);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.35;cursor:default;background:transparent;border-color:transparent;}
  .btn:disabled:hover{background:transparent;border-color:transparent;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 2px rgba(139,117,108,0.28);}
  .btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px;}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--accent-dark);}
  .btn.danger:hover{background:#f5e8e3;border-color:#e5d0c6;color:var(--up);}
  .divider{width:1px;height:22px;background:var(--hairline);margin:0 4px;}

  .search{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .search input, .search select{
    font:13px 'Pretendard',sans-serif;padding:8px 12px;
    border:1px solid var(--hairline-strong);border-radius:9px;
    background:var(--surface);color:var(--text);outline:none;
    min-width:130px;transition:border-color .15s,box-shadow .15s;
  }
  .search input{min-width:200px;}
  .search input:focus, .search select:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .search input::placeholder{color:var(--hint);}

  /* Table card */
  .table-wrap{
    background:var(--surface);border-radius:14px;overflow:auto;
    flex:1;min-height:0;
    box-shadow:var(--shadow-xs);border:1px solid var(--hairline);
  }
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap;table-layout:fixed;}
  thead th{
    position:sticky;top:0;color:var(--text);
    font-weight:700;font-size:11px;letter-spacing:0.01em;
    padding:12px 8px;border-bottom:1px solid var(--hairline);
    text-align:center;z-index:2;line-height:1.3;
    background:var(--surface-alt);
    overflow:hidden;text-overflow:ellipsis;
  }
  thead th{position:sticky;}
  th .resize{
    position:absolute;top:0;right:0;bottom:0;width:7px;
    cursor:col-resize;user-select:none;z-index:3;
    background:transparent;transition:background .12s ease;
  }
  th .resize::after{
    content:'';position:absolute;top:22%;bottom:22%;right:2px;width:2px;
    border-radius:2px;background:transparent;transition:background .12s ease;
  }
  th:hover .resize::after{background:var(--hairline-strong);}
  th .resize:hover::after,th .resize.dragging::after{background:var(--accent);}
  body.col-resizing{cursor:col-resize !important;}
  body.col-resizing *{cursor:col-resize !important;}
  tbody td{padding:0;border-bottom:1px solid var(--hairline);color:var(--text);vertical-align:middle;overflow:hidden;}
  tbody td .cell{padding:9px 8px;min-height:36px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;}
  tbody td .cell.num{justify-content:flex-end;font-variant-numeric:tabular-nums;}
  tbody td .cell.center{justify-content:center;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover td{background:var(--accent-softer);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.new-row td{background:var(--accent-soft);}
  tbody tr.new-row:hover td{background:#ebe0d8;}

  /* Editable cell */
  /* VIID/PID 펼침·접힘 */
  #tbl th.col-vp,
  #tbl td.col-vp { display: none; }
  #tbl.vp-expanded th.col-vp,
  #tbl.vp-expanded td.col-vp { display: table-cell; }
  #tbl.vp-expanded th[data-k="name"],
  #tbl.vp-expanded td.col-name { width: 128px !important; min-width: 128px !important; }
  /* 토글 컬럼: 헤더에만 얇은 세로 바가 살짝 보이고, 바디에선 거의 안 보이도록 처리 */
  #tbl th.col-vp-toggle,
  #tbl td.col-vp-toggle {
    padding: 0 !important;
    background: transparent;
    cursor: pointer;
    user-select: none;
  }
  .vp-toggle-handle {
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  /* 헤더에만 얇은 바 표시 — SKU# 와 동일한 hairline 색을 유지, 확장 시에도 색 변화 없음 */
  #tbl th.col-vp-toggle .vp-toggle-handle::before {
    content:'';
    display:block;
    width:1px; height:60%;
    background: var(--hairline-strong, #c9c0b5);
    border-radius: 1px;
  }
  /* 바디에선 아무것도 안 보이게 (클릭 영역만 유지) */
  #tbl td.col-vp-toggle .vp-toggle-handle::before { content: none; }

  .editable{cursor:text;border-radius:6px;margin:2px;padding:7px 8px !important;min-height:28px !important;transition:background .12s;}
  .editable:hover{background:var(--accent-soft);}
  .editable[contenteditable="true"]{
    background:#fff !important;
    box-shadow:0 0 0 2px var(--accent) inset;
    outline:none;
  }

  /* Calc cells (읽기 전용) */
  .calc{color:var(--text);font-weight:500;background:var(--surface-alt);}

  /* Semantic colors */
  .pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);font-weight:600;font-variant-numeric:tabular-nums;}
  .down{color:var(--down);font-weight:600;font-variant-numeric:tabular-nums;}
  .zero{color:var(--hint);}
  .col-cat{color:var(--muted);}
  td.col-name{overflow:visible;white-space:normal;}
  .col-name .cell{
    max-width:none;overflow:visible;
    white-space:normal;word-break:break-word;overflow-wrap:anywhere;
    display:block;padding:10px 10px;font-weight:500;line-height:1.45;min-height:36px;
  }
  .col-name .cell.editable{display:block;}
  .col-name .cell[contenteditable="true"]{overflow:visible;white-space:normal;}

  /* Pill/tag styles for status */
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:100px;
    font-size:10.5px;font-weight:600;letter-spacing:-0.01em;
    background:var(--tint);color:var(--muted);
  }
  .cell.sku-alert{background:var(--accent-soft);color:var(--accent-dark);font-weight:600;border-radius:4px;}
  .status-pill.sell{background:var(--sage-soft);color:#4a5748;}
  .status-pill.stop{background:#f2e5df;color:#8a3a2e;}

  /* Row actions */
  .row-actions{display:flex;gap:2px;justify-content:center;}
  .row-actions .btn{
    padding:6px 8px;font-size:12px;border-radius:8px;
    color:var(--muted);background:transparent;border-color:transparent;
  }
  .row-actions .btn:hover{background:var(--accent-soft);color:var(--text);}
  .row-actions .btn.danger:hover{background:#f5e8e3;color:var(--up);}

  .empty{padding:64px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .err{padding:64px 20px;text-align:center;color:var(--up);font-size:14px;}

  th.sortable{cursor:pointer;user-select:none;transition:color .1s;}
  th.sortable:hover{color:var(--text);}
  th.sortable .arrow{display:inline-block;width:12px;margin-left:2px;opacity:0.35;font-size:9px;}
  th.sortable.asc .arrow::after{content:'▲';opacity:1;color:var(--text);}
  th.sortable.desc .arrow::after{content:'▼';opacity:1;color:var(--text);}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--accent-dark);color:#fff;
    padding:12px 20px;border-radius:11px;font:500 13px 'Pretendard',sans-serif;
    z-index:99999;box-shadow:0 8px 24px rgba(76,52,46,0.22);
    opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Native select arrow polish */
  .search select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%236f7c6d' stroke-width='1.5' d='M1 1l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;
  }

  /* Scrollbar polish */
  .table-wrap::-webkit-scrollbar,.side::-webkit-scrollbar{width:8px;height:8px;}
  .table-wrap::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:#d9d1c8;border-radius:8px;border:2px solid var(--surface);}
  .table-wrap::-webkit-scrollbar-thumb:hover,.side::-webkit-scrollbar-thumb:hover{background:#b8ada2;}
  .table-wrap::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body class="sidebar-collapsed">
<div class="shell">
  <button class="side-toggle" id="btnSide" title="사이드바 열기/닫기" aria-label="사이드바 토글">»</button>
  <aside class="side">
    <div class="side-title">카테고리</div>
    <div id="catList"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div class="title-block">
        <h1 id="pageTitle">마진테이블</h1>
        <div class="sub">
          <span id="status">불러오는 중…</span>
          <span id="saveInfo" class="save-info"></span>
        </div>
      </div>
      <div class="page-head-actions" style="display:flex;gap:8px;">
        <button class="btn ghost" id="btnBackToMargin" style="display:none;">← 마진테이블로</button>
        <button class="btn" id="btnPriceChange" title="공급가 변경 시트로 이동">공급가 변경</button>
      </div>
    </div>

    <div id="marginView">
    <div class="toolbar">
      <div class="actions">
        <button class="btn primary" id="btnAdd">＋ 행 추가</button>
        <button class="btn" id="btnSave">저장</button>
        <button class="btn ghost" id="btnReload">새로고침</button>
        <div class="divider"></div>
        <button class="btn ghost" id="btnUndo" title="되돌리기 (Ctrl+Z)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
        </button>
        <button class="btn ghost" id="btnRedo" title="다시하기 (Ctrl+Y)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
        </button>
      </div>
      <div class="search">
        <input type="file" id="fileUpload" accept=".xlsx,.xls" style="display:none;">
        <button class="btn ghost" id="btnUpload" title="엑셀 업로드 (새로고침 시 반영)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="btn ghost" id="btnDownload" title="현재 화면 엑셀 다운로드">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <select id="fOwner"><option value="">전체 담당자</option></select>
        <select id="fStatus"><option value="">전체 상태</option></select>
        <input id="fQ" type="search" placeholder="SKU# / 상품명 검색">
      </div>
    </div>
    <div class="table-wrap">
      <table id="tbl">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    </div><!-- /#marginView -->

    <!-- ═══ 공급가 변경 뷰 ═══ -->
    <div id="priceChangeView" style="display:none;">
      <div class="toolbar">
        <div class="actions">
          <button class="btn primary" id="pcAdd">＋ 행 추가</button>
          <button class="btn" id="pcSave">저장</button>
          <span id="pcSaveInfo" class="save-info" style="margin-left:6px;font-size:11.5px;color:var(--hint);"></span>
        </div>
        <div class="search">
          <span style="font-size:11.5px;color:var(--hint);">SKU# 입력 → 기존값 자동 채움 · 변경 판매가 입력 시 <b style="color:var(--text);">31% 마진</b>으로 공급가 자동 계산 · 완료 체크 시 마진테이블에 반영</span>
        </div>
      </div>
      <div class="table-wrap">
        <table id="pcTbl" style="width:100%;border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;table-layout:fixed;">
          <thead>
            <tr>
              <th style="width:96px;text-align:center;">SKU#</th>
              <th style="text-align:left;">상품명</th>
              <th style="width:100px;text-align:right;">기존 판매가</th>
              <th style="width:100px;text-align:right;">기존 공급가</th>
              <th style="width:108px;text-align:right;background:#f8f5f2;">변경 판매가</th>
              <th style="width:108px;text-align:right;background:#f8f5f2;">변경 공급가</th>
              <th style="width:64px;text-align:center;">완료</th>
              <th style="width:44px;"></th>
            </tr>
          </thead>
          <tbody id="pcTbody"></tbody>
        </table>
      </div>
      <div style="padding:10px 4px 0;font-size:11.5px;color:var(--hint);display:flex;justify-content:space-between;align-items:center;">
        <span id="pcStatus">0건</span>
        <span>💡 변경 공급가는 수기 편집 가능 · 완료 체크 시 마진테이블의 매입가(= 공급가 × 1.1)와 소비자가를 갱신함</span>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG={owner:'tolmjj10',repo:'coupang-po',branch:'main',dir:'data',file:'마진테이블.xlsx'};

/* 컬럼 정의
   - editable: 인라인 편집 가능한 원본 컬럼
   - calc:     수식으로 자동 계산되는 컬럼
   - type:     'text' | 'num' | 'select'
*/
const COLS=[
  {k:'owner',   label:'담당자',      w:52,  align:'center', editable:true, type:'select', options:['김현유','이병은','조민주']},
  {k:'cat',     label:'카테고리',    w:66,  align:'center', editable:true, type:'select', cls:'col-cat',
    options:['이미용','욕실가전','모바일','겨울가전','여름가전','건강가전','주방가전','생활가전','인테리어/조명','제습기','공기청정기','육아','차량','애견']},
  {k:'sku',     label:'SKU #',       w:70,  align:'center', editable:true, type:'text'},
  {k:'_vpToggle', label:'',           w:6,   align:'center', render:renderVpToggle, cls:'col-vp-toggle'},
  {k:'viid',    label:'VIID',        w:96,  align:'center', editable:true, type:'text', cls:'col-vp'},
  {k:'pid',     label:'PID',         w:96,  align:'center', editable:true, type:'text', cls:'col-vp'},
  {k:'name',    label:'상품명',      w:320, align:'left',   editable:true, type:'text', cls:'col-name'},
  {k:'status',  label:'상태',        w:60,  align:'center', editable:true, type:'select', options:['판매','단종','품절','단종예정']},
  {k:'cost',    label:'매입가',      w:72,  align:'right',  editable:true, type:'num', hi:true},
  {k:'supply',  label:'공급가',      w:72,  align:'right',  calc:r=>r.cost!=null? r.cost/1.1 : null,           type:'num'},
  {k:'vat',     label:'부가세',      w:60,  align:'right',  calc:r=>r.cost!=null? r.cost - r.cost/1.1 : null,  type:'num'},
  {k:'margin1', label:'쿠팡마진\n(+VAT)', w:70, align:'right',  calc:r=>(r.price!=null&&r.cost!=null)? r.price - r.cost : null, type:'num', hi:true},
  {k:'mRate',   label:'마진율',      w:58,  align:'right',  calc:r=>(r.price&&r.cost!=null)? 1-(r.cost/r.price) : null,      type:'pct', hi:true},
  {k:'price',   label:'소비자가',    w:72,  align:'right',  editable:true, type:'num', hi:true},
  {k:'origin',  label:'원가',        w:70,  align:'right',  editable:true, type:'num'},
  {k:'originN', label:'원가\n(NEW)', w:70,  align:'right',  editable:true, type:'num'},
  {k:'diff',    label:'증감',        w:52,  align:'center', render:renderDiff},
  {k:'margin2', label:'마진\n(-VAT)', w:70, align:'right',  calc:r=>(r.cost!=null&&r.originN!=null)? (r.cost/1.1) - r.originN : null, type:'num', hi:true},
  {k:'pRate',   label:'이익율',      w:58,  align:'right',  calc:r=>{ if(r.cost==null||r.originN==null) return null; const g=r.cost/1.1, o=g-r.originN; return g? o/g:null; }, type:'pct', hi:true},
  {k:'roas',    label:'광고 ROAS\n(상시가)', w:72, align:'right', calc:r=>{ if(r.cost==null||r.originN==null||r.price==null) return null; const g=r.cost/1.1, o=g-r.originN; return o? r.price/o:null; }, type:'pctInt'},
  {k:'_act',    label:'',            w:64,  align:'center', render:renderActions},
];

const EDITABLE_KEYS=COLS.filter(c=>c.editable).map(c=>c.k);
const NUM_KEYS=new Set(COLS.filter(c=>c.editable&&c.type==='num').map(c=>c.k));

let rows=[];
let sortKey=null, sortDir=1;
let dirty=false;
let saving=false;
let autosaveTimer=null;
let lastSavedAt=null;
let activeCat=''; // '' = 전체
/* 툼스톤: 사용자가 마진에서 삭제한 상품명 목록. 신제품 임포트 시 이 목록도 제외 대상 */
let tombstones=[];

/* Undo/redo history: snapshots of rows (minus _id) */
const HISTORY_LIMIT=100;
let undoStack=[], redoStack=[];
function snapshot(){
  return JSON.stringify({
    rows: rows.map(r=>{const{_id,_new,...rest}=r;return rest;}),
    sortKey, sortDir, activeCat
  });
}
function restoreSnapshot(s){
  const obj=JSON.parse(s);
  // 하위호환: 예전 배열 스냅샷
  if(Array.isArray(obj)){
    rows=obj.map(r=>({_id:uid(),...r}));
    return;
  }
  rows=(obj.rows||[]).map(r=>({_id:uid(),...r}));
  sortKey=obj.sortKey ?? null;
  sortDir=obj.sortDir ?? 1;
  activeCat=obj.activeCat ?? '';
  // 헤더 정렬 표시 동기화
  document.querySelectorAll('#thead-row th').forEach(th=>{
    th.classList.remove('asc','desc');
    if(sortKey && th.dataset.k===sortKey){
      th.classList.add(sortDir===1?'asc':'desc');
    }
  });
}
function pushHistory(){
  undoStack.push(snapshot());
  if(undoStack.length>HISTORY_LIMIT) undoStack.shift();
  redoStack.length=0;
  updateUndoButtons();
}
function updateUndoButtons(){
  const u=document.getElementById('btnUndo');
  const r=document.getElementById('btnRedo');
  if(u) u.disabled = undoStack.length<=1;
  if(r) r.disabled = redoStack.length===0;
}
function rowsJson(s){
  try{ const o=JSON.parse(s); return JSON.stringify(Array.isArray(o)?o:o.rows||[]); }
  catch(e){ return s; }
}
function doUndo(){
  if(undoStack.length<=1) return;
  const cur=undoStack.pop();
  redoStack.push(cur);
  const target=undoStack[undoStack.length-1];
  const rowsChanged = rowsJson(cur) !== rowsJson(target);
  restoreSnapshot(target);
  fillFilters(); render();
  if(rowsChanged) markDirtyNoHistory(); else updateSaveInfo();
  updateUndoButtons();
}
function doRedo(){
  if(redoStack.length===0) return;
  const s=redoStack.pop();
  const prev=undoStack[undoStack.length-1];
  undoStack.push(s);
  const rowsChanged = rowsJson(s) !== rowsJson(prev);
  restoreSnapshot(s);
  fillFilters(); render();
  if(rowsChanged) markDirtyNoHistory(); else updateSaveInfo();
  updateUndoButtons();
}

/* ─────────────────────────── util ─────────────────────────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtInt(n){ if(n==null||!isFinite(n)) return ''; return Math.round(n).toLocaleString(); }
function fmtNum2(n){ if(n==null||!isFinite(n)) return ''; return n.toLocaleString(undefined,{maximumFractionDigits:2}); }
function fmtPct(n){ if(n==null||!isFinite(n)) return ''; return (n*100).toFixed(1)+'%'; }
function fmtPctInt(n){ if(n==null||!isFinite(n)) return ''; return Math.round(n*100)+'%'; }
function toNum(v){ if(v==null||v==='') return null; const n=Number(String(v).replace(/,/g,'').trim()); return isFinite(n)?n:null; }
function uid(){ return 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg;
  if(color) t.style.background=color; else t.style.background='#6f7c6d';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),1800);
}

function renderDiff(_,r){
  const a=r.originN, b=r.origin;
  if(a==null||b==null) return '';
  if(a>b) return `<span class="up">▲ ${fmtInt(a-b)}</span>`;
  if(a<b) return `<span class="down">▼ ${fmtInt(b-a)}</span>`;
  return `<span class="zero">0</span>`;
}
function renderActions(_,r){
  return `<div class="row-actions">
    <button class="btn ghost" data-act="dup" title="복제">⧉</button>
    <button class="btn ghost danger" data-act="del" title="삭제">✕</button>
  </div>`;
}

/* VIID/PID 컬럼 펼침·접힘 상태 */
let vpExpanded = (() => { try { return localStorage.getItem('margin_vp_expanded') === '1'; } catch(_) { return false; } })();
function renderVpToggle(_, r){
  // 얇은 세로 바만 노출. 헤더에서만 눈에 띄고 바디에선 거의 안 보이도록 CSS 로 제어.
  return `<div class="vp-toggle-handle" title="${vpExpanded?'VIID/PID 숨기기':'VIID/PID 보기'}"></div>`;
}
function toggleVp(){
  vpExpanded = !vpExpanded;
  try { localStorage.setItem('margin_vp_expanded', vpExpanded ? '1' : '0'); } catch(_){}
  document.getElementById('tbl').classList.toggle('vp-expanded', vpExpanded);
  render();
}

/* ─────────────────────────── render ─────────────────────────── */
function buildHead(){
  const tr=document.getElementById('thead-row');
  tr.innerHTML=COLS.map(c=>{
    const sortable=c.k!=='_act' && c.k!=='_vpToggle';
    const resizable=c.k!=='_act' && c.k!=='_vpToggle';
    const cls=(sortable?'sortable ':'')+(c.cls||'');
    return `<th class="${cls.trim()}" data-k="${c.k}" style="min-width:${c.w}px;width:${c.w}px;">${esc(c.label).replace(/\n/g,'<br>')}${sortable?'<span class="arrow"></span>':''}${resizable?'<span class="resize" data-k="'+c.k+'"></span>':''}</th>`;
  }).join('');
  tr.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click',(e)=>{
      if(e.target.classList.contains('resize')) return;
      const k=th.dataset.k;
      if(sortKey===k){ sortDir=-sortDir; } else { sortKey=k; sortDir=1; }
      tr.querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
      th.classList.add(sortDir===1?'asc':'desc');
      pushHistory();
      render();
    });
  });
  // 컬럼 리사이즈
  tr.querySelectorAll('.resize').forEach(handle=>{
    handle.addEventListener('mousedown',ev=>{
      ev.preventDefault(); ev.stopPropagation();
      const th=handle.parentElement;
      const k=handle.dataset.k;
      const startX=ev.clientX;
      const startW=th.offsetWidth;
      handle.classList.add('dragging');
      document.body.classList.add('col-resizing');
      let rafId=null, pendingW=startW;
      const apply=()=>{
        rafId=null;
        th.style.minWidth=pendingW+'px';
        th.style.width=pendingW+'px';
        const col=COLS.find(c=>c.k===k);
        if(col) col.w=pendingW;
      };
      const onMove=e=>{
        pendingW=Math.max(40, startW + (e.clientX-startX));
        if(rafId==null) rafId=requestAnimationFrame(apply);
      };
      const onUp=()=>{
        handle.classList.remove('dragging');
        document.body.classList.remove('col-resizing');
        window.removeEventListener('mousemove',onMove);
        window.removeEventListener('mouseup',onUp);
        // 폭 변경을 KV에 저장(모든 사용자에게 반영). undo 스택은 오염시키지 않음.
        if(startW !== pendingW) markDirtyNoHistory();
      };
      window.addEventListener('mousemove',onMove);
      window.addEventListener('mouseup',onUp);
    });
    handle.addEventListener('click',e=>e.stopPropagation());
  });
}

function getCellValue(r, col){
  if(col.calc) return col.calc(r);
  return r[col.k];
}

function formatValue(v, col){
  if(v==null) return '';
  if(col.type==='pct')    return fmtPct(v);
  if(col.type==='pctInt') return fmtPctInt(v);
  if(col.type==='num')    return fmtInt(v);
  if(col.type==='num2')   return fmtNum2(v);
  return String(v);
}

function renderCell(r, col){
  if(col.render && !col.calc) return col.render(getCellValue(r,col), r);
  const v=getCellValue(r,col);
  if(col.calc){
    let inner;
    if(col.type==='pct')         inner=fmtPct(v);
    else if(col.type==='pctInt') inner=fmtPctInt(v);
    else if(col.type==='num2')   inner=fmtNum2(v);
    else                         inner=fmtInt(v);
    if(col.hi) inner=`<span class="pct">${inner}</span>`;
    const align=col.align==='right'?'num':(col.align==='center'?'center':'');
    return `<div class="cell calc ${align}">${inner}</div>`;
  }
  const align=col.align==='right'?'num':(col.align==='center'?'center':'');
  const display=formatValue(v,col);
  let inner=esc(display);
  if(col.k==='status' && display){
    const s=String(display).trim();
    const cls=s==='판매'?'sell':(s==='단종'||s==='품절'?'stop':'');
    inner=`<span class="status-pill ${cls}">${esc(s)}</span>`;
  } else if(col.hi && display){
    inner=`<span class="pct">${inner}</span>`;
  }
  let extra='';
  if(col.k==='sku'){
    const s=String(display).trim();
    if(s && !/^\d+$/.test(s)) extra=' sku-alert';
  }
  return `<div class="cell editable ${align}${extra}" data-k="${col.k}" data-type="${col.type}">${inner}</div>`;
}

function render(){
  const q=document.getElementById('fQ').value.trim().toLowerCase();
  const fo=document.getElementById('fOwner').value;
  const fs=document.getElementById('fStatus').value;

  let list=rows.filter(r=>{
    if(activeCat && r.cat!==activeCat) return false;
    if(fo && r.owner!==fo) return false;
    if(fs && r.status!==fs) return false;
    if(q){
      const hay=((r.sku||'')+' '+(r.name||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(sortKey){
    const col=COLS.find(c=>c.k===sortKey);
    list.sort((a,b)=>{
      const va=getCellValue(a,col), vb=getCellValue(b,col);
      const na=Number(va), nb=Number(vb);
      const bothNum=isFinite(na)&&isFinite(nb);
      let cmp;
      if(bothNum) cmp=na-nb;
      else cmp=String(va==null?'':va).localeCompare(String(vb==null?'':vb),'ko');
      return cmp*sortDir;
    });
  }

  const tbody=document.getElementById('tbody');
  if(list.length===0){
    tbody.innerHTML=`<tr><td colspan="${COLS.length}" class="empty">표시할 데이터가 없습니다. 상단 [+ 행 추가] 또는 [xlsx에서 초기화]를 눌러주세요.</td></tr>`;
  } else {
    tbody.innerHTML=list.map(r=>{
      const cls=r._new?'new-row':'';
      return `<tr data-id="${r._id}" class="${cls}">`+COLS.map(c=>{
        const cell=renderCell(r,c);
        return `<td class="${c.cls||''}">${cell}</td>`;
      }).join('')+'</tr>';
    }).join('');
  }
  document.getElementById('status').textContent=`총 ${rows.length.toLocaleString()}건${list.length!==rows.length?' · 필터 '+list.length.toLocaleString()+'건':''}`;
}

/* ─────────────────────────── edit ─────────────────────────── */
// 이벤트 위임: tbody 하나에만 클릭 리스너를 붙여 매 render마다 리스너 재부착하지 않도록 함.
// 이전엔 300행 × 15셀 = 4500개 리스너를 매번 붙여서 카테고리 클릭/검색 입력마다 렉이 심했음.
function initTableDelegation(){
  const tbl=document.getElementById('tbl');
  // 헤더/바디 어디를 클릭해도 VIID/PID 토글
  tbl.addEventListener('click', e=>{
    if(e.target.closest('.col-vp-toggle')){ toggleVp(); e.stopPropagation(); return; }
  }, true);
  // 초기 상태 반영
  tbl.classList.toggle('vp-expanded', vpExpanded);
  const tbody=document.getElementById('tbody');
  tbody.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-act]');
    if(btn){
      e.stopPropagation();
      const tr = btn.closest('tr'); if(!tr) return;
      const act = btn.dataset.act;
      if(act==='del') deleteRow(tr.dataset.id);
      else if(act==='dup') duplicateRow(tr.dataset.id);
      return;
    }
    const cell = e.target.closest('.editable');
    if(cell){
      const tr = cell.closest('tr'); if(!tr) return;
      startEdit(cell, tr.dataset.id);
    }
  });
}
// 하위호환 no-op (기존 render() 내부 호출 대비)
function attachEditors(){}

function startEdit(el, id){
  // 이미 편집 중이면 재진입하지 않음 → 브라우저 기본 캐럿 이동/부분 선택 그대로 동작
  if(el.getAttribute('contenteditable')==='true') return;
  if(el.querySelector('select')) return;
  const r=rows.find(x=>x._id===id);
  if(!r) return;
  const k=el.dataset.k;
  const type=el.dataset.type;
  const col=COLS.find(c=>c.k===k);

  if(type==='select'){
    const cur=r[k]||'';
    const sel=document.createElement('select');
    sel.style.cssText='width:100%;padding:5px;border:1px solid var(--accent);border-radius:4px;font:12.5px Pretendard;';
    sel.innerHTML=`<option value=""></option>`+col.options.map(o=>`<option value="${esc(o)}"${o===cur?' selected':''}>${esc(o)}</option>`).join('');
    el.innerHTML='';
    el.appendChild(sel);
    sel.focus();
    let done=false;
    const commit=()=>{
      if(done) return; done=true;
      const changed=(r[k]||'')!==(sel.value||'');
      if(changed){ setValue(r,k,sel.value); markDirty(); render(); }
      else { render(); }
    };
    sel.addEventListener('change',commit);
    sel.addEventListener('blur',commit);
    return;
  }

  const raw=r[k];
  el.textContent=raw==null?'':String(raw);
  el.setAttribute('contenteditable','true');
  el.focus();
  // 최초 진입 시 전체 선택(교체 편집 편의). 이후 클릭은 재진입 가드로 브라우저 기본 캐럿 이동 유지.
  const range=document.createRange(); range.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(range);

  /* hi(볼드) 컬럼은 표시값을 <span class="pct"> 로 감싸야 볼드가 유지됨. 편집 후 재조립용 헬퍼. */
  const restoreDisplay=()=>{
    const v=getCellValue(r,col);
    const display=formatValue(v,col);
    if(col.hi && display){
      el.innerHTML=`<span class="pct">${esc(display)}</span>`;
    } else {
      el.textContent=display;
    }
  };
  const commit=()=>{
    el.removeAttribute('contenteditable');
    const txt=el.textContent.trim();
    const newVal=NUM_KEYS.has(k)?toNum(txt):txt;
    if((r[k]??'')!==(newVal??'')){
      setValue(r,k,newVal);
      /* 소비자가가 바뀌면 매입가를 항상 마진율 31% 기준(=소비자가×0.69) 으로 자동 갱신.
         매입가만 단독으로 수정한 경우엔 그 값이 그대로 저장됨. */
      if(k==='price' && typeof newVal==='number' && isFinite(newVal)){
        r.cost=Math.round(newVal*0.69);
      }
      markDirty();
      render();
    } else {
      // 변경 없음 → 전체 render 생략, 표시값만 원복 (hi 컬럼 볼드 스팬 재조립)
      restoreDisplay();
    }
  };
  el.addEventListener('blur',commit,{once:true});
  el.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); }
    if(ev.key==='Escape'){
      ev.preventDefault();
      el.removeAttribute('contenteditable');
      restoreDisplay();
    }
  });
}

function setValue(r,k,v){ r[k]=v; delete r._new; }

function addRow(){
  const r={_id:uid(),_new:true,owner:'',cat:'',sku:'',name:'',status:'',cost:null,price:null,origin:null,originN:null};
  rows.push(r);
  markDirty();
  fillFilters();
  // 필터/검색이 걸려있으면 새 행이 안 보일 수 있으므로 클리어
  ['fQ','fOwner','fStatus'].forEach(id=>{ const el=document.getElementById(id); if(el&&el.value) el.value=''; });
  activeCat='';
  sortKey=null;
  document.querySelectorAll('#thead-row th').forEach(th=>th.classList.remove('asc','desc'));
  render();
  // 새 행으로 스크롤 + 첫 편집 셀 포커스
  requestAnimationFrame(()=>{
    const wrap=document.querySelector('.table-wrap');
    if(wrap) wrap.scrollTop = wrap.scrollHeight;
    const tr=document.querySelector(`tr[data-id="${r._id}"]`);
    if(tr){
      const cell=tr.querySelector('.editable');
      if(cell) cell.click();
    }
  });
}

function duplicateRow(id){
  const idx=rows.findIndex(r=>r._id===id);
  if(idx<0) return;
  const src=rows[idx];
  const copy={...src,_id:uid(),_new:true};
  rows.splice(idx+1,0,copy);
  markDirty();
  render();
}

function deleteRow(id){
  const r=rows.find(x=>x._id===id);
  if(!r) return;
  if(!confirm(`삭제하시겠습니까?\n${r.sku||''} ${r.name||''}`.trim())) return;
  /* 삭제된 상품명을 툼스톤에 기록 — 신제품 임포트에서 재유입 차단 */
  const nm=(r.name||'').trim();
  if(nm && !tombstones.some(t=>t.toLowerCase()===nm.toLowerCase())){
    tombstones.push(nm);
  }
  rows=rows.filter(x=>x._id!==id);
  markDirty();
  fillFilters();
  render();
}

/* ─────────────────────────── filters ─────────────────────────── */
function fillFilters(){
  const owners=[...new Set(rows.map(r=>r.owner).filter(Boolean))].sort();
  const sts=[...new Set(rows.map(r=>r.status).filter(Boolean))].sort();
  const put=(id,arr)=>{
    const el=document.getElementById(id);
    const cur=el.value;
    el.innerHTML=el.querySelector('option').outerHTML+arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    el.value=cur;
  };
  put('fOwner',owners); put('fStatus',sts);
  renderCatList();
}

function renderCatList(){
  const el=document.getElementById('catList');
  if(!el) return;
  const counts={};
  rows.forEach(r=>{ const c=r.cat||''; counts[c]=(counts[c]||0)+1; });
  const cats=Object.keys(counts).filter(c=>c).sort();
  const total=rows.length;
  const items=[{key:'',label:'전체',count:total}]
    .concat(cats.map(c=>({key:c,label:c,count:counts[c]})));
  el.innerHTML=items.map(it=>`
    <div class="side-item ${activeCat===it.key?'active':''}" data-cat="${esc(it.key)}">
      <span>${esc(it.label)}</span>
      <span class="count">${it.count.toLocaleString()}</span>
    </div>

function isEditingActive(){
  const tbody=document.getElementById('tbody');
  if(!tbody) return false;
  if(tbody.querySelector('[contenteditable="true"]')) return true;
  if(tbody.querySelector('select')) return true;
  const ae=document.activeElement;
  if(ae && tbody.contains(ae)) return true;
  return false;
}

function updateSaveInfo(){
  const el=document.getElementById('saveInfo');
  el.classList.remove('dirty','err');
  if(saving){ el.textContent='저장 중…'; el.classList.add('dirty'); return; }
  if(dirty){ el.textContent='● 변경사항 있음 (자동 저장 대기)'; el.classList.add('dirty'); return; }
  if(lastSavedAt){
    const d=new Date(lastSavedAt);
    el.textContent='저장됨 · '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  } else {
    el.textContent='';
  }
}

function getColWidths(){
  const o={};
  COLS.forEach(c=>{ if(c.k!=='_act') o[c.k]=c.w; });
  return o;
}
function applyColWidths(){
  const tr=document.getElementById('thead-row');
  if(!tr) return;
  COLS.forEach(c=>{
    const th=tr.querySelector(`th[data-k="${c.k}"]`);
    if(th){ th.style.minWidth=c.w+'px'; th.style.width=c.w+'px'; }
  });
}

async function save(){
  if(saving) return;
  saving=true; updateSaveInfo();
  try{
    const rowsPayload=rows.map(r=>{
      const {_id,_new,...rest}=r;
      return rest;
    });
    const payload={rows:rowsPayload, colWidths:getColWidths(), tombstones};
    const res=await fetch('/api/margin-state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    dirty=false;
    lastSavedAt=Date.now();
    // 저장 후 _new 배지 제거
    rows.forEach(r=>delete r._new);
    // 편집 중이면 render() 생략 — 포커스/캐럿 끊김 방지
    if(!isEditingActive()) render();
    showToast('저장 완료');
  } catch(e){
    console.error(e);
    const el=document.getElementById('saveInfo');
    el.textContent='저장 실패: '+e.message;
    el.classList.add('err');
    showToast('저장 실패: '+e.message,'#b04a3a');
  } finally {
    saving=false; updateSaveInfo();
  }
}

async function load(){
  document.getElementById('status').textContent='불러오는 중…';
  try{
    const res=await fetch('/api/margin-state',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    // 하위호환: 예전엔 [row,...] 배열, 지금은 {rows,colWidths}
    let rowArr=[], colWidths=null;
    if(Array.isArray(data)) rowArr=data;
    else if(data && typeof data==='object'){
      rowArr=Array.isArray(data.rows)?data.rows:[];
      colWidths=data.colWidths||null;
      tombstones=Array.isArray(data.tombstones)?data.tombstones.filter(Boolean):[];
    }
    rows=rowArr.map(r=>{
      const row={_id:uid(),...r};
      if(typeof row.status==='string') row.status=row.status.replace(/\s+/g,''); // 공백 제거해 '단종 예정' → '단종예정' 통합
      if(row.status==='예정') row.status='단종예정'; // 옛 값 마이그레이션
      if(row.status==='중지') row.status=''; // '중지' 상태 제거
      // viid/pid 이전: state에 없고 window.viidMap 에만 있으면 자동 채움
      const sku=String(row.sku||'').trim();
      const mapped=(window.viidMap||{})[sku];
      if(mapped){
        if(!row.viid && mapped.viid) row.viid=String(mapped.viid);
        if(!row.pid  && mapped.pid ) row.pid =String(mapped.pid);
      }
      return row;
    });
    if(colWidths){
      COLS.forEach(c=>{ if(colWidths[c.k]!=null && isFinite(colWidths[c.k])) c.w=colWidths[c.k]; });
      applyColWidths();
    }
    fillFilters();
    render();
    undoStack.length=0; redoStack.length=0;
    undoStack.push(snapshot());
    updateUndoButtons();
    if(rows.length===0){
      document.getElementById('status').textContent='데이터 없음 · [＋ 행 추가]';
    }
  } catch(e){
    console.error(e);
    document.getElementById('tbody').innerHTML=`<tr><td colspan="${COLS.length}" class="err">불러오기 실패: ${esc(e.message)}<br><br>배포판(https://coupang-po.pages.dev)에서 열어야 저장/불러오기가 동작합니다.</td></tr>`;
    document.getElementById('status').textContent='로드 실패';
  }
}

async function loadViidPidForMargin(){
  try {
    const listUrl='/api/repo-files?path='+encodeURIComponent('promotion/viid_pid')+'&ref=main';
    const listRes=await fetch(listUrl);
    if(!listRes.ok) throw new Error('list HTTP '+listRes.status);
    const files=await listRes.json();
    const NAME_RE=/viid.*pid.*확인/i;
    const target=(files||[]).find(f=>f.type==='file' && NAME_RE.test(f.name) && /\.xlsx?$/i.test(f.name));
    if(!target){ console.log('[margin] viid_pid확인 파일 없음'); return; }
    await _mgEnsureXlsx();
    const abRes=await fetch(target.download_url);
    if(!abRes.ok) throw new Error('file HTTP '+abRes.status);
    const ab=await abRes.arrayBuffer();
    const wb=XLSX.read(ab,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1, defval:''});
    if(aoa.length<2) return;
    let hIdx=-1;
    for(let i=0;i<Math.min(aoa.length,10);i++){
      const row=(aoa[i]||[]).map(v=>String(v||'').toUpperCase().replace(/\s+/g,''));
      const hasSku=row.some(c=>/SKU/.test(c));
      const hasViid=row.some(c=>/VIID|옵션ID|옵션아이디/.test(c));
      const hasPid=row.some(c=>/(^|[^A-Z])PID|노출ID|상품ID/.test(c));
      if(hasSku && (hasViid||hasPid)){ hIdx=i; break; }
    }
    if(hIdx<0){ console.warn('[margin] viid_pid 헤더 감지 실패'); return; }
    const header=(aoa[hIdx]||[]).map(v=>String(v||'').toUpperCase().replace(/\s+/g,''));
    const skuCol=header.findIndex(h=>/SKU/.test(h) && !/명|NAME/.test(h));
    const viidCol=header.findIndex(h=>/VIID|옵션ID|옵션아이디/.test(h));
    const pidCol=header.findIndex(h=>/(^|[^A-Z])PID|노출ID|상품ID/.test(h));
    const map={};
    for(let r=hIdx+1;r<aoa.length;r++){
      const row=aoa[r]||[];
      const sku=String(row[skuCol]||'').trim();
      if(!sku) continue;
      map[sku]={
        viid: viidCol>=0?String(row[viidCol]||'').trim():'',
        pid:  pidCol>=0?String(row[pidCol]||'').trim():''
      };
    }
    window.viidMap=map;
    try { localStorage.setItem(VP_CACHE_KEY, JSON.stringify(map)); } catch(_){}
    console.log('[margin] VIID/PID 매핑 로드', Object.keys(map).length, '건');
    // rows에 viid/pid 비어있으면 매핑에서 backfill
    let filled=0;
    if(Array.isArray(rows)){
      rows.forEach(row=>{
        const sku=String(row.sku||'').trim();
        const mapped=map[sku];
        if(!mapped) return;
        if(!row.viid && mapped.viid){ row.viid=String(mapped.viid); filled++; }
        if(!row.pid  && mapped.pid ){ row.pid =String(mapped.pid);  filled++; }
      });
    }
    if(filled>0){
      console.log('[margin] 기존 rows에 viid/pid backfill', filled, '건');
      dirty=true;  // 자동 저장 트리거
      if(typeof updateSaveInfo==='function') updateSaveInfo();
    }
    if(typeof render==='function') render();
  } catch(e){
    console.warn('[margin] loadViidPid 실패:', e.message);
  }
}

document.addEventListener('keydown', (e)=>{
  const key = e.key;
  const ctrl = e.ctrlKey || e.metaKey;
  const t = e.target;
  const inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  const goBottom = () => {
    const wrap = document.querySelector('.table-wrap');
    if (!wrap) return;
    wrap.scrollTop = wrap.scrollHeight;
  };
  const goTop = () => {
    const wrap = document.querySelector('.table-wrap');
    if (!wrap) return;
    wrap.scrollTop = 0;
  };
  if (ctrl && (key === 'ArrowDown' || key === 'End')) {
    e.preventDefault();
    goBottom();
    return;
  }
  if (ctrl && (key === 'ArrowUp' || key === 'Home')) {
    e.preventDefault();
    goTop();
    return;
  }
  // End 단독: 입력 필드 안이면 기본 동작(줄 끝 이동) 우선 유지
  if (!ctrl && key === 'End' && !inField) {
    e.preventDefault();
    goBottom();
  }
  if (!ctrl && key === 'Home' && !inField) {
    e.preventDefault();
    goTop();
  }
});

async function _fetchProductStatus(){
  try{
    const listUrl = `https://api.github.com/repos/${_PS_REPO.owner}/${_PS_REPO.repo}/contents/${encodeURI(_PS_REPO.dir)}?ref=${_PS_REPO.branch}`;
    const listRes = await fetch(listUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
    if(!listRes.ok){ console.warn('[margin] 제품현황 list HTTP', listRes.status); return; }
    const files = await listRes.json();
    const NAME_RE = /^제품\s*현황\s*조회.*\.xlsx?$/i;
    const matches = (files||[]).filter(f=>f.type==='file' && NAME_RE.test(f.name));
    if(!matches.length){ console.log('[margin] 제품 현황 조회 파일 없음'); return; }
    matches.sort((a,b)=> a.name < b.name ? 1 : a.name > b.name ? -1 : 0);
    const target = matches[0];
    const abRes = await fetch(target.download_url);
    if(!abRes.ok) return;
    const ab = await abRes.arrayBuffer();
    const wb = XLSX.read(ab, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if(aoa.length < 2) return;
    let hIdx = -1;
    for(let i=0; i<Math.min(aoa.length,15); i++){
      const row = (aoa[i]||[]).map(v=>String(v||'').trim());
      if(row.some(c=>c==='제품명')){ hIdx = i; break; }
    }
    if(hIdx < 0){ console.warn('[margin] 제품현황 헤더 없음'); return; }
    const header = (aoa[hIdx]||[]).map(v=>String(v||'').trim());
    const findIdx = (fn)=>header.findIndex(fn);
    const nameCol  = findIdx(h=>h==='제품명');
    const modelCol = findIdx(h=>/^모델(명|번호|no)?$/i.test(h));
    const codeCol  = findIdx(h=>/^(상품\s*코드|프로\s*코드|product\s*code)$/i.test(h));
    if(nameCol < 0) return;
    const map = {};
    for(let r=hIdx+1; r<aoa.length; r++){
      const row = aoa[r]||[];
      const name = String(row[nameCol]||'').trim();
      if(!name) continue;
      const model = modelCol>=0 ? String(row[modelCol]||'').trim() : '';
      const code  = codeCol>=0  ? String(row[codeCol]||'').trim()  : '';
      if(!map[name] && (model || code)) map[name] = { model, code };
    }
    window.__prodStatusMap = map;
    console.log('[margin] 제품 현황 맵 로드', Object.keys(map).length, '건 (파일:', target.name + ')');
  } catch(e){ console.warn('[margin] 제품현황 로드 실패:', e.message); }
}

  const el = document.createElement('div');
  el.id = '__prodStatusPop';
  el.style.cssText = 'position:absolute;z-index:1000;background:#fffdf5;border:1px solid #e5c76b;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.12);padding:8px 10px;min-width:180px;font-size:12px;color:#4a3c1e;line-height:1.5;display:none;user-select:text;font-family:inherit;';
  document.body.appendChild(el);
  _psPop = el;
  el.addEventListener('mousedown', ev=>ev.stopPropagation());
  return el;
}
function _psHide(){ if(_psPop) _psPop.style.display='none'; }
function _psShow(cellEl, name){
  const info = (window.__prodStatusMap||{})[name];
  if(!info || (!info.model && !info.code)){ _psHide(); return; }
  const pop = _psEnsure();
  const line = (label,val) => `<div style="display:flex;gap:6px;align-items:center;margin:2px 0;"><span style="color:#8a7a3a;font-weight:600;min-width:56px;">${label}</span><span class="__psCopy" data-copy="${esc(val)}" style="cursor:pointer;padding:2px 6px;border-radius:4px;background:#fff;border:1px solid #e5c76b;font-weight:600;font-family:monospace;">${esc(val)}</span></div>`;
  const rows2 = [];
  if(info.code)  rows2.push(line('상품코드', info.code));
  if(info.model) rows2.push(line('모델명',   info.model));
  pop.innerHTML = rows2.join('') + `<div style="color:#a68a4a;font-size:10.5px;margin-top:4px;">클릭해서 복사</div>`;
  const rect = cellEl.getBoundingClientRect();
  const popW = 240;
  let left = window.scrollX + rect.left;
  const top = window.scrollY + rect.bottom + 4;
  if(left + popW > window.scrollX + window.innerWidth - 8) left = window.scrollX + window.innerWidth - popW - 8;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.display = 'block';
  pop.querySelectorAll('.__psCopy').forEach(sp=>{
    sp.onclick = async ()=>{
      const v = sp.dataset.copy;
      try{ await navigator.clipboard.writeText(v); }
      catch(_){
        const ta = document.createElement('textarea'); ta.value=v; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      sp.style.background = '#e4d68a';
      setTimeout(()=>{ sp.style.background='#fff'; }, 400);
    };
  });
}
document.getElementById('tbody').addEventListener('contextmenu', ev=>{
  const cell = ev.target.closest('td.col-name .cell');
  if(!cell) return;
  const tr = cell.closest('tr'); if(!tr) return;
  const r = rows.find(x=>x._id===tr.dataset.id); if(!r) return;
  const name = String(r.name||'').trim();
  if(!name) return;
  const info = (window.__prodStatusMap||{})[name];
  if(!info) return; // 매칭 안 되면 기본 브라우저 메뉴 유지
  ev.preventDefault();
  _psShow(cell, name);
});
document.addEventListener('mousedown', ev=>{
  if(!_psPop || _psPop.style.display==='none') return;
  if(_psPop.contains(ev.target)) return;
  _psHide();
});
window.addEventListener('scroll', _psHide, true);
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') _psHide(); });

/* ═══════════════════════ 공급가 변경 뷰 ═══════════════════════ */
const PC_STORAGE_KEY = 'coupang_margin_price_change_v1';
const PC_API = '/api/price-change-state';
const PC_MARGIN_RATE = 0.31; // 공급가 = 판매가 × (1 - 0.31)
const PC_AUTOSAVE_MS = 60 * 1000;
let pcRows = [];
let pcDirty = false;
let pcSaving = false;
let pcLastSavedAt = null;
let pcAutosaveTimer = null;

function pcLoadLocal(){
  try{
    const raw = localStorage.getItem(PC_STORAGE_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)) pcRows = arr.map(r=>({ _id: uid(), ...r }));
    }
  } catch(_){}
  if(!pcRows.length) pcRows = [pcBlankRow()];
}
async function pcLoadRemote(){
  try{
    const res = await fetch(PC_API, { cache: 'no-store' });
    if(!res.ok) return false;
    const parsed = await res.json();
    if(Array.isArray(parsed) && parsed.length){
      pcRows = parsed.map(r=>({ _id: uid(), ...r }));
      pcPersistLocal();
      return true;
    }
  } catch(_){}
  return false;
}
function pcPersistLocal(){
  try{
    const persist = pcRows.map(({_id, ...rest})=>rest);
    localStorage.setItem(PC_STORAGE_KEY, JSON.stringify(persist));
  } catch(_){}
}
function pcMarkDirty(){
  pcDirty = true;
  pcPersistLocal();
  pcUpdateSaveInfo();
}
function pcUpdateSaveInfo(){
  const el = document.getElementById('pcSaveInfo');
  if(!el) return;
  if(pcSaving){ el.textContent = '저장 중…'; return; }
  if(pcDirty){ el.textContent = '● 변경사항 있음'; return; }
  if(pcLastSavedAt){
    const d = new Date(pcLastSavedAt);
    el.textContent = '저장됨 · ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  } else el.textContent = '';
}
async function pcSaveRemote(){
  if(pcSaving) return;
  pcSaving = true; pcUpdateSaveInfo();
  try{
    const payload = pcRows.map(({_id, ...rest})=>rest);
    const res = await fetch(PC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    pcDirty = false;
    pcLastSavedAt = Date.now();
    pcPersistLocal();
  } catch(e){
    showToast('공급가 변경 저장 실패: ' + e.message, '#b04a3a');
  } finally {
    pcSaving = false; pcUpdateSaveInfo();
  }
}
function pcStartAutosave(){
  if(pcAutosaveTimer) return;
  pcAutosaveTimer = setInterval(()=>{
    if(pcDirty && !pcSaving) pcSaveRemote();
  }, PC_AUTOSAVE_MS);
}
function pcBlankRow(){
  return { _id: uid(), sku:'', name:'', oldPrice:null, oldSupply:null, newPrice:null, newSupply:null, newSupplyManual:false, done:false };
}
function pcFmtInt(v){
  if(v == null || v === '') return '';
  const n = Math.round(Number(v));
  if(!isFinite(n)) return '';
  return n.toLocaleString('ko-KR');
}
function pcParseNum(s){
  if(s == null) return null;
  const t = String(s).replace(/[,\s]/g,'').trim();
  if(t === '') return null;
  const n = Number(t);
  return isFinite(n) ? n : null;
}
function pcLookupBySku(sku){
  const s = String(sku||'').trim();
  if(!s) return null;
  return rows.find(r => String(r.sku||'').trim() === s) || null;
}
function pcRender(){
  const tbody = document.getElementById('pcTbody');
  if(!tbody) return;
  if(pcRows.length === 0) pcRows.push(pcBlankRow());
  tbody.innerHTML = pcRows.map(r=>{
    const doneStyle = r.done ? 'opacity:0.55;background:#f2ede9;' : '';
    return `<tr data-id="${r._id}" style="${doneStyle}">
      <td style="padding:6px 6px;border-bottom:1px solid var(--hairline);text-align:center;">
        <input class="pc-inp" data-k="sku" value="${esc(r.sku||'')}" style="width:100%;padding:6px 6px;border:1px solid var(--hairline);border-radius:6px;text-align:center;font-family:monospace;font-size:12px;background:${r.done?'#f8f5f2':'#fff'};" placeholder="SKU#">
      </td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--hairline);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.name||'')}</td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--hairline);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;">${pcFmtInt(r.oldPrice)}</td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--hairline);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;">${pcFmtInt(r.oldSupply)}</td>
      <td style="padding:6px 6px;border-bottom:1px solid var(--hairline);text-align:right;background:#fbf8f4;">
        <input class="pc-inp" data-k="newPrice" value="${r.newPrice==null?'':pcFmtInt(r.newPrice)}" style="width:100%;padding:6px 8px;border:1px solid var(--hairline);border-radius:6px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;background:${r.done?'#f8f5f2':'#fff'};" placeholder="0">
      </td>
      <td style="padding:6px 6px;border-bottom:1px solid var(--hairline);text-align:right;background:#fbf8f4;">
        <input class="pc-inp" data-k="newSupply" value="${r.newSupply==null?'':pcFmtInt(r.newSupply)}" style="width:100%;padding:6px 8px;border:1px solid var(--hairline);border-radius:6px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;background:${r.done?'#f8f5f2':'#fff'};color:${r.newSupplyManual?'#b04a3a':'inherit'};" placeholder="0" title="${r.newSupplyManual?'수기 입력됨':'변경 판매가 × 0.69 자동'}">
      </td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--hairline);text-align:center;">
        <input type="checkbox" class="pc-done" ${r.done?'checked':''} style="width:16px;height:16px;cursor:pointer;">
      </td>
      <td style="padding:6px 4px;border-bottom:1px solid var(--hairline);text-align:center;">
        <button class="btn ghost danger pc-del" title="행 삭제" style="padding:4px 8px;font-size:12px;">✕</button>
      </td>
    </tr>`;
  }).join('');
  const doneCnt = pcRows.filter(r=>r.done).length;
  document.getElementById('pcStatus').textContent = `${pcRows.length}건${doneCnt?' · 완료 '+doneCnt+'건':''}`;
}
function pcOpen(){
  document.getElementById('marginView').style.display = 'none';
  document.getElementById('priceChangeView').style.display = 'block';
  document.getElementById('btnPriceChange').style.display = 'none';
  document.getElementById('btnBackToMargin').style.display = 'inline-flex';
  document.getElementById('pageTitle').textContent = '공급가 변경';
  pcRender();
}
function pcCloseFn(){
  document.getElementById('priceChangeView').style.display = 'none';
  document.getElementById('marginView').style.display = 'block';
  document.getElementById('btnBackToMargin').style.display = 'none';
  document.getElementById('btnPriceChange').style.display = 'inline-flex';
  document.getElementById('pageTitle').textContent = '마진테이블';
}
function pcApplyToMargin(r){
  const target = pcLookupBySku(r.sku);
  if(!target){ showToast('SKU# 매칭 안됨: ' + r.sku, '#b04a3a'); return false; }
  const patch = {};
  if(r.newPrice != null)  patch.price = Number(r.newPrice);
  if(r.newSupply != null) patch.cost  = Math.round(Number(r.newSupply) * 1.1);
  if(!Object.keys(patch).length) return false;
  pushHistory();
  Object.assign(target, patch);
  markDirtyNoHistory();
  render();
  return true;
}
function pcRevertOnMargin(r){
  const target = pcLookupBySku(r.sku);
  if(!target) return false;
  const patch = {};
  if(r.oldPrice != null)  patch.price = Number(r.oldPrice);
  if(r.oldSupply != null) patch.cost  = Math.round(Number(r.oldSupply) * 1.1);
  if(!Object.keys(patch).length) return false;
  pushHistory();
  Object.assign(target, patch);
  markDirtyNoHistory();
  render();
  return true;
}

document.getElementById('btnPriceChange').addEventListener('click', pcOpen);
document.getElementById('btnBackToMargin').addEventListener('click', pcCloseFn);
document.getElementById('pcAdd').addEventListener('click', ()=>{
  pcRows.push(pcBlankRow());
  pcMarkDirty(); pcRender();
});
document.getElementById('pcTbody').addEventListener('input', ev=>{
  const inp = ev.target.closest('.pc-inp');
  if(!inp) return;
  const tr = inp.closest('tr'); if(!tr) return;
  const r = pcRows.find(x=>x._id === tr.dataset.id); if(!r) return;
  if(r.done) return;
  const k = inp.dataset.k;
  if(k === 'sku'){
    r.sku = inp.value.trim();
  } else if(k === 'newPrice'){
    r.newPrice = pcParseNum(inp.value);
    if(!r.newSupplyManual){
      r.newSupply = r.newPrice != null ? Math.round(r.newPrice * (1 - PC_MARGIN_RATE)) : null;
      const supplyInp = tr.querySelector('.pc-inp[data-k="newSupply"]');
      if(supplyInp) supplyInp.value = r.newSupply == null ? '' : pcFmtInt(r.newSupply);
    }
  } else if(k === 'newSupply'){
    r.newSupply = pcParseNum(inp.value);
    r.newSupplyManual = (r.newSupply != null);
  }
  pcMarkDirty();
});
document.getElementById('pcTbody').addEventListener('change', ev=>{
  const inp = ev.target.closest('.pc-inp');
  if(inp && inp.dataset.k === 'sku'){
    const tr = inp.closest('tr'); if(!tr) return;
    const r = pcRows.find(x=>x._id === tr.dataset.id); if(!r) return;
    const found = pcLookupBySku(r.sku);
    if(found){
      r.name = found.name || '';
      r.oldPrice = found.price != null ? Number(found.price) : null;
      r.oldSupply = found.cost != null ? Math.round(Number(found.cost)/1.1) : null;
    } else {
      r.name = ''; r.oldPrice = null; r.oldSupply = null;
    }
    if(!r.newSupplyManual && r.newPrice != null){
      r.newSupply = Math.round(r.newPrice * (1 - PC_MARGIN_RATE));
    }
    pcMarkDirty(); pcRender();
    return;
  }
  const chk = ev.target.closest('.pc-done');
  if(chk){
    const tr = chk.closest('tr'); if(!tr) return;
    const r = pcRows.find(x=>x._id === tr.dataset.id); if(!r) return;
    if(chk.checked){
      if(!r.sku || (r.newPrice == null && r.newSupply == null)){
        chk.checked = false;
        showToast('SKU#와 변경 판매가/공급가를 먼저 입력하세요', '#b04a3a');
        return;
      }
      const ok = pcApplyToMargin(r);
      if(!ok){ chk.checked = false; return; }
      r.done = true;
      showToast(`SKU# ${r.sku} 반영됨 · 저장 필요`);
    } else {
      const reverted = pcRevertOnMargin(r);
      r.done = false;
      if(reverted) showToast(`SKU# ${r.sku} 원상복구됨 · 저장 필요`);
    }
    pcMarkDirty(); pcRender();
  }
});
document.getElementById('pcTbody').addEventListener('click', ev=>{
  const del = ev.target.closest('.pc-del');
  if(!del) return;
  const tr = del.closest('tr'); if(!tr) return;
  pcRows = pcRows.filter(x=>x._id !== tr.dataset.id);
  if(!pcRows.length) pcRows.push(pcBlankRow());
  pcMarkDirty(); pcRender();
});
document.addEventListener('keydown', ev=>{
  if(ev.key === 'Escape' && document.getElementById('priceChangeView').style.display === 'block'){
    pcCloseFn();
  }
});
pcLoadLocal();
pcLoadRemote().then(hadRemote => { if(hadRemote){ pcUpdateSaveInfo(); if(document.getElementById('priceChangeView').style.display==='block') pcRender(); } });
pcStartAutosave();
window.addEventListener('focus', ()=>{ if(!pcDirty) pcLoadRemote().then(had=>{ if(had && document.getElementById('priceChangeView').style.display==='block') pcRender(); }); });
document.getElementById('pcSave').addEventListener('click', pcSaveRemote);

load();
</script>
