<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 판매가 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #fbfbfe;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1a1916;
    --muted: #6b6960;
    --primary: #1a3a4a;
    --primary-hover: #255269;
    --accent: #1a3a4a;
    --accent-light: #e8f1f5;
    --success: #4a7c59;
    --warning: #b08840;
    --danger: #a85450;
    --info: #4a6b8a;
    --soft-red: #f7efee;
    --soft-yellow: #f8f4e9;
    --soft-green: #eef2ec;
    --soft-blue: #eef1f4;
    --soft-purple: #f2f0ee;
  }
  html, body {
    font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    max-width: 1720px;
    margin: 0 auto;
    padding: 20px 24px 22px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .page-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 4px 12px;
    border-bottom: 1px solid #eae1d8;
    margin-bottom: 14px;
  }
  .page-title h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.024em;
    margin: 0;
    color: var(--text);
    line-height: 1.15;
  }
  .page-title .status {
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .toolbar .spacer { flex: 1 1 auto; }
  .date-range {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border: 1px solid #d3c4b7;
    border-radius: 9px;
    background: var(--card);
    font: 500 13px 'Pretendard', sans-serif;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .date-range:hover { border-color: #b8a595; }
  .date-range.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .date-range .label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .date-range .range-text { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .date-range .range-text .tilde { color: var(--muted); margin: 0 6px; }
  .date-range .cal-icon {
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
    margin-left: 2px;
  }
  .cal-popup {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 100;
    background: #fff;
    border: 1px solid #e0d6cd;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(60, 40, 20, 0.14), 0 2px 6px rgba(60, 40, 20, 0.08);
    padding: 12px;
    min-width: 260px;
    display: none;
    cursor: default;
    user-select: none;
  }
  .cal-popup.open { display: block; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .month-label { font-weight: 700; font-size: 13.5px; color: var(--text); letter-spacing: -0.01em; }
  .cal-nav {
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: transparent; cursor: pointer; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; transition: background .12s;
  }
  .cal-nav:hover { background: #f6f1ec; color: var(--text); }
  .cal-nav:disabled { opacity: 0.25; cursor: not-allowed; background: transparent; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 32px);
    grid-auto-rows: 32px;
    gap: 2px;
    justify-content: center;
  }
  .cal-dow {
    font-size: 10.5px; color: var(--muted); font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-dow.sun { color: #c46a66; }
  .cal-dow.sat { color: #4a6b8a; }
  .cal-cell {
    font-size: 12.5px;
    border-radius: 6px; cursor: pointer; color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: background .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-cell.disabled { color: #d5d0c8; cursor: not-allowed; }
  .cal-cell.disabled:hover { background: transparent; }
  .cal-cell:not(.disabled):hover { background: var(--accent-light); }
  .cal-cell.in-range { background: #eef1f4; color: var(--text); border-radius: 0; }
  .cal-cell.range-start,
  .cal-cell.range-end { background: var(--primary); color: #fff; font-weight: 700; }
  .cal-cell.range-start { border-radius: 6px 0 0 6px; }
  .cal-cell.range-end { border-radius: 0 6px 6px 0; }
  .cal-cell.range-start.range-end { border-radius: 6px; }
  .cal-hint {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0eae2;
    font-size: 11.5px; color: var(--muted); text-align: center;
  }
  .site-filter {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border: 1px solid #d3c4b7;
    border-radius: 9px;
    background: var(--card);
    font: 500 13px 'Pretendard', sans-serif;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, box-shadow .15s;
    min-width: 160px;
  }
  .site-filter:hover { border-color: #b8a595; }
  .site-filter.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .site-filter .label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .site-filter .site-text {
    flex: 1;
    letter-spacing: -0.01em;
    color: var(--text);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .site-filter .site-text.muted { color: var(--muted); }
  .site-popup {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 100;
    background: #fff;
    border: 1px solid #e0d6cd;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(60, 40, 20, 0.14), 0 2px 6px rgba(60, 40, 20, 0.08);
    padding: 10px;
    display: none;
    cursor: default;
    width: 260px;
    height: 380px;
    min-width: 220px;
    min-height: 200px;
    max-width: 90vw;
    max-height: 85vh;
    resize: both;
    overflow: hidden;
    flex-direction: column;
  }
  .site-popup.open { display: flex; }
  .site-popup-head { display: flex; gap: 6px; margin-bottom: 8px; flex: 0 0 auto; }
  .site-mini {
    font: 500 11.5px 'Pretendard', sans-serif;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #e0d6cd;
    background: #fff;
    color: var(--muted);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .site-mini:hover { background: #f6f1ec; color: var(--text); }
  .site-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding-right: 4px;   /* 우측 하단 resize handle 공간 확보 */
  }
  .site-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text);
    transition: background .1s;
  }
  .site-item:hover { background: #f6f1ec; }
  .site-item input[type="checkbox"] {
    accent-color: var(--primary);
    cursor: pointer;
    margin: 0;
  }
  .site-item .site-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .search {
    font: 13px 'Pretendard', sans-serif;
    padding: 8px 12px;
    border: 1px solid #d3c4b7;
    border-radius: 9px;
    background: var(--card);
    color: var(--text);
    outline: none;
    min-width: 200px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .search::placeholder { color: #a09990; }
  button.btn {
    font: 500 13px 'Pretendard', sans-serif; letter-spacing: -0.01em;
    padding: 8px 14px; border-radius: 9px; border: 1px solid #e0d6cd;
    background: #ffffff; color: var(--text); cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 500;
  }
  button.btn:hover { background: #f6f1ec; border-color: #d3c4b7; }
  button.btn:active { transform: scale(0.98); }
  button.btn.icon-only { padding: 8px 10px; }
  button.btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 8px 10px;
  }
  button.btn.ghost:hover { background: #f6f1ec; color: var(--text); border-color: transparent; }
  button.btn:disabled {
    opacity: 0.32;
    cursor: default;
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }
  button.btn:disabled:hover { background: transparent; color: var(--muted); border-color: transparent; }

  .table-wrap {
    background: white;
    border-radius: 14px;
    overflow: auto;
    flex: 1;
    min-height: 0;
    border: 1px solid #eae1d8;
    box-shadow: 0 1px 2px rgba(139, 117, 108, 0.05);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  /* 시간대 확장(extras 표시)이 하나라도 있으면 스크롤 발생하도록 max-content */
  table.expanded {
    width: max-content;
    min-width: 100%;
  }
  th {
    background: #f5f3ef;
    padding: 12px 12px;
    text-align: left;
    font-weight: 700;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 3;
    white-space: nowrap;
  }
  /* 두 번째 헤더 행(sub-*)은 첫 행 밑에 붙어야 함.
     top 값과 실제 date-header 높이 사이 서브픽셀 갭으로 표 내용이 보이는 문제를
     box-shadow 로 상하 양쪽 배경을 늘려 덮어 방지. */
  th.sub-base, th.sub-price {
    top: 39px;
    z-index: 2;
    box-shadow: 0 -2px 0 0 #f5f3ef;
  }
  th.date-header {
    text-align: center;
    border-left: 1px solid var(--border);
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    background: #ede8df;
    cursor: default;
    user-select: none;
    padding: 10px 12px;
    top: 0;
    z-index: 3;
    box-shadow: 0 2px 0 0 #ede8df;
  }
  th.date-header.has-extra { cursor: pointer; }
  th.date-header.has-extra:hover { background: var(--accent-light); }
  th.date-header .date-label {
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  th.date-header .expand-icon {
    font-size: 10px;
    opacity: 0.5;
    transition: transform .2s;
    display: inline-block;
    margin-left: 3px;
  }
  th.date-header.expanded .expand-icon { transform: rotate(90deg); opacity: 0.9; }
  th.sub-base, th.sub-price {
    background: #f5f3ef;
    font-weight: 700;
    font-size: 11px;
    color: var(--text);
    text-align: center;
    padding: 8px 6px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  th.sub-base { border-left: 1px solid var(--border); }
  .time-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 500;
    margin-left: 5px;
    padding: 1px 7px;
    background: #ffffff;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    letter-spacing: 0;
    text-transform: none;
  }
  .time-tag.extra-tag { display: none; }
  .time-tag.extra-tag.shown { display: inline-block; }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid #f5f6f9;
    vertical-align: middle;
    white-space: nowrap;
  }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover td { background: #fafbfd; }
  .idx {
    width: 44px;
    text-align: center;
    color: #b8b3ac;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  .id {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 11.5px;
    width: 108px;
  }
  .id.sku {
    color: var(--text);
    font-weight: 700;
    letter-spacing: -0.01em;
    position: relative;
  }
  /* SKU 셀에 메모가 있으면 우측 상단에 작은 노란 점 */
  td.id.sku.has-memo::after {
    content: '';
    position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%;
    background: #b78900; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9);
    pointer-events: none;
  }
  /* 메모 팝오버 */
  #memoPopover {
    position: fixed;
    z-index: 300;
    background: #fffdf5;
    border: 1px solid #e5c76b;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
    padding: 10px;
    width: 280px;
    display: none;
  }
  #memoPopover.open { display: block; }
  #memoPopover textarea {
    width: 100%;
    min-height: 72px;
    resize: vertical;
    border: 1px solid #e5c76b;
    border-radius: 6px;
    padding: 6px 8px;
    font: 13px 'Pretendard', inherit;
    background: white;
    box-sizing: border-box;
  }
  #memoPopover textarea:focus { outline: none; border-color: #b78900; box-shadow: 0 0 0 3px rgba(229,199,107,0.25); }
  #memoPopover .memo-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  #memoPopover .memo-actions button {
    padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid #d1d5db; background: white; color: var(--text); font-family: inherit;
  }
  #memoPopover .memo-actions button.primary { background: #b78900; border-color: #b78900; color: white; }
  #memoPopover .memo-actions button.danger { color: #a4423b; border-color: #f0b6b1; }
  #memoPopover .memo-status { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: right; min-height: 14px; }
  #memoPopover .memo-status.err { color: #a4423b; }
  #memoPopover .memo-status.ok { color: var(--success); }
  .c-site {
    font-size: 11.5px;
    color: var(--muted);
    width: 110px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
  }
  .c-site.has {
    color: var(--text);
    font-weight: 500;
  }
  .site-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.01em;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.4;
    transition: filter .1s;
  }
  .c-site .site-chip { cursor: pointer; }
  .c-site .site-chip:hover { filter: brightness(0.96); }
  .c-site .site-empty {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    color: #b8b3ac;
    border: 1px dashed #d3ccc4;
    cursor: pointer;
    background: transparent;
  }
  .c-site .site-empty:hover { background: #f6f1ec; color: var(--muted); }

  /* 사이트 편집 팝업 */
  .site-edit-popup {
    position: fixed;
    z-index: 200;
    background: #fff;
    border: 1px solid #e0d6cd;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(60, 40, 20, 0.16), 0 2px 8px rgba(60, 40, 20, 0.08);
    padding: 10px;
    min-width: 240px;
    max-width: 280px;
    display: none;
  }
  .site-edit-popup.open { display: block; }
  .site-edit-popup .edit-input {
    font: 500 13px 'Pretendard', sans-serif;
    padding: 7px 10px;
    border: 1px solid #d3c4b7;
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    outline: none;
    width: 100%;
    box-sizing: border-box;
  }
  .site-edit-popup .edit-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .site-edit-popup .edit-list {
    margin-top: 8px;
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .site-edit-popup .edit-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text);
    transition: background .1s;
  }
  .site-edit-popup .edit-item:hover,
  .site-edit-popup .edit-item.selected { background: #f6f1ec; }
  .site-edit-popup .edit-item.create {
    color: var(--primary);
    font-weight: 600;
    border-top: 1px solid #f0eae2;
    margin-top: 4px; padding-top: 8px;
  }
  .site-edit-popup .edit-item.clear {
    color: #a85450;
    border-top: 1px solid #f0eae2;
    margin-top: 4px; padding-top: 8px;
    font-size: 12px;
  }
  .site-edit-popup .edit-hint {
    font-size: 11px;
    color: var(--muted);
    margin: 6px 4px 2px;
  }
  .site-edit-popup .edit-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    text-align: right;
    min-height: 14px;
  }
  .site-edit-popup .edit-status.err { color: #a85450; }
  .site-edit-popup .edit-status.ok { color: var(--success); }
  :root {
    --name-w: 320px;
    --col-idx-w: 44px;
    --col-site-w: 110px;
    --col-sku-w: 108px;
    --col-viid-w: 108px;
    --col-pid-w: 108px;
    --stick-1: var(--col-idx-w);
    --stick-2: calc(var(--col-idx-w) + var(--col-site-w));
    --stick-3: calc(var(--col-idx-w) + var(--col-site-w) + var(--col-sku-w));
    --stick-4: calc(var(--col-idx-w) + var(--col-site-w) + var(--col-sku-w) + var(--col-viid-w));
    --stick-5: calc(var(--col-idx-w) + var(--col-site-w) + var(--col-sku-w) + var(--col-viid-w) + var(--col-pid-w));
  }
  /* 좌측 6개 컬럼 sticky-left */
  th.idx-th, td.idx {
    position: sticky; left: 0; z-index: 4;
    width: var(--col-idx-w); min-width: var(--col-idx-w); max-width: var(--col-idx-w);
  }
  th.c-site-th, td.c-site {
    position: sticky; left: var(--stick-1); z-index: 4;
    width: var(--col-site-w); min-width: var(--col-site-w); max-width: var(--col-site-w);
    overflow: hidden;
  }
  th.sku-th, td.id.sku {
    position: sticky; left: var(--stick-2); z-index: 4;
    width: var(--col-sku-w); min-width: var(--col-sku-w); max-width: var(--col-sku-w);
  }
  th.viid-th, td.viid {
    position: sticky; left: var(--stick-3); z-index: 4;
    width: var(--col-viid-w); min-width: var(--col-viid-w); max-width: var(--col-viid-w);
  }
  th.pid-th, td.pid {
    position: sticky; left: var(--stick-4); z-index: 4;
    width: var(--col-pid-w); min-width: var(--col-pid-w); max-width: var(--col-pid-w);
  }
  /* header는 top:0도 함께 (기존 th 규칙 유지) — z-index 상향 */
  th.idx-th, th.c-site-th, th.sku-th, th.viid-th, th.pid-th, th.name-th {
    z-index: 6;
  }
  /* body sticky 셀 배경 (스크롤 시 뒤 내용 비침 방지) */
  tbody td.idx, tbody td.c-site, tbody td.id.sku, tbody td.viid, tbody td.pid, tbody td.name {
    background: #fff;
  }
  tbody tr:hover td.idx,
  tbody tr:hover td.c-site,
  tbody tr:hover td.id.sku,
  tbody tr:hover td.viid,
  tbody tr:hover td.pid,
  tbody tr:hover td.name {
    background: #fafbfd;
  }
  /* 상품명 우측 경계 그림자 (sticky 끝을 시각적으로 표시) */
  th.name-th, td.name {
    box-shadow: 4px 0 6px -4px rgba(0,0,0,0.08);
  }
  .name {
    padding-right: 12px;
    width: var(--name-w);
    max-width: var(--name-w);
    min-width: var(--name-w);
    white-space: nowrap;
    overflow: hidden;
  }
  .name a {
    display: block;
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  th.name-th, td.name {
    position: sticky; left: var(--stick-5);
    width: var(--name-w);
    max-width: var(--name-w);
    min-width: var(--name-w);
  }
  .name-resizer {
    position: absolute;
    top: 0;
    right: -3px;
    width: 6px;
    height: 100%;
    cursor: col-resize;
    z-index: 5;
    background: transparent;
    transition: background 0.15s;
  }
  .name-resizer::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 30%;
    bottom: 30%;
    width: 2px;
    background: var(--border);
    border-radius: 1px;
  }
  .name-resizer:hover,
  .name-resizer.dragging {
    background: rgba(183,137,0,0.15);
  }
  .name-resizer:hover::before,
  .name-resizer.dragging::before {
    background: var(--accent);
    top: 15%;
    bottom: 15%;
  }
  body.name-resizing { cursor: col-resize !important; user-select: none; }
  body.name-resizing * { cursor: col-resize !important; }
  .name a:hover { text-decoration: underline; color: var(--primary-hover); }
  .c-base {
    text-align: center;
    color: #b8b3ac;
    width: 88px;
    border-left: 1px solid #f5f6f9;
    font-variant-numeric: tabular-nums;
    text-decoration: line-through;
    text-decoration-color: #d5d0c8;
  }
  .c-price {
    text-align: center;
    color: var(--danger);
    font-weight: 700;
    width: 98px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .c-base.dash, .c-price.dash { color: #d5d0c8; font-weight: 400; text-decoration: none; }
  .c-price.changed { color: #2563eb; }
  .c-base.changed { color: #6b8ff0; }
  .extra-col { display: none; }
  .extra-col.shown { display: table-cell; }
  .empty {
    padding: 80px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty .icon {
    display: block;
    margin: 0 auto 16px;
    width: 44px;
    height: 44px;
    color: #cfc9c0;
  }
  .empty code {
    padding: 2px 6px;
    background: var(--soft-blue);
    border-radius: 4px;
    font-size: 12px;
    color: var(--info);
  }
</style>
</head>
<body>

          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>

      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

<div class="site-edit-popup" id="siteEditPopup">

<div id="memoPopover" role="dialog" aria-label="메모">

    <button type="button" id="memoCancel">취소</button>

  </div>
  <div class="memo-status" id="memoStatus"></div>

<script>
const API = '/api/price-state';

function labelToTimeKey(label) {
  if (label === '오전' || label === 'AM') return '0830';
  if (label === '오후' || label === 'PM') return '1400';
  if (label === '저녁' || label === 'EVE') return '1900';
  if (label && label.includes(':')) return label.replace(':', '');
  return '9999';
}

function fmt(n) {
  return (n && Number.isFinite(n)) ? n.toLocaleString() + '원' : '-';
}

// 무채색·더스티 파스텔 24색 팔레트. HSL 15° 간격으로 색상환 골고루,
// 채도·명도는 균일하게 낮게 잡아 톤은 통일 + 색상은 뚜렷하게 구분.
const SITE_PALETTE = (() => {
  const p = [];
  for (let i = 0; i < 24; i++) {
    const h = i * 15;
    p.push({ bg: `hsl(${h}, 34%, 80%)`, fg: `hsl(${h}, 48%, 26%)` });
  }
  return p;
})();

// 특정 사이트에 대한 고정 색상 오버라이드 (팔레트 배정 규칙보다 우선).
// 물량이 많은 대표 사이트는 시선 안 뺏기게 연한 베이지로 통일.
const SITE_COLOR_OVERRIDE = {
  '오아스토어팜':   { bg: '#efe6d3', fg: '#6a5a3a' },
  '보아르스토어팜': { bg: '#eadfc8', fg: '#6f5c37' },
  '품절':           { bg: '#e0cddc', fg: '#5a3f57' },
  '매칭처없음':     { bg: '#e5e3df', fg: '#6b6862' },
};

// 사이트 이름 → 팔레트 인덱스. buildSiteFilter 에서 사이트 목록이 정해질 때
// 결정론적으로 배정 (해시 충돌로 같은 색이 되는 문제 회피).
let SITE_COLOR_INDEX = {};

function siteColor(name) {
  if (!name) return null;
  if (SITE_COLOR_OVERRIDE[name]) return SITE_COLOR_OVERRIDE[name];
  let idx = SITE_COLOR_INDEX[name];
  if (idx === undefined) {
    // 아직 목록에 등록 안 된 사이트 (편집기에서 방금 추가 등) 폴백:
    // 사이트 이름 해시로 임시 색상 부여.
    let h = 0;
    for (let i = 0; i < name.length; i++) {
      h = (h * 131 + name.charCodeAt(i)) >>> 0;
    }
    idx = h % SITE_PALETTE.length;
  }
  return SITE_PALETTE[idx % SITE_PALETTE.length];
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

const MAX_VISIBLE_DATES = 3;  // 첫 화면에 보일 최대 날짜 수

let CURRENT_STATE = null;

function render(state) {
  CURRENT_STATE = state;
  const history = (state && state.history) || {};
  const order = (state && state.order) || [];
  const skuMap = (state && state.skuMap) || {};  // vendorItemId → SKU_ID

  const productKeys = Object.keys(history);
  const total = productKeys.length;

  if (!total) {
    document.getElementById('tblwrap').innerHTML =
      '<div class="empty">' +
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">' +
      '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
      '아직 수집된 데이터가 없습니다.<br>' +
      '로컬에서 수집 후 <code>업로드.py</code>로 서버에 반영해주세요.' +
      '</div>';
    return;
  }

  const dateLabels = {};
  for (const key of productKeys) {
    const runs = (history[key] || {}).runs || {};
    for (const rk in runs) {
      const r = runs[rk];
      const d = r.date || '-';
      const l = r.label || '-';
      (dateLabels[d] = dateLabels[d] || new Set()).add(l);
    }
  }
  const allDatesAsc = Object.keys(dateLabels).sort();
  const dateLabelLists = {};
  for (const d of allDatesAsc) {
    dateLabelLists[d] = Array.from(dateLabels[d]).sort((a, b) => labelToTimeKey(a).localeCompare(labelToTimeKey(b)));
  }

  // 달력 범위 선택기 초기화
  DATA_DATES = allDatesAsc;
  DATA_DATE_SET = new Set(allDatesAsc);
  const maxDate = allDatesAsc[allDatesAsc.length - 1];
  const defaultFrom = allDatesAsc[Math.max(0, allDatesAsc.length - MAX_VISIBLE_DATES)];
  if (!DATA_DATE_SET.has(RANGE_FROM)) RANGE_FROM = defaultFrom;
  if (!DATA_DATE_SET.has(RANGE_TO)) RANGE_TO = maxDate;
  if (RANGE_FROM > RANGE_TO) { const t = RANGE_FROM; RANGE_FROM = RANGE_TO; RANGE_TO = t; }
  updateRangeText();
  if (!CAL_VIEW_MONTH) CAL_VIEW_MONTH = RANGE_TO.slice(0, 7);
  renderCalendar();

  const rangeFrom = RANGE_FROM;
  const rangeTo = RANGE_TO;

  // 필터링: 선택된 기간 내 데이터 존재 날짜만 (3일 초과면 가로 스크롤)
  const datesAsc = allDatesAsc.filter(d => d >= rangeFrom && d <= rangeTo);

  const topHeader = [];
  const subHeader = [];
  const colMetas = [];
  const COLS_PER_RUN = 2;
  for (const d of datesAsc) {
    const labels = dateLabelLists[d];
    const latest = labels[labels.length - 1];
    const extras = labels.slice(0, -1);
    const collapsedSpan = COLS_PER_RUN;
    const expandedSpan = COLS_PER_RUN + COLS_PER_RUN * extras.length;
    const dateShort = d.length >= 10 ? d.slice(5) : d;
    const hasExtra = extras.length > 0;
    const cls = hasExtra ? ' has-extra' : '';
    const toggleAttr = hasExtra ? ` data-date="${d}" data-collapsed-span="${collapsedSpan}" data-expanded-span="${expandedSpan}"` : '';
    const icon = hasExtra ? ' <span class="expand-icon">▶</span>' : '';
    const extrasTags = extras.map(l => `<span class="time-tag extra-tag extra-${d}">${l}</span>`).join('');
    const latestTag = ` <span class="time-tag">${latest}</span>`;

    topHeader.push(
      `<th colspan="${collapsedSpan}" class="date-header${cls}"${toggleAttr}>` +
      `<span class="date-label">${dateShort}</span>${extrasTags}${latestTag}${icon}` +
      `</th>`
    );
    for (const l of extras) {
      subHeader.push(`<th class="sub-base extra-col extra-${d}" data-date="${d}">판매가</th>`);
      subHeader.push(`<th class="sub-price extra-col extra-${d}" data-date="${d}">할인가</th>`);
      colMetas.push({date: d, label: l, isExtra: true});
    }
    subHeader.push(`<th class="sub-base">판매가</th>`);
    subHeader.push(`<th class="sub-price">할인가</th>`);
    colMetas.push({date: d, label: latest, isExtra: false});
  }

  const orderIdx = new Map(order.map((k, i) => [k, i]));
  const entriesSorted = productKeys.map(k => ({key: k, entry: history[k]})).sort((a, b) => {
    const oa = orderIdx.has(a.key) ? orderIdx.get(a.key) : 999999;
    const ob = orderIdx.has(b.key) ? orderIdx.get(b.key) : 999999;
    if (oa !== ob) return oa - ob;
    return (a.entry.name || '').localeCompare(b.entry.name || '');
  });

  const siteMap = (state && state.siteMap) || {};   // SKU_ID → site name
  const siteFilter = SITE_FILTER;                    // Set of selected sites (빈 Set = 전체)
  const filterActive = siteFilter && siteFilter.size > 0;

  const rows = [];
  let visibleIdx = 0;
  entriesSorted.forEach((e) => {
    const entry = e.entry;
    const pid = entry.productId || '';
    const viid = entry.vendorItemId || '';
    const sku = skuMap[viid] || '';
    const site = (sku && siteMap[sku]) || '';

    // 사이트 필터 적용
    if (filterActive) {
      if (!site || !siteFilter.has(site)) return;
    }

    const name = escapeHtml(entry.name);
    const url = entry.url || '#';
    const runs = entry.runs || {};
    const runByDL = {};
    for (const rk in runs) {
      const r = runs[rk];
      runByDL[`${r.date}||${r.label}`] = r;
    }
    const cells = [];
    let prevBase = null, prevPrice = null;
    for (const cm of colMetas) {
      const r = runByDL[`${cm.date}||${cm.label}`] || {};
      const exCls = cm.isExtra ? ` extra-col extra-${cm.date}` : '';
      const baseVal = fmt(r.basePrice);
      const priceVal = fmt(r.price);
      const baseChanged = (prevBase != null && r.basePrice != null && r.basePrice !== prevBase);
      const priceChanged = (prevPrice != null && r.price != null && r.price !== prevPrice);
      const baseCls = `c-base${exCls}${baseVal==='-'?' dash':''}${baseChanged?' changed':''}`;
      const priceCls = `c-price${exCls}${priceVal==='-'?' dash':''}${priceChanged?' changed':''}`;
      cells.push(`<td class="${baseCls}" data-date="${cm.date}">${baseVal}</td>`);
      cells.push(`<td class="${priceCls}" data-date="${cm.date}">${priceVal}</td>`);
      if (r.basePrice != null) prevBase = r.basePrice;
      if (r.price != null) prevPrice = r.price;
    }
    visibleIdx += 1;
    const sc = siteColor(site);
    const editableAttr = sku
      ? ` data-sku="${escapeHtml(sku)}" data-cur-site="${escapeHtml(site)}" title="클릭하여 사이트 변경"`
      : ' title="SKU 없음 — 사이트 지정 불가"';
    const siteCellInner = site
      ? `<span class="site-chip"${editableAttr} style="background:${sc.bg};color:${sc.fg}">${escapeHtml(site)}</span>`
      : (sku ? `<span class="site-empty"${editableAttr}>+ 사이트</span>` : '<span class="site-empty" style="cursor:not-allowed">-</span>');
    rows.push(
      `<tr>` +
      `<td class="idx">${visibleIdx}</td>` +
      `<td class="c-site${site?' has':''}">${siteCellInner}</td>` +
      `<td class="id sku${(sku && MEMOS[sku]) ? ' has-memo' : ''}" data-sku="${escapeHtml(sku)}" title="${(sku && MEMOS[sku]) ? '📝 ' + escapeHtml(MEMOS[sku]) : '우클릭: 메모 추가'}">${escapeHtml(sku)}</td>` +
      `<td class="id viid">${escapeHtml(viid)}</td>` +
      `<td class="id pid">${escapeHtml(pid)}</td>` +
      `<td class="name"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${name}</a></td>` +
      cells.join('') +
      `</tr>`
    );
  });

  document.getElementById('tblwrap').innerHTML =
    `<table id="t">` +
    `<thead><tr>` +
    `<th rowspan="2" class="idx-th">#</th><th rowspan="2" class="c-site-th">사이트</th><th rowspan="2" class="sku-th">SKU ID</th><th rowspan="2" class="viid-th">VendorItem ID</th><th rowspan="2" class="pid-th">Product ID</th><th rowspan="2" class="name-th">상품명<span class="name-resizer" id="nameResizer" title="드래그하여 상품명 컬럼 너비 조정"></span></th>` +
    topHeader.join('') +
    `</tr><tr>` + subHeader.join('') + `</tr></thead>` +
    `<tbody>` + rows.join('') + `</tbody></table>`;

  document.querySelectorAll('th.date-header.has-extra').forEach(th => {
    th.addEventListener('click', () => {
      const d = th.dataset.date;
      const expanded = th.classList.toggle('expanded');
      th.colSpan = parseInt(expanded ? th.dataset.expandedSpan : th.dataset.collapsedSpan, 10);
      document.querySelectorAll('.extra-' + CSS.escape(d)).forEach(el => {
        el.classList.toggle('shown', expanded);
      });
      const anyExpanded = document.querySelectorAll('th.date-header.expanded').length > 0;
      document.getElementById('t').classList.toggle('expanded', anyExpanded);
    });
  });

  const q = document.getElementById('q');
  q.oninput = () => {
    const v = q.value.toLowerCase();
    document.querySelectorAll('#t tbody tr').forEach(tr => {
      tr.style.display = tr.innerText.toLowerCase().includes(v) ? '' : 'none';
    });
  };
}

async function fetchSkuMapFromMargin() {
  // 마진테이블 state에서 {viid: sku} 매핑 생성 (VIID 기준 매칭)
  try {
    const r = await fetch('/api/margin-state?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return {};
    const data = await r.json();
    const rows = Array.isArray(data) ? data : (data.rows || []);
    const map = {};
    for (const row of rows) {
      const viid = String(row.viid || '').trim();
      const sku = String(row.sku || '').trim();
      if (viid && sku) map[viid] = sku;
    }
    return map;
  } catch (e) {
    console.warn('margin-state fetch 실패:', e);
    return {};
  }
}

async function fetchSiteMap() {
  try {
    const r = await fetch('/api/site-map?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return {};
    return await r.json();
  } catch (e) {
    console.warn('site-map fetch 실패:', e);
    return {};
  }
}

async function fetchMemos() {
  try {
    const r = await fetch('/api/price-memos?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return {};
    return await r.json();
  } catch (e) {
    console.warn('memos fetch 실패:', e);
    return {};
  }
}

async function load() {
  const st = document.getElementById('status');
  st.textContent = '로딩 중...';
  try {
    const [priceRes, marginSkuMap, siteMap, memos] = await Promise.all([
      fetch(API + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()),
      fetchSkuMapFromMargin(),
      fetchSiteMap(),
      fetchMemos(),
    ]);
    priceRes.skuMap = Object.assign({}, priceRes.skuMap || {}, marginSkuMap);
    priceRes.siteMap = siteMap;
    MEMOS = memos || {};
    buildSiteFilter(siteMap, priceRes);
    render(priceRes);
    st.textContent = '갱신: ' + new Date().toLocaleTimeString('ko-KR');
  } catch (e) {
    st.textContent = '로딩 실패: ' + e.message;
  }
}

document.getElementById('reload').addEventListener('click', load);

// ===== 사이트 필터 =====
let SITE_FILTER = new Set();     // 선택된 사이트 (empty = 전체)
let SITE_ALL = [];               // [{name, count}]

function updateSiteText() {
  const el = document.getElementById('siteText');
  if (SITE_FILTER.size === 0) { el.textContent = '전체'; el.classList.add('muted'); return; }
  el.classList.remove('muted');
  if (SITE_FILTER.size === 1) { el.textContent = [...SITE_FILTER][0]; return; }
  el.textContent = `${[...SITE_FILTER][0]} 외 ${SITE_FILTER.size - 1}`;
}

function buildSiteFilter(siteMap, priceRes) {
  // 실제 상품에 매칭되는 사이트 카운트만 노출
  const skuMap = priceRes.skuMap || {};
  const history = priceRes.history || {};
  const counts = {};
  for (const key in history) {
    const viid = history[key].vendorItemId || '';
    const sku = skuMap[viid];
    const site = sku && siteMap[sku];
    if (site) counts[site] = (counts[site] || 0) + 1;
  }
  SITE_ALL = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([name, count]) => ({ name, count }));

  // 색상 인덱스 결정론적 배정: 이름 정렬 순 → 사이트 개수가 늘어나도
  // 기존 사이트의 색은 그대로 유지.
  const sortedNames = Object.keys(counts).sort();
  SITE_COLOR_INDEX = {};
  sortedNames.forEach((name, i) => { SITE_COLOR_INDEX[name] = i; });

  // 사라진 사이트는 필터에서 제거
  for (const s of Array.from(SITE_FILTER)) {
    if (!counts[s]) SITE_FILTER.delete(s);
  }

  const list = document.getElementById('siteList');
  list.innerHTML = SITE_ALL.map(s => {
    const c = siteColor(s.name);
    const chip = `<span class="site-chip" style="background:${c.bg};color:${c.fg}">${escapeHtml(s.name)}</span>`;
    return `
    <label class="site-item">
      <input type="checkbox" data-site="${escapeHtml(s.name)}" ${SITE_FILTER.has(s.name) ? 'checked' : ''}>
      ${chip}
      <span class="site-count">${s.count}</span>
    </label>`;
  }).join('');

  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const name = cb.dataset.site;
      if (cb.checked) SITE_FILTER.add(name);
      else SITE_FILTER.delete(name);
      updateSiteText();
      if (CURRENT_STATE) render(CURRENT_STATE);
    });
  });
  updateSiteText();
}

const siteFilterEl = document.getElementById('siteFilter');
const sitePopupEl = document.getElementById('sitePopup');
sitePopupEl.addEventListener('click', (e) => e.stopPropagation());
sitePopupEl.addEventListener('mousedown', (e) => e.stopPropagation());
siteFilterEl.addEventListener('click', (e) => {
  if (sitePopupEl.contains(e.target)) return;
  const open = sitePopupEl.classList.toggle('open');
  siteFilterEl.classList.toggle('open', open);
});
document.addEventListener('click', (e) => {
  if (!siteFilterEl.contains(e.target) && sitePopupEl.classList.contains('open')) {
    sitePopupEl.classList.remove('open');
    siteFilterEl.classList.remove('open');
  }
});
document.getElementById('siteAll').addEventListener('click', () => {
  SITE_FILTER = new Set(SITE_ALL.map(s => s.name));
  document.querySelectorAll('#siteList input[type="checkbox"]').forEach(cb => { cb.checked = true; });
  updateSiteText();
  if (CURRENT_STATE) render(CURRENT_STATE);
});
document.getElementById('siteNone').addEventListener('click', () => {
  SITE_FILTER.clear();
  document.querySelectorAll('#siteList input[type="checkbox"]').forEach(cb => { cb.checked = false; });
  updateSiteText();
  if (CURRENT_STATE) render(CURRENT_STATE);
});

// ===== 사이트 편집 undo/redo (site-map 스냅샷 기반) =====
const SITE_UNDO_LIMIT = 50;
const siteUndoStack = [];  // 이전 상태들
const siteRedoStack = [];

function updateUndoButtons() {
  document.getElementById('btnUndo').disabled = siteUndoStack.length === 0;
  document.getElementById('btnRedo').disabled = siteRedoStack.length === 0;
}

function pushUndoSnapshot(prevMap) {
  siteUndoStack.push(JSON.stringify(prevMap || {}));
  if (siteUndoStack.length > SITE_UNDO_LIMIT) siteUndoStack.shift();
  siteRedoStack.length = 0;
  updateUndoButtons();
}

async function postSiteMap(mapObj) {
  const resp = await fetch('/api/site-map', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json; charset=utf-8' },
    body: JSON.stringify(mapObj),
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
}

async function applySiteMapAndRender(mapObj) {
  await postSiteMap(mapObj);
  if (CURRENT_STATE) {
    CURRENT_STATE.siteMap = mapObj;
    buildSiteFilter(mapObj, CURRENT_STATE);
    render(CURRENT_STATE);
  }
}

async function doSiteUndo() {
  if (!siteUndoStack.length) return;
  const cur = CURRENT_STATE && CURRENT_STATE.siteMap ? CURRENT_STATE.siteMap : {};
  const prevStr = siteUndoStack.pop();
  siteRedoStack.push(JSON.stringify(cur));
  updateUndoButtons();
  try { await applySiteMapAndRender(JSON.parse(prevStr)); } catch (e) { console.warn('undo 실패:', e); }
}

async function doSiteRedo() {
  if (!siteRedoStack.length) return;
  const cur = CURRENT_STATE && CURRENT_STATE.siteMap ? CURRENT_STATE.siteMap : {};
  const nextStr = siteRedoStack.pop();
  siteUndoStack.push(JSON.stringify(cur));
  updateUndoButtons();
  try { await applySiteMapAndRender(JSON.parse(nextStr)); } catch (e) { console.warn('redo 실패:', e); }
}

document.getElementById('btnUndo').addEventListener('click', doSiteUndo);
document.getElementById('btnRedo').addEventListener('click', doSiteRedo);
document.addEventListener('keydown', (e) => {
  const target = e.target;
  const inEditable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
  if (inEditable) return;
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault(); doSiteUndo();
  } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y' || (e.shiftKey && (e.key === 'z' || e.key === 'Z')))) {
    e.preventDefault(); doSiteRedo();
  }
});

// ===== 사이트 개별 편집 (SKU → site 지정) =====
const siteEditPopup = document.getElementById('siteEditPopup');
const siteEditInput = document.getElementById('siteEditInput');
const siteEditList = document.getElementById('siteEditList');
const siteEditStatus = document.getElementById('siteEditStatus');
let SITE_EDIT_SKU = '';
let SITE_EDIT_CUR = '';

function openSiteEditor(anchor, sku, curSite) {
  SITE_EDIT_SKU = sku;
  SITE_EDIT_CUR = curSite;
  siteEditInput.value = '';
  siteEditStatus.textContent = '';
  siteEditStatus.className = 'edit-status';
  const r = anchor.getBoundingClientRect();
  siteEditPopup.style.left = Math.min(r.left, window.innerWidth - 300) + 'px';
  siteEditPopup.style.top = (r.bottom + 6) + 'px';
  siteEditPopup.classList.add('open');
  renderSiteEditList('');
  setTimeout(() => siteEditInput.focus(), 0);
}

function closeSiteEditor() {
  siteEditPopup.classList.remove('open');
  SITE_EDIT_SKU = '';
  SITE_EDIT_CUR = '';
}

function renderSiteEditList(query) {
  const q = query.trim();
  const qLower = q.toLowerCase();
  const filtered = SITE_ALL.filter(s => !qLower || s.name.toLowerCase().includes(qLower));
  const exactExists = SITE_ALL.some(s => s.name === q);
  const items = filtered.map(s => {
    const c = siteColor(s.name);
    const isCurrent = s.name === SITE_EDIT_CUR;
    return `<div class="edit-item${isCurrent ? ' selected' : ''}" data-name="${escapeHtml(s.name)}">
      <span class="site-chip" style="background:${c.bg};color:${c.fg}">${escapeHtml(s.name)}</span>
      <span class="site-count" style="margin-left:auto;font-size:11px;color:#8a877e">${s.count}</span>
    </div>`;
  });
  if (q && !exactExists) {
    items.push(`<div class="edit-item create" data-create="${escapeHtml(q)}">+ 새 사이트 "${escapeHtml(q)}" 추가</div>`);
  }
  if (SITE_EDIT_CUR) {
    items.push(`<div class="edit-item clear" data-clear="1">✕ 사이트 지정 해제</div>`);
  }
  siteEditList.innerHTML = items.join('');
}

async function saveSiteEdit(sku, newSite) {
  siteEditStatus.textContent = '저장 중...';
  siteEditStatus.className = 'edit-status';
  try {
    const r = await fetch('/api/site-map?t=' + Date.now(), { cache: 'no-store' });
    const current = r.ok ? await r.json() : {};
    pushUndoSnapshot(current);
    const updated = Object.assign({}, current);
    if (newSite) updated[sku] = newSite;
    else delete updated[sku];
    await applySiteMapAndRender(updated);
    siteEditStatus.textContent = '저장됨';
    siteEditStatus.className = 'edit-status ok';
    setTimeout(closeSiteEditor, 400);
  } catch (e) {
    siteEditStatus.textContent = '저장 실패: ' + e.message;
    siteEditStatus.className = 'edit-status err';
  }
}

document.getElementById('tblwrap').addEventListener('click', (e) => {
  const el = e.target.closest('.site-chip, .site-empty');
  if (!el || !el.dataset.sku) return;
  e.stopPropagation();
  openSiteEditor(el, el.dataset.sku, el.dataset.curSite || '');
});

// ===== SKU 셀 메모 (우클릭으로 열림) =====
let MEMOS = {};
let MEMO_TARGET_SKU = '';
const memoPop = document.getElementById('memoPopover');
const memoTextEl = document.getElementById('memoText');
const memoStatusEl = document.getElementById('memoStatus');

function openMemoPopover(anchor, sku, x, y) {
  MEMO_TARGET_SKU = sku;
  memoTextEl.value = MEMOS[sku] || '';
  memoStatusEl.textContent = '';
  memoStatusEl.className = 'memo-status';
  document.getElementById('memoDelete').style.display = MEMOS[sku] ? '' : 'none';
  // 위치: 우클릭 좌표 기준, 화면 넘치면 조정
  const W = 280, H = 160;
  const left = Math.min(x, window.innerWidth - W - 10);
  const top = Math.min(y, window.innerHeight - H - 10);
  memoPop.style.left = Math.max(10, left) + 'px';
  memoPop.style.top = Math.max(10, top) + 'px';
  memoPop.classList.add('open');
  setTimeout(() => memoTextEl.focus(), 0);
}

function closeMemoPopover() {
  memoPop.classList.remove('open');
  MEMO_TARGET_SKU = '';
}

function commitMemoIfChanged() {
  if (!MEMO_TARGET_SKU) return;
  const cur = (MEMOS[MEMO_TARGET_SKU] || '').trim();
  const next = (memoTextEl.value || '').trim();
  if (cur === next) return;
  saveMemo(memoTextEl.value, { closeAfter: false });
}

async function saveMemo(text, opts = {}) {
  const targetSku = MEMO_TARGET_SKU;                   // 캡처: async 중 닫혀도 안전
  if (!targetSku) return;
  const closeAfter = opts.closeAfter !== false;
  memoStatusEl.textContent = '저장 중...';
  memoStatusEl.className = 'memo-status';
  try {
    const r = await fetch('/api/price-memos?t=' + Date.now(), { cache: 'no-store' });
    const current = r.ok ? await r.json() : {};
    if (text && text.trim()) current[targetSku] = text.trim();
    else delete current[targetSku];
    const resp = await fetch('/api/price-memos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(current),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    MEMOS = current;
    if (CURRENT_STATE) render(CURRENT_STATE);
    memoStatusEl.textContent = '저장됨';
    memoStatusEl.className = 'memo-status ok';
    if (closeAfter) setTimeout(closeMemoPopover, 400);
  } catch (e) {
    memoStatusEl.textContent = '저장 실패: ' + e.message;
    memoStatusEl.className = 'memo-status err';
  }
}

document.getElementById('tblwrap').addEventListener('contextmenu', (e) => {
  const cell = e.target.closest('td.id.sku');
  if (!cell) return;
  const sku = cell.dataset.sku;
  if (!sku) return;   // SKU 없으면 메모 못 붙임
  e.preventDefault();
  openMemoPopover(cell, sku, e.clientX, e.clientY);
});

memoPop.addEventListener('click', (e) => e.stopPropagation());
memoPop.addEventListener('mousedown', (e) => e.stopPropagation());
memoPop.addEventListener('contextmenu', (e) => e.stopPropagation());

document.addEventListener('click', (e) => {
  if (memoPop.classList.contains('open') && !memoPop.contains(e.target)) {
    commitMemoIfChanged();
    closeMemoPopover();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && memoPop.classList.contains('open')) closeMemoPopover();
});

document.getElementById('memoSave').addEventListener('click', () => saveMemo(memoTextEl.value));
document.getElementById('memoCancel').addEventListener('click', closeMemoPopover);
document.getElementById('memoDelete').addEventListener('click', () => saveMemo(''));
memoTextEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveMemo(memoTextEl.value); }
});

siteEditPopup.addEventListener('click', (e) => e.stopPropagation());
siteEditPopup.addEventListener('mousedown', (e) => e.stopPropagation());
document.addEventListener('click', (e) => {
  if (siteEditPopup.classList.contains('open') && !siteEditPopup.contains(e.target)) {
    closeSiteEditor();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && siteEditPopup.classList.contains('open')) closeSiteEditor();
});

siteEditInput.addEventListener('input', () => renderSiteEditList(siteEditInput.value));
siteEditInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const q = siteEditInput.value.trim();
  if (!q) return;
  saveSiteEdit(SITE_EDIT_SKU, q);
});

siteEditList.addEventListener('click', (e) => {
  const item = e.target.closest('.edit-item');
  if (!item) return;
  if (item.dataset.clear) {
    saveSiteEdit(SITE_EDIT_SKU, '');
  } else if (item.dataset.create) {
    saveSiteEdit(SITE_EDIT_SKU, item.dataset.create);
  } else if (item.dataset.name) {
    saveSiteEdit(SITE_EDIT_SKU, item.dataset.name);
  }
});

// ===== 커스텀 기간 선택 달력 =====
let DATA_DATES = [];        // ['2026-09-17', ...]
let DATA_DATE_SET = new Set();
let RANGE_FROM = '';
let RANGE_TO = '';
let CAL_VIEW_MONTH = '';    // 'YYYY-MM'
let CAL_PICKING = 'from';   // 'from' 다음엔 'to'

const DOW = ['일','월','화','수','목','금','토'];

function shortDate(d) {
  return d.length >= 10 ? d.slice(5).replace('-', '/') : d;
}

function updateRangeText() {
  const el = document.getElementById('rangeText');
  if (!RANGE_FROM || !RANGE_TO) { el.textContent = '-'; return; }
  if (RANGE_FROM === RANGE_TO) {
    el.innerHTML = shortDate(RANGE_FROM);
  } else {
    el.innerHTML = `${shortDate(RANGE_FROM)}<span class="tilde">~</span>${shortDate(RANGE_TO)}`;
  }
}

function shiftMonth(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function renderCalendar() {
  if (!CAL_VIEW_MONTH) return;
  const grid = document.getElementById('calGrid');
  const [y, m] = CAL_VIEW_MONTH.split('-').map(Number);
  document.getElementById('calMonth').textContent = `${y}년 ${m}월`;

  const first = new Date(y, m - 1, 1);
  const lastDay = new Date(y, m, 0).getDate();
  const leading = first.getDay();

  const cells = [];
  for (let i = 0; i < 7; i++) {
    const cls = i === 0 ? 'cal-dow sun' : i === 6 ? 'cal-dow sat' : 'cal-dow';
    cells.push(`<div class="${cls}">${DOW[i]}</div>`);
  }
  for (let d = 1; d <= lastDay; d++) {
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = DATA_DATE_SET.has(iso);
    let cls = 'cal-cell';
    if (!has) cls += ' disabled';
    if (RANGE_FROM && RANGE_TO && iso > RANGE_FROM && iso < RANGE_TO) cls += ' in-range';
    if (iso === RANGE_FROM) cls += ' range-start';
    if (iso === RANGE_TO) cls += ' range-end';
    // 첫 날짜만 요일 위치에 명시적 배치. 나머지는 자동 흐름.
    const style = d === 1 ? ` style="grid-column-start:${leading + 1}"` : '';
    cells.push(`<div class="${cls}"${style} data-date="${iso}">${d}</div>`);
  }
  grid.innerHTML = cells.join('');

  const minMonth = DATA_DATES[0]?.slice(0,7);
  const maxMonth = DATA_DATES[DATA_DATES.length-1]?.slice(0,7);
  document.getElementById('calPrev').disabled = !minMonth || CAL_VIEW_MONTH <= minMonth;
  document.getElementById('calNext').disabled = !maxMonth || CAL_VIEW_MONTH >= maxMonth;
  document.getElementById('calHint').textContent =
    CAL_PICKING === 'from' ? '시작 날짜를 클릭하세요' : '종료 날짜를 클릭하세요';
}

const dateRangeEl = document.getElementById('dateRange');
const calPopupEl = document.getElementById('calPopup');

// 팝업 내부 클릭은 바깥으로 전파되지 않게 (재렌더로 e.target이 DOM에서 떨어져
// dateRange 상위 핸들러가 팝업을 잘못 닫는 문제 방지)
calPopupEl.addEventListener('click', (e) => e.stopPropagation());
calPopupEl.addEventListener('mousedown', (e) => e.stopPropagation());

dateRangeEl.addEventListener('click', (e) => {
  if (calPopupEl.contains(e.target)) return;
  const open = calPopupEl.classList.toggle('open');
  dateRangeEl.classList.toggle('open', open);
  if (open) {
    CAL_PICKING = 'from';
    CAL_VIEW_MONTH = (RANGE_FROM || RANGE_TO || DATA_DATES[DATA_DATES.length-1] || '').slice(0,7);
    renderCalendar();
  }
});

document.addEventListener('click', (e) => {
  if (!dateRangeEl.contains(e.target) && calPopupEl.classList.contains('open')) {
    calPopupEl.classList.remove('open');
    dateRangeEl.classList.remove('open');
  }
});

document.getElementById('calPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  const minMonth = DATA_DATES[0]?.slice(0,7);
  if (minMonth && CAL_VIEW_MONTH > minMonth) {
    CAL_VIEW_MONTH = shiftMonth(CAL_VIEW_MONTH, -1);
    renderCalendar();
  }
});
document.getElementById('calNext').addEventListener('click', (e) => {
  e.stopPropagation();
  const maxMonth = DATA_DATES[DATA_DATES.length-1]?.slice(0,7);
  if (maxMonth && CAL_VIEW_MONTH < maxMonth) {
    CAL_VIEW_MONTH = shiftMonth(CAL_VIEW_MONTH, 1);
    renderCalendar();
  }
});

document.getElementById('calGrid').addEventListener('click', (e) => {
  const cell = e.target.closest('.cal-cell');
  if (!cell || cell.classList.contains('disabled') || cell.classList.contains('empty')) return;
  const iso = cell.dataset.date;
  if (CAL_PICKING === 'from') {
    RANGE_FROM = iso;
    RANGE_TO = iso;
    CAL_PICKING = 'to';
    renderCalendar();
    updateRangeText();
  } else {
    if (iso < RANGE_FROM) { RANGE_TO = RANGE_FROM; RANGE_FROM = iso; }
    else { RANGE_TO = iso; }
    CAL_PICKING = 'from';
    updateRangeText();
    calPopupEl.classList.remove('open');
    dateRangeEl.classList.remove('open');
    if (CURRENT_STATE) render(CURRENT_STATE);
  }
});

document.getElementById('btnDownload').addEventListener('click', () => {
  if (!CURRENT_STATE) { alert('먼저 데이터를 로드하세요.'); return; }
  const history = CURRENT_STATE.history || {};
  const order = CURRENT_STATE.order || [];
  const skuMap = CURRENT_STATE.skuMap || {};
  const siteMap = CURRENT_STATE.siteMap || {};
  const filterActive = SITE_FILTER && SITE_FILTER.size > 0;

  const orderIdx = new Map(order.map((k, i) => [k, i]));
  const entries = Object.values(history).slice().sort((a, b) => {
    const oa = orderIdx.has(a.vendorItemId) ? orderIdx.get(a.vendorItemId) : 999999;
    const ob = orderIdx.has(b.vendorItemId) ? orderIdx.get(b.vendorItemId) : 999999;
    if (oa !== ob) return oa - ob;
    return (a.name || '').localeCompare(b.name || '');
  });

  const aoa = [['사이트', 'SKU ID', 'PID', 'VIID', '상품명', '할인가']];
  entries.forEach(e => {
    const viid = e.vendorItemId || '';
    const pid = e.productId || '';
    const sku = skuMap[viid] || '';
    const site = (sku && siteMap[sku]) || '';
    if (filterActive && (!site || !SITE_FILTER.has(site))) return;
    const name = e.name || '';
    const runs = e.runs || {};
    let latestPrice = null;
    let latestKey = '';
    for (const rk in runs) {
      const r = runs[rk];
      const cmp = (r.date || '') + '_' + (r.ts || '');
      if (cmp > latestKey) { latestKey = cmp; latestPrice = r.price; }
    }
    aoa.push([
      site, sku, pid, viid, name,
      (latestPrice != null && isFinite(latestPrice)) ? { t: 'n', v: latestPrice, z: '#,##0' } : ''
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14}, {wch:12}, {wch:14}, {wch:14}, {wch:44}, {wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '판매가');
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
              + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb, `판매가_${stamp}.xlsx`);
});

// ===== 상품명 컬럼 리사이즈 =====
const NAME_W_KEY = 'price_name_col_width';
const NAME_W_MIN = 80;
const NAME_W_MAX = 800;
const savedNameW = parseInt(localStorage.getItem(NAME_W_KEY), 10);
if (savedNameW >= NAME_W_MIN && savedNameW <= NAME_W_MAX) {
  document.documentElement.style.setProperty('--name-w', savedNameW + 'px');
}
document.addEventListener('mousedown', (e) => {
  const r = e.target.closest('#nameResizer');
  if (!r) return;
  e.preventDefault();
  e.stopPropagation();
  r.classList.add('dragging');
  document.body.classList.add('name-resizing');
  const startX = e.clientX;
  const cs = getComputedStyle(document.documentElement).getPropertyValue('--name-w');
  const startW = parseInt(cs, 10) || 320;
  function onMove(ev) {
    let w = startW + (ev.clientX - startX);
    w = Math.max(NAME_W_MIN, Math.min(NAME_W_MAX, w));
    document.documentElement.style.setProperty('--name-w', w + 'px');
  }
  function onUp() {
    r.classList.remove('dragging');
    document.body.classList.remove('name-resizing');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--name-w'), 10);
    if (cur) localStorage.setItem(NAME_W_KEY, String(cur));
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

load();

// ===== 자동 동기화 (다른 사용자 편집 반영) =====
// 15초마다 memos + site-map 변경 감지 → 바뀌었을 때만 load() 재실행
let SYNC_SIG = '';
async function syncSignature() {
  try {
    const [m, s] = await Promise.all([
      fetch('/api/price-memos?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()),
      fetch('/api/site-map?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()),
    ]);
    return m.length + ':' + s.length + ':' + m.slice(-64) + s.slice(-64);
  } catch { return SYNC_SIG; }
}
function isEditing() {
  const memoOpen = document.getElementById('memoPopover')?.classList.contains('open');
  const siteOpen = document.getElementById('siteEditPopup')?.classList.contains('open');
  const calOpen = document.getElementById('calPopup')?.classList.contains('open');
  return memoOpen || siteOpen || calOpen;
}
async function autoSync() {
  if (document.hidden || isEditing()) return;
  const sig = await syncSignature();
  if (!SYNC_SIG) { SYNC_SIG = sig; return; }
  if (sig !== SYNC_SIG) {
    SYNC_SIG = sig;
    await load();
  }
}
setInterval(autoSync, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoSync(); });
</script>
